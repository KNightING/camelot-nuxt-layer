 webkit 捲軸樣式隱藏雙軸原生捲軸。\n3. 疊上兩個 overlay 捲軸：水平的浮動開關由 Table 的 `floatingScrollbar` 帶入，垂直的起點偏移帶表頭高度。\n\n來源：1. [Table.vue][]\n\n### 保留空間\n\n| 規則 | 說明 |\n| :--- | :--- |\n| 用透明 border | overflow 裁切在 padding box 內，內容不會進到 border 區，gutter 乾淨不漏，固定欄與固定列停在邊緣 |\n| 寬度 6px | 等於未 hover 的 bar 4px 加內縮 2px |\n| 可開關 | 關閉保留空間時不加 border，捲軸直接蓋在表格上 |\n\n來源：1. [Table.vue][]\n\n### Table 捲軸相關 props\n\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `height` | `string` | — | 固定高度，內容少於容器時不縮短；優先於 `maxHeight` |\n| `maxHeight` | `string` | — | 高度上限，內容少時縮短 |\n| `floatingScrollbar` | `boolean` | `true` | 水平軸在表格底部超出視窗時是否浮動 |\n| `reserveVerticalScrollbar` | `boolean` | `true` | 是否保留垂直捲軸 gutter |\n| `reserveHorizontalScrollbar` | `boolean` | `true` | 是否保留水平捲軸 gutter |\n| `color` | `CamelotColorRole` | `primary` | 捲軸、列 hover 與表頭底線的色彩角色 |\n\n來源：1. [Table.vue][]\n\n## 實作限制\n\n| 限制 | 對策 |\n| :--- | :--- |\n| thumb 拖曳時頻繁 re-render 會重啟放大 transition | thumb 拆成負責定位的父層與負責視覺的 bar 子層 |\n| 依方向隱藏原生軸的 webkit 選擇器在此引擎無效 | 整體隱藏原生軸，改用自訂雙軸 |\n| 捲動容器的 padding 區會顯示捲動內容 | gutter 改用透明 border |\n| 只觀察容器尺寸時，內容變動不會重算 | ResizeObserver 也觀察內容元素 |\n\n來源：1. [OverlayScrollbar.vue][]　2. [useCamelotOverlayScrollbar.ts][]　3. [Table.vue][]\n\n## 相關頁面\n\n- [Table](../features/components/Table.md)\n- [OverlayScrollbar](../features/components/OverlayScrollbar.md)\n- [Scrollbar](../features/components/Scrollbar.md)：包裝式捲軸\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCamelotOverlayScrollbar.ts | [app/composables/useCamelotOverlayScrollbar.ts](../../../app/composables/useCamelotOverlayScrollbar.ts) |\n| OverlayScrollbar.vue | [app/components/Camelot/OverlayScrollbar.vue](../../../app/components/Camelot/OverlayScrollbar.vue) |\n| Table.vue | [app/components/Camelot/Table.vue](../../../app/components/Camelot/Table.vue) |\n\n[useCamelotOverlayScrollbar.ts]: #references\n[OverlayScrollbar.vue]: #references\n[Table.vue]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"自訂捲軸系統","summary":"`CamelotOverlayScrollbar` 是附著在既有捲動容器上的自訂 overlay 捲軸，本身不建立捲動容器，以 `orientation` 切換水平或垂直；Table 的兩軸都用它取代原生捲軸。核心邏輯在方向感知的 `useCamelotOverlayScrollbar`。它與自建捲動容器、以 slot 包內容的包裝式 `CamelotScrollbar` 定位不同，兩者並存。"},"platform/theme-system.md":{"md":"# 主題系統\n\n## Summary\n\nCamelot 的主題系統讓同一組元件介面切換成四種視覺風格：`material`（Material 3）、`cupertino`（Apple）、`scifi`（HUD）與 `aqua`（玻璃擬態，預設）。目前風格由 `useCamelotTheme()` 管理並存在瀏覽器，可主題化元件依風格渲染對應外觀，props 與 emits 不變。色彩沿用 Material 3 的 `--color-{role}` token，不另立色票；色系細節見色彩主題頁。\n\n## 運作方式\n\n### 主題狀態\n\n| 項目 | 說明 |\n| :--- | :--- |\n| 可選風格 | `material`、`cupertino`、`scifi`、`aqua` |\n| 預設風格 | `aqua`，新使用者首次進入即為玻璃風格 |\n| 保存位置 | localStorage 的 `cml-theme-mode` 鍵 |\n| 全域標記 | html 元素寫入 `data-camelot-theme-mode` 屬性與 `--cml-active-ui-style` 變數 |\n| 樣式核心 | Tailwind CSS v4；共用樣式集中在全域樣式表的 `@utility` 與 `@theme` |\n\n來源：1. [useCamelotTheme.ts][]　2. [tailwind.css][]\n\n### Router 元件\n\nButton、Input、Switch、Checkbox 是 router 元件：本身不畫 UI，依目前風格渲染對應風格的子元件。\n\n其餘可主題化元件，例如 Tabs、Dialog、Steps、Select、Skeleton、Toast、Loading、DatePicker，在元件內依風格分支。\n\n這張圖回答：一個 router 元件怎麼決定要畫哪個風格？\n\n```json diagram id=圖1\n{\n  \"type\": \"flow\",\n  \"dir\": \"LR\",\n  \"title\": \"Router 元件分派\",\n  \"desc\": \"router 元件讀目前主題風格，渲染對應風格的子元件，並注入角色色 CSS 變數\",\n  \"nodes\": [\n    {\"id\": \"T\", \"text\": \"主題狀態\", \"shape\": \"db\", \"kind\": \"data\"},\n    {\"id\": \"R\", \"text\": \"Router 元件\", \"key\": true},\n    {\"id\": \"M\", \"text\": \"Material 版\"},\n    {\"id\": \"C\", \"text\": \"Cupertino 版\"},\n    {\"id\": \"S\", \"text\": \"Sci-Fi 版\"},\n    {\"id\": \"A\", \"text\": \"Aqua 版\"},\n    {\"id\": \"V\", \"text\": \"角色色變數\", \"kind\": \"data\"}\n  ],\n  \"edges\": [\n    {\"from\": \"T\", \"to\": \"R\"},\n    {\"from\": \"R\", \"to\": \"M\", \"label\": \"material\"},\n    {\"from\": \"R\", \"to\": \"C\", \"label\": \"cupertino\"},\n    {\"from\": \"R\", \"to\": \"S\", \"label\": \"scifi\"},\n    {\"from\": \"R\", \"to\": \"A\", \"label\": \"aqua\"},\n    {\"from\": \"R\", \"to\": \"V\", \"label\": \"注入 CSS 變數\", \"kind\": \"async\"}\n  ]\n}\n```\n\n![Router 元件分派](theme-system.圖1.svg)\n\n來源：1. [Button.vue][]　2. [useCamelotRoleColorClass.ts][]\n\n### 主題切換漸變\n\n切換主題風格、深淺色、色系或品牌色時，全站顏色以漸變過場：\n\n1. 在 html 元素暫時加上漸變 class，360ms 後移除。\n2. 期間所有元素的底色、文字、邊框、fill、stroke 以 0.32 秒的 ease-ios 過場。\n3. 計時器是全域單例，連續觸發只會重置同一個計時器。\n4. 使用者偏好減少動態時不加 class，也就沒有過場。\n\n主題風格與深淺色的監聽在首次載入時不觸發，避免開頁閃動。\n\n品牌色與色系由設定主題色的函式觸發；需要手動觸發時可呼叫 `triggerThemeTransition`。\n\n來源：1. [useCamelotTheme.ts][]　2. [tailwind.css][]\n\n## 表單控制項高度與字級\n\nInput、Select、NumberCounter、DatePicker 系列與 Button 在四個主題都以 42px 為最低高度，並排時對齊。\n\n字級 1rem 設在元件根節點，外部 CSS 可以覆蓋；字級變大時，高度跟著撐高。\n\n| 主題 | 欄位樣式 |\n| :--- | :--- |\n| material | Filled 欄位；Input 另有 `labelMode`，預設 outside，floating 時最低高度 56px |\n| cupertino | Cupertino Input 樣式，沒有可見框線 |\n| scifi | 欄位包在 HUD 外框裡 |\n| aqua | 半透明軌道底與 12px 圓角 |\n\n來源：1. [Input.vue][]　2. [NumberCounter.vue][]　3. [FieldFrame.vue][]　4. [useCamelotPickerTheme.ts][]\n\n## Aqua 視覺語言\n\n玻璃擬態：半透明、背景模糊、髮絲邊、柔光與 spring 動畫，由全域樣式表的共用 utility 提供。\n\n| utility | 用途 |\n| :--- | :--- |\n| `aqua-glass` | 浮層與面板：半透明、模糊、讀邊框 token 的髮絲邊與柔影，用於 Dialog、Select 浮層、DatePicker 面板 |\n| `aqua-fill` | 填滿態：135° 漸層、頂部內高光與收緊柔光，用於按鈕、選中 pill、checkbox 勾選、switch 開 |\n| `aqua-track` | 軌道與未選態：髮絲級半透明底加細邊 |\n| `aqua-glow` | 聚焦光暈，可搭配 focus 或 focus-within 變體 |\n| `aqua-thumb` | 玻璃光澤拖點，用於 switch thumb |\n\n來源：1. [tailwind.css][]\n\n### 圓角 token\n\nAqua 表單控制項不用膠囊圓角，統一消費兩個圓角 token：\n\n| token | 值 | utility | 消費者 |\n| :--- | :---: | :--- | :--- |\n| `--radius-aqua-control` | 12px | `rounded-aqua-control` | Button、Input、Select 觸發器、NumberCounter、Textarea、日期與時間選擇器觸發欄位 |\n| `--radius-aqua-panel` | 16px | `rounded-aqua-panel` | Select 選單面板、日期與時間選擇器浮層面板與其落影容器 |\n\n面板與它的落影容器圓角必須一致，否則落影會露出方角。\n\nTabs、Switch、Radio、Checkbox、Slider thumb、Pagination 頁碼維持膠囊或圓形；Dialog 面板是大面積浮層，維持 `rounded-3xl`。\n\n來源：1. [tailwind.css][]\n\n## 共用 token 與色彩規則\n\n### 邊框 token\n\n語意化邊框色 `--color-border` 同時產生 border-border 工具，預設等於 M3 的 outline-variant。\n\naqua 主題在根節點把它覆寫成角色色 12% 的淡色髮絲線。玻璃面板與軌道兩個工具的邊框都讀這個 token，所以 Dialog、Sheet、Toast、Table、選項面板與 DatePicker 的邊框會一起變化。\n\n玻璃面板頂部的內高光是 18% 白，底色是 72% 的 surface；個別元件可再覆寫底色，例如通知卡用 55%。\n\n來源：1. [tailwind.css][]\n\n### 色彩角色與前景配對\n\n元件的 `color` prop 經 [useCamelotRoleColorClass](../features/composables/useCamelotRoleColorClass.md) 解析成兩個 CSS 變數：角色色與它的配對前景色。傳入 container 旗標時改用 container 色階。\n\n| 規則 | 說明 |\n| :--- | :--- |\n| 前景配對 | 底色用角色色的表面，文字與圖示一律用配對前景色，不寫死 on-primary 或白色 |\n| Teleport 浮層 | 浮層離開原本的 DOM 位置後 CSS 變數不再繼承，要在浮層上重新套角色 class，或以 inline style 帶入目前的角色色 |\n| 狀態色預設值 | info、warning、success 在色系未設定時有內建的藍、橘、綠，前景為白，不會變成黑色 |\n\n來源：1. [useCamelotRoleColorClass.ts][]　2. [tailwind.css][]\n\n### 樣式寫法\n\n| 規則 | 說明 |\n| :--- | :--- |\n| 優先 utility | 動態 style 與 scoped CSS 盡量改用 Tailwind utility、before 與 after 變體、arbitrary value |\n| 共用動畫 | 共用 keyframes 如 `scifi-scan`，與緩動 `ease-spring`、`ease-ios` 集中在 `@theme` |\n| 保留 scoped CSS | 含 keyframes、原生捲軸樣式、transition-group 或 deep 選擇器的元件，例如 Scrollbar、RippleEffect、Reveal 系列、Sci-Fi 外框 |\n\n來源：1. [tailwind.css][]\n\n## 相關 Composables 與型別\n\n| 名稱 | 說明 |\n| :--- | :--- |\n| [useCamelotTheme](../features/composables/useCamelotTheme.md) | 主題風格、深淺色、色彩方案與主題色設定 |\n| [useCamelotRoleColorClass](../features/composables/useCamelotRoleColorClass.md) | 把 `color` 角色解析成設定 `--cml-color-current-*` 的 class |\n| [useCamelotPickerTheme](../features/composables/useCamelotPickerTheme.md) | DatePicker 各風格的觸發欄位、面板與選中底色 class |\n| `CamelotColorRole` | 共用色彩角色 union：primary、secondary、tertiary、error、info、warning、success |\n| `CamelotInputType` | Input 原生 type union：text、password、email、number、tel、url、search |\n\n來源：1. [camelot.ts][]\n\n## 相關頁面\n\n- [色彩主題](./color-scheme.md)\n- [元件清單](../features/components.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCamelotTheme.ts | [app/composables/useCamelotTheme.ts](../../../app/composables/useCamelotTheme.ts) |\n| tailwind.css | [app/assets/css/tailwind.css](../../../app/assets/css/tailwind.css) |\n| Button.vue | [app/components/Camelot/Button.vue](../../../app/components/Camelot/Button.vue) |\n| useCamelotRoleColorClass.ts | [app/composables/useCamelotRoleColorClass.ts](../../../app/composables/useCamelotRoleColorClass.ts) |\n| Input.vue | [app/components/Camelot/Input.vue](../../../app/components/Camelot/Input.vue) |\n| NumberCounter.vue | [app/components/Camelot/NumberCounter.vue](../../../app/components/Camelot/NumberCounter.vue) |\n| FieldFrame.vue | [app/components/Camelot/Internal/FieldFrame.vue](../../../app/components/Camelot/Internal/FieldFrame.vue) |\n| useCamelotPickerTheme.ts | [app/composables/useCamelotPickerTheme.ts](../../../app/composables/useCamelotPickerTheme.ts) |\n| camelot.ts | [shared/types/camelot.ts](../../../shared/types/camelot.ts) |\n\n[useCamelotTheme.ts]: #references\n[tailwind.css]: #references\n[Button.vue]: #references\n[useCamelotRoleColorClass.ts]: #references\n[Input.vue]: #references\n[NumberCounter.vue]: #references\n[FieldFrame.vue]: #references\n[useCamelotPickerTheme.ts]: #references\n[camelot.ts]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"主題系統","summary":"Camelot 的主題系統讓同一組元件介面切換成四種視覺風格：`material`（Material 3）、`cupertino`（Apple）、`scifi`（HUD）與 `aqua`（玻璃擬態，預設）。目前風格由 `useCamelotTheme()` 管理並存在瀏覽器，可主題化元件依風格渲染對應外觀，props 與 emits 不變。色彩沿用 Material 3 的 `--color-{role}` token，不另立色票；色系細節見色彩主題頁。"}},"backlinks":{"index.md":["dev/layer-integration.md","dev/testing.md","environment.md","features/calendar.md","feature scrollbar），`layer-integration` 搬到 `dev/`；元件與 composable API 頁留在 `features/`（元件庫的元件即功能）。\n- **[Q2]** 批次紀錄型頁（datepicker-time-aqua-toast、pagination-virtualscroll-carousel、field-label-and-form-controls、layout-data-components）拆進對應元件／主題頁後刪除；index 的概覽、模組、伺服器、架構圖移到新頁 `platform/architecture.md`（21 節點的圖拆成三張以符合 ≤ 12 節點）。\n- **[Q3]** 逐頁改寫以子代理平行處理：階段一單一代理拆批次頁（避免與階段二搶同一檔），階段二 8 個代理負責互不重疊的頁集，共用一份改寫規範。\n- **[Q4]** 完成條件為硬閘歸零；警告順手修，剩餘列入報告。\n- **[Phase 0]** archive 內的舊 wiki 連結不改 — 歸檔是歷史紀錄。\n- **[執行中]** 搬頁以自寫腳本重算全 wiki 與 README／AGENTS／project.md 的相對連結，讀寫保留原本換行字元（project.md 為 CRLF／LF 混用；第一次以 Python 文字模式讀寫把 CRLF 改成 LF，已還原重做）。\n- **[執行中]** API 參考頁沿用 `## Props`、`## Emits` 等表格段作為 Summary 後第一段（lint 只給警告）；composable 頁以「運作方式」開頭。\n- **[執行中]** 名稱過寬的 H1 改為中文名詞片語（如 `useCamelotMenuItemTheme` →「選單項主題」、`CustomColorSchemeProvider` →「區域配色提供者」），完整名稱寫在 Summary。\n- **[執行中]** `wiki-changelog.py` 以 git 推導頁集時漏掉 rename 的頁（platform／dev 9 頁），改以 `--pages` 明列補上。\n\n## Deviations\n- `wiki-refs-migrate.py` 轉換 0 頁：舊頁根本沒有 References 定義（路徑直接寫在正文），References 表格全部在改寫時從頭建立。\n- 原計畫以腳本補導覽列；實際由子代理在改寫時一併處理。\n- Changelog 的 PR 欄留「—」：Changelog 在 PR 建立前寫入。\n\n## Impact Files\n- `.kn-project/wiki/index.md` — 純連結分段索引（功能／平台／開發）\n- `.kn-project/wiki/environment.md` — env 頁型改寫；修正變數名 `NUXT_PUBLIC_REPLACE_END_SPLASH`、建置期設定說明、CSP 基底\n- `.kn-project/wiki/platform/*.md`（9 頁，含新頁 `architecture.md`）、`.kn-project/wiki/dev/layer-integration.md`\n- `.kn-project/wiki/features/*.md`（9 頁主題頁；刪除 4 頁批次頁）\n- `.kn-project/wiki/features/components/*.md`（96 頁，含新頁 `Internal-FieldFrame.md`）\n- `.kn-project/wiki/features/composables/*.md`（52 頁）\n- `.kn-project/wiki/**/*.svg`（17 張圖）、`.kn-project/wiki.html`（`wiki-build.py` 產物）\n- `README.md`、`AGENTS.md`、`.kn-project/project.md` — wiki 連結隨搬移更新；project.md 新增架構頁入口\n\n## Details\n子代理對照原始碼時發現的疑似程式碼缺陷（wiki 已如實記錄現行行為，程式碼未改，供日後另開計畫）：\n\n| 位置 | 現象 |\n|---|---|\n| useValueValidation | email 正規表示式字元類寫成雙反斜線：允許反斜線、拒絕連字號（`a-b@x.com` 失敗） |\n| useFetchJSONLinesStream | 結尾沒有換行的最後一行不會被解析；`finishOnParseError` 讀原始值，只有明確 `true` 才中止 |\n| useInputValidationController | 移除從未加入的 validator 會誤刪最後一個；介面沒有 `hasInvalid` |\n| useFileToDataURL | 讀檔失敗時 Promise 永不結束，`pending` 停在 `true` |\n| useIsValidKey | 參數型別宣告為 `object`，型別守衛把 key 收窄成 `never` |\n| useLazyImage | `src` 為空時狀態卡在 loading |\n| useObject | `diff` 在舊值 `null`、新值為物件時拋 TypeError；`deepClone` 把 Map／Set 變成空物件 |\n| useColor | `hexToRgba` 未帶 alpha 時除以 255 兩次，alpha 恆為 0 |\n| useAutoLink | 未做 HTML 跳脫，搭配 `v-html` 有 XSS 風險 |\n| useBlobDownload | object URL 從未釋放 |\n| useCanvasConvert | `toBlob` 不接受格式參數，永遠輸出 PNG |\n| useInfinitePage | 預設 `target = window` 在伺服器端失敗 |\n| useDrawerCollapsed | 模組層 ref 在 SSR 時被所有請求共用 |\n| RevealImage | `prefers-reduced-motion` 規則選到不存在的元素，動畫照播；平滑揭示依賴 RevealText 的 `@property` 註冊 |\n| RippleEffect | `rippleColor` 只在更新時寫入，掛載時沒有，初次漣漪可能看不見 |\n| Slider | `disabled` 時方向鍵仍可改值 |\n| SlideTransitionGroup | `next` 可移到最後一項之後、沒有內容的索引 |\n| DateV2 | `disableDaysOfWeekList`、`allowedDates` 宣告但未使用 |\n| Input | `border`、`size` 宣告但無作用 |\n| ImageV2 | `loaded` 事件宣告但從未發出；`src` 只在建立時讀一次 |\n| 環境變數 | `NUXT_PUBLIC_ENV` Layer 內無人讀取；`@nuxt/kit` 未在 package.json 直接宣告 |\n","title":"2609231616 - wiki-lint-migration"},"archive/2609231702-fix-wiki-review-code-defects.md":{"md":"# 2609231702 - fix-wiki-review-code-defects\n\n- Created: 2026-09-23 17:02 / Archived: 2026-09-23\n- Issue: KNightING/camelot-nuxt-layer#47\n- Milestone: N/A / Base Branch: main\n\n## Summary\n修正 wiki 整理（2609231616）時發現、逐項對照原始碼確認的 20 項程式碼缺陷，並建立 vitest 單元測試環境（37 個測試）。\n缺陷橫跨 13 個 composable 與 7 個元件，包含 email 驗證拒絕連字號、`hexToRgba` alpha 恆為 0、`useAutoLink` 未跳脫 HTML、JSON Lines 丟失最後一行、RippleEffect 自訂漣漪色從未生效等。\n每個 composable 缺陷先寫出能重現的失敗測試再修正；型別層缺陷由 `pnpm typecheck` 檢查測試檔抓出；元件在 playground 實測。對應 wiki 頁已改為修正後的行為，並新增 `dev/testing.md`。\n\n## Cross-Repo Scope\n無（單一 repo）\n\n## Key Decisions\n- **[Q0]** 不指定 milestone，Base Branch = `main`。\n- **[Q1]** `useFetchJSONLinesStream` 的 `finishOnParseError` 讓宣告的預設 `true` 生效（行為變更：原本實際不中止）。\n- **[Q2]** DateV2 實作 `disableDaysOfWeekList`、`allowedDates`（與使用端 `getDayAttributes` 合成停用日）；Input 移除無作用的 `border`、`size`（破壞性變更）— 使用者選擇。\n- **[Q3]** 建立 vitest：以 unimport 重建 Nuxt 自動匯入（vue、@vueuse/core、app/composables），`useState`／`useAsyncData` 由 `tests/nuxt-stubs.ts` 替身提供，環境 happy-dom；新增 devDependencies `happy-dom`、`unimport`（後者原為間接依賴，改為明確宣告）與 `pnpm test`。\n- **[Q4]** 不拆，一個 PR。\n- **[Phase 0]** `NUXT_PUBLIC_ENV`、`@nuxt/kit`、驗證器接受非空字串不列入 — 非缺陷或已有前例決議（2608190042 Q6）。\n- **[Phase 0]** email 頂級網域長度維持 `{2,4}`，只修字元類。\n- **[Phase 0]** `useLazyImage` 空 `src` 視為錯誤（ImageV2 顯示 error slot）。\n- **[執行中]** RippleEffect 實際傳入值是 `var(--color-on-*-container)` 等 CSS 變數而非 hex，原本的 hex 轉換一律失敗；改由模板 `:style` 直接綁 CSS 變數，接受任何色值，移除 `useElCssVar`（它在掛載前會 fallback 寫到 `<html>`）。\n- **[執行中]** `useAutoLink` 改在原始文字上以合併正則一次掃描，非連結片段逐段跳脫；同位置優先序網址 > email > 電話。\n- **[執行中]** `useInfinitePage` 不再給 target 預設值，交給 `useScrollOnBottom` 掛載後改用 window。SSR 測試以 `renderToString` 在元件內呼叫（元件外呼叫時 `tryOnMounted` 會立即執行，無法代表 SSR）。\n- **[執行中]** DateV2 `allowedDates` 中無法解析的日期略過，避免 `format` 拋錯使日曆無法渲染（子代理審查時發現的新邊界）。\n- **[執行中]** playground 補停用週末 DateV2、停用 Slider、ImageV2 `@loaded` 範例，作為實測與示範。\n\n## Deviations\n- 原計畫未列 `package.json` 依賴變更與 `tests/`、`vitest.config.ts`，執行中新增（Q3 的直接結果）。\n- SlideTransitionGroup、RevealImage 在 playground 沒有範例，僅以程式碼審查與型別檢查驗證，未實機確認。\n- JSON Lines 若解析錯誤發生在沒有換行的最後一行，串流已結束，使用端 `onFinish` 仍會被呼叫（中途錯誤則不會）；影響小，未處理。\n\n## Impact Files\n- `app/composables/useValueValidation.ts:17`、`useColor.ts:62-73`、`useAutoLink.ts`（重寫）、`useFetchJSONLinesStream.ts:57-82,95-104`\n- `app/composables/useInputValidationController.ts`、`useFileToDataURL.ts`、`useBlobDownload.ts`、`useCanvasConvert.ts`、`useIsValidKey.ts`\n- `app/composables/useLazyImage.ts:30-40`、`useObject.ts`（diff、deepClone）、`useInfinitePage.ts:15`、`useDrawerCollapsed.ts`\n- `app/components/Camelot/RippleEffect.vue`、`RevealImage.vue`、`Slider.vue`（onThumbKey）、`SlideTransitionGroup.vue`（next）\n- `app/components/Camelot/ImageV2.vue`（loaded、src 響應）、`DateV2.vue`（resolveDayAttributes）、`Input.vue`（移除 border、size）\n- `vitest.config.ts` (new)、`tests/nuxt-stubs.ts` (new)、`tests/composables/*.test.ts` (new, 13 檔)\n- `package.json`、`pnpm-lock.yaml` — `test` script、happy-dom、unimport\n- `.playground/app/pages/index.vue` — 三個示範\n- `.kn-project/wiki/features/composables/*.md`（13 頁）、`.kn-project/wiki/features/components/*.md`（7 頁）、`.kn-project/wiki/dev/testing.md` (new)、`.kn-project/wiki/index.md`\n","title":"2609231702 - fix-wiki-review-code-defects"}},"repoUrl":"https://github.com/KNightING/camelot-nuxt-layer","repoBranch":"main","appflow":null};

/* ---------- Markdown renderer (dependency-free; ported from kn:project:viewer) ---------- */
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]);}
function slug(s){return s.trim().toLowerCase().replace(/[^\w一-龥\- ]/g,'').replace(/\s+/g,'-');}
function splitRow(line){let s=line.trim().replace(/^\|/,'').replace(/\|$/,'');
  const out=[];let cur='';let escd=false;
  for(const ch of s){if(escd){cur+=ch;escd=false;}else if(ch==='\\'){escd=true;}
    else if(ch==='|'){out.push(cur.trim());cur='';}else cur+=ch;}
  out.push(cur.trim());return out;}
let CURRENT_REFS={};
function collectRefs(md){const refs={};md.replace(/^\[([^\]]+)\]:\s*(\S+)/gm,(m,id,url)=>{refs[id]=url;return m;});return refs;}
function renderInline(s){
  const codes=[];
  s=s.replace(/`([^`]+)`/g,(m,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000';});
  s=esc(s);
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,a,src)=>`<img alt="${a}" src="${src}">`);
  s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,t,u)=>`<a href="${u}">${t}</a>`);
  // reference-style：[text][id]、[id][]（定義在 ## References；來源檔連到 repo）
  s=s.replace(/\[([^\]]+)\]\[([^\]]*)\]/g,(m,t,id)=>{const key=id||t;const u=CURRENT_REFS[key];if(!u)return m;const isSrc=!/^(https?:|#)/.test(u);const href=isSrc&&REPO_URL?REPO_URL.replace(/\/$/,'')+'/blob/'+(WIKI.repoBranch||'main')+'/'+u.replace(/^(\.\.\/)+/,''):u;return `<a class="${isSrc?'src':''}" href="${href}" ${/^https?:/.test(href)?'target="_blank" rel="noopener"':''}>${t}</a>`;});
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^\w*])\*([^*\n]+)\*(?![\w*])/g,'$1<em>$2</em>');
  s=s.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  s=s.replace(/\u0000(\d+)\u0000/g,(m,i)=>`<code>${esc(codes[i])}</code>`);
  return s;
}
function parseList(lines,start){
  const entries=[];let i=start;
  while(i<lines.length){
    const m=lines[i].match(/^(\s*)([-*+]|\d+\.)\s+(.*)$/);
    if(m){entries.push({indent:m[1].replace(/\t/g,'  ').length,marker:m[2],text:m[3]});i++;continue;}
    if(lines[i].trim()===''){ if(i+1<lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i+1])){i++;continue;} }
    break;
  }
  function build(idx,indent){
    const type=/\d+\./.test(entries[idx].marker)?'ol':'ul';
    let html='<'+type+'>';
    while(idx<entries.length && entries[idx].indent>=indent){
      if(entries[idx].indent>indent)break;
      const e=entries[idx];idx++;
      let li;
      const task=e.text.match(/^\[([ xX])\]\s+(.*)$/);
      if(task){const ck=task[1].toLowerCase()==='x';
        li=`<label class="task"><input type="checkbox" disabled ${ck?'checked':''}> <span>${renderInline(task[2])}</span></label>`;
      }else li=renderInline(e.text);
      let child='';
      if(idx<entries.length && entries[idx].indent>indent){const r=build(idx,entries[idx].indent);child=r.html;idx=r.idx;}
      html+='<li>'+li+child+'</li>';
    }
    return {html:html+'</'+type+'>',idx};
  }
  const r=build(0,entries[0].indent);
  return {html:r.html,next:i};
}
function renderMarkdown(md){
  // 技能檔開頭的 YAML front matter 不是內文
  md=md.replace(/^---\n[\s\S]*?\n---\n/,'');
  const lines=md.replace(/\r\n/g,'\n').split('\n');
  const out=[];let i=0;
  while(i<lines.length){
    const line=lines[i];
    const fence=line.match(/^```([\w-]*)(.*)$/);
    if(fence){const lang=fence[1],info=fence[2].trim();const buf=[];i++;
      while(i<lines.length && !/^```\s*$/.test(lines[i])){buf.push(lines[i]);i++;}i++;
      // 圖表定義（JSON 正本）收進摺疊區；圖本身是下一行的 .svg 圖片
      if(lang==='json'&&/^diagram\b/.test(info))out.push(`<details class="diagram-src"><summary>圖表定義（JSON）</summary><pre class="code"><code>${esc(buf.join('\n'))}</code></pre></details>`);
      else out.push(`<pre class="code"><code>${esc(buf.join('\n'))}</code></pre>`);
      continue;}
    if(/^<!--/.test(line.trim())){while(i<lines.length && !/-->/.test(lines[i]))i++;i++;continue;}
    if(/^\[[^\]]+\]:\s*\S+/.test(line)){i++;continue;}   // reference 定義行不渲染
    const h=line.match(/^(#{1,6})\s+(.*)$/);
    if(h){const l=h[1].length;out.push(`<h${l} id="${slug(h[2])}">${renderInline(h[2])}</h${l}>`);i++;continue;}
    if(/^\s*([-*_])\1{2,}\s*$/.test(line)){out.push('<hr>');i++;continue;}
    if(/^>\s?/.test(line)){const buf=[];
      while(i<lines.length && /^>\s?/.test(lines[i])){buf.push(lines[i].replace(/^>\s?/,''));i++;}
      let inner=buf.join('\n');let cls='callout';const cm=inner.match(/^\[!(\w+)\]/);
      if(cm){cls+=' callout-'+cm[1].toLowerCase();inner=inner.replace(/^\[!\w+\][^\n]*\n?/,'');}
      out.push(`<blockquote class="${cls}">${renderMarkdown(inner)}</blockquote>`);continue;}
    if(line.includes('|') && i+1<lines.length && /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(lines[i+1]) && lines[i+1].includes('-')){
      const header=splitRow(line);i+=2;const rows=[];
      while(i<lines.length && lines[i].includes('|') && lines[i].trim()!==''){rows.push(splitRow(lines[i]));i++;}
      let t='<table><thead><tr>'+header.map(c=>`<th>${renderInline(c)}</th>`).join('')+'</tr></thead><tbody>';
      for(const r of rows)t+='<tr>'+r.map(c=>`<td>${renderInline(c)}</td>`).join('')+'</tr>';
      out.push(t+'</tbody></table>');continue;}
    if(/^\s*([-*+]|\d+\.)\s+/.test(line)){const r=parseList(lines,i);out.push(r.html);i=r.next;continue;}
    if(line.trim()===''){i++;continue;}
    const buf=[line];i++;
    while(i<lines.length && lines[i].trim()!=='' &&
      !/^(#{1,6}\s|>\s?|```|\s*([-*+]|\d+\.)\s+)/.test(lines[i]) &&
      !/^\s*([-*_])\1{2,}\s*$/.test(lines[i])){buf.push(lines[i]);i++;}
    out.push(`<p>${renderInline(buf.join('\n')).replace(/\n/g,'<br>')}</p>`);
  }
  return out.join('\n');
}

/* ---------- State & helpers ---------- */
const PAGES=WIKI.pages, ORDER=WIKI.order, BACK=WIKI.backlinks||{}, EXT=WIKI.external||{};
const EXT_PREFIX='ext:';
let currentPath=null;
// 回訪還原捲動位置：站內連結／翻頁是「新造訪」（捲頂或錨點）；← →、重新整理是「回訪」（還原離開時的位置）
let freshNav=false, restoring=false;
const scrollKey=p=>'kn-wiki:scroll:'+p;
function saveScroll(){if(restoring||!currentPath)return;try{sessionStorage.setItem(scrollKey(currentPath),String(document.getElementById('main').scrollTop));}catch(e){}}
const store={get(k,d){try{const v=localStorage.getItem('kn-wiki:'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('kn-wiki:'+k,JSON.stringify(v));}catch(e){}}};
function resolvePath(base,href){
  href=href.split('#')[0];if(!href)return base;
  const parts=base.includes('/')?base.slice(0,base.lastIndexOf('/')).split('/'):[];
  for(const seg of href.split('/')){if(seg==='.'||seg==='')continue;
    // 往上超過起點時保留 '..'，外部頁（鍵本身以 ../ 開頭）的相對連結才算得對
    else if(seg==='..'){if(parts.length&&parts[parts.length-1]!=='..')parts.pop();else parts.push('..');}
    else parts.push(seg);}
  return parts.join('/');
}
// 把任一頁（wiki 頁或外部頁）裡的 href 解析成目標：{page} 或 {ext} 或 {href}（另開分頁，相對 wiki.html）
function resolveLink(cur,href){
  const anchor=href.includes('#')?href.split('#')[1]:'';
  if(cur.startsWith(EXT_PREFIX)){
    const r=resolvePath(cur.slice(EXT_PREFIX.length),href);
    if(r.startsWith('wiki/')&&PAGES[r.slice(5)])return {page:r.slice(5),anchor};
    if(EXT[r])return {ext:r,anchor};
    return {href:r+(anchor?'#'+anchor:'')};
  }
  const r=resolvePath(cur,href);
  if(PAGES[r])return {page:r,anchor};
  const e=externalHref(cur,href).split('#')[0];
  if(EXT[e])return {ext:e,anchor};
  // 相對連結脫離 wiki 根（References 表格的位置欄）：wiki 在 <repo>/.kn-project/wiki，算出 repo 相對路徑後連到 GitHub blob
  if(!/^[a-z]+:/i.test(href)&&REPO_URL){const rp=resolvePath('.kn-project/wiki/'+cur,href);if(!rp.startsWith('..'))return {href:REPO_URL.replace(/\/$/,'')+'/blob/'+(WIKI.repoBranch||'main')+'/'+rp};}
  return {href:externalHref(cur,href)};
}
function hashFor(t){return '#'+(t.page!==undefined?encodeURI(t.page):EXT_PREFIX+encodeURI(t.ext))+(t.anchor?'#'+t.anchor:'');}
// A link that leaves the wiki root (../../archive/x.md, ../../../skills/…) becomes a real relative link from wiki.html,
// which sits one level above wiki/ — so the target is resolved against "wiki/<page>" instead.
function externalHref(base,href){return resolvePath('wiki/'+base,href)+(href.includes('#')?'#'+href.split('#')[1]:'');}
function titleOf(p){return (PAGES[p]&&PAGES[p].title)||(EXT[p]&&EXT[p].title)||p.replace(/\.md$/,'');}

/* ---------- Sidebar tree ---------- */
const SECTIONS=[['features','功能'],['integrations','整合'],['platform','平台'],['ops','維運'],['dev','開發'],['db','資料庫']];
const SECTION_LABEL=Object.fromEntries(SECTIONS);
function buildTree(){
  // 側欄依五大分類分組：根層頁在最上（index／environment／database／glossary），各分類一段，段內散頁 → 子模組資料夾
  const roots=ORDER.filter(p=>!p.includes('/'));
  const closed=new Set(store.get('closed',[]));
  const li=p=>`<li><a class="f" href="#${encodeURI(p)}" data-path="${esc(p)}">📄 ${esc(titleOf(p))}</a></li>`;
  let html='<ul>'+roots.map(li).join('')+'</ul>';
  for(const [sec,label] of SECTIONS){
    const pages=ORDER.filter(p=>p.startsWith(sec+'/'));
    if(!pages.length)continue;
    const loose=pages.filter(p=>p.split('/').length===2);
    const mods={};for(const p of pages.filter(p=>p.split('/').length>2)){const m=p.split('/')[1];(mods[m]=mods[m]||[]).push(p);}
    html+=`<span class="sec">${esc(label)}</span><ul>`+loose.map(li).join('');
    for(const m of Object.keys(mods).sort()){const path=sec+'/'+m;
      const items=mods[m].sort((a,b)=>(a.endsWith('/index.md')?0:1)-(b.endsWith('/index.md')?0:1)||a.localeCompare(b));
      html+=`<li class="${closed.has(path)?'closed':''}" data-dir="${esc(path)}"><span class="d">📁 ${esc(m)}</span><ul>${items.map(li).join('')}</ul></li>`;}
    html+='</ul>';
  }
  // 不在五大分類也不在根層的（舊結構）：照目錄樹列，讓人看得到要搬
  const other=ORDER.filter(p=>p.includes('/')&&!SECTIONS.some(([sec])=>p.startsWith(sec+'/')));
  if(other.length)html+='<span class="sec">其他</span><ul>'+other.map(li).join('')+'</ul>';
  document.getElementById('tree').innerHTML=html;
}

/* ---------- Search ---------- */
const INDEX=ORDER.map(p=>({p,title:titleOf(p).toLowerCase(),summary:(PAGES[p].summary||'').toLowerCase(),body:PAGES[p].md.toLowerCase()}));
function search(q){
  q=q.trim().toLowerCase();if(!q)return [];
  const terms=q.split(/\s+/);
  return INDEX.map(e=>{let s=0;
    for(const t of terms){if(e.title.includes(t))s+=6;if(e.summary.includes(t))s+=3;const n=e.body.split(t).length-1;s+=Math.min(n,8);
      if(!(e.title.includes(t)||e.summary.includes(t)||n))return null;}
    return {p:e.p,s};}).filter(Boolean).sort((a,b)=>b.s-a.s).slice(0,30);
}
function snippet(p,q){const md=PAGES[p].md;const t=q.trim().toLowerCase().split(/\s+/)[0];
  const i=md.toLowerCase().indexOf(t);const from=Math.max(0,i-40);let s=md.slice(from,from+110).replace(/\n/g,' ');
  s=esc(s);if(t)s=s.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),m=>'<mark>'+m+'</mark>');return s;}
let selIdx=0;
function showResults(q){
  const box=document.getElementById('results'),tree=document.getElementById('tree');
  if(!q.trim()){box.style.display='none';tree.style.display='block';return;}
  const rs=search(q);selIdx=0;
  box.innerHTML=rs.length?rs.map((r,i)=>`<a class="res ${i===0?'sel':''}" href="#${encodeURI(r.p)}" data-path="${esc(r.p)}"><b>${esc(titleOf(r.p))}</b><small>${snippet(r.p,q)}</small></a>`).join('')
    :'<div id="empty">沒有符合的頁面</div>';
  box.style.display='block';tree.style.display='none';
}

/* ---------- 圖表（.svg 圖片）：點擊放大 ---------- */
function currentTheme(){const t=document.documentElement.getAttribute('data-theme');
  return t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');}
function ensureLightbox(){
  let lb=document.getElementById('mmd-lb');if(lb)return lb;
  lb=document.createElement('div');lb.id='mmd-lb';
  lb.innerHTML='<button class="lb-close" title="關閉 (Esc)">×</button><div class="stage"></div><div class="lb-hint">滾輪縮放 · 拖曳平移 · 雙擊重置 · Esc 關閉</div>';
  document.body.appendChild(lb);
  const stage=lb.querySelector('.stage');
  let scale=1,base=1,tx=0,ty=0,drag=false,sx=0,sy=0;
  const apply=()=>{stage.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;};
  const reset=()=>{scale=base;tx=0;ty=0;apply();};
  const close=()=>{lb.classList.remove('open');stage.innerHTML='';};
  lb.__open=(html)=>{stage.innerHTML=html;lb.classList.add('open');scale=1;tx=0;ty=0;apply();base=1;
    const svg=stage.querySelector('svg,img');
    if(svg){const r=svg.getBoundingClientRect();
      if(r.width&&r.height)base=Math.max(0.2,Math.min(12,Math.min((0.86*innerWidth)/r.width,(0.82*innerHeight)/r.height)));}
    scale=base;apply();};
  lb.querySelector('.lb-close').addEventListener('click',close);
  lb.addEventListener('click',e=>{if(e.target===lb)close();});
  lb.addEventListener('wheel',e=>{e.preventDefault();const ns=Math.max(0.2,Math.min(12,scale*(e.deltaY<0?1.12:1/1.12)));
    const k=ns/scale,ex=e.clientX-innerWidth/2,ey=e.clientY-innerHeight/2;
    tx=ex*(1-k)+k*tx;ty=ey*(1-k)+k*ty;scale=ns;apply();},{passive:false});
  stage.addEventListener('mousedown',e=>{drag=true;sx=e.clientX-tx;sy=e.clientY-ty;stage.style.cursor='grabbing';e.preventDefault();});
  window.addEventListener('mousemove',e=>{if(drag){tx=e.clientX-sx;ty=e.clientY-sy;apply();}});
  window.addEventListener('mouseup',()=>{drag=false;stage.style.cursor='grab';});
  stage.addEventListener('dblclick',reset);
  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&lb.classList.contains('open'))close();});
  return lb;
}
function enhanceDiagrams(){
  document.querySelectorAll('#content img').forEach(img=>{
    if(!/\.svg(\?|$)/i.test(img.getAttribute('src')||''))return;
    img.classList.add('diagram');img.title='點擊放大';
    img.addEventListener('click',()=>ensureLightbox().__open(`<img src="${img.getAttribute('src')}" alt="${esc(img.alt||'')}" style="max-width:none;display:block">`));
  });
}

/* ---------- Content enhancements: copy buttons, table filter／sort, source links ---------- */
function enhanceContent(){
  // 每個程式碼區塊一顆複製鈕（範例 curl／JSON 一鍵複製）
  document.querySelectorAll('#content pre.code').forEach(pre=>{
    const b=document.createElement('button');b.className='copy';b.type='button';b.textContent='複製';b.title='複製內容';
    b.addEventListener('click',async()=>{const t=pre.querySelector('code')?.textContent||pre.textContent;
      try{await navigator.clipboard.writeText(t);}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
      b.textContent='已複製';b.classList.add('done');setTimeout(()=>{b.textContent='複製';b.classList.remove('done');},1200);});
    pre.appendChild(b);});
  // 表格：≥ 6 列給搜尋框；表頭可點排序（數字感知）
  document.querySelectorAll('#content table').forEach(tb=>{
    const rows=[...tb.tBodies[0]?.rows||[]];if(!rows.length)return;
    const wrap=document.createElement('div');wrap.className='tblwrap';tb.parentNode.insertBefore(wrap,tb);wrap.appendChild(tb);
    if(rows.length>=6){const bar=document.createElement('div');bar.className='tblbar';
      bar.innerHTML=`<input type="search" placeholder="篩選此表…"><small>${rows.length} 列</small>`;wrap.parentNode.insertBefore(bar,wrap);
      const inp=bar.querySelector('input'),cnt=bar.querySelector('small');
      inp.addEventListener('input',()=>{const q=inp.value.trim().toLowerCase();let n=0;
        rows.forEach(r=>{const show=!q||r.textContent.toLowerCase().includes(q);r.style.display=show?'':'none';if(show)n++;});cnt.textContent=`${n} / ${rows.length} 列`;});}
    [...tb.tHead?.rows[0]?.cells||[]].forEach((th,ci)=>{th.classList.add('sortable');
      th.addEventListener('click',()=>{const asc=!th.classList.contains('asc');
        [...tb.tHead.rows[0].cells].forEach(c=>c.classList.remove('asc','desc'));th.classList.add(asc?'asc':'desc');
        const val=r=>(r.cells[ci]?.textContent||'').trim();const num=v=>/^-?\d+(\.\d+)?$/.test(v);
        rows.sort((a,b)=>{const x=val(a),y=val(b);const r=(num(x)&&num(y))?(+x-+y):x.localeCompare(y,'zh-Hant');return asc?r:-r;});
        rows.forEach(r=>tb.tBodies[0].appendChild(r));});});});
}

/* ---------- Page render ---------- */
function buildToc(){
  const toc=document.getElementById('toc');const hs=[...document.querySelectorAll('#content h2,#content h3')];
  if(hs.length<2){toc.innerHTML='';return;}
  const base=currentPath.startsWith(EXT_PREFIX)?EXT_PREFIX+encodeURI(currentPath.slice(EXT_PREFIX.length)):encodeURI(currentPath);
  toc.innerHTML='<div class="t">本頁</div>'+hs.map(h=>`<a class="${h.tagName.toLowerCase()}" href="#${base}#${h.id}" data-id="${h.id}">${h.textContent}</a>`).join('');
}
function renderBacklinks(path){
  const refs=(BACK[path]||[]).filter(p=>PAGES[p]);
  if(!refs.length)return '';
  return `<div id="backlinks">← 連到本頁的頁面<ul>${refs.map(p=>`<li><a href="#${encodeURI(p)}">${esc(titleOf(p))}</a></li>`).join('')}</ul></div>`;
}
async function openPage(path,anchor){
  saveScroll();restoring=true;
  const isExt=path.startsWith(EXT_PREFIX), key=isExt?path.slice(EXT_PREFIX.length):path;
  const page=isExt?EXT[key]:PAGES[key];
  if(!page){document.getElementById('content').innerHTML=`<div id="empty">找不到頁面：${esc(key)}</div>`;return;}
  currentPath=path;
  CURRENT_REFS=collectRefs(page.md);
  document.getElementById('content').innerHTML=renderMarkdown(page.md)+(isExt?'':renderBacklinks(key));
  enhanceContent();
  // 圖片只引用不內嵌：相對 .md 的 src 改寫成相對 wiki.html（wiki 頁差一層 wiki/，外部頁以其鍵為基準）
  document.querySelectorAll('#content img').forEach(img=>{const src=img.getAttribute('src')||'';
    if(/^(https?:|data:|\/)/.test(src))return;img.setAttribute('src',resolvePath(isExt?key:'wiki/'+key,src));});
  document.title=titleOf(key)+' · '+WIKI.title;
  const segs=key.split('/');
  document.getElementById('crumb').innerHTML=(isExt?'<span class="ext-badge">wiki 外</span> ':'')+segs.map((s,i)=>i<segs.length-1?esc(s)+' / ':`<a href="${hashFor(isExt?{ext:key}:{page:key})}">${esc(s)}</a>`).join('');
  document.querySelectorAll('#tree .f').forEach(a=>a.classList.toggle('active',a.dataset.path===key&&!isExt));
  const i=isExt?-1:ORDER.indexOf(key);document.getElementById('prevBtn').disabled=i<=0;document.getElementById('nextBtn').disabled=i<0||i>=ORDER.length-1;
  buildToc();
  enhanceDiagrams();
  const main=document.getElementById('main');
  const fresh=freshNav;freshNav=false;
  let saved=0;try{saved=+(sessionStorage.getItem(scrollKey(path))||0);}catch(e){}
  if(!fresh&&saved)main.scrollTop=saved;
  else if(anchor){const el=document.getElementById(slug(decodeURIComponent(anchor)));if(el)el.scrollIntoView();else main.scrollTop=0;}
  else main.scrollTop=0;
  restoring=false;
}
function route(){
  const h=decodeURI((location.hash||'').replace(/^#/,''));
  const [path,anchor]=h.split('#');
  const ok=path&&(PAGES[path]||(path.startsWith(EXT_PREFIX)&&EXT[path.slice(EXT_PREFIX.length)]));
  const target=ok?path:(PAGES['index.md']?'index.md':ORDER[0]);
  if(!ok)history.replaceState(null,'','#'+encodeURI(target));
  openPage(target,anchor||'');
}

/* ---------- Theme ---------- */
function applyTheme(t){if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme');
  store.set('theme',t||'');document.getElementById('themeBtn').textContent=t==='dark'?'☾':t==='light'?'☀':'◐';}
function cycleTheme(){const cur=store.get('theme','');applyTheme(cur===''?'light':cur==='light'?'dark':'');

/* ---------- Events ---------- */
function wireEvents(){
  const tree=document.getElementById('tree');
  tree.addEventListener('click',e=>{const d=e.target.closest('span.d');if(!d)return;
    const li=d.parentElement;li.classList.toggle('closed');
    const closed=[...tree.querySelectorAll('li.closed')].map(x=>x.dataset.dir);store.set('closed',closed);});
  document.getElementById('content').addEventListener('click',e=>{
    const a=e.target.closest('a');if(!a)return;const href=a.getAttribute('href')||'';
    if(/^https?:|^mailto:/.test(href)){a.target='_blank';return;}
    if(href.startsWith('#')&&!href.slice(1).includes('#')&&!href.slice(1).endsWith('.md')){
      e.preventDefault();const el=document.getElementById(slug(decodeURIComponent(href.slice(1))));if(el)el.scrollIntoView();return;}
    if(href.startsWith('#'))return;
    e.preventDefault();
    const t=resolveLink(currentPath,href);
    if(t.href)window.open(t.href,'_blank');else{freshNav=true;location.hash=hashFor(t);}});
  // 側欄、搜尋、TOC、麵包屑、反向連結都是 <a href="#…">：點了就是新造訪
  document.addEventListener('click',e=>{if(e.target.closest('a[href^="#"]'))freshNav=true;});
  // 只有真的會另開分頁的連結標 ↗；內嵌的外部文件在站內開
  new MutationObserver(()=>{document.querySelectorAll('#content a:not([href^="#"]):not([href^="http"]):not(.ext):not(.int)').forEach(a=>{
    a.classList.add(resolveLink(currentPath,a.getAttribute('href')).href?'ext':'int');});}).observe(document.getElementById('content'),{childList:true});
  const searchEl=document.getElementById('search');
  searchEl.addEventListener('input',()=>showResults(searchEl.value));
  searchEl.addEventListener('keydown',e=>{const rs=[...document.querySelectorAll('#results .res')];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!rs.length)return;rs[selIdx]?.classList.remove('sel');
      selIdx=(selIdx+(e.key==='ArrowDown'?1:-1)+rs.length)%rs.length;rs[selIdx].classList.add('sel');rs[selIdx].scrollIntoView({block:'nearest'});}
    else if(e.key==='Enter'){if(rs[selIdx]){freshNav=true;location.hash=rs[selIdx].getAttribute('href');searchEl.value='';showResults('');searchEl.blur();}}
    else if(e.key==='Escape'){searchEl.value='';showResults('');searchEl.blur();}});
  document.getElementById('results').addEventListener('click',()=>{searchEl.value='';showResults('');});
  document.getElementById('prevBtn').addEventListener('click',()=>{const i=ORDER.indexOf(currentPath);if(i>0){freshNav=true;location.hash='#'+encodeURI(ORDER[i-1]);}});
  document.getElementById('nextBtn').addEventListener('click',()=>{const i=ORDER.indexOf(currentPath);if(i<ORDER.length-1){freshNav=true;location.hash='#'+encodeURI(ORDER[i+1]);}});
  document.getElementById('themeBtn').addEventListener('click',cycleTheme);
  window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;
    if(e.key==='/'){e.preventDefault();searchEl.focus();}
    else if(e.key==='[')document.getElementById('prevBtn').click();
    else if(e.key===']')document.getElementById('nextBtn').click();});
  window.addEventListener('hashchange',route);
  // TOC highlight while scrolling
  let scrollTick=false;
  document.getElementById('main').addEventListener('scroll',()=>{
    if(!scrollTick){scrollTick=true;requestAnimationFrame(()=>{scrollTick=false;saveScroll();});}
    const links=[...document.querySelectorAll('#toc a')];if(!links.length)return;
    const top=document.getElementById('main').scrollTop+70;let cur=links[0];
    for(const a of links){const el=document.getElementById(a.dataset.id);if(el&&el.offsetTop<=top)cur=a;}
    links.forEach(a=>a.classList.toggle('cur',a===cur));},{passive:true});
  const rz=document.getElementById('resizer'),sb=document.getElementById('sidebar');

    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});
