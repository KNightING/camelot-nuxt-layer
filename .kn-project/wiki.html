../environment.md) | [🏠 Wiki](../../index.md)\n","title":"ImageDropzone","summary":"ImageDropzone（匯入名稱 `CamelotImageDropzone`）是圖片專用的拖放區，有兩種版面：stacked 是一個大的拖放區塊，縮圖列在下方；grid 是多欄縮圖格，新增格接在最後一張縮圖之後。預設只收圖片，可限制張數，縮圖可逐一移除，選取結果以 v-model 回傳。"},"features/components/ImageV2.md":{"md":"# ImageV2\n\n## Summary\n\nImageV2（匯入名稱 `CamelotImageV2`）是延遲載入的圖片元件：進入視窗才開始載入，載入中顯示骨架，失敗時改渲染 error 插槽。可選擇在滑鼠懸停時於圖片旁浮出大圖預覽；載入狀態可從元件外部讀取。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `src` | `string` | — | 圖片網址；變更時已開始載入的圖會重新載入 |\n| `fullSrc` | `string` | — | 懸停大圖的網址；未提供時用 src |\n| `alt` | `string` | — | 替代文字 |\n| `hoverShowFullImage` | `boolean` | `false` | 懸停時顯示大圖預覽 |\n| `width` | `number` | — | 圖片寬度，單位 px |\n| `height` | `number` | — | 圖片高度，單位 px |\n| `objectFit` | `'fill' \\| 'contain' \\| 'cover' \\| 'none' \\| 'scale-down'` | `'scale-down'` | 圖片填充方式 |\n| `immediate` | `boolean` | `false` | 立即載入，不等進入視窗 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `loaded` | `image: HTMLImageElement` | 圖片載入完成時發出 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `error` | — | 載入失敗時顯示的內容 |\n\n## Exposed\n| 名稱 | 說明 |\n| :--- | :--- |\n| `isLoading` | 是否載入中 |\n| `isError` | 是否載入失敗 |\n| `isReady` | 是否已載入完成 |\n\n## 運作方式\n\n### 載入流程\n\n1. 容器有一半進入視窗時開始載入，觸發後即停止觀察。\n2. 載入中顯示 [Skeleton](./Skeleton.md)。\n3. 失敗時渲染 error 插槽，成功時渲染圖片並發出 `loaded` 事件。\n4. `src` 變更時，已開始載入的圖立即重新載入；還沒進入視窗的仍等進入後才載入。\n5. 元件上的其他屬性會傳到圖片或 error 插槽的外層元素上。\n\n載入狀態由 [useLazyImage](../composables/useLazyImage.md) 管理；整段只在瀏覽器端渲染。\n\n來源：1. [ImageV2.vue][]\n\n### 懸停大圖\n\n1. 指標進入 400ms 後顯示大圖，離開 100ms 後隱藏。\n2. 大圖掛到 body，垂直對齊原圖中線，放在原圖右側；右側放不下改放左側，下方超出改往上移。\n3. 橫幅圖限制最寬、直幅圖限制最高，大圖本身也用 ImageV2 立即載入。\n4. 只在大圖顯示期間監聽視窗捲動與縮放以更新位置，隱藏後不留監聽。\n\n來源：1. [ImageV2.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| ImageV2.vue | [app/components/Camelot/ImageV2.vue](../../../../app/components/Camelot/ImageV2.vue) |\n\n[ImageV2.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"ImageV2","summary":"ImageV2（匯入名稱 `CamelotImageV2`）是延遲載入的圖片元件：進入視窗才開始載入，載入中顯示骨架，失敗時改渲染 error 插槽。可選擇在滑鼠懸停時於圖片旁浮出大圖預覽；載入狀態可從元件外部讀取。"},"features/components/Input.md":{"md":"# Input\n\n## Summary\n\nInput（匯入名稱 `CamelotInput`）是泛型文字輸入框，依目前主題渲染 Material、Cupertino、Aqua 或 Sci-Fi 的輸入元件。支援原生 type 與密碼內建顯示切換、金額前置符號，也能切成可輸入加下拉選單或僅選單的模式；四主題最低高度 42px，標題預設由 FieldLabel 畫在框外。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `mark` | `'money'` | — | 前置標記；`money` 顯示金額符號 |\n| `disabled` | `boolean` | — | 是否停用 |\n| `label` | `string` | — | 標題文字 |\n| `required` | `boolean` | — | 是否必填，標題旁顯示星號 |\n| `placeholder` | `string` | — | 佔位文字；未給時依 label 產生「請輸入…」 |\n| `type` | `CamelotInputType` | `'text'` | 原生 input type：text、password、email、number、tel、url、search |\n| `passwordToggle` | `boolean` | `true` | type 為 password 時是否內建顯示／隱藏眼睛鈕 |\n| `passwordRevealMode` | `'hide-on-change' \\| 'persistent'` | `'hide-on-change'` | 顯示密碼後的維持策略，見下方「密碼顯示」 |\n| `labelMode` | `'outside' \\| 'floating'` | `'outside'` | 標題呈現方式；只有 Material 有差別，見下方「標題與高度」 |\n| `mode` | `'default' \\| 'select' \\| 'only-select'` | `'default'` | 一般輸入、可輸入加選單、僅選單 |\n| `options` | `SelectOptions<T>` | — | 下拉選項 |\n| `showOptionOnFocus` | `boolean` | `true` | 聚焦時展開選單 |\n| `hideOptionOnBlur` | `boolean` | `false` | 失焦時收起選單 |\n| `selectedValue` | `string \\| number` | — | 目前選中的選項值，用於高亮 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `input` | `(value?: string \\| number)` | 輸入時觸發，debounce 300ms |\n| `optionSelected` | `(option: SelectOption<T>)` | 選取下拉選項時觸發 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model` | `string \\| number` | 輸入值 |\n| `v-model:isOpen` | `boolean` | 下拉選單是否展開，預設 `false` |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `label` | `{ label }` | 自訂標題；Material 在 floating 模式下不渲染此 slot |\n| `before` | — | 輸入框前置內容；預設在 mark 為 money 時顯示金額符號 |\n| `after` | — | 輸入框後置內容，密碼眼睛鈕接在其後 |\n| `options` | `{ options }` | 自訂整段選項清單 |\n| `option` | `{ option }` | 自訂單一選項 |\n| `empty-options` | — | 無選項時的顯示內容 |\n\n## Exposed\n| 名稱 | 說明 |\n| :--- | :--- |\n| `inputEl` | 目前主題元件內的原生 input，型別 `HTMLInputElement \\| null`，供 focus、select 等操作 |\n\n## 運作方式\n\n### 主題分派\n\nInput 本身不含原生 input，而是依主題渲染對應的主題輸入元件：\n\n| 主題 | 渲染元件 |\n| :--- | :--- |\n| Material | [Material Input](./Material-Input.md) |\n| Cupertino | [Cupertino Input](./Cupertino-Input.md) |\n| Aqua | [Aqua Input](./Aqua-Input.md) |\n| Sci-Fi | [Sci-Fi Input](./Scifi-Input.md) |\n\n1. 四個主題元件各自持有原生 input 並對外公開 inputEl。\n2. 同一時間只渲染其中一個，Input 以共用的 template ref 取得後轉成自己的 inputEl。\n3. 新增主題元件時必須一併公開 inputEl，否則該主題下 inputEl 會是 null。\n\n來源：1. [Input.vue][]\n\n### 標題與高度\n\n| 主題與模式 | 標題位置 | 最低高度 |\n| :--- | :--- | :--- |\n| Cupertino、Aqua、Sci-Fi | 框外上方，由 FieldLabel 渲染 | 42px |\n| Material，labelMode 為 outside | 框外上方，由 FieldLabel 渲染 | 42px |\n| Material，labelMode 為 floating | 框內浮動 label，聚焦或有值時上浮 | 56px |\n\n字級 1rem 設在根節點，外部 CSS 可以覆蓋；字級變大時欄位跟著變高，42px 只是下限。\n\n來源：1. [Input.vue][]　2. [Material/Input.vue][]\n\n### 下拉選單\n\nmode 為 select 或 only-select 時，輸入框下方掛一個下拉選單，最高 250px、超過可捲動。\n\n1. 聚焦時依 showOptionOnFocus 展開，失焦時依 hideOptionOnBlur 收起，點外部一律收起。\n2. 展開當下量一次欄位位置，下方空間不足 250px 時改向上展開。\n3. 展開期間才監聽視窗捲動與縮放以更新方向，收合後不留監聽。\n4. 選取選項時把選項的 label 寫進 v-model、收起選單並觸發 optionSelected。\n\nonly-select 模式的原生 input 設為停用且不接收指標事件，只能從選單選取。\n\n來源：1. [Input.vue][]\n\n### 密碼顯示\n\ntype 為 password 且 passwordToggle 開啟時，after 區域尾端出現 [PasswordToggle](./Internal-PasswordToggle.md) 眼睛鈕。\n\n| 策略 | 行為 |\n| :--- | :--- |\n| hide-on-change | 顯示中只要數值異動，立刻切回隱碼 |\n| persistent | 維持顯示，直到再按一次眼睛鈕 |\n\n顯示狀態只存在元件內部，實際傳給原生 input 的 type 在顯示中為 text。hide-on-change 直接監看 v-model，不經過有 debounce 的 input 事件。\n\n切換 type 會讓瀏覽器把游標重設到最前面。輸入框原本有焦點時，元件在下一個 macrotask 還原游標與選取範圍，因為 Chromium 要到滑鼠事件的 task 結尾才重設游標。\n\n瀏覽器原生的密碼顯示與清除鈕已在全域樣式關閉，避免與內建眼睛鈕重複。\n\n來源：1. [Input.vue][]　2. [PasswordToggle.vue][]　3. [tailwind.css][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Input.vue | [app/components/Camelot/Input.vue](../../../../app/components/Camelot/Input.vue) |\n| Material/Input.vue | [app/components/Camelot/Material/Input.vue](../../../../app/components/Camelot/Material/Input.vue) |\n| PasswordToggle.vue | [app/components/Camelot/Internal/PasswordToggle.vue](../../../../app/components/Camelot/Internal/PasswordToggle.vue) |\n| tailwind.css | [app/assets/css/tailwind.css](../../../../app/assets/css/tailwind.css) |\n\n[Input.vue]: #references\n[Material/Input.vue]: #references\n[PasswordToggle.vue]: #references\n[tailwind.css]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Input","summary":"Input（匯入名稱 `CamelotInput`）是泛型文字輸入框，依目前主題渲染 Material、Cupertino、Aqua 或 Sci-Fi 的輸入元件。支援原生 type 與密碼內建顯示切換、金額前置符號，也能切成可輸入加下拉選單或僅選單的模式；四主題最低高度 42px，標題預設由 FieldLabel 畫在框外。"},"features/components/Internal-Calendar.md":{"md":"# Calendar\n\n## Summary\n\nCalendar（匯入名稱 `CamelotInternalCalendar`）是日期選擇器共用的月曆核心，屬內部元件，由 DateV2 與 DateRangeV2 包裝使用。它提供日曆、月份、年份三種視圖，支援單選與區間選取、時間列、語系與週起始，並可逐日自訂節日、標籤、停用與圓點。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `isRange` | `boolean` | - | 區間選取模式 |\n| `minDate` | `Date \\| number` | - | 可選最小日期 |\n| `maxDate` | `Date \\| number` | - | 可選最大日期 |\n| `hidePrevMonth` | `boolean` | `false` | 隱藏上個月的溢出日 |\n| `hideNextMonth` | `boolean` | `false` | 隱藏下個月的溢出日 |\n| `enableTime` | `boolean` | `false` | 是否顯示時間列 |\n| `timePrecision` | `'hour' \\| 'minute' \\| 'second'` | `'second'` | 時間精細度，由秒往上關閉 |\n| `hourFormat` | `'12' \\| '24'` | `'24'` | 12 或 24 小時制 |\n| `hideTime` | `boolean` | - | 啟用時間但不在月曆內顯示時間列，交給外層自行擺放 |\n| `pickerExpand` | `boolean` | - | 進入月份或年份選擇時撐滿容器寬並置中，供雙月曆使用 |\n| `hidePrevArrow` | `boolean` | `false` | 隱藏上一月箭頭 |\n| `hideNextArrow` | `boolean` | `false` | 隱藏下一月箭頭 |\n| `getDayAttributes` | `(date: Date, dayOfWeek: number) => CalendarDayAttributes \\| undefined \\| null` | - | 逐日自訂屬性 |\n| `showDayLabel` | `boolean` | `true` | 是否顯示日期下方 label；關閉則不渲染、格高緊湊 |\n| `locale` | `string` | - | BCP47 語系；未給用預設中文 |\n| `weekStartsOn` | `0 \\| 1` | `0` | 週起始：0 為週日、1 為週一 |\n| `weekdayFormatter` | `(date: Date, index: number) => string` | - | 自訂週名，最高優先 |\n| `monthFormatter` | `(monthIndex: number) => string` | - | 自訂月名，用於月份選擇格與月標題 |\n| `yearFormatter` | `(year: number) => string` | - | 自訂年標題 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model:modelValue` | `Date \\| number \\| null` | 單選日期 |\n| `v-model:rangeValue` | `(Date \\| number \\| null)[] \\| null` | 區間日期，依序為起、迄 |\n| `v-model:viewDate` | `Date` | 目前檢視的月份，必填 |\n| `v-model:pickerMode` | `'calendar' \\| 'month' \\| 'year'` | 目前視圖，預設 `'calendar'` |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `year-label` | `{ viewDate, year }` | 自訂標頭年份按鈕，預設「yyyy年」 |\n| `month-label` | `{ viewDate, month }` | 自訂標頭月份按鈕，預設「MM月」 |\n| `weekday` | `{ day, index }` | 自訂週名格 |\n| `day` | `{ date, day, isSelected, isToday }` | 自訂日期數字 |\n| `month-name` | `{ month, index }` | 自訂月份選擇格 |\n\n## CalendarDayAttributes\n\ngetDayAttributes 回傳的型別，由本元件匯出：\n\n| 欄位 | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `isHoliday` | `boolean` | 標記為節日，數字顯示為 error 色 |\n| `label` | `string \\| null` | 日期下方標籤文字 |\n| `labelClass` | `string` | 標籤自訂 class |\n| `disabled` | `boolean` | 停用該日 |\n| `dot` | `boolean` | 顯示圓點標記 |\n| `dotColor` | `string` | 圓點顏色 |\n| `class` | `string` | 日格自訂 class |\n\n## 運作方式\n\n### 三種視圖\n\n1. 點標頭年份按鈕切到年份選擇，一頁 12 年，從今年往前 5 年起算，可前後翻頁。\n2. 選完年份自動進入月份選擇。\n3. 點標頭月份按鈕切到月份選擇，選完回到日曆。\n4. 再點一次同一個標頭按鈕會直接回到日曆。\n\n來源：1. [Calendar.vue][]\n\n### 日格\n\n每月固定渲染 42 格，從該月第一週的週起始日開始；溢出日依 hidePrevMonth、hideNextMonth 決定是否可見。\n\n| 狀態 | 外觀 |\n| :--- | :--- |\n| 選中，含區間起迄 | 主題的選中實色底，數字加粗 |\n| 區間中段 | 角色色淡底 |\n| 週六、週日或節日 | 數字為 error 色 |\n| 今天 | 數字為角色色並加粗 |\n| 本月其他日 | 主要文字色 |\n| 溢出日 | 淡化 |\n\n早於 minDate、晚於 maxDate 或屬性標記停用的日期不可點。點溢出日時，檢視月份跟著切到該月。\n\n日期下方的 label 固定單行，截斷時懸停或長壓以 [Tooltip](./Tooltip.md) 顯示完整內容。\n\n來源：1. [Calendar.vue][]\n\n### 選取\n\n| 模式 | 行為 |\n| :--- | :--- |\n| 單選 | 點日期寫入 modelValue；啟用時間時一併套上時間列目前的時間 |\n| 區間，尚未有起日或已選滿 | 點選的日期成為新起日，迄日清空 |\n| 區間，已有起日 | 點選的日期成為迄日；早於起日時兩者自動對調 |\n\n時間列調整會即時寫回單選值，或寫回區間的起迄端點。\n\n來源：1. [Calendar.vue][]\n\n### 語系\n\n週名、月名與年月標題的優先序：\n\n1. 自訂 formatter。\n2. 有 locale 且不是 zh 開頭時，用 Intl 產生。\n3. 其他情況用內建中文：日一二三、一月到十二月、yyyy年、MM月。\n\n中文語系一律走內建格式，避免 Intl 的中文週名帶「週」「周」前綴。\n\n來源：1. [Calendar.vue][]\n\n## 相關頁面\n\n- [DateV2](./DateV2.md)\n- [DateRangeV2](./DateRangeV2.md)\n- [TimeRow](./Internal-TimeRow.md)\n- [月曆與日期選擇](../calendar.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Calendar.vue | [app/components/Camelot/Internal/Calendar.vue](../../../../app/components/Camelot/Internal/Calendar.vue) |\n\n[Calendar.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Calendar","summary":"Calendar（匯入名稱 `CamelotInternalCalendar`）是日期選擇器共用的月曆核心，屬內部元件，由 DateV2 與 DateRangeV2 包裝使用。它提供日曆、月份、年份三種視圖，支援單選與區間選取、時間列、語系與週起始，並可逐日自訂節日、標籤、停用與圓點。"},"features/components/Internal-CascadeMenuPanel.md":{"md":"# CascadeMenuPanel\n\n## Summary\n\nCascadeMenuPanel（匯入名稱 `CamelotInternalCascadeMenuPanel`）是 [CascadeMenu](./CascadeMenu.md) 串聯選單的單層面板，屬內部元件。每層面板各自飛出定位，展開中的子項再遞迴渲染下一層面板；它負責子選單的 hover 或 click 開合、越界翻轉，以及 hover 模式下跨層的延遲收合。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `items` | `CamelotCascadeMenuItem[]` | — | 本層選單項目，可含分隔線 |\n| `anchor` | `HTMLElement \\| null` | — | 定位錨點：根面板為觸發器，子面板為父列 |\n| `level` | `number` | — | 層級深度，疊加在 z-index 上 |\n| `placement` | `'root' \\| 'submenu'` | — | 根面板貼觸發器下緣，子面板出現在父列右側 |\n\n## 運作方式\n\n### 共用設定\n\n面板從 CascadeMenu 注入的 context 取得選取函式、最大高度、子選單觸發方式、開啟與收合延遲、基礎層級，並向它註冊自己的 DOM，讓外部點擊判斷能涵蓋所有層。\n\n選項區最大高度取設定值與「視窗高減 16px」的較小者，超過時內部捲動。\n\n來源：1. [CascadeMenuPanel.vue][]　2. [cascadeMenu.ts][]\n\n### 子選單開合\n\n| 觸發方式 | 含子項的列 | 葉節點列 |\n| :--- | :--- | :--- |\n| hover | 滑入後等開啟延遲才展開；點擊不收合也不關閉選單 | 滑入時收起同層已展開的子選單；點擊即選取 |\n| click | 點擊切換展開 | 點擊即選取 |\n\n停用的列不回應滑入與點擊。\n\n來源：1. [CascadeMenuPanel.vue][]\n\n### 跨層延遲收合\n\n每層面板都 Teleport 出去，子面板在 DOM 上不是父面板的後代，所以滑鼠移進子面板時父面板必定收到 mouseleave。為了不誤收，每層會向子面板提供一組取消收合、排定收合的函式。\n\n1. 滑出某層面板時，排定收合本層的子選單，並通知祖先各自排定收合。\n2. 滑入子面板時，沿祖先鏈逐層取消待收合。\n3. 移進子面板的情況下，第 2 步緊接在第 1 步之後發生，整條鏈都不會收起。\n4. click 模式下這兩個處理器直接略過。\n\n來源：1. [CascadeMenuPanel.vue][]\n\n### 定位\n\n面板經 [useCamelotTeleportTarget](../composables/useCamelotTeleportTarget.md) 送進最近的 dialog，沒有則送到 body，以 fixed 定位。\n\n1. 掛載當下同步量測錨點並凍結位置，首幀即正確；量到之前先隱藏，避免在左上角閃一下。\n2. 視窗縮放時重新量測；捲動時整個選單會關閉，所以不監聽捲動。\n3. 根面板右側不足時改為右對齊觸發器，下方不足時翻到上方。\n4. 子面板右側不足時翻到左側，下方不足時往上移進視窗。\n\n層級未指定基礎值時為 popup 層級加上 level，每深一層高一級。\n\n來源：1. [CascadeMenuPanel.vue][]\n\n### 外觀\n\n| 主題 | 面板表面 |\n| :--- | :--- |\n| Aqua | 共用玻璃面板 |\n| Sci-Fi | 直角、半透明深底、角色色細框與等寬字 |\n| Cupertino | 半透明表面加背景模糊 |\n| Material | 表面色、細框與陰影 |\n\n列的選中與懸停效果與 SelectV2 的選項共用同一套主題樣式，展開中的父列以選中樣式呈現。\n\n來源：1. [CascadeMenuPanel.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| CascadeMenuPanel.vue | [app/components/Camelot/Internal/CascadeMenuPanel.vue](../../../../app/components/Camelot/Internal/CascadeMenuPanel.vue) |\n| cascadeMenu.ts | [app/types/cascadeMenu.ts](../../../../app/types/cascadeMenu.ts) |\n\n[CascadeMenuPanel.vue]: #references\n[cascadeMenu.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"CascadeMenuPanel","summary":"CascadeMenuPanel（匯入名稱 `CamelotInternalCascadeMenuPanel`）是 [CascadeMenu](./CascadeMenu.md) 串聯選單的單層面板，屬內部元件。每層面板各自飛出定位，展開中的子項再遞迴渲染下一層面板；它負責子選單的 hover 或 click 開合、越界翻轉，以及 hover 模式下跨層的延遲收合。"},"features/components/Internal-FieldFrame.md":{"md":"# FieldFrame\n\n## Summary\n\nFieldFrame（匯入名稱 `CamelotInternalFieldFrame`）是表單欄位共用的主題外框，屬內部元件：Sci-Fi 主題時把內容包進 [ScifiFrame](./Scifi-Frame.md) 畫出 HUD 外框，其他主題直接渲染內容、不加任何元素。NumberCounter、DateV2、DateRangeV2、TimeV2 用它讓欄位外觀與 Sci-Fi 的 Input 一致。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `focused` | `boolean` | `false` | 聚焦態，傳給 HUD 外框 |\n| `disabled` | `boolean` | `false` | 停用時關閉掃描線與懸停光澤 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 欄位本體 |\n\n## 運作方式\n\n### Sci-Fi 外框\n\n只有 Sci-Fi 主題會產生外框，設定與 Sci-Fi 的 Input 相同：\n\n| 效果 | 條件 |\n| :--- | :--- |\n| 聚焦外框 | focused 為 true |\n| 掃描線 | 未停用 |\n| 懸停光澤 | 滑鼠懸停且未停用 |\n| 準星啟用 | 聚焦或懸停 |\n| 背景格線 | 一律關閉 |\n\n其他主題時元件只輸出插槽內容，欄位的框線與底色由使用端自己的主題樣式負責。\n\n來源：1. [FieldFrame.vue][]\n\n### 使用端\n\n| 元件 | 聚焦態來源 |\n| :--- | :--- |\n| [DateV2](./DateV2.md) | 月曆開啟中 |\n| [DateRangeV2](./DateRangeV2.md) | 月曆開啟中 |\n| [TimeV2](./TimeV2.md) | 時間面板開啟中 |\n| [NumberCounter](./NumberCounter.md) | 輸入框聚焦中 |\n\n來源：1. [DateV2.vue][]　2. [DateRangeV2.vue][]　3. [TimeV2.vue][]　4. [NumberCounter.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 建立 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| FieldFrame.vue | [app/components/Camelot/Internal/FieldFrame.vue](../../../../app/components/Camelot/Internal/FieldFrame.vue) |\n| DateV2.vue | [app/components/Camelot/DateV2.vue](../../../../app/components/Camelot/DateV2.vue) |\n| DateRangeV2.vue | [app/components/Camelot/DateRangeV2.vue](../../../../app/components/Camelot/DateRangeV2.vue) |\n| TimeV2.vue | [app/components/Camelot/TimeV2.vue](../../../../app/components/Camelot/TimeV2.vue) |\n| NumberCounter.vue | [app/components/Camelot/NumberCounter.vue](../../../../app/components/Camelot/NumberCounter.vue) |\n\n[FieldFrame.vue]: #references\n[DateV2.vue]: #references\n[DateRangeV2.vue]: #references\n[TimeV2.vue]: #references\n[NumberCounter.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"FieldFrame","summary":"FieldFrame（匯入名稱 `CamelotInternalFieldFrame`）是表單欄位共用的主題外框，屬內部元件：Sci-Fi 主題時把內容包進 [ScifiFrame](./Scifi-Frame.md) 畫出 HUD 外框，其他主題直接渲染內容、不加任何元素。NumberCounter、DateV2、DateRangeV2、TimeV2 用它讓欄位外觀與 Sci-Fi 的 Input 一致。"},"features/components/Internal-MenuItem.md":{"md":"# MenuItem\n\n## Summary\n\nMenuItem（匯入名稱 `CamelotInternalMenuItem`）是 [Menu](./Menu.md) 側邊選單的單一項目，屬內部元件。有子項時點擊切換展開，並遞迴渲染下一層項目；沒有子項時點擊即選取。選中、祖先與一般狀態各有外觀，選中樣式依主題而異。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `item` | `CamelotMenuItem` | — | 選單項目資料 |\n| `level` | `number` | `0` | 層級深度；第 0 層字重較重，其他層文字較淡 |\n\n本元件沒有插槽，項目內容固定為文字與展開箭頭。\n\n## 運作方式\n\n### 點擊與狀態\n\n選中、祖先、展開等判斷都由 Menu 注入的 context 提供，項目本身不存狀態。\n\n| 狀態 | 外觀 |\n| :--- | :--- |\n| 選中 | 依主題的選中樣式，見下表 |\n| 選中項目的祖先 | 中等字重、角色色文字 |\n| 一般 | 懸停時淡底 |\n| 停用 | 半透明、不可點 |\n\n有子項時右側顯示箭頭，展開時轉 90 度；子層以 [Expanded](./Expanded.md) 做展開動畫。\n\n來源：1. [MenuItem.vue][]　2. [menu.ts][]\n\n### 選中樣式\n\n| 主題 | 選中樣式 |\n| :--- | :--- |\n| Aqua | 角色色實心填色 |\n| Sci-Fi | 18% 角色色底、角色色文字與光暈 |\n| Cupertino | 10% 角色色底、粗體角色色文字 |\n| Material | 10% 角色色底、中等字重角色色文字 |\n\n來源：1. [MenuItem.vue][]\n\n### 階層導引線\n\n子層向右縮排，左側畫一條垂直導引線，止於最後一個子項的中線，並以 L 形轉角指向它。子層保留內距，讓選中項的陰影不被裁切。\n\n來源：1. [MenuItem.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| MenuItem.vue | [app/components/Camelot/Internal/MenuItem.vue](../../../../app/components/Camelot/Internal/MenuItem.vue) |\n| menu.ts | [shared/types/menu.ts](../../../../shared/types/menu.ts) |\n\n[MenuItem.vue]: #references\n[menu.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"MenuItem","summary":"MenuItem（匯入名稱 `CamelotInternalMenuItem`）是 [Menu](./Menu.md) 側邊選單的單一項目，屬內部元件。有子項時點擊切換展開，並遞迴渲染下一層項目；沒有子項時點擊即選取。選中、祖先與一般狀態各有外觀，選中樣式依主題而異。"},"features/components/Internal-PasswordToggle.md":{"md":"# PasswordToggle\n\n## Summary\n\nPasswordToggle（匯入名稱 `CamelotInternalPasswordToggle`）是密碼顯示與隱藏的眼睛按鈕，屬內部元件。[Input](./Input.md) 在 type 為 password 且 passwordToggle 開啟時，把它放在 after 區域尾端，四個主題共用同一顆；它只切換 v-model:revealed，何時自動切回隱碼由 Input 決定。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabled` | `boolean` | — | 停用，跟隨 Input 的 disabled |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model:revealed` | `boolean` | 是否顯示密碼，預設 `false` |\n\n## 運作方式\n\n### 按鈕行為\n\n1. 點擊切換 revealed。\n2. 按下滑鼠時阻止預設行為，焦點留在輸入框，Input 才能在切換後還原游標位置。\n3. 隱碼時顯示睜眼圖示，顯示密碼時顯示閉眼圖示。\n\n| 無障礙屬性 | 值 |\n| :--- | :--- |\n| aria-label | 隱碼時為「顯示密碼」，顯示時為「隱藏密碼」 |\n| aria-pressed | 與 revealed 相同 |\n\n顯示策略 hide-on-change 與 persistent 不在此元件，由 Input 的 passwordRevealMode 控制。\n\n來源：1. [PasswordToggle.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| PasswordToggle.vue | [app/components/Camelot/Internal/PasswordToggle.vue](../../../../app/components/Camelot/Internal/PasswordToggle.vue) |\n\n[PasswordToggle.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"PasswordToggle","summary":"PasswordToggle（匯入名稱 `CamelotInternalPasswordToggle`）是密碼顯示與隱藏的眼睛按鈕，屬內部元件。[Input](./Input.md) 在 type 為 password 且 passwordToggle 開啟時，把它放在 after 區域尾端，四個主題共用同一顆；它只切換 v-model:revealed，何時自動切回隱碼由 Input 決定。"},"features/components/Internal-SheetHandle.md":{"md":"# SheetHandle\n\n## Summary\n\nSheetHandle（匯入名稱 `CamelotInternalSheetHandle`）是底部面板頂端的拖曳把手，屬內部元件：熱區 44px 高、關閉瀏覽器觸控手勢、游標呈抓取狀，中間依主題畫出指示條。它本身不含拖曳邏輯，由 [BaseBottomSheetV2](./BaseBottomSheetV2.md) 監聽它的 pointerdown 開始手勢關閉。\n\n## 運作方式\n\n### 熱區\n\n1. 熱區高 44px，符合觸控最小目標，視覺上只畫中間的指示條。\n2. 關閉瀏覽器觸控手勢，拖曳不會被當成頁面捲動。\n3. 以負上邊距往上延伸，貼齊面板頂端。\n\n| 無障礙屬性 | 值 |\n| :--- | :--- |\n| role | button |\n| tabindex | 0 |\n| aria-label | 拖曳關閉 |\n\n來源：1. [SheetHandle.vue][]\n\n### 指示條\n\n| 主題 | 尺寸 | 顏色 |\n| :--- | :--- | :--- |\n| Sci-Fi | 48 × 4px | 30% 主色 |\n| Cupertino | 40 × 6px | 50% 灰 |\n| Aqua | 40 × 6px | 20% 前景色 |\n| Material | 32 × 4px | 次要外框色 |\n\n來源：1. [SheetHandle.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| SheetHandle.vue | [app/components/Camelot/Internal/SheetHandle.vue](../../../../app/components/Camelot/Internal/SheetHandle.vue) |\n\n[SheetHandle.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"SheetHandle","summary":"SheetHandle（匯入名稱 `CamelotInternalSheetHandle`）是底部面板頂端的拖曳把手，屬內部元件：熱區 44px 高、關閉瀏覽器觸控手勢、游標呈抓取狀，中間依主題畫出指示條。它本身不含拖曳邏輯，由 [BaseBottomSheetV2](./BaseBottomSheetV2.md) 監聽它的 pointerdown 開始手勢關閉。"},"features/components/Internal-TimeField.md":{"md":"# TimeField\n\n## Summary\n\nTimeField（匯入名稱 `CamelotInternalTimeField`）是單一時間數字欄位，屬內部元件，用於時、分或秒：可直接輸入兩位數，也可從下拉清單挑選，並支援方向鍵循環增減。[TimeRow](./Internal-TimeRow.md) 以它組成時間列，下拉清單會送出父容器外，不會被彈窗裁切。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `min` | `number` | — | 數值下限，必填 |\n| `max` | `number` | — | 數值上限，必填 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model` | `number`，預設 `0` | 目前數值，顯示時補零成兩位 |\n\n## 運作方式\n\n### 輸入與鍵盤\n\n| 操作 | 行為 |\n| :--- | :--- |\n| 聚焦 | 開啟下拉清單 |\n| 輸入 | 去掉非數字後夾在 min 與 max 之間寫回 |\n| 上方向鍵 | 加 1，超過 max 回到 min |\n| 下方向鍵 | 減 1，低於 min 回到 max |\n| Enter | 關閉清單 |\n| 點清單項目 | 寫回該值並關閉清單 |\n| 點外部 | 關閉清單 |\n\n清單列出 min 到 max 的每個整數。點清單項目時阻止預設行為，焦點不會離開輸入框。\n\n來源：1. [TimeField.vue][]\n\n### 下拉清單定位\n\n1. 清單經 [useCamelotTeleportTarget](../composables/useCamelotTeleportTarget.md) 送進最近的 dialog，沒有則送到 body，脫離父層的裁切容器。\n2. 在 dialog 內若送到 body，會落在 top layer 之下，看不見也點不到。\n3. 開啟時量測欄位位置，上方有 168px 以上空間就向上展開，否則向下，水平置中對齊欄位。\n4. 清單送出去後脫離色彩角色的作用範圍，開啟時把欄位當下的角色色帶進清單樣式。\n\n來源：1. [TimeField.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| TimeField.vue | [app/components/Camelot/Internal/TimeField.vue](../../../../app/components/Camelot/Internal/TimeField.vue) |\n\n[TimeField.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"TimeField","summary":"TimeField（匯入名稱 `CamelotInternalTimeField`）是單一時間數字欄位，屬內部元件，用於時、分或秒：可直接輸入兩位數，也可從下拉清單挑選，並支援方向鍵循環增減。[TimeRow](./Internal-TimeRow.md) 以它組成時間列，下拉清單會送出父容器外，不會被彈窗裁切。"},"features/components/Internal-TimeRow.md":{"md":"# TimeRow\n\n## Summary\n\nTimeRow（匯入名稱 `CamelotInternalTimeRow`）是時間輸入列，屬內部元件：前方時鐘圖示，接著時、分、秒三個 [TimeField](./Internal-TimeField.md) 欄位，12 小時制時尾端多一顆上午下午切換鈕。DateV2、DateRangeV2、TimeV2 與月曆用它選時間，數值一律以 24 小時制存放。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `precision` | `'hour' \\| 'minute' \\| 'second'` | `'second'` | 顯示到時、分或秒 |\n| `hourFormat` | `'12' \\| '24'` | `'24'` | 小時制；12 時顯示 AM、PM 切換鈕 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `change` | — | 時、分、秒或上午下午任一變更時觸發 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model:hours` | `number` | 小時，24 小時制，預設 `0` |\n| `v-model:minutes` | `number` | 分鐘，預設 `0` |\n| `v-model:seconds` | `number` | 秒，預設 `0` |\n\n## 運作方式\n\n### 精細度\n\n| precision | 顯示欄位 |\n| :--- | :--- |\n| hour | 時 |\n| minute | 時、分 |\n| second | 時、分、秒 |\n\n來源：1. [TimeRow.vue][]\n\n### 12 小時制\n\n| 項目 | 行為 |\n| :--- | :--- |\n| 時欄位範圍 | 1 到 12；24 小時制為 0 到 23 |\n| 顯示 | 0 點與 12 點都顯示為 12 |\n| 改時 | 依目前上午或下午換算回 24 小時制寫回 |\n| AM、PM 鈕 | 小時加 12 後取 24 的餘數，切換上下午 |\n\n來源：1. [TimeRow.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| TimeRow.vue | [app/components/Camelot/Internal/TimeRow.vue](../../../../app/components/Camelot/Internal/TimeRow.vue) |\n\n[TimeRow.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"TimeRow","summary":"TimeRow（匯入名稱 `CamelotInternalTimeRow`）是時間輸入列，屬內部元件：前方時鐘圖示，接著時、分、秒三個 [TimeField](./Internal-TimeField.md) 欄位，12 小時制時尾端多一顆上午下午切換鈕。DateV2、DateRangeV2、TimeV2 與月曆用它選時間，數值一律以 24 小時制存放。"},"features/components/Internal-TreeNode.md":{"md":"# TreeNode\n\n## Summary\n\nTreeNode（匯入名稱 `CamelotInternalTreeNode`）是 [Tree](./Tree.md) 樹狀結構的單一節點，屬內部元件。每列顯示展開箭頭、可選的勾選框與標籤，有子節點時遞迴渲染下一層；勾選、展開等狀態都由 Tree 注入的 context 管理，節點本身不存狀態。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `node` | `CamelotTreeNode` | — | 節點資料 |\n| `level` | `number` | `0` | 層級深度，每層左側縮排 20px |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `node` | `{ node, level, isChecked, isExpanded }` | 自訂節點內容，預設顯示標籤；會遞迴轉給子節點 |\n\n## 運作方式\n\n### 點擊行為\n\n| 模式 | 點整列 | 點箭頭 |\n| :--- | :--- | :--- |\n| 可勾選 | 切換勾選 | 切換展開 |\n| 不可勾選 | 有子節點時切換展開 | 切換展開 |\n\n兩種模式點整列時都會通知 Tree 的節點點擊處理；停用的節點半透明且不可點。\n\n來源：1. [TreeNode.vue][]　2. [tree.ts][]\n\n### 勾選框與標籤\n\n1. 可勾選且未自訂 node 插槽時，標籤直接交給 [Checkbox](./Checkbox.md) 渲染，外觀與獨立的 Checkbox 一致。\n2. 有自訂 node 插槽時，勾選框不帶標籤，後面接插槽內容。\n3. 勾選框支援半選狀態，顏色跟隨 Tree 的色彩角色。\n\n來源：1. [TreeNode.vue][]\n\n### 展開\n\n有子節點時左側顯示箭頭，展開時轉 90 度，子層以 [Expanded](./Expanded.md) 做展開動畫；沒有子節點時保留同寬的空位，讓標籤對齊。\n\nnode 插槽的型別需明確宣告：元件把自己的插槽遞迴轉給子節點，沒有宣告時 TypeScript 會循環推導而報錯。\n\n來源：1. [TreeNode.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| TreeNode.vue | [app/components/Camelot/Internal/TreeNode.vue](../../../../app/components/Camelot/Internal/TreeNode.vue) |\n| tree.ts | [shared/types/tree.ts](../../../../shared/types/tree.ts) |\n\n[TreeNode.vue]: #references\n[tree.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"TreeNode","summary":"TreeNode（匯入名稱 `CamelotInternalTreeNode`）是 [Tree](./Tree.md) 樹狀結構的單一節點，屬內部元件。每列顯示展開箭頭、可選的勾選框與標籤，有子節點時遞迴渲染下一層；勾選、展開等狀態都由 Tree 注入的 context 管理，節點本身不存狀態。"},"features/components/Internal-editor-ResizableImageView.md":{"md":"# ResizableImageView\n\n## Summary\n\nResizableImageView（匯入名稱 `CamelotInternalEditorResizableImageView`）是 [RichTextEditor](./RichTextEditor.md) 圖片節點的 Tiptap NodeView，屬內部元件。圖片被選中時浮出工具列，可調整對齊、套用預設寬度或拖拉縮放、刪除圖片，並在圖下方編輯說明文字，說明同時作為替代文字。\n\n## Props\n\nprops 直接採用 Tiptap 的 NodeViewProps，由 NodeView 渲染器傳入，常用的欄位如下：\n\n| Prop | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `editor` | `Editor` | Tiptap 編輯器實例 |\n| `node` | ProseMirror 節點 | 圖片節點，屬性含 align、width、caption、pending |\n| `selected` | `boolean` | 節點是否被選中 |\n| `updateAttributes` | `(attrs: Record<string, unknown>) => void` | 更新節點屬性 |\n| `deleteNode` | `() => void` | 刪除節點 |\n\n## 運作方式\n\n### 浮動工具列\n\n工具列只在編輯器可編輯且圖片被選中時出現。\n\n| 操作 | 行為 |\n| :--- | :--- |\n| 對齊 | 靠左文繞圖、置中、靠右文繞圖；再點一次同一個對齊恢復為不對齊 |\n| 取消對齊 | 恢復一般圖片，不文繞圖 |\n| 預設寬度 | 25%、50%、75%、100%，或「原始」清除寬度 |\n| 重設寬度 | 清除寬度，恢復自動 |\n| 刪除 | 刪除整個圖片節點 |\n\n工具列掛到 body，避免被編輯區的裁切容器切掉。\n\n1. 預設放在圖片上方，上方空間不足時改放下方。\n2. 水平置中對齊圖片，並夾在視窗內。\n3. 顯示期間監聽視窗捲動、縮放與圖片尺寸變化，隱藏後解除。\n\n來源：1. [ResizableImageView.vue][]\n\n### 拖拉縮放\n\n圖片被選中時右下角出現縮放把手。\n\n1. 按住把手往右拖變寬、往左拖變窄，最小 48px。\n2. 拖曳中只改畫面上的寬度。\n3. 放開時把最終寬度寫回節點的 width 屬性。\n\n來源：1. [ResizableImageView.vue][]\n\n### 圖片說明\n\n1. 圖片有說明時，無論是否選中都顯示在圖下方。\n2. 選中圖片，或焦點在說明編輯框內時，顯示編輯框。\n3. 輸入時同步寫入節點的說明與替代文字；清空時兩者都移除。\n4. 編輯框使用本地狀態，打字時不因節點重繪而失焦；外部改動說明時，只在編輯框沒有焦點時同步回來。\n\n來源：1. [ResizableImageView.vue][]\n\n### 節點屬性與樣式\n\npending 屬性會輸出成 data-pending，沿用既有的上傳暫存機制。元件內含全域樣式，控制編輯區內圖片的文繞圖、對齊與說明外觀。\n\n來源：1. [ResizableImageView.vue][]　2. [resizable-image.ts][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| ResizableImageView.vue | [app/components/Camelot/Internal/editor/ResizableImageView.vue](../../../../app/components/Camelot/Internal/editor/ResizableImageView.vue) |\n| resizable-image.ts | [app/components/Camelot/Internal/editor/resizable-image.ts](../../../../app/components/Camelot/Internal/editor/resizable-image.ts) |\n\n[ResizableImageView.vue]: #references\n[resizable-image.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"ResizableImageView","summary":"ResizableImageView（匯入名稱 `CamelotInternalEditorResizableImageView`）是 [RichTextEditor](./RichTextEditor.md) 圖片節點的 Tiptap NodeView，屬內部元件。圖片被選中時浮出工具列，可調整對齊、套用預設寬度或拖拉縮放、刪除圖片，並在圖下方編輯說明文字，說明同時作為替代文字。"},"features/components/Loading.md":{"md":"# Loading\n\n## Summary\n\nLoading（匯入名稱 `CamelotLoading`）是全螢幕的載入遮罩：半透明深色遮罩蓋住整個畫面，中央顯示依主題而異的指示器，下方可附階段提示文字。顯示與否完全由 [useLoading](../composables/useLoading.md) 控制，在 App 根部掛一次即可；唯一的 prop 只影響 Aqua 主題的指示器樣式。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `type` | `CamelotLoadingType`，即 `'ripple' \\| 'bounce'` | `'ripple'` | Aqua 主題的指示器樣式；其他主題忽略 |\n\n無 Emits、v-model、Slots、Exposed。\n\n## 運作方式\n\n### 遮罩\n\n1. useLoading 開啟時顯示，全部載入結束時隱藏，進出以 0.35s 淡入淡出。\n2. 遮罩掛到 body、只在瀏覽器端渲染，固定蓋滿視窗，層級 1100，背景輕微模糊。\n3. 遮罩開啟期間攔截所有指標事件。\n\n來源：1. [Loading.vue][]\n\n### 各主題指示器\n\n| 主題 | 指示器 |\n| :--- | :--- |\n| Aqua | 依 type 為水滴漣漪或玻璃珠彈跳，見下方 |\n| Sci-Fi | 雷達掃描動畫，含準星與 SYS_LOAD 字樣 |\n| Cupertino | iOS 風格 8 葉片旋轉器 |\n| Material | SVG 圓形旋轉器 |\n\n來源：1. [Loading.vue][]\n\n### 提示文字\n\n指示器下方的文字由 useLoading 開啟或更新文字時帶入，可在同一次載入中切換階段；沒有文字時整段不渲染。\n\n1. 換文字時舊字淡出、新字淡入，不會硬跳。\n2. 文字區宣告為狀態區，螢幕報讀器會禮貌地唸出新文字。\n3. 文字固定為半透明白加陰影，不跟主題文字色：遮罩永遠是深色，淺色模式的主題文字色會看不見。\n4. Sci-Fi 主題改用等寬字，顏色跟隨角色色，與該主題其他資訊一致。\n\n來源：1. [Loading.vue][]\n\n### Aqua 指示器\n\n兩種樣式都是向心或原地的形狀，沒有由左往右的線性位移，避免被讀成進度條。\n\n| 樣式 | 元素 | 動態 |\n| :--- | :--- | :--- |\n| ripple | 中心 22px 玻璃水滴與三道同心漣漪 | 水滴先縮後脹，漣漪由 0.28 倍擴散到原尺寸並淡出，三道錯開三分之一週期 |\n| bounce | 三顆 18px 玻璃珠 | 依序彈跳，以底部為變形中心 |\n\n| 樣式 | 週期變數 | 預設 |\n| :--- | :--- | :--- |\n| ripple | `--cml-aqua-ripple-duration` | 2.8s |\n| bounce | `--cml-aqua-bounce-duration` | 1.1s |\n\n三道漣漪與三顆珠子的延遲都從週期變數推算，改一個值即可整組變速。\n\nbounce 在起跳與落地各壓扁一次、空中略微拉長；少了這兩下，看起來會像等速上下平移而不是彈跳。\n\n來源：1. [Loading.vue][]\n\n### Aqua 共通規則\n\n1. 球體填色走角色色並混入白色做漸層與高光，不使用背景模糊：遮罩是深色，深色模式的表面色與遮罩幾乎同色會看不見。\n2. 動畫只動 transform 與 opacity。\n3. 使用者偏好減少動態時停住動畫，保留靜態球體表示進行中。\n\n來源：1. [Loading.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Loading.vue | [app/components/Camelot/Loading.vue](../../../../app/components/Camelot/Loading.vue) |\n\n[Loading.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Loading","summary":"Loading（匯入名稱 `CamelotLoading`）是全螢幕的載入遮罩：半透明深色遮罩蓋住整個畫面，中央顯示依主題而異的指示器，下方可附階段提示文字。顯示與否完全由 [useLoading](../composables/useLoading.md) 控制，在 App 根部掛一次即可；唯一的 prop 只影響 Aqua 主題的指示器樣式。"},"features/components/Marquee.md":{"md":"# Marquee\n\n## Summary\n\n`CamelotMarquee` 是跑馬燈容器：把預設 slot 的內容渲染兩份、首尾相接無限循環捲動，支援上下左右四個方向、以每秒像素指定速度、滑鼠移入暫停與外部暫停。內容沒有超出容器、速度為 0，或使用者偏好減少動態時不捲動，只顯示一份。不分主題，是純版面元件。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `direction` | `'left' \\| 'right' \\| 'up' \\| 'down'` | `'left'` | 捲動方向 |\n| `speed` | `number` | `60` | 速度（px/s）；`0` 不捲 |\n| `pauseOnHover` | `boolean` | `true` | 滑鼠移入暫停 |\n| `gap` | `string` | `'1rem'` | 內容項目之間、以及兩份內容接續處的間距（CSS 長度） |\n| `paused` | `boolean` | `false` | 外部暫停 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 跑馬燈內容，可放任何元素（文字、div、元件）；會渲染兩份，第二份對輔助技術隱藏 |\n\n## 運作方式\n\n### 內容與版面\n\n1. 預設 slot 的直接子元素依方向排成一列（水平）或一欄（垂直），彼此間隔 `gap`。\n2. 水平方向容器預設撐滿父層寬度；垂直方向必須由使用端給容器高度，否則內容永遠不會超出容器，也就不會捲動。\n3. 因為內容會渲染兩份，slot 內的元件也會建立兩個實例；有狀態或有副作用的元件要留意。\n\n來源：1. [Marquee.vue][]\n\n### 捲動速度與循環\n\n1. 元件持續量測單份內容與容器的尺寸，內容或容器尺寸變動時即時重算。\n2. 動畫時長等於單份內容長度除以 `speed`，所以內容越長、一圈越久，但移動速度固定。\n3. 每圈位移一份內容加一個間距的長度，第二份剛好接到第一份的起點，看起來沒有接縫。\n4. `right` 與 `down` 是把同一個動畫反向播放。\n\n來源：1. [Marquee.vue][]\n\n### 暫停\n\n| 情境 | 行為 |\n| :--- | :--- |\n| `pauseOnHover` 開啟且滑鼠移入 | 暫停，移出後從原位繼續 |\n| `paused` 為真 | 暫停，改回假後從原位繼續 |\n| 內容未超出、`speed` 為 0 或偏好減少動態 | 不捲動，只保留一份內容 |\n\n來源：1. [Marquee.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Marquee.vue | [app/components/Camelot/Marquee.vue](../../../../app/components/Camelot/Marquee.vue) |\n\n[Marquee.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Marquee","summary":"`CamelotMarquee` 是跑馬燈容器：把預設 slot 的內容渲染兩份、首尾相接無限循環捲動，支援上下左右四個方向、以每秒像素指定速度、滑鼠移入暫停與外部暫停。內容沒有超出容器、速度為 0，或使用者偏好減少動態時不捲動，只顯示一份。不分主題，是純版面元件。"},"features/components/Material-Button.md":{"md":"# Material Button\n\n## Summary\n\n`CamelotMaterialButton` 是 Material 主題的填色膠囊按鈕，內建漣漪效果與 hover、停用狀態。一般不直接使用，而是由 `CamelotButton` 在 Material 主題（也是預設主題）下自動選用；透過它使用時字級為 1rem，按鈕最低高度 42px，字級放大時隨內容撐高。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabled` | `boolean` | `false` | 是否停用按鈕 |\n| `color` | `string` | `'primary'` | 色彩角色名稱，`isContainer` 為真時用來決定漣漪色 |\n| `isContainer` | `boolean` | `false` | 是否為 container 樣式，影響漣漪顏色 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `click` | `event: MouseEvent` | 點擊按鈕時觸發 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 按鈕內容 |\n\n## 運作方式\n\n### 外觀\n\n| 項目 | 行為 |\n| :--- | :--- |\n| 尺寸 | 最低 42px，左右留白 24px，字重 medium |\n| 顏色 | 底色取目前色彩角色，文字取角色的前景色；色彩角色由外層元件提供 |\n| hover | 提高亮度並加深陰影 |\n| 停用 | 透明度 38%，取消 hover 的亮度與陰影變化，游標顯示禁止 |\n\n來源：1. [Material/Button.vue][]　2. [Button.vue][]\n\n### 漣漪\n\n按下時以漣漪元件在按下處擴散水波紋。`isContainer` 為真時漣漪色取該色彩角色的 container 前景色，否則為白色。\n\n來源：1. [Material/Button.vue][]\n\n## 相關頁面\n\n- [Button](./Button.md)\n- [RippleEffect](./RippleEffect.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Material/Button.vue | [app/components/Camelot/Material/Button.vue](../../../../app/components/Camelot/Material/Button.vue) |\n| Button.vue | [app/components/Camelot/Button.vue](../../../../app/components/Camelot/Button.vue) |\n\n[Material/Button.vue]: #references\n[Button.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Material Button","summary":"`CamelotMaterialButton` 是 Material 主題的填色膠囊按鈕，內建漣漪效果與 hover、停用狀態。一般不直接使用，而是由 `CamelotButton` 在 Material 主題（也是預設主題）下自動選用；透過它使用時字級為 1rem，按鈕最低高度 42px，字級放大時隨內容撐高。"},"features/components/Material-Checkbox.md":{"md":"# Material Checkbox\n\n## Summary\n\n`CamelotMaterialCheckbox` 是 Material 主題的核取方塊：18px 方框，勾選時填滿色彩角色並顯示打勾，支援半選（未定）狀態。一般不直接使用，而是由 `CamelotCheckbox` 在 Material 主題（也是預設主題）下自動選用；標籤、色彩角色由外層元件提供。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabled` | `boolean` | `false` | 是否停用 |\n| `indeterminate` | `boolean` | `false` | 未定（半選）狀態，顯示橫線標記 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `change` | `checked: boolean` | 切換狀態時觸發，帶入切換後的值 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `boolean`（預設 `false`） | 核取狀態 |\n\n## 運作方式\n\n### 狀態外觀\n\n| 狀態 | 外觀 |\n| :--- | :--- |\n| 未勾選 | 外框線色的空心方框 |\n| 勾選 | 方框填滿色彩角色，顯示打勾 |\n| 半選且未勾選 | 方框填滿色彩角色，顯示橫線 |\n| 停用 | 透明度 38%，不接受點擊 |\n\n方框固定為 2px 小圓角的方形，不提供形狀設定。\n\n來源：1. [Material/Checkbox.vue][]\n\n### 點擊\n\n1. 點擊方框即切換勾選狀態，並以新值發出 `change`。\n2. 半選狀態下點擊，會切換為勾選；半選旗標本身由外部控制，元件不會改動它。\n3. 停用時忽略點擊，不發出 `change`。\n\n來源：1. [Material/Checkbox.vue][]\n\n## 相關頁面\n\n- [Checkbox](./Checkbox.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Material/Checkbox.vue | [app/components/Camelot/Material/Checkbox.vue](../../../../app/components/Camelot/Material/Checkbox.vue) |\n\n[Material/Checkbox.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Material Checkbox","summary":"`CamelotMaterialCheckbox` 是 Material 主題的核取方塊：18px 方框，勾選時填滿色彩角色並顯示打勾，支援半選（未定）狀態。一般不直接使用，而是由 `CamelotCheckbox` 在 Material 主題（也是預設主題）下自動選用；標籤、色彩角色由外層元件提供。"},"features/components/Material-Input.md":{"md":"# Material Input\n\n## Summary\n\n`CamelotMaterialInput` 是 Material 主題的 Filled 文字輸入框：上方圓角、容器底色加底線，可選浮動標籤與必填標記。一般不直接使用，而是由 `CamelotInput` 在 Material 主題（也是預設主題）下自動選用；只有外層採浮動標籤模式時才會傳入 `label`。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `label` | `string` | `''` | 浮動標籤文字；有值時欄位最低 56px，沒有時最低 42px |\n| `placeholder` | `string` | `''` | 佔位文字；有 `label` 時只在聚焦時顯示 |\n| `disabled` | `boolean` | `false` | 是否停用輸入框 |\n| `type` | `CamelotInputType` | `'text'` | 原生 input type，由 `CamelotInput` 依密碼顯示切換計算後傳入 |\n| `required` | `boolean` | `false` | 為真時標籤後顯示紅色 `*` |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `string \\| number` | 輸入框的值 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `before` | — | 輸入框前方（左側）內容 |\n| `after` | — | 輸入框後方（右側）內容 |\n\n## Exposed\n| 名稱 | 說明 |\n| :--- | :--- |\n| `inputEl` | 原生 input 元素的 ref，供 `CamelotInput` 轉接給使用端做聚焦、選取等操作 |\n\n## 運作方式\n\n### 欄位高度與標籤\n\n| 情境 | 行為 |\n| :--- | :--- |\n| 有 `label` | 欄位最低 56px；標籤平時置中於欄位內，聚焦或有值時縮小上浮並改用色彩角色 |\n| 沒有 `label` | 欄位最低 42px，佔位文字隨時顯示 |\n| 有值的判斷 | 值不是 undefined 也不是空字串；數字 0 算有值 |\n\n來源：1. [Material/Input.vue][]\n\n### 聚焦與停用\n\n1. 平時底線為外框線色。\n2. 欄位內任一元素取得焦點時，底線換成目前色彩角色，並在底部加一條 1px 的內陰影，讓底線看起來加粗。\n3. 停用時原生 input 停用；半透明與禁止游標由外層 `CamelotInput` 處理。\n\n來源：1. [Material/Input.vue][]　2. [Input.vue][]\n\n## 相關頁面\n\n- [Input](./Input.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Material/Input.vue | [app/components/Camelot/Material/Input.vue](../../../../app/components/Camelot/Material/Input.vue) |\n| Input.vue | [app/components/Camelot/Input.vue](../../../../app/components/Camelot/Input.vue) |\n\n[Material/Input.vue]: #references\n[Input.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Material Input","summary":"`CamelotMaterialInput` 是 Material 主題的 Filled 文字輸入框：上方圓角、容器底色加底線，可選浮動標籤與必填標記。一般不直接使用，而是由 `CamelotInput` 在 Material 主題（也是預設主題）下自動選用；只有外層採浮動標籤模式時才會傳入 `label`。"},"features/components/Material-Radio.md":{"md":"# MaterialRadio\n\n## Summary\n\n`CamelotMaterialRadio` 是 Material 主題的單選圓鈕：20px 圓框，選取時框線與內部圓點改用色彩角色。一般不直接使用，而是由 `CamelotRadio` 在 Material 主題（也是預設主題）下自動選用；標籤與色彩角色由外層元件提供。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabled` | `boolean` | `false` | 是否停用 |\n| `deselectable` | `boolean` | `false` | 點擊已選取項可取消選取（非必填情境） |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `change` | `checked: boolean` | 選取狀態切換時觸發 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `boolean`（預設 `false`） | 是否為選取狀態 |\n\n## 運作方式\n\n### 點擊\n\n1. 未選取時點擊：改為選取並發出 `change`。\n2. 已選取時點擊：只有 `deselectable` 為真才會取消選取；否則不動作。\n3. 停用時不接受點擊，透明度降為 38%。\n\n來源：1. [Material/Radio.vue][]\n\n### 外觀\n\n外圈為 2px 框線；選取時內部圓點由中心放大到框內寬度的 62.5%，框線與圓點都用色彩角色，未選取時框線為外框線色。\n\n來源：1. [Material/Radio.vue][]\n\n## 相關頁面\n\n- [Radio](./Radio.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Material/Radio.vue | [app/components/Camelot/Material/Radio.vue](../../../../app/components/Camelot/Material/Radio.vue) |\n\n[Material/Radio.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"MaterialRadio","summary":"`CamelotMaterialRadio` 是 Material 主題的單選圓鈕：20px 圓框，選取時框線與內部圓點改用色彩角色。一般不直接使用，而是由 `CamelotRadio` 在 Material 主題（也是預設主題）下自動選用；標籤與色彩角色由外層元件提供。"},"features/components/Material-Switch.md":{"md":"# Material Switch\n\n## Summary\n\n`CamelotMaterialSwitch` 是 Material 主題的開關：40×22px 的膠囊軌道，開啟時軌道填滿色彩角色、圓鈕放大並移到右側。一般不直接使用，而是由 `CamelotSwitch` 在 Material 主題（也是預設主題）下自動選用；色彩角色由外層元件提供。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabled` | `boolean` | `false` | 停用開關 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `change` | `checked: boolean` | 切換狀態改變時觸發，帶入切換後的值 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `boolean`（預設 `false`） | 開關狀態 |\n\n## 運作方式\n\n### 狀態外觀\n\n| 狀態 | 外觀 |\n| :--- | :--- |\n| 關閉 | 外框線色框線、淺色容器底，左側 12px 小圓鈕 |\n| 開啟 | 軌道與框線填滿色彩角色，右側 16px 圓鈕用角色前景色 |\n| 停用 | 軌道改為淡灰、透明度 38%，游標顯示禁止 |\n\n1. 點擊軌道即切換狀態並發出 `change`。\n2. 停用時點擊不會切換，也不發出事件。\n\n來源：1. [Material/Switch.vue][]\n\n## 相關頁面\n\n- [Switch](./Switch.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Material/Switch.vue | [app/components/Camelot/Material/Switch.vue](../../../../app/components/Camelot/Material/Switch.vue) |\n\n[Material/Switch.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Material Switch","summary":"`CamelotMaterialSwitch` 是 Material 主題的開關：40×22px 的膠囊軌道，開啟時軌道填滿色彩角色、圓鈕放大並移到右側。一般不直接使用，而是由 `CamelotSwitch` 在 Material 主題（也是預設主題）下自動選用；色彩角色由外層元件提供。"},"features/components/Material3Provider.md":{"md":"# Material3Provider\n\n## Summary\n\n`CamelotMaterial3Provider` 是一層 div 容器，把指定的 Material 3 明亮與暗色配色方案以 CSS 變數套在自己身上，讓裡面的子元件改用這組配色，而不影響頁面其他區域。明暗切換跟隨全域色彩模式；沒傳的方案沿用全域配色。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `lightColorScheme` | `Material3ColorSchemePartial` | — | 明亮模式使用的 Material 3 配色（可只給部分色） |\n| `darkColorScheme` | `Material3ColorSchemePartial` | — | 暗色模式使用的 Material 3 配色（可只給部分色） |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 套用配色方案的內容 |\n\n## 運作方式\n\n### 套用配色\n\n1. 元件掛載後，以自己的容器元素與傳入的兩組配色建立區域配色。\n2. 沒傳的那組方案，改用當下的全域明亮或暗色配色。\n3. 目前是暗色模式時套用暗色方案，否則套用明亮方案；色彩模式為自動時依系統偏好判斷。\n4. 色彩模式切換時，容器上的 CSS 變數跟著換成另一組方案。\n\n來源：1. [Material3Provider.vue][]　2. [useMaterial3ColorScheme.ts][]\n\n### 限制\n\n配色只在掛載時讀取一次；掛載後再修改 `lightColorScheme` 或 `darkColorScheme`，不會更新到容器上。需要換配色時，重新掛載元件（例如變更 `key`）。\n\n來源：1. [Material3Provider.vue][]\n\n## 相關頁面\n\n- [配色系統](../../platform/color-scheme.md)\n- [ColorSchemeProvider](./ColorSchemeProvider.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Material3Provider.vue | [app/components/Camelot/Material3Provider.vue](../../../../app/components/Camelot/Material3Provider.vue) |\n| useMaterial3ColorScheme.ts | [app/composables/useMaterial3ColorScheme.ts](../../../../app/composables/useMaterial3ColorScheme.ts) |\n\n[Material3Provider.vue]: #references\n[useMaterial3ColorScheme.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Material3Provider","summary":"`CamelotMaterial3Provider` 是一層 div 容器，把指定的 Material 3 明亮與暗色配色方案以 CSS 變數套在自己身上，讓裡面的子元件改用這組配色，而不影響頁面其他區域。明暗切換跟隨全域色彩模式；沒傳的方案沿用全域配色。"},"features/components/Menu.md":{"md":"# Menu\n\n## Summary\n\n`CamelotMenu` 是行內手風琴式的多層選單清單：子層往下縮排展開，點父項展開或收合、點葉節點設為選中，選中項的祖先會一起變色標示路徑。要浮層飛出、子層往側邊展開的選單請改用 [CascadeMenu](./CascadeMenu.md)。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `items` | `CamelotMenuItem[]` | — | 選單項目清單，每項有 `label`、`value`，可含 `children` 巢狀與 `disabled` |\n| `defaultExpandAll` | `boolean` | `false` | 掛載時是否預設展開所有含子項的父節點 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `select` | `item: CamelotMenuItem` | 選取某葉節點時觸發 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `string \\| number` | 目前選中項目的 `value` |\n| `expanded` | `(string \\| number)[]` | 已展開節點的 `value` 陣列（預設 `[]`） |\n\n## 運作方式\n\n### 點擊行為\n\n1. 點含子項的項目：展開或收合，不改變選中值。\n2. 點葉節點：設為選中並發出 `select`。\n3. 停用項目半透明、不回應點擊。\n\n來源：1. [Menu.vue][]　2. [MenuItem.vue][]\n\n### 預設展開\n\n`defaultExpandAll` 為真，且掛載時 `expanded` 仍是空陣列，才會展開所有父節點；外部已給展開清單時以外部為準。\n\n來源：1. [Menu.vue][]\n\n### 層級視覺\n\n1. 子層往下縮排，左側有一條實線導引線，止於最後一個子項的中線，並轉成 L 形轉角指向它。\n2. 頂層項目字重較粗，深層項目文字較淡。\n3. 選中項的父層與祖先文字改用色彩角色，但不加選中底色。\n\n來源：1. [MenuItem.vue][]\n\n### 各主題選中樣式\n\n| 主題 | 選中樣式 |\n| :--- | :--- |\n| aqua | 玻璃填滿底，文字用配對的前景色 |\n| scifi | 18% 角色色底、角色色文字與文字光暈 |\n| cupertino | 10% 角色色底、粗體角色色文字 |\n| material | 10% 角色色底、角色色文字 |\n\n來源：1. [MenuItem.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Menu.vue | [app/components/Camelot/Menu.vue](../../../../app/components/Camelot/Menu.vue) |\n| MenuItem.vue | [app/components/Camelot/Internal/MenuItem.vue](../../../../app/components/Camelot/Internal/MenuItem.vue) |\n\n[Menu.vue]: #references\n[MenuItem.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Menu","summary":"`CamelotMenu` 是行內手風琴式的多層選單清單：子層往下縮排展開，點父項展開或收合、點葉節點設為選中，選中項的祖先會一起變色標示路徑。要浮層飛出、子層往側邊展開的選單請改用 [CascadeMenu](./CascadeMenu.md)。"},"features/components/NumberCounter.md":{"md":"# NumberCounter\n\n## Summary\n\n`CamelotNumberCounter` 是帶加減按鈕的數字輸入欄位：中間可直接輸入，左右按鈕依步進值加減並夾在上下限內，可依目前值的小數位數自動決定步進。高度與 Input 一致，最低 42px、隨字級撐高，外觀依主題跟著各主題的 Input。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `step` | `number` | — | 加減步進值（取絕對值）；開啟 `minStepByValue` 且目前值有小數時，會被依值算出的步進覆蓋 |\n| `min` | `number` | — | 按減號時的下限 |\n| `max` | `number` | — | 按加號時的上限 |\n| `placeholder` | `string` | — | 輸入框提示文字 |\n| `label` | `string` | — | 欄位標題文字 |\n| `required` | `boolean` | — | 是否為必填（顯示標題必填星號） |\n| `disabled` | `boolean` | — | 是否停用 |\n| `color` | `CamelotColorRole` | — | 色彩角色（未提供時為 `'primary'`） |\n| `isContainer` | `boolean` | — | 是否使用 container 色階（未提供時為 `false`） |\n| `minStepByValue` | `boolean` | — | 目前值有小數時，以最小小數位作為步進（例如 `0.25` 的步進為 `0.01`），並覆蓋 `step` |\n| `usedMinStepByValue` | `boolean` | — | 需搭配 `minStepByValue`；算出的步進比目前步進大時保留較小者，避免步進被放大 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `number`（預設 `0`） | 目前數值 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `label` | `{ label: string }` | 自訂標題區塊，預設渲染 `CamelotFieldLabel` |\n| `minus` | — | 自訂減號按鈕內容，預設為含漣漪效果的 `-` |\n| `plus` | — | 自訂加號按鈕內容，預設為含漣漪效果的 `+` |\n\n## 運作方式\n\n### 各主題外框\n\n| 主題 | 外框 |\n| :--- | :--- |\n| aqua | 半透明軌道底、12px 圓角，聚焦時加光暈 |\n| cupertino | 與 Cupertino Input 相同：無可見框線，聚焦時轉亮底並加內側角色色框 |\n| scifi | 包在與 Sci-Fi Input 相同的 HUD 外框裡，hover 與聚焦時有掃描光與準星 |\n| material | 與 Material Input、SelectV2 同為 Filled 欄位：上方圓角、容器底色與底線，聚焦時底線改為角色色 |\n\n高度與 Input 相同，最低 42px；字級放大時，加減按鈕與容器一起撐高。Sci-Fi 主題的內容區扣掉 HUD 外框上下各 1px。\n\n停用時整個元件半透明、游標顯示禁止，並且不接受點擊。\n\n來源：1. [NumberCounter.vue][]　2. [FieldFrame.vue][]\n\n### 步進值\n\n1. 有設定 `step` 時，以它的絕對值為步進。\n2. 沒設 step、也沒開 minStepByValue 時，步進為 1。\n3. 開啟 `minStepByValue` 且目前值帶小數時，步進改為該值的最小小數位，例如 0.25 的步進是 0.01；這一步會覆蓋 step。\n4. 同時開啟 `usedMinStepByValue` 時，若算出的步進比目前步進大，保留目前較小的步進。\n5. 開啟 minStepByValue 但目前值是整數時，有 step 就用 step，否則沿用上一次的步進。\n\n來源：1. [NumberCounter.vue][]\n\n### 加減與輸入\n\n1. 按加減號時以浮點數安全的加法計算，避免 0.1 加 0.2 這類誤差。\n2. 按加號超過上限時停在上限；按減號低於下限時停在下限。直接輸入的值不會被夾限。\n3. 加減後輸入框自動取得焦點。\n4. 行動裝置上，按加減號造成的聚焦不會彈出鍵盤；使用者點擊輸入框後才切成小數鍵盤，失焦後恢復。\n5. 原生數字輸入框的上下箭頭已隱藏。\n\n來源：1. [NumberCounter.vue][]　2. [useFloat.ts][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| NumberCounter.vue | [app/components/Camelot/NumberCounter.vue](../../../../app/components/Camelot/NumberCounter.vue) |\n| FieldFrame.vue | [app/components/Camelot/Internal/FieldFrame.vue](../../../../app/components/Camelot/Internal/FieldFrame.vue) |\n| useFloat.ts | [app/composables/useFloat.ts](../../../../app/composables/useFloat.ts) |\n\n[NumberCounter.vue]: #references\n[FieldFrame.vue]: #references\n[useFloat.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"NumberCounter","summary":"`CamelotNumberCounter` 是帶加減按鈕的數字輸入欄位：中間可直接輸入，左右按鈕依步進值加減並夾在上下限內，可依目前值的小數位數自動決定步進。高度與 Input 一致，最低 42px、隨字級撐高，外觀依主題跟著各主題的 Input。"},"features/components/OverlayScrollbar.md":{"md":"# OverlayScrollbar\n\n## Summary\n\n`CamelotOverlayScrollbar` 是附著在既有捲動容器上的自訂覆蓋式捲軸，不自建容器，一個實例只負責一個方向。水平捲軸可在容器底部捲出視窗時浮動到視窗底；Table 的兩軸都用它取代原生捲軸。整體設計與和 Scrollbar 的分工見 [OverlayScrollbar 系統](../../platform/overlay-scrollbar.md)。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `container` | `HTMLElement \\| null` | — | 目標捲動容器（必填） |\n| `orientation` | `CamelotScrollbarOrientation` | — | 捲軸方向：`'horizontal'` 或 `'vertical'`（必填） |\n| `floatingEnabled` | `boolean` | `false` | 是否允許浮動到視窗底，只對水平捲軸有效 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色，用於捲軸滑塊 |\n| `startInset` | `number` | `0` | 主軸起點額外偏移（px），例如垂直捲軸避開 sticky 表頭 |\n\n## 運作方式\n\n### 擺放方式\n\n1. 把捲動容器包在一個 `relative` 的外層裡，捲軸元件放在捲動容器旁邊、同一個外層內。\n2. 把捲動容器的元素傳給 `container`；水平與垂直各放一個實例。\n3. 平時捲軸以絕對定位貼在外層內：水平貼底、垂直貼右，兩端各內縮 6px，會被外層的圓角裁切。\n\n來源：1. [OverlayScrollbar.vue][]　2. [Table.vue][]\n\n### 顯示與浮動\n\n| 情境 | 行為 |\n| :--- | :--- |\n| 容器在該方向沒有溢出 | 不顯示 |\n| 容器完全在視窗外 | 不顯示 |\n| 水平、`floatingEnabled` 為真，且容器底部在視窗下方 | 移到頁面最外層，固定在視窗底上方 6px |\n| 垂直 | 永遠貼在容器右側，不會浮動 |\n\n容器尺寸、內容尺寸、視窗捲動與縮放都會觸發重新量測，每個畫面幀最多量測一次。\n\n來源：1. [OverlayScrollbar.vue][]　2. [useCamelotOverlayScrollbar.ts][]\n\n### 滑塊\n\n1. 滑塊長度依可見比例計算，最短 40px。\n2. 只有滑塊接收指標事件，其餘區域不攔截點擊；拖曳滑塊即捲動容器。\n3. 平時滑塊是半寬、半透明的膠囊；hover 或拖曳時放大到全寬、改用實色並加一圈淡光暈。\n4. 顏色取全域的色彩角色變數，所以浮動到頁面最外層後仍維持同一顏色。\n\n來源：1. [OverlayScrollbar.vue][]　2. [useCamelotOverlayScrollbar.ts][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| OverlayScrollbar.vue | [app/components/Camelot/OverlayScrollbar.vue](../../../../app/components/Camelot/OverlayScrollbar.vue) |\n| Table.vue | [app/components/Camelot/Table.vue](../../../../app/components/Camelot/Table.vue) |\n| useCamelotOverlayScrollbar.ts | [app/composables/useCamelotOverlayScrollbar.ts](../../../../app/composables/useCamelotOverlayScrollbar.ts) |\n\n[OverlayScrollbar.vue]: #references\n[Table.vue]: #references\n[useCamelotOverlayScrollbar.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"OverlayScrollbar","summary":"`CamelotOverlayScrollbar` 是附著在既有捲動容器上的自訂覆蓋式捲軸，不自建容器，一個實例只負責一個方向。水平捲軸可在容器底部捲出視窗時浮動到視窗底；Table 的兩軸都用它取代原生捲軸。整體設計與和 Scrollbar 的分工見 [OverlayScrollbar 系統](../../platform/overlay-scrollbar.md)。"},"features/components/Pagination.md":{"md":"# Pagination\n\n## Summary\n\n`CamelotPagination` 是分頁導覽列：上一頁、頁碼、下一頁，並可選擇顯示總筆數、每頁筆數下拉選單與跳頁輸入框。它只負責分頁列、不持有資料，父層依目前頁碼與每頁筆數自行切出當頁資料。頁碼過多時以省略號折疊，外觀依主題切換。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `total` | `number` | — | 總筆數；與 `totalPages` 擇一，兩者都給時以 `totalPages` 為準 |\n| `totalPages` | `number` | — | 總頁數；未給時由 `total` 除以每頁筆數無條件進位 |\n| `siblingCount` | `number` | `1` | 目前頁左右各顯示幾個頁碼 |\n| `boundaryCount` | `number` | `1` | 首尾各固定顯示幾個頁碼 |\n| `showTotal` | `boolean` | — | 是否顯示「共 N 筆」；沒給 `total` 時 N 會顯示總頁數 |\n| `showJumper` | `boolean` | — | 是否顯示跳頁輸入框 |\n| `showPageSize` | `boolean` | — | 是否顯示每頁筆數下拉選單 |\n| `pageSizeOptions` | `number[]` | `[10, 20, 50, 100]` | 每頁筆數選項 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色 |\n| `disabled` | `boolean` | — | 停用整個分頁列 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `number` | 目前頁碼（預設 `1`） |\n| `pageSize` | `number` | 每頁筆數（預設 `10`） |\n\n## 運作方式\n\n### 搭配資料清單\n\n父層依頁碼與每頁筆數切出當頁資料，例如搭配 [Table](./Table.md)：\n\n```ts\nconst rows = computed(() => data.slice((page.value - 1) * pageSize.value, page.value * pageSize.value))\n```\n\n總頁數最少為 1；兩者都沒給時也視為 1 頁。\n\n來源：1. [Pagination.vue][]\n\n### 頁碼折疊\n\n1. 固定顯示首尾各 `boundaryCount` 個頁碼。\n2. 固定顯示目前頁左右各 `siblingCount` 個頁碼。\n3. 其餘頁碼折疊，相鄰頁碼間有缺口時顯示一個「…」。\n\n來源：1. [Pagination.vue][]\n\n### 換頁規則\n\n| 規則 | 說明 |\n| :--- | :--- |\n| 夾限 | 點頁碼、上下頁、跳頁輸入都會夾在 1 到總頁數之間 |\n| 跳頁 | 輸入框的值確定變更（失焦或按 Enter）時才換頁 |\n| 超出總頁數 | 每頁筆數或總頁數變動、目前頁超出時，自動退回最後一頁 |\n| 首頁與末頁 | 上一頁在第 1 頁、下一頁在最後一頁時停用 |\n| 停用 | 所有按鈕停用，點擊不換頁 |\n\n每頁筆數選單使用關閉搜尋的 [SelectV2](./SelectV2.md)，選項顯示為「N / 頁」。\n\n來源：1. [Pagination.vue][]\n\n### 各主題頁碼樣式\n\n| 主題 | 形狀 | 目前頁 |\n| :--- | :--- | :--- |\n| aqua | 圓形玻璃軌道 | 玻璃填滿底 |\n| scifi | 切角方塊、淡角色色框線 | 角色色底加光暈 |\n| cupertino | 8px 圓角，hover 顯示淺底 | 角色色底 |\n| material | 6px 圓角，hover 顯示淺底 | 角色色底 |\n\n來源：1. [Pagination.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Pagination.vue | [app/components/Camelot/Pagination.vue](../../../../app/components/Camelot/Pagination.vue) |\n\n[Pagination.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Pagination","summary":"`CamelotPagination` 是分頁導覽列：上一頁、頁碼、下一頁，並可選擇顯示總筆數、每頁筆數下拉選單與跳頁輸入框。它只負責分頁列、不持有資料，父層依目前頁碼與每頁筆數自行切出當頁資料。頁碼過多時以省略號折疊，外觀依主題切換。"},"features/components/PopupV2.md":{"md":"# PopupV2\n\n## Summary\n\n`CamelotPopupV2` 是依附在觸發元素上的彈出浮層：點擊或 hover 開啟，浮層以固定定位跟著觸發元素，空間不足時自動翻到上方或靠右對齊，並在頁面捲動時自動關閉。浮層預設掛到頁面最外層；觸發元素在對話框內時改掛進該對話框。下拉選單、日期選擇器等浮層元件都建立在它之上。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `zIndex` | `number` | `var(--cml-z-popup)` | 浮層 z-index；未指定時採用[疊層刻度](../../platform/layering.md)的 popup 層級，傳 `0` 也視為有效值 |\n| `disabled` | `boolean` | — | 停用觸發；停用後元件更新時會關閉浮層 |\n| `disabledShadow` | `boolean` | — | 關閉浮層陰影 |\n| `disabledCloseWhenScrolling` | `boolean` | — | 頁面捲動時不自動關閉 |\n| `disabledAutoSpace` | `boolean` | — | 關閉浮層貼邊時的左右留白 |\n| `manual` | `boolean` | — | 手動控制開關：點擊觸發元素與點擊外部都不會改變開關狀態 |\n| `verticalPosition` | `'auto' \\| 'top' \\| 'bottom'` | — | 垂直位置；未指定時自動判斷 |\n| `isClickInside` | `(string \\| MaybeElementRef<MaybeElement>)[]` | — | 視為點擊內部、不觸發點擊外部關閉的元素清單 |\n| `disabledClickOutside` | `boolean` | — | 點擊外部時不自動關閉 |\n| `popupWidthMode` | `'fit-content' \\| 'min-target' \\| 'same-target'` | — | 浮層寬度模式；未指定時依內容寬度 |\n| `teleport` | `string \\| MaybeElementRef<MaybeElement>` | — | 自訂浮層掛載目標 |\n| `popupClass` | `string \\| string[] \\| Record<string, boolean>` | — | 套用於浮層外層容器的 class |\n| `triggerMode` | `'click' \\| 'hover'` | — | 觸發模式；未指定時為點擊 |\n| `hoverDelay` | `number` | — | hover 模式滑鼠移開後延遲關閉的毫秒數，未指定時為 200 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `open` | `boolean` | 是否開啟（預設 `false`） |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 觸發元素 |\n| `popup` | — | 浮層內容 |\n\n## 運作方式\n\n### 開啟與關閉\n\n| 觸發 | 行為 |\n| :--- | :--- |\n| 點擊模式 | 點觸發元素切換開關 |\n| hover 模式 | 滑鼠進入觸發元素或浮層即開啟；離開兩者後延遲 `hoverDelay` 關閉，期間移回則取消關閉 |\n| 點擊外部 | 關閉；`manual`、`disabledClickOutside` 開啟時不作用 |\n| 頁面捲動 | 關閉；`disabledCloseWhenScrolling` 開啟時不作用 |\n| 捲動父層捲動 | 關閉；在對話框內時一律關閉，不受 `disabledCloseWhenScrolling` 影響 |\n\n來源：1. [PopupV2.vue][]\n\n### 定位\n\n1. 浮層以固定定位放在觸發元素下方，左緣對齊觸發元素。\n2. 觸發元素底部加上浮層高度超出視窗時翻到上方；`verticalPosition` 可強制上方或下方。\n3. 觸發元素左緣加上浮層寬度超出視窗右緣時改為靠右對齊。\n4. 浮層開啟期間每一幀追蹤觸發元素位置；開啟當下先同步量測一次，關閉與卸載時停止追蹤。\n5. 行動裝置鍵盤彈出造成可視區位移時，依可視區偏移修正位置；浮層開啟且沒有輸入框聚焦時凍結偏移，避免收鍵盤時浮層跳動。\n\n因為使用固定定位，祖先元素若設定 transform、perspective、filter 或 will-change，定位可能失效。\n\n來源：1. [PopupV2.vue][]\n\n### 寬度模式\n\n| 模式 | 浮層寬度 |\n| :--- | :--- |\n| `fit-content`（未指定時同此） | 依內容寬度 |\n| `min-target` | 依內容寬度，但不小於觸發元素 |\n| `same-target` | 與觸發元素同寬 |\n\n來源：1. [PopupV2.vue][]\n\n### 掛載目標與疊層\n\n1. 有 `teleport` 時掛到指定目標。\n2. 否則若觸發元素位在原生對話框內，掛進該對話框；對話框會建立頂層，掛在外面的浮層 z-index 再高也會被壓住。\n3. 其餘情況掛到頁面最外層。\n4. 浮層容器帶有 `data-camelot-popup` 屬性。掛進對話框後浮層落在對話框內容框之外，[BaseDialogV2](./BaseDialogV2.md) 靠這個標記把它與遮罩區分，點選單選項才不會被誤判成點遮罩而關閉對話框。自訂浮層要有相同行為時，也要帶上這個屬性。\n5. 預設層級高於 Drawer 與 BottomSheet，因為掛進對話框後三者互為同層兄弟節點，見[疊層刻度](../../platform/layering.md)。\n\n來源：1. [PopupV2.vue][]\n\n### 陰影\n\n陰影畫在帶 `popupClass` 的外層容器上，內容本身包在展開動畫容器裡並裁切溢出。要自訂浮層圓角時，把圓角 class 放進 `popupClass`，陰影才會跟著圓角，不會被裁成方形。\n\n來源：1. [PopupV2.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| PopupV2.vue | [app/components/Camelot/PopupV2.vue](../../../../app/components/Camelot/PopupV2.vue) |\n\n[PopupV2.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"PopupV2","summary":"`CamelotPopupV2` 是依附在觸發元素上的彈出浮層：點擊或 hover 開啟，浮層以固定定位跟著觸發元素，空間不足時自動翻到上方或靠右對齊，並在頁面捲動時自動關閉。浮層預設掛到頁面最外層；觸發元素在對話框內時改掛進該對話框。下拉選單、日期選擇器等浮層元件都建立在它之上。"},"features/components/ProgressBar.md":{"md":"# ProgressBar\n\n## Summary\n\n`CamelotProgressBar` 是水平進度條：依目前值與最大值填滿軌道，也可切成不確定狀態、以由左往右反覆掃過的色塊表示進行中；可在右側顯示百分比或分數標籤，外觀依主題切換。系列元件的比較見 [進度元件](../progress-components.md)。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `value` | `number` | `0` | 目前進度值 |\n| `max` | `number` | `100` | 最大值 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色 |\n| `indeterminate` | `boolean` | `false` | 不確定狀態，顯示掃描動畫 |\n| `showLabel` | `boolean` | `false` | 顯示右側標籤；不確定狀態下不顯示 |\n| `labelMode` | `'percent' \\| 'fraction'` | `'percent'` | 標籤格式：百分比或分數 |\n| `height` | `string` | `'8px'` | 軌道高度（CSS 長度） |\n| `rounded` | `boolean` | `true` | 是否圓角；Sci-Fi 主題一律無圓角 |\n\n## 運作方式\n\n### 進度與標籤\n\n1. 進度百分比等於目前值除以最大值，夾在 0 到 100；最大值小於等於 0 時為 0。\n2. 百分比標籤四捨五入到整數，例如「42%」。\n3. 分數標籤直接顯示原始值，例如「3 / 8」，不做夾限。\n4. 進度變化時填色寬度以彈性曲線過渡；不確定狀態以 40% 寬的色塊由左往右反覆掃過，一趟 1.4 秒。\n\n來源：1. [ProgressBar.vue][]\n\n### 各主題外觀\n\n| 主題 | 軌道 | 填色 |\n| :--- | :--- | :--- |\n| aqua | 玻璃軌道加背景模糊 | 玻璃填滿 |\n| scifi | 淡角色色框線與 8% 角色色底，無圓角 | 角色色加外光暈 |\n| cupertino、material | 淺色容器底 | 角色色 |\n\n使用者偏好減少動態時，關閉過渡與掃描動畫。\n\n來源：1. [ProgressBar.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| ProgressBar.vue | [app/components/Camelot/ProgressBar.vue](../../../../app/components/Camelot/ProgressBar.vue) |\n\n[ProgressBar.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"ProgressBar","summary":"`CamelotProgressBar` 是水平進度條：依目前值與最大值填滿軌道，也可切成不確定狀態、以由左往右反覆掃過的色塊表示進行中；可在右側顯示百分比或分數標籤，外觀依主題切換。系列元件的比較見 [進度元件](../progress-components.md)。"},"features/components/ProgressCircle.md":{"md":"# ProgressCircle\n\n## Summary\n\n`CamelotProgressCircle` 是圓環進度指示器：以 SVG 圓環從頂端順時針畫出進度，也可切成不確定狀態、以缺口圓環持續旋轉；中央可顯示百分比或分數標籤，外觀依主題切換。系列元件的比較見 [進度元件](../progress-components.md)。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `value` | `number` | `0` | 目前進度值 |\n| `max` | `number` | `100` | 最大值 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色 |\n| `indeterminate` | `boolean` | `false` | 不確定狀態，顯示旋轉動畫 |\n| `showLabel` | `boolean` | `false` | 顯示中央標籤；不確定狀態下不顯示 |\n| `labelMode` | `'percent' \\| 'fraction'` | `'percent'` | 標籤格式：百分比或分數 |\n| `size` | `number` | `64` | 元件尺寸（px） |\n| `strokeWidth` | `number` | `6` | 圓環線寬（px） |\n\n## 運作方式\n\n### 進度與標籤\n\n1. 進度百分比等於目前值除以最大值，夾在 0 到 100；最大值小於等於 0 時為 0。\n2. 圓環從頂端起算，依百分比畫出對應長度的弧，變化時以彈性曲線過渡。\n3. 不確定狀態固定畫出 30% 的弧並整圈旋轉。\n4. 中央標籤字級為尺寸的 26%；百分比四捨五入到整數，分數直接顯示原始值。\n\n來源：1. [ProgressCircle.vue][]\n\n### 各主題外觀\n\n| 主題 | 軌道 | 進度弧 |\n| :--- | :--- | :--- |\n| aqua | 14% 角色色 | 角色色到偏白的斜向漸層，圓頭 |\n| scifi | 18% 角色色 | 角色色加外光暈，平頭 |\n| cupertino、material | 淡外框線色 | 角色色，圓頭 |\n\n使用者偏好減少動態時，關閉過渡與旋轉動畫。\n\n來源：1. [ProgressCircle.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| ProgressCircle.vue | [app/components/Camelot/ProgressCircle.vue](../../../../app/components/Camelot/ProgressCircle.vue) |\n\n[ProgressCircle.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"ProgressCircle","summary":"`CamelotProgressCircle` 是圓環進度指示器：以 SVG 圓環從頂端順時針畫出進度，也可切成不確定狀態、以缺口圓環持續旋轉；中央可顯示百分比或分數標籤，外觀依主題切換。系列元件的比較見 [進度元件](../progress-components.md)。"},"features/components/ProgressStage.md":{"md":"# ProgressStage\n\n## Summary\n\n`CamelotProgressStage` 是階段進度指示器：以左上方留一個缺口的弧形環顯示「目前階段／總階段」的比例，目前階段的數字從缺口處突出，斜線與總階段數排在圓心附近，三者視為一體。外觀依主題切換。系列元件的比較見 [進度元件](../progress-components.md)。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `current` | `number` | `1` | 目前階段 |\n| `total` | `number` | `1` | 總階段數 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色 |\n| `size` | `number` | `96` | 元件尺寸（px） |\n| `strokeWidth` | `number` | `7` | 弧線線寬（px） |\n\n## 運作方式\n\n### 弧形與比例\n\n1. 缺口固定開在左上方，寬 98 度；其餘 262 度是軌道。\n2. 進度弧從缺口的一端順時針畫起，長度等於目前階段除以總階段，夾在 0 到 1；總階段小於等於 0 時為 0。\n3. 階段變化時以彈性曲線過渡；使用者偏好減少動態時關閉過渡。\n\n來源：1. [ProgressStage.vue][]\n\n### 數字排版\n\n| 元素 | 排版 |\n| :--- | :--- |\n| 目前階段 | 角色色粗斜體，放在缺口處；3 位數以內 51px，4 位數以上 40px |\n| 斜線 | 淡色，旋轉 30 度，放在圓心偏左上 |\n| 總階段 | 淡色斜體，放在圓心偏右下，字級為尺寸的 26% |\n\n目前階段的位置與字級是固定像素，不隨 `size` 縮放；改變尺寸時需自行確認排版。\n\n來源：1. [ProgressStage.vue][]\n\n### 各主題外觀\n\n| 主題 | 軌道 | 進度弧 |\n| :--- | :--- | :--- |\n| aqua | 14% 角色色 | 角色色到偏白的斜向漸層 |\n| scifi | 18% 角色色 | 角色色加外光暈 |\n| cupertino、material | 淡外框線色 | 角色色 |\n\n來源：1. [ProgressStage.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| ProgressStage.vue | [app/components/Camelot/ProgressStage.vue](../../../../app/components/Camelot/ProgressStage.vue) |\n\n[ProgressStage.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"ProgressStage","summary":"`CamelotProgressStage` 是階段進度指示器：以左上方留一個缺口的弧形環顯示「目前階段／總階段」的比例，目前階段的數字從缺口處突出，斜線與總階段數排在圓心附近，三者視為一體。外觀依主題切換。系列元件的比較見 [進度元件](../progress-components.md)。"},"features/components/Radio.md":{"md":"# Radio\n\n## Summary\n\n`CamelotRadio` 是單一的單選圓鈕加可點擊標籤，依目前主題渲染 Sci-Fi、Cupertino、Aqua 或 Material 風格的圓鈕，並提供色彩角色。預設只能選取、不能點擊取消，需要可取消時開啟 `deselectable`。一組選項請改用 [RadioGroup](./RadioGroup.md)。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `label` | `string` | `''` | 標籤文字 |\n| `disabled` | `boolean` | `false` | 是否停用 |\n| `deselectable` | `boolean` | `false` | 點擊已選取項可取消選取（非必填情境） |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色 |\n| `isContainer` | `boolean` | `false` | 是否使用 container 色階 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `change` | `checked: boolean` | 選取狀態切換時觸發 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `boolean`（預設 `false`） | 是否為選取狀態 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `label` | `{ label: string }` | 自訂標籤內容，預設渲染 `CamelotFieldLabel` |\n\n## 運作方式\n\n### 主題分派\n\n| 主題 | 使用的圓鈕 |\n| :--- | :--- |\n| scifi | Sci-Fi Radio |\n| cupertino | Cupertino Radio |\n| aqua | Aqua Radio |\n| 其他（含 material） | [Material Radio](./Material-Radio.md) |\n\n來源：1. [Radio.vue][]\n\n### 點擊\n\n1. 點圓鈕或點標籤的行為相同。\n2. 未選取時點擊：改為選取並發出 `change`。\n3. 已選取時點擊：只有 `deselectable` 為真才會取消選取。\n4. 停用時不接受點擊，標籤半透明並顯示禁止游標。\n5. 沒有 `label` 也沒有 label slot 時，不渲染標籤區。\n\n來源：1. [Radio.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Radio.vue | [app/components/Camelot/Radio.vue](../../../../app/components/Camelot/Radio.vue) |\n\n[Radio.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Radio","summary":"`CamelotRadio` 是單一的單選圓鈕加可點擊標籤，依目前主題渲染 Sci-Fi、Cupertino、Aqua 或 Material 風格的圓鈕，並提供色彩角色。預設只能選取、不能點擊取消，需要可取消時開啟 `deselectable`。一組選項請改用 [RadioGroup](./RadioGroup.md)。"},"features/components/RadioGroup.md":{"md":"# RadioGroup\n\n## Summary\n\n`CamelotRadioGroup` 依選項清單渲染一組 [Radio](./Radio.md)，以單一值雙向綁定目前選取的選項，可水平或垂直排列、整組或逐項停用，並可加上群組標題與必填標記。開啟 `deselectable` 時可點擊已選項取消選取，值變回 undefined。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `options` | `CamelotGroupOption[]` | — | 選項清單（必填） |\n| `direction` | `'horizontal' \\| 'vertical'` | `'horizontal'` | 排列方向；水平時可換行 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色 |\n| `disabled` | `boolean` | `false` | 整組停用；逐選項停用請用選項的 `disabled` |\n| `deselectable` | `boolean` | `false` | 點擊已選取項可取消選取，取消時 `modelValue` 為 `undefined` |\n| `label` | `string` | `''` | 群組標題文字 |\n| `required` | `boolean` | `false` | 是否顯示必填標記 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `change` | `option: CamelotGroupOption \\| undefined` | 選取變動時觸發；取消選取時為 `undefined` |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `string \\| number \\| undefined` | 目前選取選項的值 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `label` | `{ label: string }` | 自訂群組標題，預設渲染 `CamelotFieldLabel` |\n\n## 運作方式\n\n### 選取\n\n1. 每個選項渲染成一個 Radio，選項的值等於綁定值時為選取狀態。\n2. 點未選取的選項：值改為該選項，並以該選項發出 change。\n3. 點已選取的選項：`deselectable` 為真時值改為 undefined 並發出 change；否則不動作。\n4. 整組停用或該選項停用時，點擊不作用。\n\n來源：1. [RadioGroup.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| RadioGroup.vue | [app/components/Camelot/RadioGroup.vue](../../../../app/components/Camelot/RadioGroup.vue) |\n\n[RadioGroup.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"RadioGroup","summary":"`CamelotRadioGroup` 依選項清單渲染一組 [Radio](./Radio.md)，以單一值雙向綁定目前選取的選項，可水平或垂直排列、整組或逐項停用，並可加上群組標題與必填標記。開啟 `deselectable` 時可點擊已選項取消選取，值變回 undefined。"},"features/components/RevealImage.md":{"md":"# RevealImage\n\n## Summary\n\n`CamelotRevealImage` 顯示一張先呈黑白的圖片，再以一道沿指定角度推進的遮罩，把同一張圖的彩色版逐步揭示出來。可自動播放、滑鼠移入播放或由外部控制播放，時長、延遲與方向都可調。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `src` | `string` | — | 圖片網址（必填），黑白底圖與彩色揭示層共用 |\n| `alt` | `string` | `''` | 圖片替代文字 |\n| `trigger` | `'auto' \\| 'hover' \\| 'manual'` | `'auto'` | 觸發方式：自動播放、滑鼠移入播放、手動控制 |\n| `play` | `boolean` | `false` | `manual` 模式下設為真即播放 |\n| `angle` | `string` | `'0deg'` | 揭示推進方向（CSS 角度） |\n| `duration` | `string` | `'800ms'` | 動畫時長（CSS 時間） |\n| `delay` | `string` | `'0s'` | 動畫延遲（CSS 時間） |\n\n## 運作方式\n\n### 揭示\n\n1. 圖片本身套灰階濾鏡作為底圖，寬度撐滿元件。\n2. 上方疊一層同一張圖的彩色版，以線性漸層遮罩控制可見範圍，初始完全隱藏。\n3. 播放時遮罩的可見比例從 0% 推到 100%，播完停在全彩。\n4. `hover` 模式只在滑鼠停留期間播放，移出後回到黑白。\n\n來源：1. [RevealImage.vue][]\n\n### 漸進與減少動態\n\n| 項目 | 行為 |\n| :--- | :--- |\n| 漸進效果 | 元件自行把遮罩比例註冊為百分比型別，揭示過程平滑推進，不依賴其他元件 |\n| 減少動態 | 使用者偏好減少動態時，彩色層直接完整顯示，不播放揭示動畫 |\n\n來源：1. [RevealImage.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| RevealImage.vue | [app/components/Camelot/RevealImage.vue](../../../../app/components/Camelot/RevealImage.vue) |\n\n[RevealImage.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"RevealImage","summary":"`CamelotRevealImage` 顯示一張先呈黑白的圖片，再以一道沿指定角度推進的遮罩，把同一張圖的彩色版逐步揭示出來。可自動播放、滑鼠移入播放或由外部控制播放，時長、延遲與方向都可調。"},"features/components/RevealText.md":{"md":"# RevealText\n\n## Summary\n\n`CamelotRevealText` 顯示一段文字，再以一道沿指定角度推進的遮罩，把同一段文字以指定的填色或背景逐步覆蓋上去。可自動播放、滑鼠移入播放或由外部控制播放，時長、延遲、方向與填色都可調。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `text` | `string` | — | 要顯示的文字（必填） |\n| `trigger` | `'auto' \\| 'hover' \\| 'manual'` | `'auto'` | 觸發方式：自動播放、滑鼠移入播放、手動控制 |\n| `play` | `boolean` | `false` | `manual` 模式下設為真即播放 |\n| `angle` | `string` | `'0deg'` | 揭示推進方向（CSS 角度） |\n| `duration` | `string` | `'500ms'` | 動畫時長（CSS 時間） |\n| `delay` | `string` | `'0s'` | 動畫延遲（CSS 時間） |\n| `fill` | `string` | `'#ff4d4f'` | 揭示層的背景，可為顏色、漸層或圖片 |\n| `bgSize` | `string` | `'auto'` | 揭示層背景尺寸（CSS 長度或關鍵字） |\n\n## 運作方式\n\n### 揭示\n\n1. 元件先以一般文字色顯示整段文字。\n2. 上方疊一層同樣的文字，以 `fill` 為背景並裁切成文字形狀，背景置中。\n3. 揭示層以線性漸層遮罩控制可見範圍，播放時可見比例從 0% 推到 100%，播完停在全填色。\n4. `hover` 模式只在滑鼠停留期間播放，移出後回到原色。\n5. 使用者偏好減少動態時不播放動畫，直接顯示全填色。\n\n來源：1. [RevealText.vue][]\n\n### 預設樣式\n\n元件內建字級 64px、文字色近黑，不跟隨主題或外層字級；要改變時需從外層覆寫元件的樣式。\n\n來源：1. [RevealText.vue][]\n\n## 相關頁面\n\n- [RevealImage](./RevealImage.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| RevealText.vue | [app/components/Camelot/RevealText.vue](../../../../app/components/Camelot/RevealText.vue) |\n\n[RevealText.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"RevealText","summary":"`CamelotRevealText` 顯示一段文字，再以一道沿指定角度推進的遮罩，把同一段文字以指定的填色或背景逐步覆蓋上去。可自動播放、滑鼠移入播放或由外部控制播放，時長、延遲、方向與填色都可調。"},"features/components/RichTextEditor.md":{"md":"# RichTextEditor\n\n## Summary\n\n`CamelotRichTextEditor` 是以 TipTap 驅動、依主題換外觀的所見即所得編輯器，以 HTML 字串雙向綁定內容。內建標題、清單、引言、程式碼、連結、圖片等工具列，會把貼上的雜亂 HTML 淨化成乾淨的文章格式；圖片可先暫存在本機、等到儲存前再透過使用端提供的上傳函式一次上傳。整體設計見 [RichTextEditor 與 ImageDropzone](../richtext-editor-image-dropzone.md)。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色 |\n| `placeholder` | `string` | `'開始撰寫內容…'` | 內容空白時的提示文字 |\n| `disabled` | `boolean` | `false` | 停用編輯：唯讀、半透明、不接受點擊 |\n| `minHeight` | `string` | `'320px'` | 編輯區最小高度（CSS 長度） |\n| `uploadHandler` | `(file: File) => Promise<string>` | — | 上傳函式，回傳圖片的最終網址；未提供時只能插入圖片網址 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `string` | 編輯器的 HTML 內容（必填） |\n\n## Exposed\n| 名稱 | 說明 |\n| :--- | :--- |\n| `flush()` | 回傳 `Promise<void>`；把仍在內容中的暫存圖片逐張上傳，並把內容裡的暫存網址換成最終網址。上傳中再呼叫會拋錯 |\n| `hasPending` | `ComputedRef<boolean>`；是否還有尚未上傳的暫存圖片 |\n\n## 運作方式\n\n### 工具列\n\n| 群組 | 按鈕 |\n| :--- | :--- |\n| 段落格式 | 標題 1、標題 2、標題 3、段落 |\n| 文字樣式 | 粗體、斜體、刪除線、行內代碼 |\n| 區塊 | 項目清單、編號清單、引言、程式碼區塊、分隔線 |\n| 插入 | 連結、圖片、貼上 HTML |\n| 歷程 | 復原、重做 |\n\n工具列固定在編輯區頂端，捲動時不離開。介面文案內建繁體中文，沒有接 i18n。\n\n來源：1. [RichTextEditor.vue][]\n\n### 貼上與鍵盤\n\n1. 貼上圖片檔且有上傳函式時，圖片以暫存方式插入。\n2. 貼上的純文字看起來含 HTML 標籤時，先淨化再插入：移除腳本、樣式與多餘屬性，只保留文章常用標籤。\n3. 「貼上 HTML」按鈕讀取剪貼簿文字並淨化後插入；瀏覽器拒絕存取或剪貼簿為空時，狀態列顯示錯誤 4 秒。\n4. 在清單內按 Tab 會調整清單層級；在程式碼區塊內插入兩個半形空白；其他地方插入一個全形空白，Shift＋Tab 刪除它。\n5. 連結在編輯區內點擊不會開啟，方便編輯文字。\n\n來源：1. [RichTextEditor.vue][]　2. [paste-sanitize.ts][]　3. [tab-indent.ts][]\n\n### 圖片暫存與上傳\n\n1. 有上傳函式時，貼上、拖放或從圖片面板選擇的圖片不會立刻上傳，而是以本機暫存網址插入，並以虛線外框標示。\n2. 狀態列顯示待上傳的張數。\n3. 儲存前使用端呼叫 `flush()`：已從內容刪除的暫存圖片直接釋放，其餘逐張上傳並換成最終網址，最後更新綁定的 HTML。\n4. 上傳失敗時狀態列顯示錯誤，`flush()` 拋出帶原始錯誤原因的例外。\n5. 沒有上傳函式時，圖片面板只提供貼上圖片網址，貼上或拖放的圖片檔交給編輯器預設處理。\n6. 選取圖片後，拖曳右下角的把手可調整寬度。\n7. 元件卸載時釋放所有暫存網址並銷毀編輯器。\n\n來源：1. [RichTextEditor.vue][]　2. [resizable-image.ts][]　3. [ResizableImageView.vue][]\n\n### 各主題外框\n\n| 主題 | 外框 |\n| :--- | :--- |\n| aqua | 大圓角、半透明底加背景模糊與柔和陰影 |\n| scifi | 直角、淡角色色框線與光暈，等寬字體 |\n| cupertino | 14px 圓角、淺色容器底與較深陰影 |\n| material | 12px 圓角、表面底色與輕陰影 |\n\n來源：1. [RichTextEditor.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| RichTextEditor.vue | [app/components/Camelot/RichTextEditor.vue](../../../../app/components/Camelot/RichTextEditor.vue) |\n| paste-sanitize.ts | [app/components/Camelot/Internal/editor/paste-sanitize.ts](../../../../app/components/Camelot/Internal/editor/paste-sanitize.ts) |\n| tab-indent.ts | [app/components/Camelot/Internal/editor/tab-indent.ts](../../../../app/components/Camelot/Internal/editor/tab-indent.ts) |\n| resizable-image.ts | [app/components/Camelot/Internal/editor/resizable-image.ts](../../../../app/components/Camelot/Internal/editor/resizable-image.ts) |\n| ResizableImageView.vue | [app/components/Camelot/Internal/editor/ResizableImageView.vue](../../../../app/components/Camelot/Internal/editor/ResizableImageView.vue) |\n\n[RichTextEditor.vue]: #references\n[paste-sanitize.ts]: #references\n[tab-indent.ts]: #references\n[resizable-image.ts]: #references\n[ResizableImageView.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"RichTextEditor","summary":"`CamelotRichTextEditor` 是以 TipTap 驅動、依主題換外觀的所見即所得編輯器，以 HTML 字串雙向綁定內容。內建標題、清單、引言、程式碼、連結、圖片等工具列，會把貼上的雜亂 HTML 淨化成乾淨的文章格式；圖片可先暫存在本機、等到儲存前再透過使用端提供的上傳函式一次上傳。整體設計見 [RichTextEditor 與 ImageDropzone](../richtext-editor-image-dropzone.md)。"},"features/components/RippleEffect.md":{"md":"# RippleEffect\n\n## Summary\n\n`CamelotRippleEffect` 是包住任意內容的容器，指標按下時從按下的位置擴散一圈水波紋，650 毫秒後自動移除。Material 按鈕、RippleTabs、NumberCounter 的加減按鈕都用它提供點擊回饋。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `rippleColor` | `string` | — | 水波紋顏色，可為任何 CSS 色值；未指定時沿用全域主題 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 要套用水波紋效果的內容 |\n\n## 運作方式\n\n### 水波紋\n\n1. 指標按下時，當場量測一次容器大小，不做常駐追蹤；同一頁可能有數十個實例，常駐追蹤會掛上大量捲動與縮放監聽。\n2. 水波紋直徑為容器對角線的兩倍，保證從任一點擴散都能蓋滿容器。\n3. 水波紋以按下點為圓心，在 600 毫秒內從 0 放大並淡出。\n4. 容器裁切溢出，水波紋不接收指標事件，不影響內容的點擊。\n\n來源：1. [RippleEffect.vue][]\n\n### 顏色\n\n`rippleColor` 可以是 hex、rgb 函式或 CSS 變數等任何色值，由模板直接綁到容器的漣漪色 CSS 變數，掛載時就生效。\n\n沒指定時不覆寫變數，沿用全域色彩方案的漣漪色。\n\n來源：1. [RippleEffect.vue][]　2. [useCustomColorScheme.ts][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| RippleEffect.vue | [app/components/Camelot/RippleEffect.vue](../../../../app/components/Camelot/RippleEffect.vue) |\n| useCustomColorScheme.ts | [app/composables/useCustomColorScheme.ts](../../../../app/composables/useCustomColorScheme.ts) |\n\n[RippleEffect.vue]: #references\n[useCustomColorScheme.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"RippleEffect","summary":"`CamelotRippleEffect` 是包住任意內容的容器，指標按下時從按下的位置擴散一圈水波紋，650 毫秒後自動移除。Material 按鈕、RippleTabs、NumberCounter 的加減按鈕都用它提供點擊回饋。"},"features/components/RippleTabs.md":{"md":"# RippleTabs\n\n## Summary\n\n`CamelotRippleTabs` 是可水平捲動的膠囊式分頁列：每個分頁點擊時有漣漪效果，選中的分頁以色彩角色的 container 色階標示，並自動捲到分頁列中央。資料可以是字串陣列或物件陣列，也能用預設 slot 完全自訂分頁外觀。泛型元件，資料型別由 `data` 推得。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `data` | `T[]` | — | 分頁資料陣列 |\n| `displayKey` | `string` | — | 項目為物件時用來顯示的欄位鍵 |\n| `modelValue` | `number` | — | 目前選中的索引 |\n| `scrollSmooth` | `boolean` | `true` | 選中時是否平滑捲動 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色，選中態使用它的 container 色階 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `update:modelValue` | `value?: number` | 選中索引變更時觸發 |\n| `changedWithClick` | `value: number` | 由點擊造成選中變更時觸發 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `number` | 目前選中的索引 |\n\n## Slots\n| Slot
