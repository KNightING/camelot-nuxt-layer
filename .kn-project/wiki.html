初始為 `false`，呼叫 `load` 後變 `true` |\n| `isReady` | `Ref<boolean>` | 是否載入完成 |\n| `isError` | `Ref<boolean>` | 是否載入失敗 |\n| `load` | `() => void` | 重設狀態並開始載入 |\n| `image` | `Ref<HTMLImageElement \\| null>` | 載入完成後的圖片元素 |\n| `isLandscapeImage` | `ComputedRef<boolean>` | 圖片寬大於高時為 `true`；尚未載入時為 `false` |\n\n來源：1. [useLazyImage.ts][]\n\n## 用法\n\n```ts\nconst { isReady, isError, image, load } = useLazyImage(() => user.avatarUrl)\nload()\n```\n\n## 運作方式\n\n1. `load` 先把 `isLoading`、`isPending` 設為 `true`，`isError`、`isReady` 設為 `false`。\n2. 網址為空時清空 `image`、標記 `isError`，並結束載入中與等待中。\n3. 網址有值時清空 `image`，建立新的 Image 並設定網址。\n4. 載入成功：`isReady` 為 `true`，存入 `image`，結束載入中與等待中。\n5. 載入失敗：`isError` 為 `true`，結束載入中與等待中。\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useLazyImage.ts | [app/composables/useLazyImage.ts](../../../../app/composables/useLazyImage.ts) |\n\n[useLazyImage.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useLazyImage","summary":"useLazyImage 以程式建立 Image 物件預載入圖片，提供載入中、完成、失敗等響應式狀態，以及載入完成後的圖片元素與是否為橫向圖。預設不自動載入，呼叫 load 才開始；只能在瀏覽器端使用。"},"features/composables/useLoading.md":{"md":"# useLoading\n\n## Summary\n\nuseLoading 是以標籤為單位的全域載入狀態管理：開啟任一標籤即進入載入中，全部關閉才結束，並可為每個標籤附上提示文字。同檔另匯出 useLoadingFn、useDebounceLoadingFn、useThrottleLoadingFn 與 running，把非同步函式包成自動開關載入的版本。狀態是模組層級單例，全站共用，由全域 Loading 元件顯示。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useLoading: () => {\n  open: (tag: string, text?: string) => LoadingCloseable\n  close: (tag?: string) => void\n  setText: (tag: string, text: string) => void\n  text: ComputedRef<string>\n  isOpening: ComputedRef<boolean>\n  isOpen: (tag: string) => boolean\n  run: <R = void>(tag, fn, errorFn?, pending?) => Promise<R | undefined>\n  watch: (tag, refs: Ref<boolean> | Ref<boolean>[], options?) => void\n}\n\nconst useLoadingFn: <T, P = void>(\n  tag: string,\n  fn: (params?: P) => Promise<T>,\n  errorFn?: ErrorFn,\n  pending?: Ref<boolean>,\n) => (params?: P) => Promise<T | undefined>\n\nconst useDebounceLoadingFn: <T, P = void>(\n  tag, fn, errorFn?, pending?,\n  ms?: MaybeRefOrGetter<number>,\n  options?: DebounceFilterOptions,\n) => …\n\nconst useThrottleLoadingFn: <T, P = void>(\n  tag, fn, errorFn?, pending?,\n  ms?: MaybeRefOrGetter<number>,\n  trailing?: boolean,\n  leading?: boolean,\n  rejectOnCancel?: boolean,\n) => …\n\nconst running: <R = void>(\n  fn: () => Promise<R | undefined>,\n  errorFn?: ErrorFn,\n  finallyFn?: VoidFunction,\n  pending?: Ref<boolean>,\n) => Promise<R | undefined>\n\ntype ErrorFn = (ex: unknown) => Promise<void> | void\ntype LoadingCloseable = () => void\n```\n\n### useLoading 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `open` | `(tag, text?) => LoadingCloseable` | 開啟標籤，回傳關閉該標籤的函式；`text` 為提示文字 |\n| `close` | `(tag?) => void` | 關閉標籤並清掉它的文字；不帶標籤時清空全部 |\n| `setText` | `(tag, text) => void` | 更新標籤的提示文字，只對開著的標籤生效 |\n| `text` | `ComputedRef<string>` | 目前顯示的提示文字，取最後開啟且有文字的標籤 |\n| `isOpening` | `ComputedRef<boolean>` | 是否有任何標籤開著 |\n| `isOpen` | `(tag) => boolean` | 指定標籤是否開著 |\n| `run` | `(tag, fn, errorFn?, pending?) => Promise` | 執行期間開啟標籤，結束後關閉；委派給 `running` |\n| `watch` | `(tag, refs, options?) => void` | 監聽 boolean ref 自動開關標籤，`immediate` 預設 `true` |\n\n### 包裝函式參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `tag` | `string` | 必填 | 載入標籤 |\n| `fn` | `(params?: P) => Promise<T>` | 必填 | 要包裝的非同步函式 |\n| `errorFn` | `ErrorFn` | — | 錯誤處理回呼 |\n| `pending` | `Ref<boolean>` | 內部建立 | 反映執行中狀態的 ref |\n| `ms` | `MaybeRefOrGetter<number>` | — | debounce、throttle 版的間隔毫秒 |\n| `options` | `DebounceFilterOptions` | — | debounce 版選項 |\n| `trailing`、`leading`、`rejectOnCancel` | `boolean` | — | throttle 版選項，原樣傳給 VueUse |\n\n來源：1. [useLoading.ts][]\n\n## 用法\n\n```ts\nconst { isOpening, run, watch } = useLoading()\n\n// 直接執行\nawait run('save', async () => api.save())\n\n// 包裝函式\nconst submit = useLoadingFn('submit', async payload => api.post(payload))\nawait submit(data)\n\n// 監聽外部 ref\nwatch('fetching', isFetching)\n```\n\n## 提示文字與分階段\n\n文字由狀態驅動而非 prop。[Loading](../components/Loading.md) 是全域單例，文字必須跟著「哪一次載入」走，不能寫死在掛載點。\n\n```ts\nconst { open, setText } = useLoading()\nconst tag = 'sync-orders'\n\nconst close = open(tag, '正在連線…')\ntry {\n  await connect()\n  setText(tag, '下載資料中…')\n  await download()\n  setText(tag, '整理結果…')\n  await transform()\n}\nfinally {\n  close()\n}\n```\n\n| 規則 | 說明 |\n| --- | --- |\n| 一次載入開一次 | 同一個標籤從頭到尾只開一次，中途只換文字；重開會讓指示器閃爍重來 |\n| 只改開著的標籤 | 已關閉的標籤若還能寫入，文字會殘留到下一次開啟 |\n| 關閉即清文字 | 關閉標籤時一併清掉它的文字，不需手動重設 |\n| 沒有文字 | Loading 不渲染文字段落，版面不會多出空位 |\n| 不並行同一標籤 | 關閉會移除該標籤的所有進行中項目，先結束的那次會把後開的一起關掉；並行時用不同標籤 |\n\n## 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| 單例 | 狀態在模組層級，所有呼叫端共用同一組標籤 |\n| `run` 不帶文字 | `run` 與包裝函式開啟標籤時不附提示文字，需要時另呼叫 `setText` |\n| 錯誤會被吞掉 | `running` 捕捉所有例外交給 `errorFn`；沒給 `errorFn` 時錯誤被靜默忽略，回傳 `undefined` |\n| 結束順序 | `running` 在 finally 先執行 `finallyFn`，再把 `pending` 設回 `false` |\n| 監聽陣列 | `watch` 傳陣列時忽略傳入的標籤，改用字面字串 `tag:0`、`tag:1`… 作標籤，不同呼叫端會撞名 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useLoading.ts | [app/composables/useLoading.ts](../../../../app/composables/useLoading.ts) |\n\n[useLoading.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useLoading","summary":"useLoading 是以標籤為單位的全域載入狀態管理：開啟任一標籤即進入載入中，全部關閉才結束，並可為每個標籤附上提示文字。同檔另匯出 useLoadingFn、useDebounceLoadingFn、useThrottleLoadingFn 與 running，把非同步函式包成自動開關載入的版本。狀態是模組層級單例，全站共用，由全域 Loading 元件顯示。"},"features/composables/useLocalStorageProxy.md":{"md":"# useLocalStorageProxy\n\n## Summary\n\nuseLocalStorageProxy 以 VueUse 的 useLocalStorage 為底，建立一個 localStorage 代理物件：用 value 讀寫、用 del 刪除，也可透過 storage 取得底層 ref。代理類別 LocalStorageProxy 不匯出，只能透過此函式建立。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useLocalStorageProxy: <T>(\n  key: string,\n  initialValue: MaybeRefOrGetter<T>,\n  options?: UseStorageOptions<T>,\n) => LocalStorageProxy<T>\n```\n\n### 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `key` | `string` | 必填 | localStorage 鍵名 |\n| `initialValue` | `MaybeRefOrGetter<T>` | 必填 | 初始值 |\n| `options` | `UseStorageOptions<T>` | — | 原樣傳給 `useLocalStorage` |\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `storage` | `RemovableRef<T>` | 底層 ref，唯讀 getter |\n| `value` | `T` | 讀寫存取值，等同 `storage.value` |\n| `del` | `() => void` | 把值設為 `null`，由 VueUse 移除該鍵 |\n\n來源：1. [useLocalStorageProxy.ts][]\n\n## 用法\n\n```ts\nconst token = useLocalStorageProxy('token', '')\ntoken.value = 'abc'\nconsole.log(token.value)\ntoken.del()\n```\n\n## 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| 刪除後的值 | `del` 之後 `value` 為 `null`，不在 `T` 的型別範圍內，讀取端要自行處理 |\n| 同類工具 | sessionStorage 用 [sessionStorage 代理](./useSessionStorageProxy.md)，非同步儲存用 [useStorageProxy](./useStorageProxy.md) |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useLocalStorageProxy.ts | [app/composables/useLocalStorageProxy.ts](../../../../app/composables/useLocalStorageProxy.ts) |\n\n[useLocalStorageProxy.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useLocalStorageProxy","summary":"useLocalStorageProxy 以 VueUse 的 useLocalStorage 為底，建立一個 localStorage 代理物件：用 value 讀寫、用 del 刪除，也可透過 storage 取得底層 ref。代理類別 LocalStorageProxy 不匯出，只能透過此函式建立。"},"features/composables/useLocale.md":{"md":"# useLocale\n\n## Summary\n\nuseLocale 把輸入的語系字串標準化，衍生出 BCP 47、CLDR、l10n 三種語言標籤。輸入可為 zh-TW 這類 BCP 47 格式，或 zh-Hant-TW、zh_Hant_TW 這類帶 script 的格式；三個結果都是 computed，輸入是 ref 或 getter 時會跟著變。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useLocale: (\n  locale: MaybeRefOrGetter<string | undefined>,\n) => {\n  bcp47: ComputedRef<string | undefined>\n  cldr: ComputedRef<string | undefined>\n  l10n: ComputedRef<string | undefined>\n}\n```\n\n### 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `locale` | `MaybeRefOrGetter<string \\| undefined>` | 必填 | 原始語系字串，連字號或底線分隔皆可 |\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `bcp47` | `ComputedRef<string \\| undefined>` | BCP 47 格式，如 `en-US`、`zh-TW`；由 CLDR 結果或標準化值移除 script 子標籤而得 |\n| `cldr` | `ComputedRef<string \\| undefined>` | CLDR 格式，如 `zh-Hant-TW`；不在對照表內且未自帶 script 時為 `undefined` |\n| `l10n` | `ComputedRef<string \\| undefined>` | 優先 `cldr`，其次 `bcp47`，最後原始字串 |\n\n來源：1. [useLocale.ts][]\n\n## 用法\n\n```ts\nconst { bcp47, cldr, l10n } = useLocale(() => 'zh-CN')\n// bcp47.value === 'zh-CN'\n// cldr.value  === 'zh-Hans-CN'\n// l10n.value  === 'zh-Hans-CN'\n```\n\n## 運作方式\n\n1. 底線換成連字號，逐段標準化大小寫：語言碼小寫、script 首字大寫、region 大寫。\n2. 標準化後若已帶 script 子標籤，直接作為 CLDR 結果。\n3. 否則查對照表補上 script；查不到時 CLDR 為 `undefined`。\n4. BCP 47 取 CLDR 結果或標準化值，移除 script 子標籤。\n\n| 規則 | 說明 |\n| --- | --- |\n| script 子標籤 | 4 個英文字母，如 `Hant`、`Latn` |\n| region 子標籤 | 2 個英文字母或 3 個數字，如 `TW`、`001` |\n| 對照表涵蓋 | 中文、塞爾維亞文、烏茲別克文、亞塞拜然文、哈薩克文、蒙古文、庫德文、旁遮普文、信德文、塔吉克文、韃靼文 |\n| 空輸入 | 三個結果都是 `undefined` |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useLocale.ts | [app/composables/useLocale.ts](../../../../app/composables/useLocale.ts) |\n\n[useLocale.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useLocale","summary":"useLocale 把輸入的語系字串標準化，衍生出 BCP 47、CLDR、l10n 三種語言標籤。輸入可為 zh-TW 這類 BCP 47 格式，或 zh-Hant-TW、zh_Hant_TW 這類帶 script 的格式；三個結果都是 computed，輸入是 ref 或 getter 時會跟著變。"},"features/composables/useMaterial3ColorScheme.md":{"md":"# M3 色彩配置\n\n## Summary\n\nuseMaterial3ColorScheme 管理 Material 3 的淺色與深色色彩配置，依目前色彩模式選出採用中的一組，寫進目標元素的 --cml-c-m3-* CSS 變數，值為 r,g,b 三元組。未傳目標元素時改走 useGlobalMaterial3ColorScheme，只更新全站共用的配置 ref，不寫任何 CSS 變數。同檔匯出預設色票與色鍵清單。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useMaterial3ColorScheme: (\n  target?: MaybeElementRef,\n  config?: Material3ColorSchemeConfig,\n) => {\n  mode, lightColorScheme, darkColorScheme, usedColorScheme,\n}\n\nconst useGlobalMaterial3ColorScheme: (\n  config?: Material3ColorSchemeConfig,\n) => { mode, lightColorScheme, darkColorScheme, usedColorScheme }\n\ntype Material3ColorSchemeConfig = {\n  lightColorScheme?: Material3ColorSchemePartial\n  darkColorScheme?: Material3ColorSchemePartial\n  editMode?: boolean\n}\n\nexport type Material3ColorScheme = { /* primary、onPrimary、surface… 完整 M3 色票 */ }\nexport type Material3ColorSchemePartial = Partial<Material3ColorScheme>\n```\n\n### 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `target` | `MaybeElementRef` | — | 寫入 CSS 變數的元素；未傳時改走全域版本 |\n| `config.lightColorScheme` | `Material3ColorSchemePartial` | 全域淺色配置 | 淺色模式配置 |\n| `config.darkColorScheme` | `Material3ColorSchemePartial` | 全域深色配置 | 深色模式配置 |\n| `config.editMode` | `boolean` | 視為 `true` | 明確為 `false` 時不寫 CSS 變數；只在有 `target` 時有作用 |\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `mode` | 色彩模式的可寫 ref | 來自 useCamelotColorMode 的 `store` |\n| `lightColorScheme` | `Ref<Material3ColorSchemePartial>` | 淺色配置；全域版本回傳共用 ref |\n| `darkColorScheme` | `Ref<Material3ColorSchemePartial>` | 深色配置；全域版本回傳共用 ref |\n| `usedColorScheme` | `ComputedRef<Material3ColorSchemePartial>` | 依模式採用的配置；`auto` 時看系統偏好 |\n\n### 匯出常數\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `defaultColorScheme` | `Material3ColorScheme` | 預設淺色 M3 色票 |\n| `defaultDarkColorScheme` | `Material3ColorScheme` | 預設深色 M3 色票 |\n| `Material3ColorSchemeKeys` | `(keyof Material3ColorScheme)[]` | 所有 M3 色鍵名 |\n\n來源：1. [useMaterial3ColorScheme.ts][]　2. [useColorSchemeCssVars.ts][]\n\n## 用法\n\n```ts\n// 更新全站共用配置（不寫 CSS 變數）\nuseMaterial3ColorScheme(undefined, {\n  lightColorScheme: { primary: '#6750a4' },\n  darkColorScheme: { primary: '#d0bcff' },\n})\n\n// 套用到特定元素\nconst el = ref<HTMLElement>()\nuseMaterial3ColorScheme(el, { lightColorScheme: { primary: '#005ac1' } })\n```\n\nMaterial3Provider 元件在掛載後以自己的容器為目標呼叫它，把 props 的淺深色配置套用到容器內。\n\n來源：1. [Material3Provider.vue][]\n\n## 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| 寫入時機 | 有目標元素時，以 immediate 監聽採用中的配置與目標元素，任一變動就重寫 |\n| 寫入方式 | 委派給 `applyMaterial3CssVars`，hex 轉成 `r,g,b` 三元組，無法解析時寫入原值 |\n| 變數命名 | `--cml-c-m3-` 加上色鍵的 kebab-case |\n| 與自訂配色的差異 | useCustomColorScheme 寫原始色值，兩者各用一支寫入函式，只共用鍵名轉換快取 |\n| 初始配置 | 有目標元素時，淺深色各取 `config` 值，沒有就取當下的全域值 |\n| 深淺色來源 | 共用 useCamelotColorMode，不各自建立 useColorMode |\n| 全域版本 | 傳入的配置直接取代模組層級的共用 ref，整站共用 |\n\n## 相關頁面\n\n- [useColorSchemeCssVars](./useColorSchemeCssVars.md)：CSS 變數單向寫入器。\n- [useCamelotColorMode](./useCamelotColorMode.md)：共用色彩模式。\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useMaterial3ColorScheme.ts | [app/composables/useMaterial3ColorScheme.ts](../../../../app/composables/useMaterial3ColorScheme.ts) |\n| useColorSchemeCssVars.ts | [app/composables/useColorSchemeCssVars.ts](../../../../app/composables/useColorSchemeCssVars.ts) |\n| Material3Provider.vue | [app/components/Camelot/Material3Provider.vue](../../../../app/components/Camelot/Material3Provider.vue) |\n\n[useMaterial3ColorScheme.ts]: #references\n[useColorSchemeCssVars.ts]: #references\n[Material3Provider.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"M3 色彩配置","summary":"useMaterial3ColorScheme 管理 Material 3 的淺色與深色色彩配置，依目前色彩模式選出採用中的一組，寫進目標元素的 --cml-c-m3-* CSS 變數，值為 r,g,b 三元組。未傳目標元素時改走 useGlobalMaterial3ColorScheme，只更新全站共用的配置 ref，不寫任何 CSS 變數。同檔匯出預設色票與色鍵清單。"},"features/composables/useNumberThousandsSeparators.md":{"md":"# 千分位格式化\n\n## Summary\n\nuseNumberThousandsSeparator（檔名為複數 useNumberThousandsSeparators）提供 format 方法，把數字轉成帶千分位分隔符號的字串。實作直接呼叫 toLocaleString，分隔符號與小數處理跟著執行環境的預設語系，因此只適合在瀏覽器端使用。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useNumberThousandsSeparator: () => {\n  format: (value: number | bigint) => string\n}\n```\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `format` | `(value: number \\| bigint) => string` | 回傳 `value.toLocaleString()` 的結果 |\n\n來源：1. [useNumberThousandsSeparators.ts][]\n\n## 用法\n\n```ts\nconst { format } = useNumberThousandsSeparator()\nformat(1234567) // '1,234,567'（預設語系為 en、zh-TW 時）\n```\n\n## 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| 語系 | 不指定語系，跟著執行環境；伺服端與瀏覽器語系不同時輸出會不一致 |\n| 小數 | 依 `toLocaleString` 預設，最多保留 3 位小數 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useNumberThousandsSeparators.ts | [app/composables/useNumberThousandsSeparators.ts](../../../../app/composables/useNumberThousandsSeparators.ts) |\n\n[useNumberThousandsSeparators.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"千分位格式化","summary":"useNumberThousandsSeparator（檔名為複數 useNumberThousandsSeparators）提供 format 方法，把數字轉成帶千分位分隔符號的字串。實作直接呼叫 toLocaleString，分隔符號與小數處理跟著執行環境的預設語系，因此只適合在瀏覽器端使用。"},"features/composables/useObject.md":{"md":"# useObject\n\n## Summary\n\nuseObject 提供一組物件工具：diff 遞迴比較新舊物件並只回傳有差異的欄位，用於 RESTful PATCH 差份更新；deepClone 深拷貝物件、陣列、Date、Map 與 Set；另有 isDate、isUndefined、isNotUndefined 判斷函式。全部是純函式，不建立響應式狀態。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useObject: () => {\n  diff: <T>(oldObj: T, newObj: T) => PartialRecursive<T>\n  isDate: (val: any) => val is Date\n  deepClone: <T>(source: T) => T\n  isUndefined: (obj: any) => boolean\n  isNotUndefined: (obj: any) => boolean\n}\n\nexport type PartialRecursive<T> = {\n  [P in keyof T]?: T[P] extends Array<infer U>\n    ? Array<PartialRecursive<U>>\n    : T[P] extends object\n      ? PartialRecursive<T[P]>\n      : T[P];\n}\n```\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `diff` | `<T>(oldObj, newObj) => PartialRecursive<T>` | 回傳只含差異欄位的部分物件，巢狀物件也只留差異 |\n| `isDate` | `(val) => val is Date` | 以 `instanceof Date` 判斷 |\n| `deepClone` | `<T>(source) => T` | 深拷貝物件、陣列、`Date`、Map、Set，其餘值原樣回傳 |\n| `isUndefined` | `(obj) => boolean` | 是否為 `undefined` |\n| `isNotUndefined` | `(obj) => boolean` | `isUndefined` 的反向 |\n\n來源：1. [useObject.ts][]\n\n## 用法\n\n```ts\nconst { diff, deepClone } = useObject()\n\nconst patch = diff(oldUser, newUser) // 只含變更欄位\nconst copy = deepClone(oldUser)\n```\n\n## 規則\n\n### diff\n\n| 情境 | 結果 |\n| --- | --- |\n| 只看新物件的鍵 | 舊物件有、新物件沒有的鍵不列入；這類刪除在 RESTful 上改用 DELETE |\n| 舊值為 `undefined` | 直接採用新值 |\n| 兩邊都是陣列 | 長度不同或任一元素有差異時，整組陣列換成新值 |\n| 兩邊都是 `Date` | 以時間戳比較，不同時採用新值 |\n| 新值是物件、舊值也是物件 | 遞迴比較，只留有差異的子欄位 |\n| 其他值 | 以 `!==` 比較 |\n| 舊值為 `null` 或原始值、新值為物件 | 視為整筆變更，採用新值 |\n\n### deepClone\n\n| 情境 | 結果 |\n| --- | --- |\n| `null`、原始值 | 原樣回傳 |\n| `Date` | 複製成新的 `Date` |\n| 陣列、一般物件 | 逐項遞迴複製 |\n| Map、Set | 建立新的 Map、Set，逐項深拷貝鍵與值 |\n| 無原型的物件 | 拋出 `Unable to copy obj! Its type isn't supported.` |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useObject.ts | [app/composables/useObject.ts](../../../../app/composables/useObject.ts) |\n\n[useObject.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useObject","summary":"useObject 提供一組物件工具：diff 遞迴比較新舊物件並只回傳有差異的欄位，用於 RESTful PATCH 差份更新；deepClone 深拷貝物件、陣列、Date、Map 與 Set；另有 isDate、isUndefined、isNotUndefined 判斷函式。全部是純函式，不建立響應式狀態。"},"features/composables/usePiniaClear.md":{"md":"# Pinia 重置與釋放\n\n## Summary\n\nusePiniaClear 檔案匯出 usePiniaReset 與 usePiniaDispose：讀取目前 active Pinia 已建立的所有 store，產生以 store id 為鍵的方法表，逐一或以 all 一次呼叫 $reset 或 $dispose。常用於登出時清空全站狀態。\n\n## 介面\n\n### 簽章\n\n```ts\nconst usePiniaReset: () => Record<string | 'all', () => void>\nconst usePiniaDispose: () => Record<string | 'all', () => void>\n```\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `usePiniaReset()` | `Record<string \\| 'all', () => void>` | 每個 store id 對應一個呼叫 `$reset` 的函式；`all` 重置全部 |\n| `usePiniaDispose()` | `Record<string \\| 'all', () => void>` | 每個 store id 對應一個呼叫 `$dispose` 的函式；`all` 釋放全部 |\n\n來源：1. [usePiniaClear.ts][]\n\n## 用法\n\n```ts\nconst reset = usePiniaReset()\nreset.all() // 重置所有 store\nreset.user() // 重置 id 為 user 的 store\n\nconst dispose = usePiniaDispose()\ndispose.all()\n```\n\n## 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| store 來源 | 以 `getActivePinia` 取得實例，讀取內部的 `_s` 表 |\n| 沒有 Pinia | 拋出 `There is no stores` |\n| 具名方法的範圍 | 只含呼叫當下已建立的 store；`all` 執行時才遍歷，會涵蓋之後建立的 store |\n| `all` 的錯誤 | 每個 store 以 try／catch 包住，錯誤靜默忽略 |\n| 具名方法的錯誤 | 不捕捉；setup store 未實作 `$reset`，開發模式下直接呼叫會拋錯 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| usePiniaClear.ts | [app/composables/usePiniaClear.ts](../../../../app/composables/usePiniaClear.ts) |\n\n[usePiniaClear.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Pinia 重置與釋放","summary":"usePiniaClear 檔案匯出 usePiniaReset 與 usePiniaDispose：讀取目前 active Pinia 已建立的所有 store，產生以 store id 為鍵的方法表，逐一或以 all 一次呼叫 $reset 或 $dispose。常用於登出時清空全站狀態。"},"features/composables/useRandom.md":{"md":"# useRandom\n\n## Summary\n\nuseRandom 回傳介於 min 與 max 之間、兩端都包含的隨機整數，以 Math.random 計算，不適合用在需要密碼學安全的場合。它是純函式，每次呼叫產生一個新值。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useRandom: (min?: number, max?: number) => number\n```\n\n### 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `min` | `number` | `0` | 最小值，包含 |\n| `max` | `number` | `Number.MAX_VALUE` | 最大值，包含 |\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| 回傳值 | `number` | `Math.floor(Math.random() * (max - min + 1)) + min` |\n\n來源：1. [useRandom.ts][]\n\n## 用法\n\n```ts\nuseRandom(1, 6) // 1 到 6 之間的隨機整數\n```\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useRandom.ts | [app/composables/useRandom.ts](../../../../app/composables/useRandom.ts) |\n\n[useRandom.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useRandom","summary":"useRandom 回傳介於 min 與 max 之間、兩端都包含的隨機整數，以 Math.random 計算，不適合用在需要密碼學安全的場合。它是純函式，每次呼叫產生一個新值。"},"features/composables/useRandomCatImg.md":{"md":"# useRandomCatImg\n\n## Summary\n\nuseRandomCatImg 產生 cataas.com 的隨機貓咪圖片網址，回傳響應式網址與換一張的方法，常用於範例頁與佔位圖。它只組網址，不發送任何請求；網址帶隨機查詢字串，讓瀏覽器每次都重新取圖。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useRandomCatImg: () => {\n  url: Ref<string>\n  newCat: () => void\n}\n```\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `url` | `Ref<string>` | 目前的貓咪圖片網址，格式見下方 |\n| `newCat` | `() => void` | 產生新的隨機碼並更新 `url` |\n\n```text\nhttps://cataas.com/cat?<隨機碼>\n```\n\n來源：1. [useRandomCatImg.ts][]\n\n## 用法\n\n```vue\n<script setup lang=\"ts\">\nconst { url, newCat } = useRandomCatImg()\n<\/script>\n\n<template>\n  <img :src=\"url\">\n  <button @click=\"newCat\">換一隻<\/button>\n<\/template>\n```\n\n## 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| 初始值 | 建立時自動呼叫一次 `newCat` |\n| 隨機碼 | `Math.random` 轉 36 進位後取第 2 到 14 位 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useRandomCatImg.ts | [app/composables/useRandomCatImg.ts](../../../../app/composables/useRandomCatImg.ts) |\n\n[useRandomCatImg.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useRandomCatImg","summary":"useRandomCatImg 產生 cataas.com 的隨機貓咪圖片網址，回傳響應式網址與換一張的方法，常用於範例頁與佔位圖。它只組網址，不發送任何請求；網址帶隨機查詢字串，讓瀏覽器每次都重新取圖。"},"features/composables/useRouteWrapper.md":{"md":"# useRouteWrapper\n\n## Summary\n\nuseRouteWrapper 針對一個固定路徑包裝 Nuxt router 的 push 與 replace，回傳 to、replace 兩個導航方法與路徑本身，讓頁面導航可以集中定義、在各處重用，並可額外合併 query、hash 等路由選項。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useRouteWrapper: (path: string) => {\n  to: (options?: RouteLocationAsRelativeGeneric | RouteLocationAsPathGeneric) => ReturnType<Router['push']>\n  replace: (options?: RouteLocationAsRelativeGeneric | RouteLocationAsPathGeneric) => ReturnType<Router['replace']>\n  path: string\n}\n```\n\n### 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `path` | `string` | 必填 | 目標路徑 |\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `to` | `(options?) => Promise` | 以 `router.push` 導向 `path`，合併傳入的路由選項 |\n| `replace` | `(options?) => Promise` | 以 `router.replace` 導向 `path`，合併傳入的路由選項 |\n| `path` | `string` | 傳入的路徑 |\n\n來源：1. [useRouteWrapper.ts][]\n\n## 用法\n\n```ts\nconst userPage = useRouteWrapper('/user')\n\nuserPage.to() // router.push({ path: '/user' })\nuserPage.to({ query: { id: '1' } }) // 合併選項\nuserPage.replace()\n```\n\n## 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| 合併順序 | 以 `{ path, ...options }` 組成目標，`options` 內的 `path` 會覆蓋固定路徑 |\n| 呼叫時機 | 建立時呼叫 `useRouter`，須在 setup 或 Nuxt 環境內建立 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useRouteWrapper.ts | [app/composables/useRouteWrapper.ts](../../../../app/composables/useRouteWrapper.ts) |\n\n[useRouteWrapper.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useRouteWrapper","summary":"useRouteWrapper 針對一個固定路徑包裝 Nuxt router 的 push 與 replace，回傳 to、replace 兩個導航方法與路徑本身，讓頁面導航可以集中定義、在各處重用，並可額外合併 query、hash 等路由選項。"},"features/composables/useScrollOnBottom.md":{"md":"# useScrollOnBottom\n\n## Summary\n\nuseScrollOnBottom 偵測指定捲動目標是否已捲到底部，容許一段像素容差，回傳響應式的 isOnBottom。目標可以是 window、document 或任一元素，預設為 window。它在元件掛載後才開始監聽，是 useInfinitePage 的底層。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useScrollOnBottom: (options?: {\n  target?: MaybeRefOrGetter<HTMLElement | SVGElement | Window | Document | null | undefined>\n  offset?: MaybeRefOrGetter<number>\n}) => {\n  isOnBottom: Ref<boolean>\n}\n```\n\n### 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `options.target` | `MaybeRefOrGetter<HTMLElement \\| SVGElement \\| Window \\| Document \\| null \\| undefined>` | `window` | 捲動監聽目標，解析規則見下表 |\n| `options.offset` | `MaybeRefOrGetter<number>` | `20` | 判定到底的容差像素 |\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `isOnBottom` | `Ref<boolean>` | 捲動位置加可視高度大於等於總高度減容差時為 `true` |\n\n來源：1. [useScrollOnBottom.ts][]\n\n## 用法\n\n```ts\nconst { isOnBottom } = useScrollOnBottom({ offset: 40 })\n```\n\n## 運作方式\n\n1. 元件掛載後才解析目標並註冊事件；掛載前 `isOnBottom` 固定為 `false`。\n2. 監聽目標的 scroll 事件，以及 window 與 visualViewport 的 resize 事件。\n3. 事件觸發時以 `requestAnimationFrame` 排程一次檢查。\n4. 註冊後不會主動檢查一次，第一次捲動或縮放前 `isOnBottom` 都是 `false`。\n\n| 目標解析 | 使用的數值 |\n| --- | --- |\n| 未傳 `target` | 視為 window |\n| 傳入但解析為 `undefined`，或為 Document | 改用 `document.scrollingElement` |\n| window | `scrollY`；可視高度取 visualViewport 高度或 `innerHeight`；總高度取整頁 `scrollHeight` |\n| 元素 | 元素自身的 `scrollTop`、`clientHeight`、`scrollHeight` |\n\n| 規則 | 說明 |\n| --- | --- |\n| 目標型別 | 是否為 window 只在掛載時判定一次，之後切換目標型別不會改變監聽方式 |\n| 目標為 `null` | 總高度當作 0，視窗縮放時 `isOnBottom` 會變成 `true` |\n\n## 相關頁面\n\n- [useInfinitePage](./useInfinitePage.md)：以到底偵測實作無限捲動。\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useScrollOnBottom.ts | [app/composables/useScrollOnBottom.ts](../../../../app/composables/useScrollOnBottom.ts) |\n\n[useScrollOnBottom.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useScrollOnBottom","summary":"useScrollOnBottom 偵測指定捲動目標是否已捲到底部，容許一段像素容差，回傳響應式的 isOnBottom。目標可以是 window、document 或任一元素，預設為 window。它在元件掛載後才開始監聽，是 useInfinitePage 的底層。"},"features/composables/useScrollParent.md":{"md":"# useScrollParent\n\n## Summary\n\nuseScrollParent 從指定元素本身開始往上找，回傳第一個內容高度超過可視高度的元素，也就是最近的捲動容器；找不到時為 null。結果是 computed，只在目標元素改變時重算，不會因為內容高度變化而更新。\n\n## 介面\n\n### 簽章\n\n```ts\nfunction useScrollParent(target?: MaybeElementRef): ComputedRef<HTMLElement | null>\n```\n\n### 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `target` | `MaybeElementRef` | — | 起始元素，以 `unrefElement` 取值 |\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| 回傳值 | `ComputedRef<HTMLElement \\| null>` | 找到的捲動容器；找不到或目標為空時為 `null` |\n\n來源：1. [useScrollParent.ts][]\n\n## 用法\n\n```ts\nconst el = ref<HTMLElement>()\nconst scrollParent = useScrollParent(el)\n```\n\n## 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| 判定條件 | 只比較 `scrollHeight` 與 `clientHeight`，不看 CSS overflow 設定 |\n| 起點 | 包含目標元素自己；目標本身可捲動時直接回傳它 |\n| 方向 | 只判斷垂直方向 |\n| 重算時機 | 目標元素改變時；內容高度變化不會觸發 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useScrollParent.ts | [app/composables/useScrollParent.ts](../../../../app/composables/useScrollParent.ts) |\n\n[useScrollParent.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useScrollParent","summary":"useScrollParent 從指定元素本身開始往上找，回傳第一個內容高度超過可視高度的元素，也就是最近的捲動容器；找不到時為 null。結果是 computed，只在目標元素改變時重算，不會因為內容高度變化而更新。"},"features/composables/useSessionStorageProxy.md":{"md":"# sessionStorage 代理\n\n## Summary\n\nuseSessionStorageProxy 以 VueUse 的 useSessionStorage 為底，建立一個 sessionStorage 代理物件：用 value 讀寫、用 del 刪除，也可透過 storage 取得底層 ref。代理類別 SessionStorageProxy 有匯出，也可直接 new 出實例。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useSessionStorageProxy: <T>(\n  key: string,\n  initialValue: MaybeRefOrGetter<T>,\n  options?: UseStorageOptions<T>,\n) => SessionStorageProxy<T>\n\nexport class SessionStorageProxy<T> { /* storage、value、del */ }\n```\n\n### 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `key` | `string` | 必填 | sessionStorage 鍵名 |\n| `initialValue` | `MaybeRefOrGetter<T>` | 必填 | 初始值 |\n| `options` | `UseStorageOptions<T>` | — | 原樣傳給 `useSessionStorage` |\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `storage` | `RemovableRef<T>` | 底層 ref，唯讀 getter |\n| `value` | `T` | 讀寫存取值，等同 `storage.value` |\n| `del` | `() => void` | 把值設為 `null`，由 VueUse 移除該鍵 |\n\n來源：1. [useSessionStorageProxy.ts][]\n\n## 用法\n\n```ts\nconst draft = useSessionStorageProxy('draft', '')\ndraft.value = 'hello'\ndraft.del()\n```\n\n## 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| 刪除後的值 | `del` 之後 `value` 為 `null`，不在 `T` 的型別範圍內，讀取端要自行處理 |\n| 同類工具 | localStorage 用 [useLocalStorageProxy](./useLocalStorageProxy.md)，非同步儲存用 [useStorageProxy](./useStorageProxy.md) |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useSessionStorageProxy.ts | [app/composables/useSessionStorageProxy.ts](../../../../app/composables/useSessionStorageProxy.ts) |\n\n[useSessionStorageProxy.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"sessionStorage 代理","summary":"useSessionStorageProxy 以 VueUse 的 useSessionStorage 為底，建立一個 sessionStorage 代理物件：用 value 讀寫、用 del 刪除，也可透過 storage 取得底層 ref。代理類別 SessionStorageProxy 有匯出，也可直接 new 出實例。"},"features/composables/useStorageProxy.md":{"md":"# useStorageProxy\n\n## Summary\n\nuseStorageProxy 以 VueUse 的 useStorageAsync 為底，建立一個可接非同步儲存後端的代理物件：用 value 讀寫、用 patch 淺層合併更新物件、用 del 刪除。未指定後端時使用 localStorage。代理類別 StorageProxy 不匯出，只能透過此函式建立。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useStorageProxy: <T>(\n  key: string,\n  initialValue: MaybeRefOrGetter<T>,\n  storageLike?: StorageLikeAsync,\n  options?: UseStorageAsyncOptions<T>,\n) => StorageProxy<T>\n```\n\n### 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `key` | `string` | 必填 | 儲存鍵名 |\n| `initialValue` | `MaybeRefOrGetter<T>` | 必填 | 初始值 |\n| `storageLike` | `StorageLikeAsync` | localStorage | 自訂儲存後端 |\n| `options` | `UseStorageAsyncOptions<T>` | — | 原樣傳給 `useStorageAsync`，如序列化、合併預設值 |\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `storage` | `RemovableRef<T>` | 底層 ref，唯讀 getter |\n| `value` | `T` | 讀寫存取值 |\n| `patch` | `(newValue: T) => void` | 以展開方式淺層合併到目前值 |\n| `del` | `() => void` | 把值設為 `null`，由 VueUse 移除該鍵 |\n\n來源：1. [useStorageProxy.ts][]\n\n## 用法\n\n```ts\nconst profile = useStorageProxy('profile', { name: '', age: 0 })\n\nprofile.value.name // 讀取\nprofile.value = { name: 'A', age: 1 } // 覆寫\nprofile.patch({ age: 2 }) // 局部合併\nprofile.del() // 刪除\n```\n\n## 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| `patch` 的型別 | 參數型別是完整的 `T`，只傳部分欄位時需自行放寬型別 |\n| 合併深度 | 只合併第一層，巢狀物件整個取代 |\n| 刪除後的值 | `del` 之後 `value` 為 `null`，讀取端要自行處理 |\n\n## 相關頁面\n\n- [useLocalStorageProxy](./useLocalStorageProxy.md)、[sessionStorage 代理](./useSessionStorageProxy.md)：同步儲存的代理。\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useStorageProxy.ts | [app/composables/useStorageProxy.ts](../../../../app/composables/useStorageProxy.ts) |\n\n[useStorageProxy.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useStorageProxy","summary":"useStorageProxy 以 VueUse 的 useStorageAsync 為底，建立一個可接非同步儲存後端的代理物件：用 value 讀寫、用 patch 淺層合併更新物件、用 del 刪除。未指定後端時使用 localStorage。代理類別 StorageProxy 不匯出，只能透過此函式建立。"},"features/composables/useValueValidation.md":{"md":"# useValueValidation\n\n## Summary\n\nuseValueValidation 依指定型別對字串值做響應式格式驗證，回傳 ComputedRef<boolean>。支援 email、手機、國際手機、純數字、市話、可含分機的市話、台灣身分證字號、台灣統一編號；空值的結果由 allowUndefined 決定。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useValueValidation: (\n  target: MaybeRef<string | undefined>,\n  options: {\n    type: 'email' | 'mobile' | 'internationalMobile' | 'number' | 'phone'\n      | 'phoneCanExtension' | 'taiwanIdNumber' | 'taiwanUniformNumber'\n    allowUndefined?: boolean\n  },\n) => ComputedRef<boolean>\n```\n\n### 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `target` | `MaybeRef<string \\| undefined>` | 必填 | 要驗證的值 |\n| `options.type` | 見簽章 | 必填 | 驗證型別 |\n| `options.allowUndefined` | `boolean` | `false` | 值為空字串或 `undefined` 時直接回傳的結果 |\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| 回傳值 | `ComputedRef<boolean>` | 值是否通過驗證 |\n\n來源：1. [useValueValidation.ts][]\n\n## 用法\n\n```ts\nconst email = ref('')\nconst isValidEmail = useValueValidation(email, { type: 'email' })\n\nconst id = ref('')\nconst isValidId = useValueValidation(id, { type: 'taiwanIdNumber', allowUndefined: true })\n```\n\n## 驗證規則\n\n| type | 規則 | 備註 |\n| --- | --- | --- |\n| `email` | `/^[\\w.+-]+@([\\w-]+\\.)+[\\w-]{2,4}$/` | 見下方說明 |\n| `mobile` | `/^[0-9]+$/` | 與 `number` 相同，只檢查純數字 |\n| `internationalMobile` | `/^\\+\\d{1,3}\\d{8,9}$/` | 加號、1 到 3 碼國碼、8 到 9 碼號碼 |\n| `number` | `/^[0-9]+$/` | 純數字 |\n| `phone` | `/^0\\d{8,9}$/` | 0 開頭共 9 到 10 碼 |\n| `phoneCanExtension` | `/^0\\d{8,9}(#\\d+)?$/` | 同 `phone`，可接 `#` 加分機 |\n| `taiwanIdNumber` | 身分證檢核碼 | 見下方步驟 |\n| `taiwanUniformNumber` | 統一編號檢核碼 | 見下方步驟 |\n\nemail 的帳號可含英數、底線、點、連字號與加號，網域各段可含英數、底線與連字號，不接受反斜線。頂級網域須為 2 到 4 碼。\n\n### 台灣身分證字號\n\n1. 格式須為一個大寫字母、數字 1 或 2、再 8 碼數字。\n2. 字母依對照表轉成兩位數，十位數乘 1、個位數乘 9。\n3. 第 2 到第 9 碼依序乘 8 到 1，最後一碼乘 1。\n4. 全部加總可被 10 整除即合法。\n\n### 台灣統一編號\n\n1. 格式須為 8 碼數字。\n2. 各碼依序乘上權重 1、2、1、2、1、2、4、1。\n3. 乘積為兩位數時，十位數與個位數相加。\n4. 全部加總可被 5 整除即合法。\n5. 第 7 碼為 7 時，總和加 1 可被 5 整除也視為合法。\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useValueValidation.ts | [app/composables/useValueValidation.ts](../../../../app/composables/useValueValidation.ts) |\n\n[useValueValidation.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useValueValidation","summary":"useValueValidation 依指定型別對字串值做響應式格式驗證，回傳 ComputedRef<boolean>。支援 email、手機、國際手機、純數字、市話、可含分機的市話、台灣身分證字號、台灣統一編號；空值的結果由 allowUndefined 決定。"},"platform/api-client.md":{"md":"# API 用戶端\n\n## Summary\n\nCamelot 的 API 層（API Client）以 `useBaseApi` 為核心：一次設定 `baseURL`、標頭、攔截器與 refresh token 策略，之後每支端點各自取得一個請求物件，由呼叫端決定用 `useFetch` 系列（響應式）或 `fetch`（命令式）。建議以繼承 `BaseApi` 的應用層類別收斂設定與端點，元件只認具名方法、不碰 URL 字串。完整簽章見 useBaseApi 參考頁。\n\n## 運作方式\n\n### 組成與分工\n\n| 單元 | 角色 |\n| :--- | :--- |\n| `useBaseApi` | 工廠：綁定共用設定，回傳 `get`、`post`、`put`、`patch`、`del` |\n| `BaseApi` | 類別包裝：建構子接收共用設定，`this.api` 即工廠的結果，供應用層繼承 |\n| 請求物件 | 一次請求的多種取用方式：`useFetch`、`useBFetch`、`useLFetch`、`fetch` |\n\n這張圖回答：應用層類別的一次呼叫，經過哪幾層才變成實際請求？\n\n```json diagram id=圖1\n{\n  \"type\": \"flow\",\n  \"dir\": \"TD\",\n  \"title\": \"API 呼叫分層\",\n  \"desc\": \"應用層類別把共用設定交給工廠，每支端點回傳請求物件，由呼叫端選擇響應式或命令式取用\",\n  \"nodes\": [\n    {\"id\": \"A\", \"text\": \"應用層類別\", \"shape\": \"stadium\"},\n    {\"id\": \"B\", \"text\": \"API 工廠\"},\n    {\"id\": \"G\", \"text\": \"共用設定\", \"kind\": \"data\"},\n    {\"id\": \"C\", \"text\": \"HTTP 方法\"},\n    {\"id\": \"D\", \"text\": \"請求物件\", \"key\": true},\n    {\"id\": \"E\", \"text\": \"響應式取用\"},\n    {\"id\": \"F\", \"text\": \"命令式取用\"}\n  ],\n  \"edges\": [\n    {\"from\": \"A\", \"to\": \"B\", \"label\": \"傳入共用設定\"},\n    {\"from\": \"B\", \"to\": \"G\", \"label\": \"綁定\", \"kind\": \"async\"},\n    {\"from\": \"B\", \"to\": \"C\"},\n    {\"from\": \"C\", \"to\": \"D\", \"label\": \"一端點一方法\"},\n    {\"from\": \"D\", \"to\": \"E\", \"label\": \"隨依賴重取\"},\n    {\"from\": \"D\", \"to\": \"F\", \"label\": \"回傳 Promise\"}\n  ]\n}\n```\n\n![API 呼叫分層](api-client.圖1.svg)\n\n共用設定包含 `baseURL`、標頭、`contentType`、攔截器與 refresh token 策略。\n\n來源：1. [useBaseApi.ts][]\n\n### 建立應用層 API 類別\n\n以 `BaseApi` 為基底，建構子集中所有共用設定，每支端點一個具名 public 方法：\n\n```ts\nclass OrderApi extends BaseApi {\n  constructor() {\n    super({\n      // baseURL 可傳 computed，讓執行期設定（如 runtimeConfig）生效\n      baseURL: computed(() => useRuntimeConfig().public.apiBaseUrl),\n      contentType: ContentType.Json,\n      headers: defaultHeaders,\n      onRequests: [useBearerTokenRequest(() => useAuthStore().accessToken ?? '')],\n      autoRefreshToken: true,\n      refreshTokenHandler: async () => {\n        // 回傳 true 代表刷新成功，原請求會自動重送\n        return await refreshAccessToken()\n      },\n    })\n  }\n\n  // 回傳請求物件而非直接 .fetch()，讓呼叫端自行選擇取用方式\n  public getOrders(query?: MaybeRefOrGetter<OrderQuery>) {\n    return this.api.get<OrderListResp>(() => '/orders', { query })\n  }\n\n  public postOrder(body: MaybeRefOrGetter<CreateOrderReq>) {\n    return this.api.post<CreateOrderResp>(() => '/orders', { body })\n  }\n}\n\nexport const useOrderApi = () => new OrderApi()\n```\n\n| 要點 | 說明 |\n| :--- | :--- |\n| 方法內不呼叫 `fetch` | 回傳請求物件；頁面要響應式用 `useBFetch`，要命令式用 `fetch`，同一支端點兩種情境共用 |\n| URL 一律用 getter | URL 型別支援字串、Request、Ref 與 getter；getter 才能讓路徑中的變數參與響應式重取 |\n| `query` 與 `body` 收 `MaybeRefOrGetter` | 搭配 `useFetch` 系列時，來源變動會自動重取 |\n| 型別放在泛型參數 | 回應型別寫在方法的泛型參數上，即端點契約 |\n\nplayground 有一份可執行的同型範例。\n\n來源：1. [useBaseApi.ts][]　2. [useTestApi.ts][]\n\n### 四種取用方式\n\n| 方式 | 行為 | 適用情境 |\n| :--- | :--- | :--- |\n| `useFetch` | Nuxt `useFetch` 的原生包裝 | 需要原生回傳結構時 |\n| `useBFetch`，別名 `useFetchBetter` | 額外提供由 `status` 衍生的 `idle`、`pending`、`success` | 一般頁面載入的預設選擇 |\n| `useLFetch`，別名 `useLazyFetch` | `useBFetch` 的懶載入版：不立即送出、不 watch、不在 server 端執行，`dedupe` 為 `defer` | 由使用者操作觸發、不隨依賴自動重取 |\n| `fetch` | 以 `$fetch` 送出並回傳 Promise，可傳 `AbortSignal` 中止 | 送出表單、序列流程、需要 await 結果或中止請求 |\n\n每種方式都可傳覆寫設定 `coverOptions`，只影響該次呼叫。\n\n來源：1. [useBaseApi.ts][]\n\n### 設定的合併規則\n\n共用設定與單次設定是淺層合併，同名鍵由單次設定覆寫。\n\n| 鍵 | 合併方式 |\n| :--- | :--- |\n| 純量與物件鍵，例如 `baseURL`、`headers`、`contentType` | 單次設定整個取代共用設定 |\n| 攔截器陣列 `onRequests`、`onResponses`、`onResponseErrors` | 同樣是取代而非串接，單次傳入後共用的那組不再生效 |\n\n攔截器需要疊加時，在單次陣列中一併列出要保留的攔截器。\n\n來源：1. [useBaseApi.ts][]\n\n## 認證與 refresh token\n\n### 請求攔截器\n\n| 匯出 | 用途 |\n| :--- | :--- |\n| `useBearerTokenRequest` | 加上 Bearer 認證標頭，接受 ref 或 getter |\n| `useBasicTokenRequest` | 以帳號、密碼加上 Basic 認證標頭 |\n| `useBasicToken` | 產生 Base64 字串 |\n| `secureHeaderRequest` | 安全標頭，預設已由 `addSecureHeaderRequest` 自動掛上 |\n\n來源：1. [useBaseApi.ts][]\n\n### 自動刷新\n\n| 選項 | 說明 |\n| :--- | :--- |\n| `autoRefreshToken` | 啟用自動刷新與原請求重送 |\n| `refreshTokenHandler` | 實際刷新邏輯，回傳 `true` 代表成功 |\n| `shouldRefreshToken` | 自訂觸發條件，預設為回應狀態 401 |\n| `maxRefreshRetry` | 重試上限，預設 `1` |\n\n同一個刷新函式參考共用一把鎖：多個請求同時遇到 401 只觸發一次刷新，其餘等待同一個 Promise；不同函式互不影響。\n\n因此刷新函式應是穩定的參考，不要每次呼叫都重新建立。\n\n來源：1. [useBaseApi.ts][]\n\n### 忽略回應錯誤時的攔截器\n\n開啟 `ignoreResponseError` 後，HTTP 4xx 與 5xx 不再拋出，而是走 `onResponses`。\n\n`onResponseErrors` 只剩斷網、逾時、DNS 等傳輸層錯誤會進入。\n\n| 處理 | 放在哪組攔截器 |\n| :--- | :--- |\n| 狀態碼相關，自行判斷回應狀態 | `onResponses` |\n| 連線層錯誤 | `onResponseErrors` |\n\n自動 refresh token 在兩種模式下都可運作。\n\n來源：1. [useBaseApi.ts][]\n\n## 其他機制\n\n| 機制 | 說明 |\n| :--- | :--- |\n| `contentType` | 預設 JSON，自動帶對應的 Content-Type；上傳檔案用 multipart form data |\n| `cachePolicy` | 設為 `cache` 時透過 `useNuxtData` 取回快取；需自行設定 key，未設定則無效 |\n| `transDateKeys` | 指定回應中哪些 key 要還原為 Date；內部改寫 transform，對陣列逐項或單一物件套用 |\n| `addSecureHeaderRequest` | 預設 `true`，自動加上 nosniff 與 same-origin Referrer-Policy 兩個安全標頭 |\n\n來源：1. [useBaseApi.ts][]\n\n## 與其他系統的分工\n\n| 情境 | 交給誰 |\n| :--- | :--- |\n| 串流 | SSE 與逐行 JSON 改用 [useFetchStream](../features/composables/useFetchStream.md) 與 [useFetchJSONLinesStream](../features/composables/useFetchJSONLinesStream.md) |\n| 錯誤處理 | 可自動回復的 401 在 API 層就地刷新並重送；刷新也失敗的錯誤才交由 [錯誤處理系統](./error-handling.md) 提示 |\n| 分頁 | 清單型端點可搭配 [useInfinitePage](../features/composables/useInfinitePage.md) |\n\n## 相關頁面\n\n- [useBaseApi](../features/composables/useBaseApi.md)：完整 API 參考\n- [錯誤處理系統](./error-handling.md)：全域錯誤佇列與本頁的分工\n- [Composable 清單](../features/composables.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useBaseApi.ts | [app/composables/useBaseApi.ts](../../../app/composables/useBaseApi.ts) |\n| useTestApi.ts | [.playground/app/composables/useTestApi.ts](../../../.playground/app/composables/useTestApi.ts) |\n\n[useBaseApi.ts]: #references\n[useTestApi.ts]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"API 用戶端","summary":"Camelot 的 API 層（API Client）以 `useBaseApi` 為核心：一次設定 `baseURL`、標頭、攔截器與 refresh token 策略，之後每支端點各自取得一個請求物件，由呼叫端決定用 `useFetch` 系列（響應式）或 `fetch`（命令式）。建議以繼承 `BaseApi` 的應用層類別收斂設定與端點，元件只認具名方法、不碰 URL 字串。完整簽章見 useBaseApi 參考頁。"},"platform/architecture.md":{"md":"# 專案架構\n\n## Summary\n\nCamelot Nuxt Layer（套件名稱 `camelot-nuxt3-layer`）是以 Nuxt Layer 形式發佈的 UI 元件函式庫。消費端的 Nuxt 4 應用程式以 extends 繼承它，取得 Vue 3 元件、Composables、Nuxt 模組、伺服器外掛與 Tailwind CSS v4 主題。本頁說明 Layer 由哪些部分組成、各自提供什麼；逐一元件與 composable 的 API 見清單矩陣。\n\n## 運作方式\n\n### 專案概覽\n\n| 項目 | 說明 |\n| :--- | :--- |\n| 套件名稱 | camelot-nuxt3-layer |\n| 版本 | 以 package.json 為準 |\n| 框架 | Nuxt 4 + Vue 3 Composition API |\n| 樣式 | Tailwind CSS v4 |\n| 狀態管理 | Pinia 與 pinia-plugin-persistedstate |\n| 多語系 | @nuxtjs/i18n；語系全部由消費端註冊，細節見 [i18n 語系系統](./i18n-locales.md) |\n| 套件管理 | pnpm |\n\n來源：1. [package.json][]　2. [nuxt.config.ts][]\n\n### Layer 組成\n\n消費端 extends 這個 Layer 後，下列各部分會一起合併進它的 Nuxt 應用程式。\n\n```json diagram id=圖1\n{\n  \"type\": \"flow\",\n  \"dir\": \"TD\",\n  \"title\": \"Layer 全貌\",\n  \"desc\": \"消費端繼承 Layer 後取得的六個部分\",\n  \"nodes\": [\n    {\"id\": \"A\", \"text\": \"消費端 Nuxt App\", \"kind\": \"ext\"},\n    {\"id\": \"B\", \"text\": \"Camelot Layer\", \"key\": true},\n    {\"id\": \"C\", \"text\": \"UI 元件\"},\n    {\"id\": \"D\", \"text\": \"Composables\"},\n    {\"id\": \"E\", \"text\": \"Nuxt 模組\"},\n    {\"id\": \"F\", \"text\": \"伺服器外掛\"},\n    {\"id\": \"G\", \"text\": \"i18n 設定\"},\n    {\"id\": \"H\", \"text\": \"Tailwind 主題\"}\n  ],\n  \"edges\": [\n    {\"from\": \"A\", \"to\": \"B\", \"label\": \"extends\"},\n    {\"from\": \"B\", \"to\": \"C\"},\n    {\"from\": \"B\", \"to\": \"D\"},\n    {\"from\": \"B\", \"to\": \"E\"},\n    {\"from\": \"B\", \"to\": \"F\"},\n    {\"from\": \"B\", \"to\": \"G\"},\n    {\"from\": \"B\", \"to\": \"H\"}\n  ]\n}\n```\n\n![Layer 全貌](architecture.圖1.svg)\n\nUI 元件依用途分成五群；共用日曆核心供各日期與時間選擇器共用。\n\n```json diagram id=圖2\n{\n  \"type\": \"flow\",\n  \"dir\": \"TD\",\n  \"title\": \"UI 元件分群\",\n  \"desc\": \"Layer 的 UI 元件依用途分成五群\",\n  \"nodes\": [\n    {\"id\": \"C\", \"text\": \"UI 元件\", \"key\": true},\n    {\"id\": \"C1\", \"text\": \"表單元件\"},\n    {\"id\": \"C2\", \"text\": \"對話框與側欄\"},\n    {\"id\": \"C3\", \"text\": \"動畫元件\"},\n    {\"id\": \"C4\", \"text\": \"共用日曆核心\"},\n    {\"id\": \"C5\", \"text\": \"版面資料導覽\"}\n  ],\n  \"edges\": [\n    {\"from\": \"C\", \"to\": \"C1\"},\n    {\"from\": \"C\", \"to\": \"C2\"},\n    {\"from\": \"C\", \"to\": \"C3\"},\n    {\"from\": \"C\", \"to\": \"C4\"},\n    {\"from\": \"C\", \"to\": \"C5\"}\n  ]\n}\n```\n\n![UI 元件分群](architecture.圖2.svg)\n\n| 分群 | 代表元件 |\n| :--- | :--- |\n| 表單元件 | Input、SelectV2、DateV2、DateRangeV2 |\n| 對話框與側欄 | BaseDialogV2、BaseBottomSheetV2、Drawer、PopupV2 |\n| 動畫元件 | RevealText、RippleEffect、Skeleton |\n| 共用日曆核心 | 內部 Calendar |\n| 版面資料導覽 | Tree、Table、Menu、OverlayScrollbar |\n\n主題提供四種風格與共用工具，核心 composable 則負責 API、路由與色彩。\n\n```json diagram id=圖3\n{\n  \"type\": \"flow\",\n  \"dir\": \"TD\",\n  \"title\": \"主題與核心 composable\",\n  \"desc\": \"Tailwind 主題與 Composables 各自提供的核心能力\",\n  \"nodes\": [\n    {\"id\": \"H\", \"text\": \"Tailwind 主題\", \"key\": true},\n    {\"id\": \"H1\", \"text\": \"四風格主題\"},\n    {\"id\": \"H2\", \"text\": \"Aqua 共用工具\"},\n    {\"id\": \"D\", \"text\": \"Composables\", \"key\": true},\n    {\"id\": \"D1\", \"text\": \"API 封裝\"},\n    {\"id\": \"D2\", \"text\": \"路由管理\"},\n    {\"id\": \"D3\", \"text\": \"色彩主題\"}\n  ],\n  \"edges\": [\n    {\"from\": \"H\", \"to\": \"H1\"},\n    {\"from\": \"H\", \"to\": \"H2\"},\n    {\"from\": \"D\", \"to\": \"D1\"},\n    {\"from\": \"D\", \"to\": \"D2\"},\n    {\"from\": \"D\", \"to\": \"D3\"}\n  ]\n}\n```\n\n![主題與核心 composable](architecture.圖3.svg)\n\n| 節點 | 說明 |\n| :--- | :--- |\n| 四風格主題 | material、cupertino、scifi、aqua，預設 aqua |\n| Aqua 共用工具 | 玻璃面板、填滿態、軌道等 Tailwind 工具 |\n| API 封裝 | [useBaseApi](../features/composables/useBaseApi.md) |\n| 路由管理 | [useCamelotRouter](../features/composables/useCamelotRouter.md) |\n| 色彩主題 | [useCustomColorScheme](../features/composables/useCustomColorScheme.md) |\n\n元件以 Nuxt 自動匯入，名稱為 Camelot 加上元件名。主題子元件（Aqua、Material、Cupertino、Scifi）與內部元件是實作細節，由公開元件依主題自動選用。主題機制見 [主題系統](./theme-system.md)。\n\n來源：1. [nuxt.config.ts][]\n\n### Nuxt 模組\n\nLayer 自帶的模組放在模組目錄，由 Nuxt 自動載入；開關讀 runtimeConfig。\n\n| 模組 | 狀態 | 說明 |\n| :--- | :---: | :--- |\n| tappay | 🟢 | runtimeConfig 開啟時注入 TapPay SDK script |\n| googleFont | 🟢 | 注入 Noto Sans TC 的 Google Fonts 連結，可由 runtimeConfig 關閉 |\n| buildHook | 🟢 | 建置期 hook |\n| echartModule | 🟢 | 把 ECharts 相關套件加入 transpile |\n\n來源：1. [tappay.ts][]　2. [googleFont.ts][]　3. [buildHook.ts][]　4. [echartModule.ts][]\n\n### 伺服器功能\n\n| 項目 | 狀態 | 說明 |\n| :--- | :---: | :--- |\n| securityPlugin | 🟢 | 設定 CSP 與其他安全標頭，並為 script、style、link 注入 nonce |\n| 版本端點 | 🟢 | 回傳 runtimeConfig 中的應用程式版本號 |\n| 健康檢查端點 | 🟢 | 回傳 OK |\n\n端點路徑：\n\n```text\nGET /api/version\nGET /api/health\n```\n\n來源：1. [securityPlugin.ts][]　2. [version/index.get.ts][]　3. [health/index.get.ts][]\n\n### 清單矩陣\n\n每個元件與 composable 都有獨立的 API 頁，記錄 Props、Emits、v-model、Slots、Exposed、簽章與回傳值。兩份矩陣是逐頁索引的入口：\n\n| 矩陣 | 內容 |\n| :--- | :--- |\n| [元件清單矩陣](../features/components.md) | 全部元件，依表單、版面、覆蓋層、回饋、媒體、主題變體、內部分組 |\n| [Composable 清單矩陣](../features/composables.md) | 全部 composable，依主題、元件相關、API、驗證、儲存、路由、DOM、工具分組 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 建立 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| package.json | [package.json](../../../package.json) |\n| nuxt.config.ts | [nuxt.config.ts](../../../nuxt.config.ts) |\n| tappay.ts | [modules/tappay.ts](../../../modules/tappay.ts) |\n| googleFont.ts | [modules/googleFont.ts](../../../modules/googleFont.ts) |\n| buildHook.ts | [modules/buildHook.ts](../../../modules/buildHook.ts) |\n| echartModule.ts | [modules/echartModule.ts](../../../modules/echartModule.ts) |\n| securityPlugin.ts | [server/plugins/securityPlugin.ts](../../../server/plugins/securityPlugin.ts) |\n| version/index.get.ts | [server/api/version/index.get.ts](../../../server/api/version/index.get.ts) |\n| health/index.get.ts | [server/api/health/index.get.ts](../../../server/api/health/index.get.ts) |\n\n[package.json]: #references\n[nuxt.config.ts]: #references\n[tappay.ts]: #references\n[googleFont.ts]: #references\n[buildHook.ts]: #references\n[echartModule.ts]: #references\n[securityPlugin.ts]: #references\n[version/index.get.ts]: #references\n[health/index.get.ts]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"專案架構","summary":"Camelot Nuxt Layer（套件名稱 `camelot-nuxt3-layer`）是以 Nuxt Layer 形式發佈的 UI 元件函式庫。消費端的 Nuxt 4 應用程式以 extends 繼承它，取得 Vue 3 元件、Composables、Nuxt 模組、伺服器外掛與 Tailwind CSS v4 主題。本頁說明 Layer 由哪些部分組成、各自提供什麼；逐一元件與 composable 的 API 見清單矩陣。"},"platform/color-scheme.md":{"md":"# 色彩主題系統\n\n## Summary\n\nCamelot 的色彩系統（Color Scheme）把 Material Design 3 色票與 Camelot 額外色轉成 CSS 變數注入 DOM，並隨深淺色模式自動切換。以雙變數策略蓋過 Tailwind v4 放在 `:root` 的主題色。全域色彩狀態與其副作用都是模組層單例；區域覆蓋由 `CamelotCustomColorSchemeProvider` 綁定自身元素。核心 composable 是 `useCustomColorScheme`。\n\n## 運作方式\n\n### 架構總覽\n\n這張圖回答：色彩方案從 Provider 到畫面，中間經過哪些單元？\n\n```json diagram id=圖1\n{\n  \"type\": \"flow\",\n  \"dir\": \"TD\",\n  \"title\": \"色彩方案注入\",\n  \"desc\": \"全域與區域 Provider 都經色彩方案 composable 建立 watcher，再由單向寫入器把 CSS 變數寫到 html 或 Provider 元素\",\n  \"nodes\": [\n    {\"id\": \"ColorMode\", \"text\": \"深淺色單例\", \"kind\": \"data\"},\n    {\"id\": \"GlobalProvider\", \"text\": \"全域 Provider\", \"shape\": \"stadium\"},\n    {\"id\": \"ScopedProvider\", \"text\": \"區域 Provider\", \"shape\": \"stadium\"},\n    {\"id\": \"useCustom\", \"text\": \"色彩方案函式\", \"key\": true},\n    {\"id\": \"GlobalWatcher\", \"text\": \"全域監聽\"},\n    {\"id\": \"ScopedWatcher\", \"text\": \"逐實例監聽\"},\n    {\"id\": \"Writer\", \"text\": \"單向寫入器\"},\n    {\"id\": \"Html\", \"text\": \"html 樣式\"},\n    {\"id\": \"El\", \"text\": \"Provider 元素\"},\n    {\"id\": \"Tailwind\", \"text\": \"Tailwind 色\"}\n  ],\n  \"edges\": [\n    {\"from\": \"GlobalProvider\", \"to\": \"useCustom\"},\n    {\"from\": \"ScopedProvider\", \"to\": \"useCustom\"},\n    {\"from\": \"ColorMode\", \"to\": \"useCustom\"},\n    {\"from\": \"useCustom\", \"to\": \"GlobalWatcher\", \"label\": \"全域目標\"},\n    {\"from\": \"useCustom\", \"to\": \"ScopedWatcher\", \"label\": \"區域目標\"},\n    {\"from\": \"GlobalWatcher\", \"to\": \"Writer\"},\n    {\"from\": \"ScopedWatcher\", \"to\": \"Writer\"},\n    {\"from\": \"Writer\", \"to\": \"Html\"},\n    {\"from\": \"Writer\", \"to\": \"El\"},\n    {\"from\": \"Html\", \"to\": \"Tailwind\"}\n  ]\n}\n```\n\n![色彩方案注入](color-scheme.圖1.svg)\n\n`useMaterial3ColorScheme` 是獨立的並行路徑，值為 r、g、b 三元組，不經過 `useCustomColorScheme`。\n\n來源：1. [useCustomColorScheme.ts][]　2. [useColorSchemeCssVars.ts][]　3. [useMaterial3ColorScheme.ts][]\n\n### 訂閱模型\n\n`useCamelotTheme` 被數十個 Camelot 元件呼叫，單頁可達數百個實例。\n\n下列狀態與副作用一律收斂為模組層單例，否則切換一次深淺色會產生數百份重複工作：\n\n| 項目 | 位置 | 說明 |\n| :--- | :--- | :--- |\n| `useColorMode` 實例 | [useCamelotColorMode](../features/composables/useCamelotColorMode.md) | VueUse 每個實例都會註冊一份往 html 寫 class 的 watcher |\n| 主題風格 storage ref | `useCamelotTheme` | 同分頁兩個 storage 實例不會互相同步，必須共用同一個 ref |\n| 主題屬性與漸變過場 watcher | `useCamelotTheme` | 掛在模組層的 detached effect scope |\n| 全域色彩方案 watcher | `useCustomColorScheme` | 所有全域呼叫端寫的都是同一個 html 元素 |\n\nCSS 變數寫入是單向動作，由 [useColorSchemeCssVars](../features/composables/useColorSchemeCssVars.md) 直接 setProperty，不為每個變數建立響應式 ref。\n\n來源：1. [useCamelotColorMode.ts][]　2. [useCamelotTheme.ts][]　3. [useCustomColorScheme.ts][]　4. [useColorSchemeCssVars.ts][]\n\n### CSS 變數命名\n\nTailwind v4 把主題色放在 `:root`，直接修改會被覆蓋，所以採雙變數策略：\n\n1. 內部變數存實際色值：Material3 色鍵前綴 `--cml-c-m3-`，Camelot 與消費端自訂色鍵前綴 `--cml-c-`。\n2. 覆蓋變數 `--color-*` 指向內部變數，Tailwind 的色彩 utility 讀它。\n\n| 色鍵 | 內部變數 | 覆蓋變數 |\n| :--- | :--- | :--- |\n| Material3 的 primary | `--cml-c-m3-primary` | `--color-primary` |\n| Camelot 的 rippleColor | `--cml-c-ripple-color` | `--color-ripple-color` |\n\n來源：1. [useColorSchemeCssVars.ts][]\n\n## useCustomColorScheme\n\n把色彩方案物件轉成 CSS 變數，注入指定 DOM 元素或全域 html。呼叫形式為目標元素加上選填設定。\n\n### 參數\n\n| 參數 | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `targetRef` | `MaybeElementRef` | 目標 DOM 元素；傳入 `document.documentElement` 時視為全域設定 |\n| `config.lightColorScheme` | `CustomColorScheme<T>` | 亮色模式色彩方案 |\n| `config.darkColorScheme` | `CustomColorScheme<T>` | 暗色模式色彩方案 |\n| `config.editable` | `boolean` | 設為 `false` 時不更新 CSS 變數；只對非全域目標生效，因為全域目標是共用的 html |\n\n來源：1. [useCustomColorScheme.ts][]\n\n### 回傳值\n\n| 值 | 說明 |\n| :--- | :--- |\n| `mode` | 目前色彩模式，來自全站共用的深淺色單例 |\n| `lightColorScheme` | 亮色方案 Ref；全域目標共用同一個 |\n| `darkColorScheme` | 暗色方案 Ref；全域目標共用同一個 |\n| `usedColorScheme` | 依深淺色自動切換的目前方案 Computed |\n\n來源：1. [useCustomColorScheme.ts][]\n\n## 型別定義\n\n### CustomColorScheme\n\n```typescript\ntype CustomColorScheme<T = any> =\n  Material3ColorSchemePartial   // M3 色彩（primary, secondary, error, surface 等）\n  & Partial<CamelotColorScheme> // Camelot 額外色彩（rippleColor, maskColor）\n  & Partial<T>                  // 消費端自訂擴展\n```\n\n### CamelotColorScheme\n\n```typescript\ntype CamelotColorScheme = {\n  rippleColor: string  // 漣漪點擊效果顏色\n  maskColor: string    // 遮罩顏色\n}\n```\n\n來源：1. [useCustomColorScheme.ts][]\n\n## 元件\n\n### CamelotColorSchemeProvider\n\n全域色彩方案注入元件：對整個應用程式套用 Material3 與 Camelot 預設色彩方案，並隨深淺色自動切換。\n\n```vue\n<template>\n  <CamelotColorSchemeProvider\n    :light-color-scheme=\"myLightScheme\"\n    :dark-color-scheme=\"myDarkScheme\"\n  >\n    <NuxtPage />\n  <\/CamelotColorSchemeProvider>\n<\/template>\n```\n\n來源：1. [ColorSchemeProvider.vue][]\n\n### CamelotCustomColorSchemeProvider\n\n區域色彩方案覆蓋元件：在特定 DOM 範圍內套用不同的色彩方案，不影響全域主題。\n\n來源：1. [CustomColorSchemeProvider.vue][]\n\n## Material3 色彩角色對照\n\n常用的 Tailwind 色彩 utility，由全域樣式表定義：\n\n| Tailwind Class | CSS 變數 | 語意 |\n| :--- | :--- | :--- |\n| `bg-primary` | `--color-primary` | 主要強調色 |\n| `text-on-primary` | `--color-on-primary` | Primary 上的文字色 |\n| `bg-surface` | `--color-surface` | 背景表面色 |\n| `text-on-surface` | `--color-on-surface` | 表面上的文字色 |\n| `bg-surface-container` | `--color-surface-container` | 容器背景色，例如 Hover |\n| `text-outline` | `--color-outline` | 邊框與次要文字色 |\n| `text-error` | `--color-error` | 錯誤與假日色 |\n\n來源：1. [tailwind.css][]\n\n## 相關頁面\n\n- [主題系統](./theme-system.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCustomColorScheme.ts | [app/composables/useCustomColorScheme.ts](../../../app/composables/useCustomColorScheme.ts) |\n| useColorSchemeCssVars.ts | [app/composables/useColorSchemeCssVars.ts](../../../app/composables/useColorSchemeCssVars.ts) |\n| useMaterial3ColorScheme.ts | [app/composables/useMaterial3ColorScheme.ts](../../../app/composables/useMaterial3ColorScheme.ts) |\n| useCamelotColorMode.ts | [app/composables/useCamelotColorMode.ts](../../../app/composables/useCamelotColorMode.ts) |\n| useCamelotTheme.ts | [app/composables/useCamelotTheme.ts](../../../app/composables/useCamelotTheme.ts) |\n| ColorSchemeProvider.vue | [app/components/Camelot/ColorSchemeProvider.vue](../../../app/components/Camelot/ColorSchemeProvider.vue) |\n| CustomColorSchemeProvider.vue | [app/components/Camelot/CustomColorSchemeProvider.vue](../../../app/components/Camelot/CustomColorSchemeProvider.vue) |\n| tailwind.css | [app/assets/css/tailwind.css](../../../app/assets/css/tailwind.css) |\n\n[useCustomColorScheme.ts]: #references\n[useColorSchemeCssVars.ts]: #references\n[useMaterial3ColorScheme.ts]: #references\n[useCamelotColorMode.ts]: #references\n[useCamelotTheme.ts]: #references\n[ColorSchemeProvider.vue]: #references\n[CustomColorSchemeProvider.vue]: #references\n[tailwind.css]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"色彩主題系統","summary":"Camelot 的色彩系統（Color Scheme）把 Material Design 3 色票與 Camelot 額外色轉成 CSS 變數注入 DOM，並隨深淺色模式自動切換。以雙變數策略蓋過 Tailwind v4 放在 `:root` 的主題色。全域色彩狀態與其副作用都是模組層單例；區域覆蓋由 `CamelotCustomColorSchemeProvider` 綁定自身元素。核心 composable 是 `useCustomColorScheme`。"},"platform/error-handling.md":{"md":"# 錯誤處理系統\n\n## Summary\n\nCamelot 的全域錯誤機制由 `useCamelotError` 的佇列與 `CamelotErrorDialog` 的顯示層組成，可累積多筆錯誤並逐一呈現，管線分為轉換器、攔截器與佇列三段。入口只接受 `CamelotErrorType`，任意原始錯誤必須經由消費端註冊的轉換器轉成該型別，副作用由攔截器負責，因此換一套 API 錯誤格式不需要改動 Layer。Layer 只內建 `FetchError`、`Error`、`string` 三個無業務語意的轉換器；401 導向登入這類行為一律由消費端註冊。\n\n## 運作方式\n\n### 管線\n\n`handle` 是接收原始錯誤的唯一入口，分三段推進。\n\n這張圖回答：一筆原始錯誤從進入到顯示，會經過哪些判斷？\n\n```json diagram id=圖1\n{\n  \"type\": \"flow\",\n  \"dir\": \"LR\",\n  \"title\": \"錯誤處理管線\",\n  \"desc\": \"原始錯誤先經轉換器鏈轉成統一型別，再經攔截器鏈決定是否靜默，否則入列由錯誤對話框逐一顯示\",\n  \"nodes\": [\n    {\"id\": \"A\", \"text\": \"原始錯誤\", \"shape\": \"stadium\"},\n    {\"id\": \"B\", \"text\": \"有轉換器命中?\", \"shape\": \"diamond\"},\n    {\"id\": \"F\", \"text\": \"保底錯誤型別\"},\n    {\"id\": \"C\", \"text\": \"攔截器攔下?\", \"shape\": \"diamond\"},\n    {\"id\": \"G\", \"text\": \"靜默處理\", \"kind\": \"success\", \"terminal\": true},\n    {\"id\": \"D\", \"text\": \"加入佇列\", \"kind\": \"data\", \"shape\": \"db\"},\n    {\"id\": \"E\", \"text\": \"對話框逐一顯示\", \"key\": true},\n    {\"id\": \"H\", \"text\": \"執行動作按鈕\"},\n    {\"id\": \"I\", \"text\": \"關閉並回呼\"}\n  ],\n  \"edges\": [\n    {\"from\": \"A\", \"to\": \"B\"},\n    {\"from\": \"B\", \"to\": \"C\", \"label\": \"第一個命中者\"},\n    {\"from\": \"B\", \"to\": \"F\", \"label\": \"全部落空\"},\n    {\"from\": \"F\", \"to\": \"C\"},\n    {\"from\": \"C\", \"to\": \"G\", \"label\": \"回傳 true\"},\n    {\"from\": \"C\", \"to\": \"D\", \"label\": \"否\"},\n    {\"from\": \"D\", \"to\": \"E\"},\n    {\"from\": \"E\", \"to\": \"H\", \"label\": \"按下按鈕\"},\n    {\"from\": \"H\", \"to\": \"I\"}\n  ]\n}\n```\n\n![錯誤處理管線](error-handling.圖1.svg)\n\n保底錯誤型別的等級為 error，原始錯誤放在 data 欄位。\n\n| 階段 | 職責 | 不該做什麼 |\n| :--- | :--- | :--- |\n| resolve | 純轉換：把 unknown 轉成 `CamelotErrorType` | 不做副作用；轉換器若兼做清權限或導頁，單純轉格式的情境也會觸發 |\n| intercept | 副作用：清除權限、記錄 log、掛上 `onConfirm`；回傳 `true` 可攔下不入列 | 不改寫錯誤的顯示語意，那是 resolve 的事 |\n| enqueue | 入列並由錯誤對話框逐一呈現 | — |\n\n轉換器與攔截器都可註冊多個，`priority` 數字大者先跑；未指定為 0，內建轉換器為 -100。\n\n註冊表是模組層的 Map，同名視為覆蓋，註冊函式回傳註銷函式。\n\n來源：1. [useCamelotError.ts][]　2. [ErrorDialog.vue][]\n\n### 消費端註冊\n\n以 401 為例，三個需求各自落在管線的一段：\n\n1. 清除權限：在 intercept。\n2. 跳出對話框：入列後由錯誤對話框負責。\n3. 確認後回登入：掛在 `onConfirm`。\n\n```ts\n// plugins/camelotError.ts\nexport default defineNuxtPlugin(() => {\n  const { registerErrorResolver, registerErrorInterceptor } = useCamelotError()\n\n  // 轉換：把後端的 401 轉成統一模型（無副作用）\n  registerErrorResolver({\n    name: 'unauthorized',\n    priority: 100,\n    resolve: (raw) => {\n      if (!isFetchError(raw) || raw.statusCode !== 401) return undefined\n      return { code: 401, message: '登入逾期，請重新登入', data: raw.data }\n    },\n  })\n\n  // 攔截：清權限（立即），導頁掛到 onConfirm（對話框關閉後才跑）\n  registerErrorInterceptor({\n    name: 'unauthorized',\n    intercept: (error) => {\n      if (error.code !== 401) return\n      useAuthStore().clear()\n      error.onConfirm = () => navigateTo('/login')\n    },\n  })\n})\n```\n\n自訂 API 錯誤格式同理，只註冊轉換器即可：\n\n```ts\nregisterErrorResolver<ApiErrorPayload>({\n  name: 'api-error',\n  priority: 100,\n  resolve: raw => isApiErrorPayload(raw)\n    ? { code: raw.errorCode, message: raw.errorMessage, data: raw }\n    : undefined,\n})\n```\n\n來源：1. [useCamelotError.ts][]\n\n### 呼叫端控制\n\n`push`、`handle`、`watch` 共用同一組選項型別 CamelotErrorOptions，讓觸發錯誤的頁面就地決定行為：\n\n```ts\nconst { error } = await useFetch('/api/orders')\n\n// 確認後回上一頁\nuseCamelotError().watch(error, { onConfirm: () => router.back() })\n```\n\n| 欄位 | 合併方式 | 理由 |\n| :--- | :--- | :--- |\n| 動作欄位 `positive`、`neutral`、`negative` | 呼叫端覆寫錯誤自帶的 | 呼叫端比轉換器更貼近當下情境 |\n| `onConfirm` | 串接：呼叫端的先跑，錯誤自帶的後跑 | 攔截器掛的多為導頁這類終結動作，排最後才不會跳過呼叫端邏輯 |\n\n來源：1. [useCamelotError.ts][]\n\n### 多動作按鈕與重試\n\n錯誤可帶 `positive`、`neutral`、`negative` 三顆按鈕，型別為 CamelotErrorAction，直接對映確認對話框的按鈕槽。\n\n按鈕設定 `close: false` 時，按下後不自動關閉，由呼叫端自行控制關閉時機：\n\n```ts\npush({\n  title: '連線失敗',\n  message: '無法取得資料，請稍後再試。',\n  positive: { label: '重試', close: false, handler: retry },\n  negative: { label: '關閉' },\n})\n\nconst retry = async () => {\n  // 自行關閉，loading 才不會被對話框蓋住\n  dismiss()\n  const closeLoading = useLoading().open('重新連線中...')\n  await request()\n  closeLoading()\n}\n```\n\nplayground 首頁的 Global Error Queue 卡片有可操作的示範。\n\n來源：1. [useCamelotError.ts][]　2. [index.vue][]\n\n## 與其他機制的分工\n\n| 機制 | 負責範圍 |\n| :--- | :--- |\n| useCamelotError | 非致命、可累積、需逐一提示的錯誤 |\n| Nuxt 的 `useError` 與 `showError` | 致命錯誤：只承載單一 NuxtError，且會中止當前頁渲染、切換到錯誤頁 |\n| [useBaseApi](../features/composables/useBaseApi.md) 的自動刷新 | 可自動回復的 401：在 API 層就地刷新 token 並重送，不進入本管線；刷新也失敗的 401 才由本管線處理 |\n| [useCamelotToast](../features/composables/useCamelotToast.md) | 不需要使用者確認的輕量提示 |\n| [useErrorRef](../features/composables/useErrorRef.md) | 只把多個錯誤 ref 匯總成一個 ref，不含佇列、轉換與顯示 |\n\n## 相關頁面\n\n- [useCamelotError](../features/composables/useCamelotError.md)\n- [ErrorDialog](../features/components/ErrorDialog.md)\n- [ConfirmDialog](../features/components/ConfirmDialog.md)\n- [API 用戶端](./api-client.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCamelotError.ts | [app/composables/useCamelotError.ts](../../../app/composables/useCamelotError.ts) |\n| ErrorDialog.vue | [app/components/Camelot/ErrorDialog.vue](../../../app/components/Camelot/ErrorDialog.vue) |\n| index.vue | [.playground/app/pages/index.vue](../../../.playground/app/pages/index.vue) |\n\n[useCamelotError.ts]: #references\n[ErrorDialog.vue]: #references\n[index.vue]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"錯誤處理系統","summary":"Camelot 的全域錯誤機制由 `useCamelotError` 的佇列與 `CamelotErrorDialog` 的顯示層組成，可累積多筆錯誤並逐一呈現，管線分為轉換器、攔截器與佇列三段。入口只接受 `CamelotErrorType`，任意原始錯誤必須經由消費端註冊的轉換器轉成該型別，副作用由攔截器負責，因此換一套 API 錯誤格式不需要改動 Layer。Layer 只內建 `FetchError`、`Error`、`string` 三個無業務語意的轉換器；401 導向登入這類行為一律由消費端註冊。"},"platform/i18n-locales.md":{"md":"# i18n 語系系統\n\n## Summary\n\n本專案的多語系採 CLDR 區域代碼加上 vue-i18n 的 fallback 鏈，語系註冊與 fallback 設定全部由消費端負責：Layer 的 Nuxt 設定宣告 `locales: []`、`defaultLocale: undefined`，Layer 的 i18n 設定也不設 `fallbackLocale`。Layer 目錄下雖有 en 與 zh 兩份基底字典，但不會被註冊，消費端必須自帶完整詞條，fallback 鏈也只能指向自己註冊過的語系。\n\n## 運作方式\n\n### 分工原則\n\n@nuxtjs/i18n 會合併各 layer 的 `locales` 與 vueI18n 設定，專案層優先。\n\n| 層 | 職責 | 語系 |\n| :--- | :--- | :--- |\n| Layer | 只提供 `globalInjection`、`legacy` 等與語系無關的設定；不註冊語系、不設預設語系與 fallback | 無，實際註冊數為 0 |\n| 消費端 | 註冊全部語系，含區域與語言基底；決定預設語系、提供完整詞條與自己的 fallback 鏈 | 以 playground 為例：zh-Hant-TW、zh-Hant-HK、zh-Hant-MO、zh-Hant、zh-Hans-CN、zh-Hans-SG、zh-Hans-MY、zh-Hans、en-US |\n\n> [!IMPORTANT]\n> 消費端不可假設 Layer 基底字典存在，fallback 鏈的終點詞條必須自己備齊。\n> fallback 目標必須是已註冊的語系：指向未註冊語系的鏈在執行期不成立，`nuxt typecheck` 也會報型別錯誤。\n\n來源：1. [nuxt.config.ts][]　2. [i18n/i18n.config.ts][]　3. [.playground/nuxt.config.ts][]\n\n### Fallback 鏈\n\n這張圖回答：playground 的某個語系缺 key 時，會依序退回哪個語系？\n\n```json diagram id=圖1\n{\n  \"type\": \"flow\",\n  \"dir\": \"LR\",\n  \"title\": \"playground fallback 鏈\",\n  \"desc\": \"區域語系先退回繁或簡通用基底，未命中時由 default 退回 zh-Hant-TW\",\n  \"nodes\": [\n    {\"id\": \"HK\", \"text\": \"zh-Hant-HK\"},\n    {\"id\": \"MO\", \"text\": \"zh-Hant-MO\"},\n    {\"id\": \"Hant\", \"text\": \"zh-Hant\", \"kind\": \"data\"},\n    {\"id\": \"CN\", \"text\": \"zh-Hans-CN\"},\n    {\"id\": \"SG\", \"text\": \"zh-Hans-SG\"},\n    {\"id\": \"MY\", \"text\": \"zh-Hans-MY\"},\n    {\"id\": \"Hans\", \"text\": \"zh-Hans\", \"kind\": \"data\"},\n    {\"id\": \"ENUS\", \"text\": \"en-US\"},\n    {\"id\": \"TW\", \"text\": \"zh-Hant-TW\", \"key\": true}\n  ],\n  \"edges\": [\n    {\"from\": \"HK\", \"to\": \"Hant\"},\n    {\"from\": \"MO\", \"to\": \"Hant\"},\n    {\"from\": \"TW\", \"to\": \"Hant\", \"label\": \"區域覆寫\"},\n    {\"from\": \"CN\", \"to\": \"Hans\"},\n    {\"from\": \"SG\", \"to\": \"Hans\"},\n    {\"from\": \"MY\", \"to\": \"Hans\"},\n    {\"from\": \"Hans\", \"to\": \"TW\", \"label\": \"default\", \"kind\": \"retry\"},\n    {\"from\": \"ENUS\", \"to\": \"TW\", \"label\": \"default\", \"kind\": \"retry\"}\n  ]\n}\n```\n\n![playground fallback 鏈](i18n-locales.圖1.svg)\n\n| 規則 | 說明 |\n| :--- | :--- |\n| 一語系一檔 | 每個 locale 對應單一字典檔，fallback 由 vue-i18n 在執行期解析，不是合併檔案 |\n| 區域覆寫檔只放差異 | 例如 zh-Hant-TW 只有 login 一個 key，其餘 key 逐層退回 |\n| 完整字典 | 繁體在 zh-Hant、簡體在 zh-Hans，都由消費端提供 |\n| 最終兜底 | `default` 指向 zh-Hant-TW；鏈中不出現 zh 與 en，那兩碼未註冊，指過去不會生效 |\n\nplayground 的 fallback 設定：\n\n```ts\nfallbackLocale: {\n  'zh-Hant-TW': ['zh-Hant'],\n  'zh-Hant-HK': ['zh-Hant'],\n  'zh-Hant-MO': ['zh-Hant'],\n  'zh-Hans-CN': ['zh-Hans'],\n  'zh-Hans-SG': ['zh-Hans'],\n  'zh-Hans-MY': ['zh-Hans'],\n  'default': ['zh-Hant-TW'],\n}\n```\n\nLayer 的 i18n 設定不設 `fallbackLocale`：Layer 不註冊語系，無從得知消費端會註冊哪些，也就無法指定落點。\n\n來源：1. [.playground/i18n/i18n.config.ts][]　2. [zh-Hant-TW.json][]　3. [i18n/i18n.config.ts][]\n\n## 已知缺陷\n\n### Layer 基底字典永不註冊\n\nLayer 的 en 與 zh 兩份字典存在，但不會進入任何消費端的語系表。成因是 @nuxtjs/i18n 跨 layer 合併的兩個限制：\n\n| 機制 | 後果 |\n| :--- | :--- |\n| `mergeConfigLocales` 逐 config 迭代各自的 locales，以語系代碼為鍵累積字典檔 | Layer 宣告空陣列，不貢獻任何代碼，兩份字典永不進入合併結果 |\n| `resolveRelativeLocales` 以該 config 自己的 langDir 解析字典路徑 | 消費端想在自己的 files 疊加 Layer 字典時，路徑以消費端目錄解析，找不到檔案 |\n\n這是 Layer 端缺陷，消費端無法繞過。\n\n來源：1. [nuxt.config.ts][]　2. [en.json][]　3. [zh.json][]\n\n### 因應與修法\n\n| 項目 | 說明 |\n| :--- | :--- |\n| 現況因應 | 消費端自帶完整詞條，不依賴 Layer 基底字典；Layer 與 playground 的 fallback 鏈都不指向 zh 與 en |\n| 修法 | 在 Layer 的 Nuxt 設定 `i18n.locales` 補上 zh 與 en 兩筆，各自指向同名字典檔 |\n| 未修原因 | 修復會讓 zh 與 en 開始註冊，改變既有消費端的 fallback 鏈與語系選單，屬公開契約的行為變更，需獨立驗證 |\n| 字典檔保留原因 | 以 zh 或 en 為語系代碼的消費端仍會取用 Layer 同名檔案 |\n\n來源：1. [nuxt.config.ts][]\n\n## 陷阱\n\n1. 設定 `restructureDir` 為 i18n 後，vueI18n 設定檔的路徑以 i18n 目錄為基準；放在專案根目錄不會被載入，`nuxt prepare` 只給 WARN 就跳過。\n2. 多 layer 合併後，fallback map 同 key 可能出現重複項，例如 en-US 對應兩個 en，無害。\n3. `detectBrowserLanguage` 對 zh-TW 這類簡式代碼以語言前綴比對，取 locales 清單中第一個命中者。\n4. 因此區域語系必須排在通用基底之前，否則初始語系會落在 zh-Hant 而非 zh-Hant-TW。\n5. Nuxt 設定裡的 i18n 區塊不在 HMR 範圍，改動需重啟 dev server。\n\n來源：1. [nuxt.config.ts][]　2. [.playground/nuxt.config.ts][]\n\n## 相關頁面\n\n- [useLocale](./locale.md)：語系格式正規化\n- [Layer 整合與必裝依賴](../dev/layer-integration.md)\n- [vue-i18n Fallbacking](https://vue-i18n.intlify.dev/guide/essentials/fallback.html)\n- [@nuxtjs/i18n locales 選項](https://i18n.nuxtjs.org/docs/api/options#locales)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| nuxt.config.ts | [nuxt.config.ts](../../../nuxt.config.ts) |\n| i18n/i18n.config.ts | [i18n/i18n.config.ts](../../../i18n/i18n.config.ts) |\n| .playground/nuxt.config.ts | [.playground/nuxt.config.ts](../../../.playground/nuxt.config.ts) |\n| .playground/i18n/i18n.config.ts | [.playground/i18n/i18n.config.ts](../../../.playground/i18n/i18n.config.ts) |\n| zh-Hant-TW.json | [.playground/i18n/locales/zh-Hant-TW.json](../../../.playground/i18n/locales/zh-Hant-TW.json) |\n| en.json | [i18n/locales/en.json](../../../i18n/locales/en.json) |\n| zh.json | [i18n/locales/zh.json](../../../i18n/locales/zh.json) |\n\n[nuxt.config.ts]: #references\n[i18n/i18n.config.ts]: #references\n[.playground/nuxt.config.ts]: #references\n[.playground/i18n/i18n.config.ts]: #references\n[zh-Hant-TW.json]: #references\n[en.json]: #references\n[zh.json]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"i18n 語系系統","summary":"本專案的多語系採 CLDR 區域代碼加上 vue-i18n 的 fallback 鏈，語系註冊與 fallback 設定全部由消費端負責：Layer 的 Nuxt 設定宣告 `locales: []`、`defaultLocale: undefined`，Layer 的 i18n 設定也不設 `fallbackLocale`。Layer 目錄下雖有 en 與 zh 兩份基底字典，但不會被註冊，消費端必須自帶完整詞條，fallback 鏈也只能指向自己註冊過的語系。"},"platform/layering.md":{"md":"# 疊層刻度\n\n## Summary\n\nCamelot 的疊層刻度（Layering）讓 Drawer、BottomSheet、Popup 等浮動元件以一組具名 CSS 變數 `--cml-z-*` 決定 z-index，而不是各自硬編碼數字。刻度定義在全域樣式表的一般 `:root`，元件一律以 `var(--cml-z-*)` 引用。浮層要在原生 dialog 內可見，還必須先 teleport 進該對話框，層級只在同一堆疊脈絡內才有意義。\n\n## 運作方式\n\n### 刻度\n\n| 變數 | 值 | 使用者 |\n| :--- | ---: | :--- |\n| `--cml-z-drawer` | 50 | [Drawer](../features/components/Drawer.md) floating 模式的 Teleport 容器 |\n| `--cml-z-sheet` | 60 | [BaseBottomSheetV2](../features/components/BaseBottomSheetV2.md) 的面板容器 |\n| `--cml-z-popup` | 70 | [PopupV2](../features/components/PopupV2.md) 與 [Tooltip](../features/components/Tooltip.md) 浮層的預設層級 |\n\n| 疊在 popup 之上的浮層 | 層級 |\n| :--- | :--- |\n| [CascadeMenu](../features/components/CascadeMenu.md) 面板 | popup 刻度加上所在層數，逐層加 1 |\n| TimeV2、DateV2 的時分秒清單 | popup 刻度加 1 |\n\n來源：1. [tailwind.css][]　2. [PopupV2.vue][]　3. [Tooltip.vue][]　4. [CascadeMenuPanel.vue][]　5. [TimeField.vue][]\n\n### 為什麼 popup 必須高於 sheet 與 drawer\n\npopup 概念的元件會把浮層 Teleport 進最近的原生 dialog，沒有 dialog 時回落 body，以繞開 dialog 的 top layer 限制。\n\nPopupV2 自行尋找最近的 dialog；Tooltip、CascadeMenu 面板與時間欄位清單經由 [useCamelotTeleportTarget](../features/composables/useCamelotTeleportTarget.md) 取得目標。\n\n此時浮層與 BottomSheet 的面板容器是同一個堆疊脈絡下的兄弟節點，純粹比 z-index 大小。popup 若低於面板，Sheet 內的下拉選單就會被面板蓋住。\n\n> [!IMPORTANT]\n> 兩者有先後關係：沒有先 teleport 進 dialog，調高 z-index 完全無效。body 底下的內容永遠在對話框 top layer 之下，開到多大都一樣。\n\n這張圖回答：BottomSheet 裡開啟下拉選單時，誰蓋在誰上面？\n\n```json diagram id=圖1\n{\n  \"type\": \"flow\",\n  \"dir\": \"TD\",\n  \"title\": \"dialog 內的疊層\",\n  \"desc\": \"Sheet 面板與 teleport 進來的 popup 浮層同在 dialog 的 top layer 內，popup 刻度較高所以在上\",\n  \"nodes\": [\n    {\"id\": \"Dialog\", \"text\": \"原生 dialog\", \"shape\": \"round\"},\n    {\"id\": \"Wrapper\", \"text\": \"Sheet 面板 60\"},\n    {\"id\": \"Popup\", \"text\": \"Popup 浮層 70\", \"key\": true}\n  ],\n  \"edges\": [\n    {\"from\": \"Dialog\", \"to\": \"Wrapper\"},\n    {\"from\": \"Dialog\", \"to\": \"Popup\", \"label\": \"teleport 進來\"}\n  ]\n}\n```\n\n![dialog 內的疊層](layering.圖1.svg)\n\n來源：1. [PopupV2.vue][]　2. [useCamelotTeleportTarget.ts][]　3. [BaseBottomSheetV2.vue][]\n\n## 規則\n\n| 規則 | 說明 |\n| :--- | :--- |\n| 不寫死 z-index 數字 | 元件一律引用刻度變數；popup 概念的元件都已收斂 |\n| 既有硬編碼 | 非 popup 類仍有固定值：Loading 1100、Toast 1000、Carousel 150；新增或修改時優先改用刻度 |\n| 疊在同層之上用 calc | 例如浮層內的子清單寫 popup 刻度加 1；相同 z-index 會退回以 DOM 順序決定，多個浮層並存時不可預測 |\n| 刻度放一般 `:root` | 不要移進 `@theme`：Tailwind v4 會 tree-shake 掉未被引用的變數，預留刻度在首次被引用前不存在 |\n| 個別覆寫 | 使用端可透過元件的 `zIndex` prop 覆寫單一實例 |\n\n來源：1. [tailwind.css][]　2. [Loading.vue][]　3. [Toast.vue][]　4. [Carousel.vue][]\n\n## 相關頁面\n\n- [BaseDialogV2](../features/components/BaseDialogV2.md)\n- [元件清單](../features/components.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| tailwind.css | [app/assets/css/tailwind.css](../../../app/assets/css/tailwind.css) |\n| PopupV2.vue | [app/components/Camelot/PopupV2.vue](../../../app/components/Camelot/PopupV2.vue) |\n| Tooltip.vue | [app/components/Camelot/Tooltip.vue](../../../app/components/Camelot/Tooltip.vue) |\n| CascadeMenuPanel.vue | [app/components/Camelot/Internal/CascadeMenuPanel.vue](../../../app/components/Camelot/Internal/CascadeMenuPanel.vue) |\n| TimeField.vue | [app/components/Camelot/Internal/TimeField.vue](../../../app/components/Camelot/Internal/TimeField.vue) |\n| useCamelotTeleportTarget.ts | [app/composables/useCamelotTeleportTarget.ts](../../../app/composables/useCamelotTeleportTarget.ts) |\n| BaseBottomSheetV2.vue | [app/components/Camelot/BaseBottomSheetV2.vue](../../../app/components/Camelot/BaseBottomSheetV2.vue) |\n| Loading.vue | [app/components/Camelot/Loading.vue](../../../app/components/Camelot/Loading.vue) |\n| Toast.vue | [app/components/Camelot/Toast.vue](../../../app/components/Camelot/Toast.vue) |\n| Carousel.vue | [app/components/Camelot/Carousel.vue](../../../app/components/Camelot/Carousel.vue) |\n\n[tailwind.css]: #references\n[PopupV2.vue]: #references\n[Tooltip.vue]: #references\n[CascadeMenuPanel.vue]: #references\n[TimeField.vue]: #references\n[useCamelotTeleportTarget.ts]: #references\n[BaseBottomSheetV2.vue]: #references\n[Loading.vue]: #references\n[Toast.vue]: #references\n[Carousel.vue]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"疊層刻度","summary":"Camelot 的疊層刻度（Layering）讓 Drawer、BottomSheet、Popup 等浮動元件以一組具名 CSS 變數 `--cml-z-*` 決定 z-index，而不是各自硬編碼數字。刻度定義在全域樣式表的一般 `:root`，元件一律以 `var(--cml-z-*)` 引用。浮層要在原生 dialog 內可見，還必須先 teleport 進該對話框，層級只在同一堆疊脈絡內才有意義。"},"platform/locale.md":{"md":"# useLocale\n\n## Summary\n\n`useLocale` 是語系格式正規化 composable：把單一 locale 字串正規化成 `bcp47`、`cldr`、`l10n` 三種表示，各為一個 computed。輸入可為 bcp47 或 cldr 格式，大小寫不敏感，底線與連字號分隔皆可；參數型別是 `MaybeRefOrGetter<string | undefined>`。\n\n## 運作方式\n\n### 三種輸出\n\n| 輸出 | 規則 | 例 |\n| :--- | :--- | :--- |\n| `cldr` | 常見語言補上完整的語言、文字、地區三段；輸入已帶文字子標籤則保留；不在對照表的語言回 `undefined` | zh-TW 得 zh-Hant-TW |\n| `bcp47` | 由 cldr 反推，沒有 cldr 時用正規化後的輸入；移除文字子標籤、保留地區 | zh-Hant-TW 得 zh-TW |\n| `l10n` | 依序取 cldr、bcp47、原始輸入中第一個有值者 | en-US 得 en-US |\n\n來源：1. [useLocale.ts][]\n\n### 解析流程\n\n這張圖回答：一個 locale 字串怎麼被解析成三種輸出？\n\n```json diagram id=圖1\n{\n  \"type\": \"flow\",\n  \"dir\": \"TD\",\n  \"title\": \"locale 解析\",\n  \"desc\": \"先統一分隔符與大小寫，再依是否自帶文字子標籤或命中對照表決定 cldr，最後推出 bcp47 與 l10n\",\n  \"nodes\": [\n    {\"id\": \"A\", \"text\": \"locale 輸入\", \"shape\": \"stadium\"},\n    {\"id\": \"B\", \"text\": \"統一分隔與大小寫\"},\n    {\"id\": \"C\", \"text\": \"含文字子標籤?\", \"shape\": \"diamond\"},\n    {\"id\": \"D\", \"text\": \"cldr 保留輸入\"},\n    {\"id\": \"E\", \"text\": \"對照表命中?\", \"shape\": \"diamond\"},\n    {\"id\": \"F\", \"text\": \"cldr 取對照值\"},\n    {\"id\": \"G\", \"text\": \"cldr 為空\"},\n    {\"id\": \"H\", \"text\": \"去文字得 bcp47\"},\n    {\"id\": \"I\", \"text\": \"取 l10n\", \"key\": true}\n  ],\n  \"edges\": [\n    {\"from\": \"A\", \"to\": \"B\"},\n    {\"from\": \"B\", \"to\": \"C\"},\n    {\"from\": \"C\", \"to\": \"D\", \"label\": \"是\"},\n    {\"from\": \"C\", \"to\": \"E\", \"label\": \"否\"},\n    {\"from\": \"E\", \"to\": \"F\", \"label\": \"是\"},\n    {\"from\": \"E\", \"to\": \"G\", \"label\": \"否\"},\n    {\"from\": \"D\", \"to\": \"H\"},\n    {\"from\": \"F\", \"to\": \"H\"},\n    {\"from\": \"G\", \"to\": \"H\"},\n    {\"from\": \"H\", \"to\": \"I\"}\n  ]\n}\n```\n\n![locale 解析](locale.圖1.svg)\n\n1. 底線換成連字號，依 BCP 47 慣例統一大小寫：語言小寫、文字首字大寫、地區大寫。\n2. 已帶文字子標籤，例如 zh-Hant-TW 或 zh-Hant，視為已是 cldr，直接保留。\n3. 否則查 CLDR 對照表，命中取對照值，未命中為空。\n4. bcp47 由 cldr 或正規化輸入移除文字子標籤而得。\n5. l10n 依序退回 cldr、bcp47、原始輸入。\n\n來源：1. [useLocale.ts][]\n\n### CLDR 對照表\n\n對照表只收帶地區的 key；裸語言碼一律不擴展，行為與不在表內的語言相同。\n\n涵蓋 11 種語言：中文 zh、塞爾維亞 sr、烏茲別克 uz、亞塞拜然 az、哈薩克 kk、蒙古 mn、庫德 ku、旁遮普 pa、信德 sd、塔吉克 tg、韃靼 tt。\n\n| 輸入 | 對照值 |\n| :--- | :--- |\n| zh-CN | zh-Hans-CN |\n| zh-TW | zh-Hant-TW |\n| sr-ME | sr-Latn-ME |\n| mn-CN | mn-Mong-CN |\n| uz-AF | uz-Arab-AF |\n| pa-PK | pa-Arab-PK |\n| sd-IN | sd-Deva-IN |\n\n來源：1. [useLocale.ts][]\n\n## 行為範例\n\n| 輸入 | bcp47 | cldr | l10n |\n| :--- | :--- | :--- | :--- |\n| zh-TW、zh-Hant-TW、zh_Hant_TW、ZH-tw | zh-TW | zh-Hant-TW | zh-Hant-TW |\n| zh-CN | zh-CN | zh-Hans-CN | zh-Hans-CN |\n| zh，裸碼 | zh | `undefined` | zh |\n| zh-Hant，只有文字子標籤 | zh | zh-Hant | zh-Hant |\n| en-US | en-US | `undefined` | en-US |\n| `undefined` | `undefined` | `undefined` | `undefined` |\n\n## 相關頁面\n\n- [i18n 語系系統](./i18n-locales.md)：專案語系註冊與 fallback 鏈\n- [FieldLabel](../features/components/FieldLabel.md)\n- [useLocale 參考頁](../features/composables/useLocale.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useLocale.ts | [app/composables/useLocale.ts](../../../app/composables/useLocale.ts) |\n\n[useLocale.ts]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"useLocale","summary":"`useLocale` 是語系格式正規化 composable：把單一 locale 字串正規化成 `bcp47`、`cldr`、`l10n` 三種表示，各為一個 computed。輸入可為 bcp47 或 cldr 格式，大小寫不敏感，底線與連字號分隔皆可；參數型別是 `MaybeRefOrGetter<string | undefined>`。"},"platform/overlay-scrollbar.md":{"md":"# 自訂捲軸系統\n\n## Summary\n\n`CamelotOverlayScrollbar` 是附著在既有捲動容器上的自訂 overlay 捲軸，本身不建立捲動容器，以 `orientation` 切換水平或垂直；Table 的兩軸都用它取代原生捲軸。核心邏輯在方向感知的 `useCamelotOverlayScrollbar`。它與自建捲動容器、以 slot 包內容的包裝式 `CamelotScrollbar` 定位不同，兩者並存。\n\n## 運作方式\n\n### 架構\n\n這張圖回答：Table 的兩條捲軸怎麼附著在同一個捲動容器上？\n\n```json diagram id=圖1\n{\n  \"type\": \"flow\",\n  \"dir\": \"TD\",\n  \"title\": \"Table 捲軸附著\",\n  \"desc\": \"Table 隱藏捲動容器的原生捲軸，疊上水平與垂直兩個 overlay 捲軸，兩者共用方向感知核心去量測與拖曳容器\",\n  \"nodes\": [\n    {\"id\": \"Table\", \"text\": \"Table\", \"shape\": \"stadium\"},\n    {\"id\": \"Scroll\", \"text\": \"捲動容器\", \"key\": true},\n    {\"id\": \"HBar\", \"text\": \"水平捲軸\"},\n    {\"id\": \"VBar\", \"text\": \"垂直捲軸\"},\n    {\"id\": \"Core\", \"text\": \"方向感知核心\"}\n  ],\n  \"edges\": [\n    {\"from\": \"Table\", \"to\": \"Scroll\", \"label\": \"隱藏原生軸\"},\n    {\"from\": \"Table\", \"to\": \"HBar\", \"label\": \"傳入容器\"},\n    {\"from\": \"Table\", \"to\": \"VBar\", \"label\": \"傳入容器\"},\n    {\"from\": \"HBar\", \"to\": \"Core\"},\n    {\"from\": \"VBar\", \"to\": \"Core\"},\n    {\"from\": \"Core\", \"to\": \"Scroll\", \"label\": \"量測與定位\"}\n  ]\n}\n```\n\n![Table 捲軸附著](overlay-scrollbar.圖1.svg)\n\n| 單元 | 職責 |\n| :--- | :--- |\n| 核心 composable | 抽象主軸與交叉軸：水平的主軸是 X，垂直的主軸是 Y；負責量測、thumb 幾何、拖曳、hover、停靠與浮動 |\n| 捲軸元件 | 呼叫核心，渲染 track、thumb 與 bar；水平浮動時 Teleport 到 body |\n\n來源：1. [useCamelotOverlayScrollbar.ts][]　2. [OverlayScrollbar.vue][]\n\n### 行為\n\n| 行為 | 說明 |\n| :--- | :--- |\n| thumb 尺寸 | 視覺 bar 8px，未 hover 時縮放一半成 4px；水平往上長、垂直往左長，帶淡邊陰影；命中區 10px |\n| 水平停靠 | 平時以絕對定位留在容器內，被圓角裁切 |\n| 水平浮動 | 啟用浮動且表格底部超出視窗時，Teleport 到 body，固定在視窗底 |\n| 垂直 | 恆停靠在右側；以起點偏移從表頭下方開始，可蓋過固定列 |\n| 重新量測 | 監聽容器與 window 的 scroll、resize，並以 ResizeObserver 同時觀察容器與內容元素 |\n\n換頁或資料變動時容器尺寸不變、內容高度改變，觀察內容元素才能即時重算並顯示捲軸。\n\n來源：1. [useCamelotOverlayScrollbar.ts][]　2. [OverlayScrollbar.vue][]\n\n## Props\n\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `container` | `HTMLElement \\| null` | — | 目標捲動容器，捲軸附著其上 |\n| `orientation` | `'horizontal' \\| 'vertical'` | — | 捲軸方向 |\n| `floatingEnabled` | `boolean` | `false` | 只對水平有效：表格底部超出視窗時是否浮動到視窗底 |\n| `color` | `CamelotColorRole` | `primary` | thumb 的色彩角色 |\n| `startInset` | `number` | `0` | 主軸起點偏移，例如垂直軸避開 sticky 表頭時傳表頭高度 |\n\n## Table 整合\n\n### 隱藏原生軸與疊加捲軸\n\n1. 捲動容器維持 overflow auto，保留原生滾輪、觸控與鍵盤捲動。\n2. 以 scrollbar-width 與
