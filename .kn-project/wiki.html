n```ts\nuseCamelotFileDrop(options: CamelotFileDropOptions): {\n  dragOver: Ref<boolean>\n  count: ComputedRef<number>\n  atMax: ComputedRef<boolean>\n  maxCount: ComputedRef<number>\n  entries: Ref<CamelotFileEntry[]>\n  setFiles: (list: File[]) => void\n  removeAt: (i: number) => void\n  pick: () => void\n  onDragOver: () => void\n  onDragLeave: () => void\n  onDrop: (e: DragEvent) => void\n}\n```\n\n## 參數\n\n| 欄位 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `model` | `Ref<File[] \\| null>` | — | 檔案清單 |\n| `accept` | `MaybeRefOrGetter<string>` | `'*'` | 接受的檔案型別，寫法同檔案輸入元素 |\n| `multiple` | `MaybeRefOrGetter<boolean>` | `true` | 多選；新檔累加到既有清單 |\n| `max` | `MaybeRefOrGetter<number>` | `0` | 最多檔數，0 代表不限 |\n| `disabled` | `MaybeRefOrGetter<boolean>` | `false` | 停用 |\n| `thumbnails` | `MaybeRefOrGetter<boolean>` | `true` | 是否為圖片產生縮圖 |\n| `onSelect` | `(files: File[]) => void` | — | 清單因選入或移除而變動時呼叫 |\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `dragOver` | `Ref<boolean>` | 是否正在拖曳懸停 |\n| `count` | `ComputedRef<number>` | 目前檔案數 |\n| `atMax` | `ComputedRef<boolean>` | 是否已達上限 |\n| `maxCount` | `ComputedRef<number>` | 上限值；不限時為 `Infinity` |\n| `entries` | `Ref<CamelotFileEntry[]>` | 由 model 衍生的檔案項目 |\n| `setFiles` | `(list) => void` | 過濾後寫入 model |\n| `removeAt` | `(i) => void` | 移除指定索引的檔案 |\n| `pick` | `() => void` | 開啟檔案選擇器 |\n| `onDragOver`、`onDragLeave`、`onDrop` | 事件處理函式 | 搭配 prevent 修飾子綁在拖放區 |\n\n## 相關型別與工具\n\n| 名稱 | 說明 |\n| --- | --- |\n| `CamelotFileKind` | `'image' \\| 'sheet' \\| 'pdf' \\| 'doc' \\| 'archive' \\| 'audio' \\| 'video' \\| 'file'` |\n| `CamelotFileEntry` | `file`、`url`、`kind`、`label`、`sizeText`、`colorClass`、`key` |\n| `camelotFileMeta(f)` | 回傳檔案的 kind、label 與 colorClass |\n| `camelotFormatFileSize(bytes)` | 轉成 B、KB、MB、GB；10 以上取整數，以下保留一位小數 |\n\n| 類型 | 副檔名 | MIME 前綴 | 色塊 |\n| --- | --- | --- | --- |\n| image | png、jpg、jpeg、gif、webp、svg、avif、bmp | image | `bg-purple-600` |\n| sheet | csv、xls、xlsx、ods、tsv | — | `bg-green-600` |\n| pdf | pdf | — | `bg-red-600` |\n| doc | doc、docx、txt、md、rtf、odt | — | `bg-blue-600` |\n| archive | zip、rar、7z、gz、tar | — | `bg-amber-600` |\n| audio | mp3、wav、flac、aac、ogg、m4a | audio | `bg-fuchsia-600` |\n| video | mp4、mov、avi、mkv、webm | video | `bg-cyan-600` |\n| file | 其他 | — | `bg-slate-500` |\n\n標籤為大寫副檔名；沒有副檔名時用 MIME，再沒有就顯示「檔案」。\n\n來源：1. [useCamelotFileDrop.ts][]\n\n## 相關頁面\n\n- [檔案拖放](../file-drop.md)\n- [FileDropzone](../components/FileDropzone.md)\n- [ImageDropzone](../components/ImageDropzone.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCamelotFileDrop.ts | [app/composables/useCamelotFileDrop.ts](../../../../app/composables/useCamelotFileDrop.ts) |\n\n[useCamelotFileDrop.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useCamelotFileDrop","summary":"`useCamelotFileDrop(options)` 是檔案拖放與選擇的 headless 核心：以 v-model 的檔案清單為單一真相來源，衍生含型別、大小文字與縮圖的項目，並提供拖放事件處理與檔案選擇器。FileDropzone 與 ImageDropzone 共用它，也可單獨把任意元素變成拖放區。"},"features/composables/useCamelotMenuItemTheme.md":{"md":"# 選單項主題\n\n## Summary\n\n`useCamelotMenuItemTheme()` 是選單與選項列的共用樣式核心，依目前主題風格回傳選中態與 hover 態的 class。CascadeMenu 的飛出面板與 SelectV2 的下拉選項共用它，確保兩者效果一致。顏色一律取自上層注入的當前色 CSS 變數。\n\n## 運作方式\n\n1. 從 useCamelotTheme 讀取目前主題風格。\n2. 依風格回傳兩個 computed class 字串：選中態與未選 hover 態。\n3. 顏色取自色彩角色 class 注入的當前色與當前前景色兩個 CSS 變數。\n4. class 字串全為字面量，Tailwind v4 掃描器才能在編譯期產生對應 utility。\n\n| 主題 | 選中態 | 未選 hover |\n| --- | --- | --- |\n| aqua | aqua-fill 填色，文字用當前前景色 | 當前色 12% 底 |\n| scifi | 當前色 18% 底，文字當前色，帶文字光暈 | 當前色 10% 底，文字轉當前色 |\n| cupertino | 當前色 12% 底，文字當前色，semibold | 當前色 8% 底 |\n| material | 當前色 12% 底，文字當前色，medium | 當前色 8% 底 |\n\n未選態的文字色一律為 on-surface。\n\n來源：1. [useCamelotMenuItemTheme.ts][]　2. [SelectV2.vue][]　3. [CascadeMenuPanel.vue][]\n\n## 用法\n\n```ts\nconst { activeClass, hoverClass } = useCamelotMenuItemTheme()\n```\n\n```vue\n<li :class=\"[roleColorClass, selected ? activeClass : hoverClass]\">…<\/li>\n```\n\n## 簽章\n\n```ts\nuseCamelotMenuItemTheme(): {\n  activeClass: ComputedRef<string>\n  hoverClass: ComputedRef<string>\n}\n```\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `activeClass` | `ComputedRef<string>` | 選中態的 class |\n| `hoverClass` | `ComputedRef<string>` | 未選態的文字色與 hover 底色 class |\n\n## 相關頁面\n\n- [角色色彩類別](./useCamelotRoleColorClass.md)：注入當前色 CSS 變數。\n- [SelectV2](../components/SelectV2.md)\n- [CascadeMenu](../components/CascadeMenu.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCamelotMenuItemTheme.ts | [app/composables/useCamelotMenuItemTheme.ts](../../../../app/composables/useCamelotMenuItemTheme.ts) |\n| SelectV2.vue | [app/components/Camelot/SelectV2.vue](../../../../app/components/Camelot/SelectV2.vue) |\n| CascadeMenuPanel.vue | [app/components/Camelot/Internal/CascadeMenuPanel.vue](../../../../app/components/Camelot/Internal/CascadeMenuPanel.vue) |\n\n[useCamelotMenuItemTheme.ts]: #references\n[SelectV2.vue]: #references\n[CascadeMenuPanel.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"選單項主題","summary":"`useCamelotMenuItemTheme()` 是選單與選項列的共用樣式核心，依目前主題風格回傳選中態與 hover 態的 class。CascadeMenu 的飛出面板與 SelectV2 的下拉選項共用它，確保兩者效果一致。顏色一律取自上層注入的當前色 CSS 變數。"},"features/composables/useCamelotOverlayScrollbar.md":{"md":"# 覆蓋式捲軸\n\n## Summary\n\n`useCamelotOverlayScrollbar(container, orientation, floatingEnabled, thumbColor, mainStartInset)` 是自訂覆蓋式捲軸的方向感知核心：附著在既有捲動容器上，量測幾何，產生 track、thumb、bar 三組樣式，並處理拖曳與 hover。水平捲軸可貼容器底或浮動到視窗底，垂直捲軸固定貼在右側。OverlayScrollbar 元件以它實作。\n\n## 運作方式\n\n### 量測\n\n主軸就是捲動方向：水平讀橫向的捲動位置、內容寬與可視寬，垂直讀縱向的對應值。\n\n1. 容器不存在、主軸沒有溢出，或容器完全在視窗外時，隱藏捲軸並結束。\n2. 記錄內容長度、可視長度與目前捲動位置。\n3. track 長度等於可視長度扣掉起點偏移與兩端內縮。\n4. thumb 長度依可視比例計算，最小 40px。\n5. 水平、允許浮動，且容器底部超出視窗時，改為浮動狀態。\n\n來源：1. [useCamelotOverlayScrollbar.ts][]\n\n### 定位與外觀\n\n| 狀態 | track 位置 |\n| --- | --- |\n| 水平貼底 | 容器內絕對定位，距底 2px，左右內縮 6px，左側另加起點偏移 |\n| 水平浮動 | 視窗固定定位，距視窗底 6px，左緣對齊容器左緣加 6px |\n| 垂直 | 容器內絕對定位，距右 2px，上方從起點偏移加 6px 開始 |\n\n| 狀態 | bar 外觀 |\n| --- | --- |\n| 平時 | 交叉軸縮為一半，thumb 色 55% 混透明，2px 淡邊 |\n| hover 或拖曳 | 恢復全寬，完整 thumb 色，4px 光暈 |\n\nthumb 只放隨拖曳變動的尺寸、位移與游標；bar 的視覺樣式分開計算，拖曳期間 bar 物件參照不變，CSS transition 不會被重啟。\n\n來源：1. [useCamelotOverlayScrollbar.ts][]\n\n### 拖曳\n\n1. 按下 thumb：進入拖曳狀態，記下起點與當時捲動位置，並 capture 指標。\n2. 移動：把指標位移依 thumb 可移動範圍換算成捲動距離，直接寫回容器。\n3. 放開：結束拖曳並釋放 capture。\n\n來源：1. [useCamelotOverlayScrollbar.ts][]\n\n### 重新量測時機\n\n| 觸發 | 處理 |\n| --- | --- |\n| 容器自身捲動 | 只更新捲動位置，不重新量測 |\n| 視窗捲動，以 capture 監聽 | 排入下一幀量測 |\n| 視窗 resize | 排入下一幀量測 |\n| 容器與其第一個子元素尺寸變動 | 排入下一幀量測，涵蓋換頁等只改內容的情況 |\n| 掛載後 | nextTick 直接量測 |\n| 方向、浮動開關或起點偏移變動 | 直接量測 |\n\n排入的量測以單一 pending 的 requestAnimationFrame 合併，每幀最多量測一次；scope 結束時取消尚未執行的那一幀。\n\n來源：1. [useCamelotOverlayScrollbar.ts][]\n\n## 用法\n\n```ts\nconst container = useTemplateRef<HTMLElement>('container')\n\nconst {\n  visible, trackStyle, thumbStyle, barStyle,\n  onThumbDown, onThumbMove, onThumbUp, onThumbEnter, onThumbLeave,\n} = useCamelotOverlayScrollbar(\n  container,\n  () => 'vertical',\n  () => false,\n  () => 'var(--color-primary)',\n  () => 48,\n)\n```\n\n## 簽章\n\n```ts\nuseCamelotOverlayScrollbar(\n  container: Readonly<ShallowRef<HTMLElement | null>>,\n  orientation: () => CamelotScrollbarOrientation,\n  floatingEnabled: () => boolean,\n  thumbColor?: () => string,\n  mainStartInset?: () => number,\n): {\n  visible, floating, trackStyle, thumbStyle, barStyle,\n  onThumbDown, onThumbMove, onThumbUp, onThumbEnter, onThumbLeave,\n}\n\ntype CamelotScrollbarOrientation = 'horizontal' | 'vertical'\n```\n\n## 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `container` | `Readonly<ShallowRef<HTMLElement \\| null>>` | 必填 | 附著的捲動容器 |\n| `orientation` | `() => CamelotScrollbarOrientation` | 必填 | 主軸方向 |\n| `floatingEnabled` | `() => boolean` | 必填 | 是否允許浮動到視窗底，只對水平有效 |\n| `thumbColor` | `() => string` | `() => 'var(--cml-c-m3-on-surface)'` | thumb 顏色，接受 CSS 色彩運算式 |\n| `mainStartInset` | `() => number` | `() => 0` | 主軸起點額外偏移，單位 px，例如避開 sticky 表頭 |\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `visible` | `Ref<boolean>` | 是否顯示捲軸 |\n| `floating` | `Ref<boolean>` | 水平捲軸是否處於浮動狀態 |\n| `trackStyle` | `ComputedRef<CSSProperties>` | track 定位樣式 |\n| `thumbStyle` | `ComputedRef<CSSProperties>` | thumb 命中區的尺寸、位移與游標 |\n| `barStyle` | `ComputedRef<CSSProperties>` | bar 的縮放、顏色與淡邊 |\n| `onThumbDown` | `(e: PointerEvent) => void` | 開始拖曳 |\n| `onThumbMove` | `(e: PointerEvent) => void` | 拖曳中更新捲動位置 |\n| `onThumbUp` | `(e: PointerEvent) => void` | 結束拖曳 |\n| `onThumbEnter` | `() => void` | 進入 hover |\n| `onThumbLeave` | `() => void` | 離開 hover |\n\n## 常數\n\n| 常數 | 值 | 說明 |\n| --- | --- | --- |\n| `MIN_THUMB_SIZE` | 40 | thumb 最小長度，px |\n| `MAIN_INSET` | 6 | 主軸兩端內縮，px |\n| `CROSS_INSET` | 2 | 交叉軸內縮，px |\n| `VIEWPORT_GAP` | 6 | 浮動時距視窗底，px |\n\n## 相關頁面\n\n- [OverlayScrollbar](../components/OverlayScrollbar.md)\n- [自訂捲軸系統](../../platform/overlay-scrollbar.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCamelotOverlayScrollbar.ts | [app/composables/useCamelotOverlayScrollbar.ts](../../../../app/composables/useCamelotOverlayScrollbar.ts) |\n\n[useCamelotOverlayScrollbar.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"覆蓋式捲軸","summary":"`useCamelotOverlayScrollbar(container, orientation, floatingEnabled, thumbColor, mainStartInset)` 是自訂覆蓋式捲軸的方向感知核心：附著在既有捲動容器上，量測幾何，產生 track、thumb、bar 三組樣式，並處理拖曳與 hover。水平捲軸可貼容器底或浮動到視窗底，垂直捲軸固定貼在右側。OverlayScrollbar 元件以它實作。"},"features/composables/useCamelotPickerTheme.md":{"md":"# 選擇器主題\n\n## Summary\n\n`useCamelotPickerTheme()` 集中 DateV2、DateRangeV2、TimeV2 與內部日曆的四主題樣式，回傳 `themeMode`、`triggerClass`、`triggerOpenClass`、`panelClass`、`selectedSurfaceClass`。觸發欄位與同主題的 Input 同一套外觀，最低高度 42px（Sci-Fi 內容區 40px，加上 HUD 外框共 42px）；展開時套上對應 Input 聚焦效果的樣式。\n\n## 運作方式\n\n1. 從 useCamelotTheme 讀取目前主題風格，原樣回傳為 themeMode。\n2. 依風格回傳四個 computed class 字串；未列出的風格一律走 material 分支。\n3. 日期與時間元件把觸發欄位 class 綁在觸發 label 上，展開時再加上展開 class。\n4. 內部日曆只取選中態表面 class，用在選中的日、月、年。\n5. Sci-Fi 的觸發欄位外框由 FieldFrame 內部元件負責，這裡只給最低高度。\n\n來源：1. [useCamelotPickerTheme.ts][]　2. [DateV2.vue][]　3. [DateRangeV2.vue][]　4. [TimeV2.vue][]　5. [Calendar.vue][]　6. [FieldFrame.vue][]\n\n### 觸發欄位\n\n| 主題 | 觸發欄位 | 展開或聚焦 |\n| --- | --- | --- |\n| aqua | 最低 42px，aqua-track 軌道底，Aqua 控制項圓角，背景模糊 | aqua-glow 光暈 |\n| scifi | 內容區最低 40px，加上 FieldFrame 提供的 HUD 外框共 42px | 無額外 class |\n| cupertino | 最低 42px，10px 圓角，透明邊框，surface-container-highest 底 | 改 surface 底，加 1px 當前色內框線 |\n| material | 最低 42px，上緣 4px 圓角，底線 outline 色，surface-container-highest 底 | 底線與 1px 內陰影改當前色 |\n\n來源：1. [useCamelotPickerTheme.ts][]\n\n### 面板與選中態\n\n| 主題 | 面板 | 選中態表面 |\n| --- | --- | --- |\n| aqua | aqua-glass 玻璃，Aqua 面板圓角 | aqua-fill 填色，文字當前前景色 |\n| scifi | 直角，主色 40% 邊框，主色 15% 光暈 | 當前色 85% 底，發光陰影 |\n| cupertino | surface 底，2xl 圓角 | 當前色實心底 |\n| material | surface 底，xl 圓角 | 當前色實心底，加小陰影 |\n\n選中態在 aqua 以外的主題，沒有注入當前色時退回主色與主色前景色。\n\n來源：1. [useCamelotPickerTheme.ts][]\n\n## 用法\n\n```ts\nconst { themeMode, triggerClass, triggerOpenClass, panelClass } = useCamelotPickerTheme()\n```\n\n```vue\n<label :class=\"[triggerClass, open ? triggerOpenClass : '']\">…<\/label>\n```\n\n## 簽章\n\n```ts\nuseCamelotPickerTheme(): {\n  themeMode: Ref<CamelotThemeMode>\n  triggerClass: ComputedRef<string>\n  triggerOpenClass: ComputedRef<string>\n  panelClass: ComputedRef<string>\n  selectedSurfaceClass: ComputedRef<string>\n}\n```\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `themeMode` | `Ref<CamelotThemeMode>` | 目前主題風格，與 useCamelotTheme 共用同一個 ref |\n| `triggerClass` | `ComputedRef<string>` | 觸發欄位外框樣式，與同主題 Input 一致 |\n| `triggerOpenClass` | `ComputedRef<string>` | 觸發欄位展開或聚焦時追加的樣式 |\n| `panelClass` | `ComputedRef<string>` | 日曆浮層或對話框容器的表面樣式 |\n| `selectedSurfaceClass` | `ComputedRef<string>` | 選中的日、月、年的表面樣式 |\n\n## 相關頁面\n\n- [DateV2](../components/DateV2.md)\n- [DateRangeV2](../components/DateRangeV2.md)\n- [TimeV2](../components/TimeV2.md)\n- [Internal Calendar](../components/Internal-Calendar.md)\n- [useCamelotTheme](./useCamelotTheme.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCamelotPickerTheme.ts | [app/composables/useCamelotPickerTheme.ts](../../../../app/composables/useCamelotPickerTheme.ts) |\n| DateV2.vue | [app/components/Camelot/DateV2.vue](../../../../app/components/Camelot/DateV2.vue) |\n| DateRangeV2.vue | [app/components/Camelot/DateRangeV2.vue](../../../../app/components/Camelot/DateRangeV2.vue) |\n| TimeV2.vue | [app/components/Camelot/TimeV2.vue](../../../../app/components/Camelot/TimeV2.vue) |\n| Calendar.vue | [app/components/Camelot/Internal/Calendar.vue](../../../../app/components/Camelot/Internal/Calendar.vue) |\n| FieldFrame.vue | [app/components/Camelot/Internal/FieldFrame.vue](../../../../app/components/Camelot/Internal/FieldFrame.vue) |\n\n[useCamelotPickerTheme.ts]: #references\n[DateV2.vue]: #references\n[DateRangeV2.vue]: #references\n[TimeV2.vue]: #references\n[Calendar.vue]: #references\n[FieldFrame.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"選擇器主題","summary":"`useCamelotPickerTheme()` 集中 DateV2、DateRangeV2、TimeV2 與內部日曆的四主題樣式，回傳 `themeMode`、`triggerClass`、`triggerOpenClass`、`panelClass`、`selectedSurfaceClass`。觸發欄位與同主題的 Input 同一套外觀，最低高度 42px（Sci-Fi 內容區 40px，加上 HUD 外框共 42px）；展開時套上對應 Input 聚焦效果的樣式。"},"features/composables/useCamelotRoleColorClass.md":{"md":"# 角色色彩類別\n\n## Summary\n\n`useCamelotRoleColorClass(color, isContainer)` 把色彩角色轉成一組 Tailwind 任意屬性 class，在元素上設定 `--cml-color-current-color` 與 `--cml-color-current-on-color` 兩個 CSS 變數。路由元件以它注入當前色，葉元件與面板再以 var() 取用，四種主題共用同一套色彩來源。\n\n## 運作方式\n\n1. 依 isContainer 選擇一般色或容器色的對照表。\n2. 以色彩角色查表，回傳對應的 class 字串，color 或 isContainer 變動時重新計算。\n3. 把 class 綁到元素上，子孫即可讀到兩個當前色變數。\n4. class 字串全為字面量，Tailwind v4 掃描器才能在編譯期產生對應 utility。\n\n| 模式 | 當前色 | 當前前景色 |\n| --- | --- | --- |\n| 一般色 | 角色色，例如 `--color-primary` | 角色前景色，例如 `--color-on-primary` |\n| 容器色 | 角色容器色，例如 `--color-primary-container` | 容器前景色，例如 `--color-on-primary-container` |\n\n支援的角色：primary、secondary、tertiary、error、info、warning、success。\n\n浮層 Teleport 離開原本的 DOM 位置後，CSS 變數的繼承會中斷，面板需要自行再套一次這組 class。\n\n來源：1. [useCamelotRoleColorClass.ts][]\n\n## 用法\n\n```ts\nconst colorClass = useCamelotRoleColorClass(() => props.color, () => props.container)\n```\n\n```vue\n<div :class=\"colorClass\">\n  <span class=\"bg-[var(--cml-color-current-color)] text-[var(--cml-color-current-on-color)]\">…<\/span>\n<\/div>\n```\n\n## 簽章\n\n```ts\nuseCamelotRoleColorClass(\n  color: MaybeRefOrGetter<CamelotColorRole>,\n  isContainer: MaybeRefOrGetter<boolean> = false,\n): ComputedRef<string>\n```\n\n## 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `color` | `MaybeRefOrGetter<CamelotColorRole>` | — | 色彩角色 |\n| `isContainer` | `MaybeRefOrGetter<boolean>` | `false` | 為 `true` 時使用容器色 |\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| （回傳值） | `ComputedRef<string>` | 設定兩個當前色變數的 class 字串 |\n\n## 相關頁面\n\n- [選單項主題](./useCamelotMenuItemTheme.md)：消費當前色變數的選中與 hover 樣式。\n- [浮層傳送目標](./useCamelotTeleportTarget.md)：浮層離開 DOM 後的變數繼承問題。\n- [色彩主題系統](../../platform/color-scheme.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCamelotRoleColorClass.ts | [app/composables/useCamelotRoleColorClass.ts](../../../../app/composables/useCamelotRoleColorClass.ts) |\n\n[useCamelotRoleColorClass.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"角色色彩類別","summary":"`useCamelotRoleColorClass(color, isContainer)` 把色彩角色轉成一組 Tailwind 任意屬性 class，在元素上設定 `--cml-color-current-color` 與 `--cml-color-current-on-color` 兩個 CSS 變數。路由元件以它注入當前色，葉元件與面板再以 var() 取用，四種主題共用同一套色彩來源。"},"features/composables/useCamelotRouter.md":{"md":"# useCamelotRouter\n\n## Summary\n\n`useCamelotRouter()` 包裝 Vue Router，並維護一份模組層的 App 內歷史堆疊，提供 single 單例導覽、CamelotPath 路徑物件與返回判斷。single 有 task 與 only 兩種模式。堆疊由 Layer 內建的 camelotRouter plugin 在每次導覽完成後自動同步，使用端不必自行呼叫同步函式。\n\n## 運作方式\n\n### 歷史堆疊同步\n\n1. plugin 在 router 的 afterEach 呼叫同步函式，此時網址與瀏覽器歷史狀態都已更新。\n2. 以 router 歷史狀態的 position 作為這筆紀錄的位置。\n3. 堆疊裡已有同一位置：視為返回或替換，截掉它之後的紀錄，並把路徑更新為含 query 的完整路徑。\n4. 沒有同一位置：新增一筆，記錄路徑、路由名稱與位置。\n\n來源：1. [useCamelotRouter.ts][]　2. [camelotRouter.ts][]\n\n### single 單例導覽\n\n目前位置取自瀏覽器歷史狀態的 position，沒有時視為 0。\n\n| 模式 | 行為 |\n| --- | --- |\n| task | 在堆疊找相符頁；找到且位置比目前淺，就退回該位置，等 100ms 後 replace 成目標；否則依 replace 選項直接 replace 或 push |\n| only | 堆疊有紀錄且目前位置比第一筆深時，先退回第一筆的位置；接著清空堆疊，等 100ms 後 replace 成目標 |\n\n| 選項 | 預設 | 說明 |\n| --- | --- | --- |\n| `replace` | `true` | task 模式找不到相符頁時，以 replace 還是 push 導向 |\n| `checkName` | `true` | 比對時具名路由以名稱為準，忽略 params 差異 |\n| `mode` | `'task'` | 導覽模式 |\n\n比對規則：開啟名稱比對且目標有路由名稱時先比名稱，否則比對路徑或解析後的路徑。\n\n來源：1. [useCamelotRouter.ts][]\n\n### 返回\n\n1. canBack 讀 router 歷史狀態的 back 欄位，有值才算可返回。\n2. back 預設只在可返回時呼叫 router.back；傳入 false 時不檢查、直接返回。\n\n來源：1. [useCamelotRouter.ts][]\n\n### CamelotPath\n\n| 成員 | 說明 |\n| --- | --- |\n| 建構子 | 把連續兩個斜線合併成一個，並去掉結尾斜線，根路徑除外 |\n| `path` | 正規化後的路徑 |\n| `fullPath` | origin 加上 app.baseURL 再加路徑，路徑的開頭斜線會去掉 |\n| `name` | 以 router 解析出的路由名稱 |\n| `to(queryAndHash?)` | 以 navigateTo 導向 |\n| `replace(queryAndHash?)` | 以 navigateTo 取代目前紀錄 |\n| `single(options?)` | 呼叫 single，options 可另帶 queryAndHash |\n| `append(path)` | 串接子路徑，回傳新的 CamelotPath |\n\n來源：1. [useCamelotRouter.ts][]\n\n## 用法\n\n```ts\nconst { single, toPath, back } = useCamelotRouter()\nawait single({ path: '/home' }, { mode: 'only' })\nawait toPath('/user').append('profile').to({ query: { tab: 'info' } })\n```\n\n## 簽章\n\n```ts\nuseCamelotRouter(): {\n  findHistory: (to: RouteLocationRaw, options?: { checkName?: boolean }) => CamelotHistory | undefined\n  syncHistory: (to: RouteLocationNormalized) => void\n  back: (inApp?: boolean) => void\n  forward: Router['forward']\n  push: Router['push']\n  replace: Router['replace']\n  go: Router['go']\n  single: (to: RouteLocationRaw, options?: SingleOptions) => Promise<void>\n  canBack: () => boolean\n  toPath: (path: string) => CamelotPath\n}\n\ntype CamelotHistory = { path: string; name?: string | symbol | null; pos: number }\n```\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `findHistory` | `(to, options?) => CamelotHistory \\| undefined` | 在堆疊中尋找相符紀錄 |\n| `syncHistory` | `(to) => void` | 依目前歷史位置新增或更新堆疊紀錄，plugin 已自動呼叫 |\n| `back` | `(inApp = true) => void` | 返回上一頁 |\n| `forward`、`push`、`replace`、`go` | Router 原生方法 | 直接轉發 useRouter 的方法 |\n| `single` | `(to, options?) => Promise<void>` | 單例導覽 |\n| `canBack` | `() => boolean` | 是否有上一頁 |\n| `toPath` | `(path) => CamelotPath` | 建立路徑物件 |\n\n## 相關頁面\n\n- [BaseDialogV2](../components/BaseDialogV2.md)：關閉以 query 綁定的對話框時，以 canBack 決定返回上一頁或改為移除 query。\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCamelotRouter.ts | [app/composables/useCamelotRouter.ts](../../../../app/composables/useCamelotRouter.ts) |\n| camelotRouter.ts | [app/plugins/camelotRouter.ts](../../../../app/plugins/camelotRouter.ts) |\n\n[useCamelotRouter.ts]: #references\n[camelotRouter.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useCamelotRouter","summary":"`useCamelotRouter()` 包裝 Vue Router，並維護一份模組層的 App 內歷史堆疊，提供 single 單例導覽、CamelotPath 路徑物件與返回判斷。single 有 task 與 only 兩種模式。堆疊由 Layer 內建的 camelotRouter plugin 在每次導覽完成後自動同步，使用端不必自行呼叫同步函式。"},"features/composables/useCamelotTeleportTarget.md":{"md":"# 浮層傳送目標\n\n## Summary\n\n`useCamelotTeleportTarget(anchor)` 決定浮層應該 Teleport 到哪裡：錨點的祖先有 `<dialog>` 就進該對話框，否則回落 body。新增任何 popup 概念的元件都用它決定 Teleport 目標，不要自行寫死 body。\n\n## 運作方式\n\n### 判定方式\n\n1. 取錨點元素，沒有元素時視為不在對話框內。\n2. 以 closest 往上找最近的 dialog 祖先。\n3. 找到就回傳該元素，否則回傳字串 body，可直接綁到 Teleport 的 to。\n4. 兩者都是 computed，錨點變動時自動重算。\n\n來源：1. [useCamelotTeleportTarget.ts][]\n\n### 為什麼需要它\n\n原生 `<dialog>` 以 showModal 開啟時會建立自己的 top layer，該層之上沒有任何一般內容。\n\nTeleport 到 body 的浮層無論 z-index 開多高，都會被壓在對話框底下，既看不見也點不到。\n\n浮層改 Teleport 進最近的對話框祖先，成為對話框內的節點後，才輪得到 z-index 決定先後，見[疊層刻度](../../platform/layering.md)。\n\n> [!IMPORTANT]\n> 兩者是先後關係：**沒有先修好 Teleport 目標，單獨調高 z-index 完全無效。**\n\n來源：1. [useCamelotTeleportTarget.ts][]\n\n### 使用者\n\n| 元件 | 浮層 |\n| --- | --- |\n| [Tooltip](../components/Tooltip.md) | 提示浮層 |\n| [CascadeMenu](../components/CascadeMenu.md) | 各層飛出面板，由內部 CascadeMenuPanel 呼叫 |\n| [Internal TimeField](../components/Internal-TimeField.md) | 時、分、秒欄位的下拉清單 |\n\n[PopupV2](../components/PopupV2.md) 沒有使用本 composable，而是自行往上找對話框祖先，並提供 teleport prop 讓呼叫端指定目標。\n\n來源：1. [Tooltip.vue][]　2. [CascadeMenuPanel.vue][]　3. [TimeField.vue][]　4. [PopupV2.vue][]\n\n### 注意事項\n\n浮層離開原本的 DOM 位置後，CSS 自訂屬性的繼承會中斷：CSS 繼承跟著 DOM 樹，不跟元件樹；Vue 的 provide 與 inject 不受影響。\n\n目前各元件在浮層面板上再套一次色彩角色 class，補回當前色變數。\n\n來源：1. [CascadeMenuPanel.vue][]\n\n## 用法\n\n```vue\n<template>\n  <div ref=\"root\">\n    <Teleport :to=\"teleportTarget\">\n      <div class=\"fixed\" :style=\"{ zIndex: 'var(--cml-z-popup)' }\">\n        <!-- 浮層內容 -->\n      <\/div>\n    <\/Teleport>\n  <\/div>\n<\/template>\n\n<script setup lang=\"ts\">\nconst root = useTemplateRef<HTMLElement>('root')\nconst { teleportTarget } = useCamelotTeleportTarget(root)\n<\/script>\n```\n\n## 簽章\n\n```ts\nuseCamelotTeleportTarget(\n  anchor: MaybeRefOrGetter<HTMLElement | null | undefined>,\n): {\n  nearestDialog: ComputedRef<HTMLDialogElement | undefined>\n  teleportTarget: ComputedRef<HTMLElement | string>\n}\n```\n\n## 參數\n\n| 參數 | 型別 | 說明 |\n| --- | --- | --- |\n| `anchor` | `MaybeRefOrGetter<HTMLElement \\| null \\| undefined>` | 浮層的錨點，通常是觸發器 |\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `nearestDialog` | `ComputedRef<HTMLDialogElement \\| undefined>` | 最近的 dialog 祖先；沒有則為 `undefined` |\n| `teleportTarget` | `ComputedRef<HTMLElement \\| string>` | 對話框元素或字串 `'body'` |\n\n## 相關頁面\n\n- [疊層刻度](../../platform/layering.md)\n- [Composables 清單](../composables.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCamelotTeleportTarget.ts | [app/composables/useCamelotTeleportTarget.ts](../../../../app/composables/useCamelotTeleportTarget.ts) |\n| Tooltip.vue | [app/components/Camelot/Tooltip.vue](../../../../app/components/Camelot/Tooltip.vue) |\n| CascadeMenuPanel.vue | [app/components/Camelot/Internal/CascadeMenuPanel.vue](../../../../app/components/Camelot/Internal/CascadeMenuPanel.vue) |\n| TimeField.vue | [app/components/Camelot/Internal/TimeField.vue](../../../../app/components/Camelot/Internal/TimeField.vue) |\n| PopupV2.vue | [app/components/Camelot/PopupV2.vue](../../../../app/components/Camelot/PopupV2.vue) |\n\n[useCamelotTeleportTarget.ts]: #references\n[Tooltip.vue]: #references\n[CascadeMenuPanel.vue]: #references\n[TimeField.vue]: #references\n[PopupV2.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"浮層傳送目標","summary":"`useCamelotTeleportTarget(anchor)` 決定浮層應該 Teleport 到哪裡：錨點的祖先有 `<dialog>` 就進該對話框，否則回落 body。新增任何 popup 概念的元件都用它決定 Teleport 目標，不要自行寫死 body。"},"features/composables/useCamelotTheme.md":{"md":"# useCamelotTheme\n\n## Summary\n\n`useCamelotTheme()` 管理 Camelot 的主題風格、深淺色與品牌色。主題風格有 material、cupertino、scifi、aqua 四種，預設 aqua，存在 localStorage；切換風格、深淺色或色系時，全站顏色以漸變過場。狀態與副作用都是模組層單例，數百個元件同時呼叫也只有一份。\n\n## 運作方式\n\n### 共用狀態\n\n1. 主題風格是一個全站共用的 localStorage ref，鍵為 `cml-theme-mode`，在元件掛載後才讀取，避免 hydration 不一致。\n2. 深淺色取自 [useCamelotColorMode](./useCamelotColorMode.md) 的共用實例。\n3. 淺色與深色方案取自 [useCustomColorScheme](./useCustomColorScheme.md) 以 html 元素為目標的全域方案。\n4. 每次呼叫新建的只有兩個設定色彩的函式，以及全域方案附帶的一個 computed。\n\n主題風格 ref 與全域 watcher 掛在模組層的獨立 effect scope 上，不會因第一個呼叫的元件卸載而失效。\n\n來源：1. [useCamelotTheme.ts][]　2. [useCamelotColorMode.ts][]　3. [useCustomColorScheme.ts][]\n\n### 全域副作用\n\n第一次在瀏覽器端呼叫時註冊兩個 watcher，之後不再重複註冊：\n\n| watcher | 時機 | 動作 |\n| --- | --- | --- |\n| 主題風格 | 立即執行，之後每次變動 | 寫入 html 的 `--cml-active-ui-style` 與 `data-camelot-theme-mode` |\n| 主題風格與深淺色 | 變動時，初次載入不觸發 | 觸發顏色漸變過場 |\n\n來源：1. [useCamelotTheme.ts][]\n\n### 顏色漸變過場\n\n1. 沒有 document，或使用者偏好減少動態時，直接略過。\n2. 在 html 加上 `cml-theme-transitioning` class。\n3. 360ms 後移除；期間再次觸發只會重設同一個計時器。\n\n設定品牌色或任一色鍵時也會觸發過場。此函式另可獨立匯入使用。\n\n來源：1. [useCamelotTheme.ts][]\n\n## 用法\n\n```ts\nconst { themeMode, colorMode, setPrimaryColor } = useCamelotTheme()\nthemeMode.value = 'scifi'\ncolorMode.value = 'dark'\nsetPrimaryColor('#3366ff', '#88aaff')\n```\n\n## 簽章\n\n```ts\nuseCamelotTheme(): {\n  themeMode: Ref<CamelotThemeMode>\n  colorMode: Ref<BasicColorSchema>\n  lightColorScheme: Ref<CustomColorScheme>\n  darkColorScheme: Ref<CustomColorScheme>\n  setPrimaryColor: (lightColor: string, darkColor: string) => void\n  setThemeColor: (key: string, lightColor: string, darkColor: string) => void\n  triggerThemeTransition: () => void\n}\n\ntype CamelotThemeMode = 'material' | 'cupertino' | 'scifi' | 'aqua'\n```\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `themeMode` | `Ref<CamelotThemeMode>` | 目前主題風格，全站共用同一個 ref |\n| `colorMode` | `Ref<BasicColorSchema>` | 深淺色設定，可為 auto、light、dark |\n| `lightColorScheme` | `Ref<CustomColorScheme>` | 全域淺色方案 |\n| `darkColorScheme` | `Ref<CustomColorScheme>` | 全域深色方案 |\n| `setPrimaryColor` | `(lightColor, darkColor) => void` | 設定品牌主色，等同設定 primary 色鍵 |\n| `setThemeColor` | `(key, lightColor, darkColor) => void` | 同時設定某色鍵的淺色與深色值，並觸發過場 |\n| `triggerThemeTransition` | `() => void` | 手動觸發顏色漸變過場 |\n\n## 相關頁面\n\n- [主題系統](../../platform/theme-system.md)\n- [色彩主題系統](../../platform/color-scheme.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCamelotTheme.ts | [app/composables/useCamelotTheme.ts](../../../../app/composables/useCamelotTheme.ts) |\n| useCamelotColorMode.ts | [app/composables/useCamelotColorMode.ts](../../../../app/composables/useCamelotColorMode.ts) |\n| useCustomColorScheme.ts | [app/composables/useCustomColorScheme.ts](../../../../app/composables/useCustomColorScheme.ts) |\n\n[useCamelotTheme.ts]: #references\n[useCamelotColorMode.ts]: #references\n[useCustomColorScheme.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useCamelotTheme","summary":"`useCamelotTheme()` 管理 Camelot 的主題風格、深淺色與品牌色。主題風格有 material、cupertino、scifi、aqua 四種，預設 aqua，存在 localStorage；切換風格、深淺色或色系時，全站顏色以漸變過場。狀態與副作用都是模組層單例，數百個元件同時呼叫也只有一份。"},"features/composables/useCamelotToast.md":{"md":"# useCamelotToast\n\n## Summary\n\n`useCamelotToast()` 是全域單例的 Toast 通知佇列，提供開啟、新增、移除與清空通知的方法。通知預設顯示 3 秒後自動移除，可同時存在多則，由 Toast 元件依各自的位置呈現。\n\n## 運作方式\n\n### 新增通知\n\n1. 以預設值補齊：顯示 3000ms、類型 info、位置 bottom，並產生隨機 id；傳入的欄位會覆蓋預設值。\n2. 深拷貝後放進佇列；函式欄位如 onClose、action 的 handler 保留原參照。\n3. 選項 only 為 true 時，先清空所有通知與計時器再加入。\n4. 顯示時間大於 0 時設定計時器，到期自動移除；設為 0 則不會自動關閉。\n5. 回傳這則通知的 id。\n\nopen 接受字串或通知物件，字串會轉成只有 message 的通知，再走同樣流程。\n\n來源：1. [useCamelotToast.ts][]\n\n### 移除與清空\n\n1. removeToast 未傳 id 時不做任何事。\n2. 有 id 時先清掉該則的計時器，移出佇列，再呼叫它的 onClose。\n3. clear 清掉所有計時器並清空佇列，不呼叫任何 onClose。\n\n來源：1. [useCamelotToast.ts][]\n\n## 用法\n\n```ts\nconst toast = useCamelotToast()\ntoast.open('儲存成功', { only: true })\nconst id = toast.addToast({ message: '刪除中…', type: 'warning', duration: 0 })\ntoast.removeToast(id)\n```\n\n## 簽章\n\n```ts\nuseCamelotToast(): {\n  toasts: Ref<CamelotToast[]>\n  currentToast: ComputedRef<CamelotToast | null>\n  addToast: (toast: CamelotToast, options?: CamelotToastOptions) => string | undefined\n  removeToast: (id?: string) => void\n  open: (messageOrToast: string | CamelotToast, options?: CamelotToastOptions) => string | undefined\n  clear: () => void\n}\n```\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `toasts` | `Ref<CamelotToast[]>` | 所有通知，以 useState 的 `Camelot:Toasts` 保存 |\n| `currentToast` | `ComputedRef<CamelotToast \\| null>` | 佇列第一則，供舊用法相容；沒有則為 `null` |\n| `addToast` | `(toast, options?) => string \\| undefined` | 新增通知並回傳 id |\n| `removeToast` | `(id?) => void` | 移除指定通知並呼叫其 onClose |\n| `open` | `(messageOrToast, options?) => string \\| undefined` | 以字串或物件開啟通知 |\n| `clear` | `() => void` | 清空所有通知 |\n\n## 型別\n\n| 型別 | 欄位 |\n| --- | --- |\n| `CamelotToast` | `id?`、`message`、`title?`、`type?`、`color?`、`duration?`、`position?`、`action?`、`onClose?` |\n| `CamelotToastOptions` | `only?` |\n| `CamelotToastType` | `'success' \\| 'error' \\| 'info' \\| 'warning'` |\n| `CamelotToastPosition` | `'top' \\| 'bottom' \\| 'left' \\| 'right' \\| 'center' \\| 'top-left' \\| 'top-right' \\| 'bottom-left' \\| 'bottom-right'` |\n| `CamelotToastAction` | `{ label: string; handler?: () => void }` |\n\n| 欄位 | 預設 | 說明 |\n| --- | --- | --- |\n| `duration` | `3000` | 顯示毫秒數；0 代表不自動關閉 |\n| `type` | `'info'` | 狀態類型，決定狀態色 |\n| `color` | — | 直接指定色彩角色，優先於類型對應的狀態色 |\n| `position` | `'bottom'` | 顯示位置 |\n\n來源：1. [useCamelotToast.ts][]\n\n## 相關頁面\n\n- [Toast](../components/Toast.md)：顯示佇列的元件。\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCamelotToast.ts | [app/composables/useCamelotToast.ts](../../../../app/composables/useCamelotToast.ts) |\n\n[useCamelotToast.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useCamelotToast","summary":"`useCamelotToast()` 是全域單例的 Toast 通知佇列，提供開啟、新增、移除與清空通知的方法。通知預設顯示 3 秒後自動移除，可同時存在多則，由 Toast 元件依各自的位置呈現。"},"features/composables/useCamelotVirtual.md":{"md":"# useCamelotVirtual\n\n## Summary\n\n`useCamelotVirtual(scrollEl, count, estimate, options)` 是可變列高的虛擬視窗計算：先以預估尺寸排版，渲染後由呼叫端回報實際尺寸並快取，逐步修正可視範圍。回傳前後留白尺寸，呼叫端以「前後撐高、中間實際渲染」的方式虛擬化，div 或表格的 spacer 列皆適用。VirtualScroll 與 Table 以它實作。\n\n## 運作方式\n\n### 計算流程\n\n1. 尺寸陣列長度隨項目總數同步，新項目以預估尺寸填入。\n2. 前綴和記錄每一項的起始位置，總尺寸即最後一項的結束位置。\n3. 可視上緣是捲動位置扣掉 headerOffset，下緣再加上可視高度或寬度。\n4. 以二分搜尋找出上下緣所在的索引，前後各加 overscan 項，得到渲染範圍。\n5. 前方留白為範圍起點的位置，後方留白為總尺寸扣掉範圍終點的位置。\n\n來源：1. [useCamelotVirtual.ts][]\n\n### 尺寸回報與效能\n\n| 設計 | 說明 |\n| --- | --- |\n| 原地寫入 | 尺寸存在非響應式陣列，setSize 為 O(1)，不複製整條陣列 |\n| 版本計數 | 另以一個 ref 作為響應式訊號，同一輪的多次 setSize 以 microtask 合併成一次遞增 |\n| 增量前綴和 | 記下最小受影響索引，只重算其後的區間，前段沿用快取 |\n| 不用 computed | 前綴和快取重用同一個陣列參照，computed 以 Object.is 比對會停止更新；改由各 computed 自行讀取版本計數 |\n| 忽略的回報 | 尺寸小於等於 0、與快取相同，或索引超出範圍時略過 |\n\n來源：1. [useCamelotVirtual.ts][]\n\n### 捲動監聽\n\n1. 捲動容器出現時立即讀取一次捲動位置與可視尺寸。\n2. 監聽容器的 scroll 事件，並以 ResizeObserver 觀察容器尺寸，兩者都重新讀取。\n3. 容器更換或卸載時移除監聽；沒有 window 時不掛載。\n\n來源：1. [useCamelotVirtual.ts][]\n\n## 用法\n\n```ts\nconst scrollEl = ref<HTMLElement | null>(null)\nconst { visibleIndices, topPad, bottomPad, setSize } = useCamelotVirtual(\n  scrollEl, () => items.value.length, 48, { overscan: 6 },\n)\n```\n\n## 簽章\n\n```ts\nuseCamelotVirtual(\n  scrollEl: Ref<HTMLElement | null | undefined>,\n  count: MaybeRefOrGetter<number>,\n  estimate: MaybeRefOrGetter<number>,\n  options?: {\n    overscan?: MaybeRefOrGetter<number>\n    horizontal?: MaybeRefOrGetter<boolean>\n    headerOffset?: MaybeRefOrGetter<number>\n  },\n): {\n  range: ComputedRef<{ start: number; end: number }>\n  visibleIndices: ComputedRef<number[]>\n  topPad: ComputedRef<number>\n  bottomPad: ComputedRef<number>\n  totalSize: ComputedRef<number>\n  setSize: (index: number, size: number) => void\n  scrollToIndex: (index: number) => void\n  readScroll: () => void\n}\n```\n\n## 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `scrollEl` | `Ref<HTMLElement \\| null \\| undefined>` | — | 捲動容器 |\n| `count` | `MaybeRefOrGetter<number>` | — | 項目總數 |\n| `estimate` | `MaybeRefOrGetter<number>` | — | 預估單項尺寸，單位 px |\n| `options.overscan` | `MaybeRefOrGetter<number>` | `4` | 可視範圍前後多渲染的項目數 |\n| `options.horizontal` | `MaybeRefOrGetter<boolean>` | `false` | 水平模式，以寬度與橫向捲動計算 |\n| `options.headerOffset` | `MaybeRefOrGetter<number>` | `0` | 虛擬項目之前的固定偏移，例如 sticky 表頭加釘選列的高度 |\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `range` | `ComputedRef<{ start; end }>` | 應渲染的索引範圍，含 overscan，end 不含 |\n| `visibleIndices` | `ComputedRef<number[]>` | 範圍內的索引陣列 |\n| `topPad` | `ComputedRef<number>` | 前方留白尺寸 |\n| `bottomPad` | `ComputedRef<number>` | 後方留白尺寸 |\n| `totalSize` | `ComputedRef<number>` | 所有項目的總尺寸 |\n| `setSize` | `(index, size) => void` | 回報某項的實際尺寸 |\n| `scrollToIndex` | `(index) => void` | 捲動到指定項目，位置含 headerOffset |\n| `readScroll` | `() => void` | 手動重新讀取捲動位置與可視尺寸 |\n\n## 相關頁面\n\n- [VirtualScroll](../components/VirtualScroll.md)\n- [Table](../components/Table.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCamelotVirtual.ts | [app/composables/useCamelotVirtual.ts](../../../../app/composables/useCamelotVirtual.ts) |\n\n[useCamelotVirtual.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useCamelotVirtual","summary":"`useCamelotVirtual(scrollEl, count, estimate, options)` 是可變列高的虛擬視窗計算：先以預估尺寸排版，渲染後由呼叫端回報實際尺寸並快取，逐步修正可視範圍。回傳前後留白尺寸，呼叫端以「前後撐高、中間實際渲染」的方式虛擬化，div 或表格的 spacer 列皆適用。VirtualScroll 與 Table 以它實作。"},"features/composables/useCanvasConvert.md":{"md":"# useCanvasConvert\n\n## Summary\n\n`useCanvasConvert(canvas)` 把一個 canvas 元素轉成 Blob 或 Data URL。回傳的兩個函式每次呼叫都取用當下的 canvas，canvas 可用 ref 或 getter 傳入。\n\n## 運作方式\n\n1. 以 computed 解析傳入的 canvas。\n2. toBlob 以 Promise 包裝 canvas 的 toBlob，可指定格式與品質，未指定時輸出 PNG；無法產生時為 `null`。\n3. toDataURL 直接轉呼叫 canvas 的 toDataURL，可指定格式與品質。\n\n來源：1. [useCanvasConvert.ts][]\n\n## 用法\n\n```ts\nconst { toBlob, toDataURL } = useCanvasConvert(canvasEl)\nconst blob = await toBlob('image/webp', 0.8)\nconst dataUrl = toDataURL('image/jpeg', 0.9)\n```\n\n## 簽章\n\n```ts\nuseCanvasConvert(canvasRef: MaybeRefOrGetter<HTMLCanvasElement>): {\n  toBlob: (type?: string, quality?: number) => Promise<Blob | null>\n  toDataURL: (type?: string, quality?: any) => string\n}\n```\n\n## 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `canvasRef` | `MaybeRefOrGetter<HTMLCanvasElement>` | — | 目標 canvas 元素 |\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `toBlob` | `(type?, quality?) => Promise<Blob \\| null>` | 轉成 Blob，未指定格式時為 PNG |\n| `toDataURL` | `(type?, quality?) => string` | 轉成 Data URL 字串 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCanvasConvert.ts | [app/composables/useCanvasConvert.ts](../../../../app/composables/useCanvasConvert.ts) |\n\n[useCanvasConvert.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useCanvasConvert","summary":"`useCanvasConvert(canvas)` 把一個 canvas 元素轉成 Blob 或 Data URL。回傳的兩個函式每次呼叫都取用當下的 canvas，canvas 可用 ref 或 getter 傳入。"},"features/composables/useColor.md":{"md":"# useColor\n\n## Summary\n\n`useColor()` 回傳全站共用的顏色工具單例，提供 Hex 驗證、補齊、轉 RGBA 與調整明暗等方法。Hex 可寫 3、4、6、8 碼，可含或不含井號。\n\n## 運作方式\n\n1. 所有轉換都先補齊成 8 碼 Hex：3、4 碼逐字元加倍，6 碼補上 FF 透明度。\n2. 輸入為空或不是合法 Hex 時回傳 `undefined`。\n3. 補齊時保留輸入的大小寫，只有補上的透明度固定為大寫 FF。\n4. 調整明暗時，紅、綠、藍各通道加上位移量並夾在 0 到 255，透明度段原樣保留。\n\n| 注意事項 | 說明 |\n| --- | --- |\n| 陣列的透明度 | 換算成 0 到 1 後無條件捨去到小數一位 |\n| hexToRgba 未傳 alpha | 沿用色碼本身的透明度；6 碼色碼為 1 |\n| 調整後的大小寫 | 紅綠藍三段輸出小寫 |\n\n來源：1. [useColor.ts][]\n\n## 用法\n\n```ts\nconst color = useColor()\ncolor.toFullHex('#abc')         // '#aabbccFF'\ncolor.hexToRgba('#ff0000', 0.5) // 'rgba(255,0,0, 0.5)'\ncolor.lightness('#336699')      // '#5b8ec1FF'\n```\n\n## 簽章\n\n```ts\nuseColor(): ColorUtil\n\ntype CamelotRgbaTuple = [number, number, number, number]\n```\n\n## 回傳\n\n共用的 `ColorUtil` 實例，包含下列方法：\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `isCorrectHex` | `(hex: string) => boolean` | 是否為合法的 3、4、6、8 碼 Hex |\n| `toFullHex` | `(hex: string \\| undefined) => string \\| undefined` | 補齊為井號開頭的 8 碼 Hex |\n| `hexToRgbaArray` | `(hex: string \\| undefined) => CamelotRgbaTuple \\| undefined` | 轉成紅、綠、藍 0 到 255 與透明度 0 到 1 的陣列 |\n| `hexToRgba` | `(hex: string \\| undefined, alpha?: number) => string \\| undefined` | 轉成 rgba 字串，alpha 範圍 0 到 1 |\n| `shade` | `(hex: string \\| undefined, amt: number) => string \\| undefined` | 各通道加上 amt 調整明暗，amt 可為負 |\n| `lightness` | `(hex: string \\| undefined) => string \\| undefined` | 等同 shade 加 40 |\n| `darkness` | `(hex: string \\| undefined) => string \\| undefined` | 等同 shade 減 40 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useColor.ts | [app/composables/useColor.ts](../../../../app/composables/useColor.ts) |\n\n[useColor.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useColor","summary":"`useColor()` 回傳全站共用的顏色工具單例，提供 Hex 驗證、補齊、轉 RGBA 與調整明暗等方法。Hex 可寫 3、4、6、8 碼，可含或不含井號。"},"features/composables/useColorSchemeCssVars.md":{"md":"# 色彩方案變數\n\n## Summary\n\n`useColorSchemeCssVars` 模組是色彩方案的 CSS 變數單向寫入器，匯出 `applyColorSchemeCssVars` 與 `applyMaterial3CssVars` 兩支函式，把整組色彩方案物件一次寫進目標元素的 inline style，不建立任何響應式實例。前者供 useCustomColorScheme 使用，後者供 useMaterial3ColorScheme 使用。\n\n## 運作方式\n\n### 寫入流程\n\n1. 目標元素為空時直接結束。\n2. 逐一走訪色彩方案的鍵，值不是字串就略過。\n3. 依下方命名規則寫入內部變數；一般寫入器另寫一個 Tailwind 覆蓋變數指向它。\n\n來源：1. [useColorSchemeCssVars.ts][]\n\n### 變數命名規則\n\n```\nMaterial3 色鍵 primary        → --cml-c-m3-primary\n其餘色鍵 rippleColor          → --cml-c-ripple-color\nTailwind 覆蓋變數             → --color-primary: var(--cml-c-m3-primary)\n```\n\n1. 色鍵從 camelCase 轉成 kebab-case，結果會快取，切換主題時不重算。\n2. 屬於 Material3 色鍵集合的鍵加上 m3 前綴，其餘鍵只加 Camelot 前綴。\n3. Tailwind v4 把主題色放在 `:root`，直接改會被蓋掉，因此採雙變數：內部變數存實際色值，覆蓋變數指向內部變數。\n\n來源：1. [useColorSchemeCssVars.ts][]\n\n### 兩支寫入函式的差異\n\n| 項目 | applyColorSchemeCssVars | applyMaterial3CssVars |\n| --- | --- | --- |\n| 寫入值 | 原始色值 | 紅綠藍三個數字，以逗號分隔 |\n| 無法解析為 Hex | 不解析，一律原樣寫入 | 原樣寫入 |\n| 變數前綴 | 依鍵是否屬於 Material3 決定 | 一律 m3 前綴 |\n| Tailwind 覆蓋變數 | 會寫 | 不寫 |\n| 用途 | 供覆蓋變數直接 var 取用 | 供 rgb 函式搭配透明度使用 |\n\n兩者值格式不同，刻意不合併，只共用鍵名的 kebab-case 快取。\n\n來源：1. [useColorSchemeCssVars.ts][]\n\n### 設計考量\n\n| 考量 | 說明 |\n| --- | --- |\n| 不用 useElCssVar | 寫入是單向動作；逐鍵建立 ref 與 watcher 會在主題切換這條熱路徑上產生大量永不回收的 watcher |\n| Material3 鍵集合延遲建立 | 本模組與 useMaterial3ColorScheme 互相匯入，模組載入當下建立集合會撞上尚未初始化的鍵清單，因此首次寫入時才建立 |\n\n來源：1. [useColorSchemeCssVars.ts][]\n\n## 用法\n\n```ts\napplyColorSchemeCssVars(el, { primary: '#6750a4', rippleColor: '#111827' })\n// --cml-c-m3-primary: #6750a4; --color-primary: var(--cml-c-m3-primary);\n// --cml-c-ripple-color: #111827; --color-ripple-color: var(--cml-c-ripple-color);\n```\n\n## 匯出\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `applyColorSchemeCssVars` | `(target: CssVarTarget, colorScheme: Record<string, unknown>) => void` | 寫入原始色值與 Tailwind 覆蓋變數 |\n| `applyMaterial3CssVars` | `(target: CssVarTarget, colorScheme: Record<string, unknown>) => void` | 把 Hex 轉成紅綠藍三元組後寫入 |\n| `toColorSchemeCssVarName` | `(key: string) => string` | 色鍵轉內部變數名 |\n| `CssVarTarget` | `HTMLElement \\| SVGElement \\| null \\| undefined` | 目標元素型別 |\n\n## 相關頁面\n\n- [useCustomColorScheme](./useCustomColorScheme.md)\n- [useMaterial3ColorScheme](./useMaterial3ColorScheme.md)\n- [useElCssVar](./useElCssVar.md)\n- [色彩主題系統](../../platform/color-scheme.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useColorSchemeCssVars.ts | [app/composables/useColorSchemeCssVars.ts](../../../../app/composables/useColorSchemeCssVars.ts) |\n\n[useColorSchemeCssVars.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"色彩方案變數","summary":"`useColorSchemeCssVars` 模組是色彩方案的 CSS 變數單向寫入器，匯出 `applyColorSchemeCssVars` 與 `applyMaterial3CssVars` 兩支函式，把整組色彩方案物件一次寫進目標元素的 inline style，不建立任何響應式實例。前者供 useCustomColorScheme 使用，後者供 useMaterial3ColorScheme 使用。"},"features/composables/useCookieProxy.md":{"md":"# useCookieProxy\n\n## Summary\n\n`useCookieProxy(key, opts)` 以類別包裝 Nuxt 的 `useCookie`，提供讀寫 value、以物件展開部分更新的 patch，以及刪除的 del。選項同 useCookie，但不接受唯讀模式。\n\n## 運作方式\n\n1. 建構時以鍵名與選項呼叫 useCookie，保存回傳的 cookie ref。\n2. 讀寫 value 直接對應 cookie ref 的值。\n3. patch 把目前值與新值展開合併後寫回，只覆寫傳入的欄位，適用物件型別的 cookie。\n4. del 把值設為 `undefined`，由 useCookie 刪除該 cookie。\n\n來源：1. [useCookieProxy.ts][]\n\n## 用法\n\n```ts\nconst session = useCookieProxy<{ token: string; name: string }>('session')\nsession.value = { token: 'abc', name: 'Amy' }\nsession.patch({ name: 'Bob' })\nsession.del()\n```\n\n## 簽章\n\n```ts\nuseCookieProxy<T>(key: string, opts?: ReadOnlyCookeOptions<T>): CookieProxy<T>\n\ntype ReadOnlyCookeOptions<T> = CookieOptions<T> & { readonly?: false | undefined }\n```\n\n`CookieProxy` 類別與選項型別都沒有匯出，只能透過本函式取得實例。\n\n## 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `key` | `string` | — | cookie 名稱 |\n| `opts` | `ReadOnlyCookeOptions<T>` | `undefined` | 傳給 useCookie 的選項，readonly 只能是 `false` 或不設定 |\n\n## 回傳\n\n| 成員 | 型別 | 說明 |\n| --- | --- | --- |\n| `cookie` | `CookieRef<T \\| undefined>` | 底層 useCookie 的 ref |\n| `value` | `T \\| undefined` | 取得或設定 cookie 值 |\n| `patch` | `(newValue: T) => void` | 展開合併後寫回 |\n| `del` | `() => void` | 刪除 cookie |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCookieProxy.ts | [app/composables/useCookieProxy.ts](../../../../app/composables/useCookieProxy.ts) |\n\n[useCookieProxy.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useCookieProxy","summary":"`useCookieProxy(key, opts)` 以類別包裝 Nuxt 的 `useCookie`，提供讀寫 value、以物件展開部分更新的 patch，以及刪除的 del。選項同 useCookie，但不接受唯讀模式。"},"features/composables/useCurrentRoute.md":{"md":"# useCurrentRoute\n\n## Summary\n\n`useCurrentRoute()` 回傳 router 目前路由的當下值，用來避開 Nuxt 的 `useRoute()` 在部分情境沒有即時更新的問題。回傳的是一次性的路由物件，不是 ref，之後的導覽不會反映到已取得的值。\n\n## 運作方式\n\n1. 呼叫 useRouter 取得 router。\n2. 讀取 currentRoute 的值並直接回傳。\n3. 需要最新路由時要重新呼叫；要在模板或 computed 中追蹤變化，請在 computed 內呼叫。\n\n來源：1. [useCurrentRoute.ts][]\n\n## 用法\n\n```ts\nconst path = computed(() => useCurrentRoute().path)\n```\n\n## 簽章\n\n```ts\nuseCurrentRoute(): RouteLocationNormalizedLoaded\n```\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| （回傳值） | `RouteLocationNormalizedLoaded` | 呼叫當下的路由資訊 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCurrentRoute.ts | [app/composables/useCurrentRoute.ts](../../../../app/composables/useCurrentRoute.ts) |\n\n[useCurrentRoute.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useCurrentRoute","summary":"`useCurrentRoute()` 回傳 router 目前路由的當下值，用來避開 Nuxt 的 `useRoute()` 在部分情境沒有即時更新的問題。回傳的是一次性的路由物件，不是 ref，之後的導覽不會反映到已取得的值。"},"features/composables/useCustomColorScheme.md":{"md":"# useCustomColorScheme\n\n## Summary\n\n`useCustomColorScheme(target, config)` 在指定元素上套用可自訂的色彩方案，內容是 Material 3 色鍵加上 Camelot 的 rippleColor、maskColor，並隨深淺色切換寫入對應的 CSS 變數。目標是 html 元素時視為全域設定，所有全域呼叫端共用同一組方案與同一個 watcher；其他元素各自擁有方案。\n\n## 運作方式\n\n### 全域與區域\n\n| 項目 | 全域：目標為 html 元素 | 區域：其他元素 |\n| --- | --- | --- |\n| 方案 ref | 模組層共用的淺色、深色方案 | 各自新建，初值為全域方案當下的值再疊上 config |\n| config 的方案 | 合併進全域方案，影響全站 | 只套用到此元素 |\n| CSS 變數寫入 | 模組層 watcher 只註冊一次 | 每次呼叫各註冊一個 watcher，元素變動時也重寫 |\n| editable 為 false | 不生效，仍會寫入 | 不寫入任何變數 |\n\n全域目標是共用的 html，單一呼叫端的唯讀意圖不足以代表其餘呼叫端，所以 editable 只對區域目標有效。全域 watcher 掛在獨立的 effect scope，不隨第一個呼叫的元件卸載而停止。\n\n來源：1. [useCustomColorScheme.ts][]\n\n### 深淺色判定\n\n1. 深淺色來源是共用的 [useCamelotColorMode](./useCamelotColorMode.md)。\n2. 設定為 auto 時看系統偏好，否則看設定值是否為 dark。\n3. 採用中的方案隨判定結果在淺色與深色方案間切換，並寫入 CSS 變數。\n\n變數命名與寫入方式見[色彩方案變數](./useColorSchemeCssVars.md)。\n\n來源：1. [useCustomColorScheme.ts][]　2. [useCamelotColorMode.ts][]\n\n### 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| 預設方案 | Material 3 的預設淺色與深色方案，rippleColor 與 maskColor 皆為 #111827 |\n| 淺深色都要設定 | 切換方案不會刪除已寫入的變數，只會覆蓋；只設一邊時，另一邊可能留著舊值 |\n| 伺服器端 | 三個方案都指向全域深色方案，不寫入任何 DOM |\n| 色鍵清單 | 匯出的 `CamelotColorSchemeKeys` 由 Camelot 額外色的鍵推導 |\n\n來源：1. [useCustomColorScheme.ts][]\n\n## 用法\n\n```ts\nconst el = ref<HTMLElement>()\n\nconst { usedColorScheme, mode } = useCustomColorScheme(el, {\n  lightColorScheme: { primary: '#6750a4', rippleColor: '#111827' },\n  darkColorScheme: { primary: '#d0bcff', rippleColor: '#111827' },\n})\n\nuseCustomColorScheme(document.documentElement, {\n  lightColorScheme: { primary: '#3366ff' },\n  darkColorScheme: { primary: '#88aaff' },\n})\n```\n\n## 簽章\n\n```ts\nuseCustomColorScheme<T>(\n  targetRef: MaybeElementRef,\n  config?: {\n    lightColorScheme?: CustomColorScheme<T>\n    darkColorScheme?: CustomColorScheme<T>\n    editable?: boolean\n  },\n): {\n  mode: Ref<BasicColorSchema>\n  lightColorScheme: Ref<CustomColorScheme<T>>\n  darkColorScheme: Ref<CustomColorScheme<T>>\n  usedColorScheme: ComputedRef<CustomColorScheme<T>>\n}\n\ntype CustomColorScheme<T = any> = Material3ColorSchemePartial\n  & Partial<{ rippleColor: string; maskColor: string }>\n  & Partial<T>\n```\n\n## 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `targetRef` | `MaybeElementRef` | 必填 | 套用方案的元素；為 html 元素時視為全域 |\n| `config.lightColorScheme` | `CustomColorScheme<T>` | `undefined` | 淺色方案 |\n| `config.darkColorScheme` | `CustomColorScheme<T>` | `undefined` | 深色方案 |\n| `config.editable` | `boolean` | 視為可寫入 | 只有明確為 `false` 時才停用，且僅對區域目標有效 |\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `mode` | `Ref<BasicColorSchema>` | 共用的深淺色設定，可寫，值為 auto、light、dark |\n| `lightColorScheme` | `Ref<CustomColorScheme<T>>` | 淺色方案；全域時為共用 ref |\n| `darkColorScheme` | `Ref<CustomColorScheme<T>>` | 深色方案；全域時為共用 ref |\n| `usedColorScheme` | `ComputedRef<CustomColorScheme<T>>` | 依目前深淺色採用的方案 |\n\n## 相關頁面\n\n- [色彩方案變數](./useColorSchemeCssVars.md)\n- [useMaterial3ColorScheme](./useMaterial3ColorScheme.md)\n- [CustomColorSchemeProvider](../components/CustomColorSchemeProvider.md)\n- [色彩主題系統](../../platform/color-scheme.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCustomColorScheme.ts | [app/composables/useCustomColorScheme.ts](../../../../app/composables/useCustomColorScheme.ts) |\n| useCamelotColorMode.ts | [app/composables/useCamelotColorMode.ts](../../../../app/composables/useCamelotColorMode.ts) |\n\n[useCustomColorScheme.ts]: #references\n[useCamelotColorMode.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useCustomColorScheme","summary":"`useCustomColorScheme(target, config)` 在指定元素上套用可自訂的色彩方案，內容是 Material 3 色鍵加上 Camelot 的 rippleColor、maskColor，並隨深淺色切換寫入對應的 CSS 變數。目標是 html 元素時視為全域設定，所有全域呼叫端共用同一組方案與同一個 watcher；其他元素各自擁有方案。"},"features/composables/useDelay.md":{"md":"# useDelay\n\n## Summary\n\n`useDelay(ms)` 回傳一個在指定毫秒後 resolve 的 Promise，用於非同步流程中的等待。\n\n## 運作方式\n\n1. 呼叫當下以 toValue 讀取毫秒數，之後 ref 再變動不影響這次等待。\n2. 以 setTimeout 計時，到期後 resolve。\n3. 沒有取消機制。\n\n來源：1. [useDelay.ts][]\n\n## 用法\n\n```ts\nawait useDelay(1000)\n```\n\n## 簽章\n\n```ts\nuseDelay(milliseconds: MaybeRef<number>): Promise<void>\n```\n\n## 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `milliseconds` | `MaybeRef<number>` | — | 等待的毫秒數 |\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| （回傳值） | `Promise<void>` | 計時到期後 resolve |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useDelay.ts | [app/composables/useDelay.ts](../../../../app/composables/useDelay.ts) |\n\n[useDelay.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useDelay","summary":"`useDelay(ms)` 回傳一個在指定毫秒後 resolve 的 Promise，用於非同步流程中的等待。"},"features/composables/useDeviceBreakpoints.md":{"md":"# useDeviceBreakpoints\n\n## Summary\n\n`useDeviceBreakpoints()` 以 Tailwind 預設斷點判斷裝置類型，回傳手機、平板、筆電、桌機四個響應式布林值，以及底層的 VueUse breakpoints 實例。每次呼叫都建立新的 breakpoints 實例。\n\n## 運作方式\n\n以 VueUse 的 useBreakpoints 搭配 Tailwind 斷點表，四個類型互斥：\n\n| 類型 | 條件 | 寬度 |\n| --- | --- | --- |\n| 手機 | 小於 md | 未滿 768px |\n| 平板 | 大於等於 md 且小於 lg | 768px 到未滿 1024px |\n| 筆電 | 大於等於 lg 且小於 xl | 1024px 到未滿 1280px |\n| 桌機 | 大於等於 xl | 1280px 以上 |\n\n來源：1. [useDeviceBreakpoints.ts][]\n\n## 用法\n\n```ts\nconst { isMobile, isDesktop, breakpoints } = useDeviceBreakpoints()\nconst isWide = breakpoints.greaterOrEqual('2xl')\n```\n\n## 簽章\n\n```ts\nuseDeviceBreakpoints(): {\n  isMobile: ComputedRef<boolean>\n  isTablet: ComputedRef<boolean>\n  isLaptop: ComputedRef<boolean>\n  isDesktop: ComputedRef<boolean>\n  breakpoints: ReturnType<typeof useBreakpoints>\n}\n```\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `isMobile` | `ComputedRef<boolean>` | 手機寬度 |\n| `isTablet` | `ComputedRef<boolean>` | 平板寬度 |\n| `isLaptop` | `ComputedRef<boolean>` | 筆電寬度 |\n| `isDesktop` | `ComputedRef<boolean>` | 桌機寬度 |\n| `breakpoints` | `ReturnType<typeof useBreakpoints>` | 以 Tailwind 斷點建立的 VueUse 實例，可自行查詢其他斷點 |\n\n## 相關頁面\n\n- [Breakpoints](../components/Breakpoints.md)\n- [DateV2](../components/DateV2.md)\n- [DateRangeV2](../components/DateRangeV2.md)\n- [TimeV2](../components/TimeV2.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useDeviceBreakpoints.ts | [app/composables/useDeviceBreakpoints.ts](../../../../app/composables/useDeviceBreakpoints.ts) |\n\n[useDeviceBreakpoints.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useDeviceBreakpoints","summary":"`useDeviceBreakpoints()` 以 Tailwind 預設斷點判斷裝置類型，回傳手機、平板、筆電、桌機四個響應式布林值，以及底層的 VueUse breakpoints 實例。每次呼叫都建立新的 breakpoints 實例。"},"features/composables/useDrawerCollapsed.md":{"md":"# useDrawerCollapsed\n\n## Summary\n\n`useDrawerCollapsed()` 回傳一個跨元件共享的抽屜收合狀態 ref，預設為收合。狀態以 Nuxt 的 useState 保存：瀏覽器端所有呼叫端讀寫同一份，伺服器端每個請求各自一份。\n\n## 運作方式\n\n1. 以固定的 key 呼叫 Nuxt 的 useState，初始值為 `true`。\n2. 瀏覽器端每次呼叫都取得同一份狀態，任一處改值，其他使用處同步更新。\n3. 伺服器端渲染時，每個請求各自一份狀態，請求之間互不影響。\n4. 狀態不持久化，重新整理後回到收合。\n\n來源：1. [useDrawerCollapsed.ts][]\n\n## 用法\n\n```ts\nconst collapsed = useDrawerCollapsed()\ncollapsed.value = false\n```\n\n## 簽章\n\n```ts\nuseDrawerCollapsed(): Ref<boolean>\n```\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| （回傳值） | `Ref<boolean>` | 共享的收合狀態，`true` 為收合 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useDrawerCollapsed.ts | [app/composables/useDrawerCollapsed.ts](../../../../app/composables/useDrawerCollapsed.ts) |\n\n[useDrawerCollapsed.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useDrawerCollapsed","summary":"`useDrawerCollapsed()` 回傳一個跨元件共享的抽屜收合狀態 ref，預設為收合。狀態以 Nuxt 的 useState 保存：瀏覽器端所有呼叫端讀寫同一份，伺服器端每個請求各自一份。"},"features/composables/useElCssVar.md":{"md":"# useElCssVar\n\n## Summary\n\nuseElCssVar 讀寫指定元素上的單一 CSS 變數，回傳與該變數雙向同步的響應式 ref：讀取得到目前值，寫入會設到元素的 inline style。可選擇以 MutationObserver 監聽元素 style、class 變動，或只讀 inline 值不讀繼承值。它是 VueUse useCssVar 的改寫版，差別在 inherit 選項。\n\n## 介面\n\n### 簽章\n\n```ts\nexport function useElCssVar(\n  prop: MaybeRefOrGetter<string>,\n  target?: MaybeElementRef,\n  options: UseCssVarOptions = {},\n): Ref<string>\n\nexport interface UseCssVarOptions extends ConfigurableWindow {\n  initialValue?: string\n  observe?: boolean\n  inherit?: boolean\n}\n```\n\n### 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `prop` | `MaybeRefOrGetter<string>` | 必填 | CSS 變數名稱，例如 `--cml-c-primary` |\n| `target` | `MaybeElementRef` | 根元素 | 目標元素；未提供或解析不到時操作 `document.documentElement` |\n| `options.initialValue` | `string` | `''` | ref 初始值，也是讀不到變數時的回退值 |\n| `options.observe` | `boolean` | `false` | 以 `MutationObserver` 監聽 `style`、`class` 屬性變化並重讀 |\n| `options.inherit` | `boolean` | `true` | `true` 以 `getComputedStyle` 讀取，含繼承值；`false` 只讀元素 inline style |\n| `options.window` | `Window` | `defaultWindow` | 使用的 window 物件 |\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| 回傳值 | `Ref<string>` | CSS 變數的響應式 ref；寫入時以 `setProperty` 設到目標元素 |\n\n來源：1. [useElCssVar.ts][]\n\n## 用法\n\n```ts\nconst primary = useElCssVar('--cml-c-primary', el, { inherit: false })\nprimary.value = '#6750a4' // 寫入元素 style\nconsole.log(primary.value) // 讀取目前值\n```\n\n## 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| 何時重讀 | 目標元素或變數名稱改變時立即重讀一次；開啟 `observe` 時屬性變動也會重讀 |\n| 何時寫回 | ref 值改變時寫回目標元素的 inline style |\n| 讀到空值 | 回退為 `initialValue` |\n| 生命週期 | 每個實例建立一個 ref、一個 computed 與兩個常駐 watch |\n\n> [!WARNING]\n> 只在 setup 期建立，不要在 watcher 或迴圈內建立實例。在 watcher callback 內建立時不屬於任何 effect scope，永遠不會被回收。\n> 需要一次寫入多個變數（如整組色彩方案）時，改用單向寫入的 [useColorSchemeCssVars](./useColorSchemeCssVars.md)，寫入不需要響應式 ref。\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useElCssVar.ts | [app/composables/useElCssVar.ts](../../../../app/composables/useElCssVar.ts) |\n\n[useElCssVar.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useElCssVar","summary":"useElCssVar 讀寫指定元素上的單一 CSS 變數，回傳與該變數雙向同步的響應式 ref：讀取得到目前值，寫入會設到元素的 inline style。可選擇以 MutationObserver 監聽元素 style、class 變動，或只讀 inline 值不讀繼承值。它是 VueUse useCssVar 的改寫版，差別在 inherit 選項。"},"features/composables/useErrorRef.md":{"md":"# useErrorRef\n\n## Summary\n\nuseErrorRef 建立一個匯總用的錯誤 ref，並提供 watch 方法監聽一個或多個來源錯誤 ref，任一來源變動就把值同步過來。它只負責匯總，不含佇列、格式轉換與顯示；需要多筆錯誤累積並逐一彈窗時改用 useCamelotError。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useErrorRef: () => {\n  error: Ref<ErrorRefType>\n  watch: (errors: Ref<ErrorRefType> | Ref<ErrorRefType>[]) => void\n}\n\ntype ErrorRefType = FetchError | Error | any | null\n```\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `error` | `Ref<ErrorRefType>` | 匯總後的錯誤 ref，初始為 `undefined` |\n| `watch` | `(errors) => void` | 監聽單一或多個來源錯誤 ref，變動時同步到 `error` |\n\n### watch 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `errors` | `Ref<ErrorRefType> \\| Ref<ErrorRefType>[]` | 必填 | 要監聽的錯誤 ref；傳陣列時逐一監聽 |\n\n來源：1. [useErrorRef.ts][]\n\n## 用法\n\n```ts\nconst { error, watch } = useErrorRef()\nwatch([fetchAError, fetchBError])\n```\n\n## 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| 初始同步 | 每個來源都以 immediate 監聽，建立當下就同步一次 |\n| 多來源 | 共用同一個 `error`，後變動的來源覆寫先前的值 |\n| 清除 | 來源變回 `null` 時 `error` 也跟著變回 `null` |\n\n## 相關頁面\n\n- [useCamelotError](./useCamelotError.md)：多筆錯誤累積並逐一彈窗。\n- [錯誤處理系統](../../platform/error-handling.md)：整體錯誤處理流程。\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useErrorRef.ts | [app/composables/useErrorRef.ts](../../../../app/composables/useErrorRef.ts) |\n\n[useErrorRef.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useErrorRef","summary":"useErrorRef 建立一個匯總用的錯誤 ref，並提供 watch 方法監聽一個或多個來源錯誤 ref，任一來源變動就把值同步過來。它只負責匯總，不含佇列、格式轉換與顯示；需要多筆錯誤累積並逐一彈窗時改用 useCamelotError。"},"features/composables/useFetchJSONLinesStream.md":{"md":"# JSON Lines 串流\n\n## Summary\n\nuseFetchJSONLinesStream 建在 useFetchStream 之上，把串流回應依換行切成一行一筆，逐行解析成物件並累積為陣列。適合後端以 JSON Lines（NDJSON）逐筆推送資料的端點。每解析一行觸發回呼，串流結束時帶入整份陣列；狀態、錯誤與中止沿用底層 useFetchStream。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useFetchJSONLinesStream: <T>(\n  url: MaybeRefOrGetter<string>,\n  options?: UseFetchJSONLinesStreamOptions<T>,\n) => {\n  // 其餘沿用 useFetchStream：status、isStreaming、error、abort、then 等\n  data: Ref<T[]>\n  refresh: () => Promise<void>\n  clear: () => void\n}\n\ntype BaseOptions = Omit<UseFetchStreamOptions, 'onChunk' | 'onFinish'>\n```\n\n### 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `url` | `MaybeRefOrGetter<string>` | 必填 | 串流請求網址 |\n| `options` | `UseFetchJSONLinesStreamOptions<T>` | `{}` | 選項物件，見下表 |\n\n### options\n\n| 選項 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `onLineParsed` | `(data: T) => void` | — | 一行解析成功時觸發 |\n| `onParseError` | `(error: Error, line: string) => void` | — | 一行解析失敗時觸發，帶入錯誤與原始行 |\n| `onFinish` | `(data: T[]) => void` | — | 串流結束時觸發，帶入累積的陣列 |\n| `decoder` | `TextDecoder` | UTF-8 解碼器 | 把二進位資料塊解碼成文字 |\n| `lineBreak` | `string` | `'\\n'` | 分行符號 |\n| `parse` | `(line: string) => T \\| null` | `JSON.parse` | 單行解析函式 |\n| `finishOnParseError` | `boolean` | `true` | 解析失敗時中止串流；傳 `false` 則略過錯誤行繼續 |\n| `keepData` | `boolean` | `true` | 是否把解析結果累積到 `data` |\n| `method`、`headers`、`immediate`、`onError` | — | 同 useFetchStream | 原樣傳給底層 useFetchStream |\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `data` | `Ref<T[]>` | 累積的解析結果，取代底層的位元組資料 |\n| `refresh` | `() => Promise<void>` | 先清空，再重新發送請求 |\n| `clear` | `() => void` | 清空 `data` 與行緩衝，並中止、重置底層串流 |\n| 其餘 | — | 展開自底層 useFetchStream，含 `status`、`isStreaming`、`error`、`abort` |\n\n來源：1. [useFetchJSONLinesStream.ts][]　2. [useFetchStream.ts][]\n\n## 用法\n\n```ts\nconst { data, refresh } = useFetchJSONLinesStream<MyItem>('/api/stream', {\n  immediate: false,\n  onLineParsed: item => console.log(item),\n  onParseError: (err, line) => console.warn(err, line),\n})\nawait refresh()\n```\n\n## 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| 行緩衝 | 每收到一塊資料就解碼接到緩衝尾端，依分行符號切開，最後一段不完整的行留在緩衝 |\n| 空行 | 只有空白的行直接略過 |\n| 結尾沒有換行 | 串流結束時殘留在緩衝的最後一行視為完整的一行照常解析 |\n| 解析失敗 | 先呼叫 `onParseError`；預設接著中止串流，後續的行不再解析 |\n| 略過錯誤行 | `finishOnParseError` 為 `false` 時略過該行，繼續解析後續的行 |\n| 底層資料 | 底層 useFetchStream 的 `keepData` 固定為 `false`，不累積位元組 |\n| 錯誤轉交 | 底層的 `onError` 轉呼叫使用者傳入的 `onError` |\n| 立即請求 | 未傳 `immediate` 時沿用底層預設，建立當下就發出請求 |\n\n## 相關頁面\n\n- [useFetchStream](./useFetchStream.md)：底層的位元組串流讀取。\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useFetchJSONLinesStream.ts | [app/composables/useFetchJSONLinesStream.ts](../../../../app/composables/useFetchJSONLinesStream.ts) |\n| useFetchStream.ts | [app/composables/useFetchStream.ts](../../../../app/composables/useFetchStream.ts) |\n\n[useFetchJSONLinesStream.ts]: #references\n[useFetchStream.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"JSON Lines 串流","summary":"useFetchJSONLinesStream 建在 useFetchStream 之上，把串流回應依換行切成一行一筆，逐行解析成物件並累積為陣列。適合後端以 JSON Lines（NDJSON）逐筆推送資料的端點。每解析一行觸發回呼，串流結束時帶入整份陣列；狀態、錯誤與中止沿用底層 useFetchStream。"},"features/composables/useFetchStream.md":{"md":"# useFetchStream\n\n## Summary\n\nuseFetchStream 以 fetch 搭配 ReadableStream 讀取串流回應，把收到的 Uint8Array 資料塊累積起來，並提供 onChunk、onFinish、onError 回呼與請求狀態。回傳物件同時可被 await，會等待建立時發出的那次請求。逐行 JSON 的情境改用建在它之上的 useFetchJSONLinesStream。\n\n## 介面\n\n### 簽章\n\n```ts\nexport const useFetchStream = (\n  url: MaybeRefOrGetter<string>,\n  options: UseFetchStreamOptions = {},\n): Shell & Promise<Shell>\n\nexport interface UseFetchStreamOptions {\n  method?: 'GET' | 'POST'\n  headers?: Record<string, string>\n  immediate?: boolean\n  onChunk?: (chunk: Uint8Array) => Promise<void>\n  onFinish?: (fullData: Uint8Array) => Promise<void>\n  onError?: (error: Error) => Promise<void>\n  keepData?: boolean\n}\n```\n\n### 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `url` | `MaybeRefOrGetter<string>` | 必填 | 請求網址，每次請求時以 `toValue` 取值 |\n| `options.method` | `'GET' \\| 'POST'` | `'GET'` | HTTP 方法 |\n| `options.headers` | `Record<string, string>` | `{}` | 請求標頭 |\n| `options.immediate` | `boolean` | `true` | 建立時是否立即發出請求 |\n| `options.onChunk` | `(chunk) => Promise<void>` | — | 每收到一塊資料時觸發，會被 await |\n| `options.onFinish` | `(fullData) => Promise<void>` | — | 串流讀完時觸發，帶入目前累積的資料 |\n| `options.onError` | `(error) => Promise<void>` | — | 非中止的錯誤時觸發，不會被 await |\n| `options.keepData` | `boolean` | `true` | 是否把資料塊累積到 `data`；`false` 時只透過 `onChunk` 處理 |\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `data` | `Ref<Uint8Array>` | 累積的串流資料 |\n| `status` | `Ref<'idle' \\| 'pending' \\| 'success' \\| 'aborted' \\| 'error'>` | 請求狀態 |\n| `isStreaming` | `ComputedRef<boolean>` | `status` 為 `'pending'` 時為 `true` |\n| `error` | `ShallowRef<Error \\| null>` | 錯誤物件 |\n| `abort` | `() => void` | 中止目前請求，狀態設為 `'aborted'` |\n| `refresh` | `() => Promise<void>` | 先 `clear` 再重新發送請求；失敗時 reject |\n| `clear` | `() => void` | 中止進行中的請求，重置 `data`、`error`，狀態回 `'idle'` |\n| `then`、`catch`、`finally` | — | 讓回傳物件可被 await |\n\n來源：1. [useFetchStream.ts][]\n\n## 用法\n\n```ts\nconst { data, status, isStreaming, abort } = useFetchStream('/api/stream', {\n  onChunk: async (chunk) => {\n    console.log(new TextDecoder().decode(chunk))\n  },\n  onFinish: async (full) => {\n    console.log('done', full.length)\n  },\n})\n```\n\n```ts\n// 等待建立時發出的請求結束；失敗會拋出\nawait useFetchStream('/api/stream')\n```\n\n## 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| 回應失敗 | 狀態碼非 2xx 拋出 `HTTP error! status: <code>` |\n| 沒有 body | 拋出 `Response body is empty.` |\n| 中止 | 錯誤名稱為 `AbortError` 時不設錯誤狀態、不呼叫 `onError`、不 reject |\n| await 的結果 | `immediate` 為 `true` 時 resolve 為 `undefined`；為 `false` 時直接 resolve 為回傳物件本身 |\n| await 的對象 | 永遠是建立時那一次請求；之後呼叫 `refresh` 要 await 它自己的回傳值 |\n| 重複請求 | `refresh` 會先中止前一次請求再重新發出 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useFetchStream.ts | [app/composables/useFetchStream.ts](../../../../app/composables/useFetchStream.ts) |\n\n[useFetchStream.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useFetchStream","summary":"useFetchStream 以 fetch 搭配 ReadableStream 讀取串流回應，把收到的 Uint8Array 資料塊累積起來，並提供 onChunk、onFinish、onError 回呼與請求狀態。回傳物件同時可被 await，會等待建立時發出的那次請求。逐行 JSON 的情境改用建在它之上的 useFetchJSONLinesStream。"},"features/composables/useFileKey.md":{"md":"# useFileKey\n\n## Summary\n\nuseFileKey 依檔案的 MIME 型別、名稱、大小與最後修改時間組出一個識別字串，用來判斷兩個 File 是否為同一個檔案，或當作快取、useAsyncData 的 key。它是純函式，不建立任何響應式狀態。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useFileKey: (file: File) => string\n```\n\n### 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `file` | `File` | 必填 | 來源檔案 |\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| 回傳值 | `string` | 以底線串接 `type`、`name`、`size`、`lastModified` |\n\n來源：1. [useFileKey.ts][]\n\n## 用法\n\n```ts\nconst key = useFileKey(file)\n// 'image/png_photo.png_20480_1700000000000'\n```\n\n## 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| 相同判定 | 四個欄位都相同就得到相同字串，內容不同但欄位相同也會撞 key |\n| 使用者 | useFileToDataURL 以它作為 useAsyncData 的 key |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useFileKey.ts | [app/composables/useFileKey.ts](../../../../app/composables/useFileKey.ts) |\n\n[useFileKey.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useFileKey","summary":"useFileKey 依檔案的 MIME 型別、名稱、大小與最後修改時間組出一個識別字串，用來判斷兩個 File 是否為同一個檔案，或當作快取、useAsyncData 的 key。它是純函式，不建立任何響應式狀態。"},"features/composables/useFileToDataURL.md":{"md":"# useFileToDataURL\n\n## Summary\n\nuseFileToDataURL 以 FileReader 把 File 讀成 Data URL 字串，並用 Nuxt 的 useAsyncData 包裝，回傳可 await 的非同步資料物件。快取 key 取自 useFileKey，同一個檔案重複呼叫會共用結果。常用於上傳前的圖片預覽。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useFileToDataURL: (file: File) => AsyncData<string, …>\n```\n\n### 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `file` | `File` | 必填 | 要讀取的檔案 |\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| 回傳值 | useAsyncData 的回傳型別 | `data` 為 Data URL 字串，另有 `pending`、`error`、`refresh` 等 |\n\n來源：1. [useFileToDataURL.ts][]　2. [useFileKey.ts][]\n\n## 用法\n\n```ts\nconst { data, pending } = await useFileToDataURL(file)\n// data.value 為檔案的 Data URL\n```\n\n## 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| 快取 key | `useFileKey(file)` |\n| 讀取方式 | `FileReader.readAsDataURL`，只能在瀏覽器端執行 |\n| 讀取失敗 | 讀檔失敗或中止時結束載入，`error` 帶出錯誤 |\n\n## 相關頁面\n\n- [useFileKey](./useFileKey.md)：檔案識別字串。\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useFileToDataURL.ts | [app/composables/useFileToDataURL.ts](../../../../app/composables/useFileToDataURL.ts) |\n| useFileKey.ts | [app/composables/useFileKey.ts](../../../../app/composables/useFileKey.ts) |\n\n[useFileToDataURL.ts]: #references\n[useFileKey.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useFileToDataURL","summary":"useFileToDataURL 以 FileReader 把 File 讀成 Data URL 字串，並用 Nuxt 的 useAsyncData 包裝，回傳可 await 的非同步資料物件。快取 key 取自 useFileKey，同一個檔案重複呼叫會共用結果。常用於上傳前的圖片預覽。"},"features/composables/useFloat.md":{"md":"# useFloat\n\n## Summary\n\nuseFloat 提供避免 JavaScript 浮點誤差的數值運算，目前只有加法 plus：把兩個數放大成整數後相加再縮回，回傳 computed，讓 0.1 + 0.2 得到 0.3。兩個參數都可以是 ref，值變動時結果自動重算。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useFloat: () => {\n  plus: (\n    value1Ref: MaybeRef<number>,\n    value2Ref: MaybeRef<number>,\n  ) => ComputedRef<number>\n}\n```\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `plus` | `(value1Ref, value2Ref) => ComputedRef<number>` | 兩數相加，回傳避免浮點誤差的 computed |\n\n來源：1. [useFloat.ts][]\n\n## 用法\n\n```ts\nconst { plus } = useFloat()\nconst sum = plus(0.1, 0.2) // sum.value === 0.3\n```\n\n## 規則\n\n計算步驟：\n\n1. 以字串形式找出兩數小數點後的長度，取較大者。\n2. 縮放倍數為 10 的「小數位數加一」次方。\n3. 兩數各乘上倍數後相加，四捨五入成整數。\n4. 除以倍數得到結果。\n\n| 規則 | 說明 |\n| --- | --- |\n| 整數相加 | 倍數為 1，直接相加 |\n| 科學記號 | 以字串找小數點，極小或極大的數轉成科學記號時不保證精度 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useFloat.ts | [app/composables/useFloat.ts](../../../../app/composables/useFloat.ts) |\n\n[useFloat.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useFloat","summary":"useFloat 提供避免 JavaScript 浮點誤差的數值運算，目前只有加法 plus：把兩個數放大成整數後相加再縮回，回傳 computed，讓 0.1 + 0.2 得到 0.3。兩個參數都可以是 ref，值變動時結果自動重算。"},"features/composables/useInfinitePage.md":{"md":"# useInfinitePage\n\n## Summary\n\nuseInfinitePage 實作無限捲動載入：以 useScrollOnBottom 偵測是否捲到底，到底且不在載入中、也還沒到最後一頁時，節流呼叫 nextPage。資料少到頁面無法捲動時，載入結束後會自動再補載下一頁，直到頁面能捲動或到底為止。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useInfinitePage: (options: {\n  nextPage: VoidFunction\n  isPending: Ref<boolean | null | undefined>\n  isEnd?: Ref<boolean | null | undefined>\n  target?: MaybeRefOrGetter<HTMLElement | SVGElement | null | undefined>\n  offset?: MaybeRefOrGetter<number>\n}) => void\n```\n\n### 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `nextPage` | `VoidFunction` | 必填 | 載入下一頁的函式 |\n| `isPending` | `Ref<boolean \\| null \\| undefined>` | 必填 | 是否載入中；為真時不觸發 |\n| `isEnd` | `Ref<boolean \\| null \\| undefined>` | — | 是否已到最後一頁；為真時不觸發 |\n| `target` | `MaybeRefOrGetter<HTMLElement \\| SVGElement \\| null \\| undefined>` | — | 捲動監聽目標，傳給 useScrollOnBottom；未指定時掛載後改用 `window` |\n| `offset` | `MaybeRefOrGetter<number>` | `20` | 到底容差像素，傳給 useScrollOnBottom |\n\n### 回傳\n\n無。\n\n來源：1. [useInfinitePage.ts][]　2. [useScrollOnBottom.ts][]\n\n## 用法\n\n```ts\nuseInfinitePage({\n  nextPage: loadMore,\n  isPending,\n  isEnd,\n})\n```\n\n## 運作方式\n\n1. 以 VueUse 的 `useThrottleFn` 包裝 `nextPage`，執行前檢查 `isEnd` 與 `isPending`。\n2. 以 immediate 監聽 `isOnBottom`，變成真時呼叫節流後的函式。\n3. 在瀏覽器端另外監聽 `isPending`：載入結束後等 100ms。\n4. 若此時整頁高度不超過可視高度，也就是頁面還不能捲動，就再呼叫一次節流後的函式。\n\n| 規則 | 說明 |\n| --- | --- |\n| 補載判斷對象 | 永遠看整頁的捲動高度，不看自訂 `target` |\n| 伺服端 | 未傳 `target` 時交給 useScrollOnBottom 在掛載後才取 `window`，伺服端呼叫不會出錯 |\n\n## 相關頁面\n\n- [useScrollOnBottom](./useScrollOnBottom.md)：到底偵測。\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useInfinitePage.ts | [app/composables/useInfinitePage.ts](../../../../app/composables/useInfinitePage.ts) |\n| useScrollOnBottom.ts | [app/composables/useScrollOnBottom.ts](../../../../app/composables/useScrollOnBottom.ts) |\n\n[useInfinitePage.ts]: #references\n[useScrollOnBottom.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useInfinitePage","summary":"useInfinitePage 實作無限捲動載入：以 useScrollOnBottom 偵測是否捲到底，到底且不在載入中、也還沒到最後一頁時，節流呼叫 nextPage。資料少到頁面無法捲動時，載入結束後會自動再補載下一頁，直到頁面能捲動或到底為止。"},"features/composables/useInputValidationController.md":{"md":"# 輸入驗證控制器\n\n## Summary\n\nuseInputValidationController 集中管理一個表單內的多個驗證來源：驗證函式清單用於送出前批次驗證，失敗時自動捲動到出錯欄位；computed 清單用於即時算出整體是否有效。兩套清單彼此獨立，各自註冊、各自判斷。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useInputValidationController: () => InputValidationController\n\ninterface InputValidationController {\n  addValidatorComputed: (ref: ComputedRef<boolean | string | undefined>) => void\n  removeValidatorComputed: (ref: ComputedRef<boolean | string | undefined>) => void\n  addValidator: (fn: Validator) => void\n  removeValidator: (fn: Validator) => void\n  validate: () => boolean\n  hasInvalid: (options?: { scrollToFirstElement?: boolean }) => boolean\n  isValidate: ComputedRef<boolean>\n}\n\nexport type Validator = () => {\n  valid: boolean\n  element?: MaybeElementRef\n} | boolean\n\nexport type ValidatorFn = () => boolean\n```\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `addValidatorComputed` | `(ref) => void` | 加入一個 computed 驗證來源，供 `isValidate` 計算 |\n| `removeValidatorComputed` | `(ref) => void` | 移除已加入的 computed 驗證來源 |\n| `addValidator` | `(fn: Validator) => void` | 加入一個驗證函式，供 `validate` 與 `hasInvalid` 使用 |\n| `removeValidator` | `(fn: Validator) => void` | 移除已加入的驗證函式 |\n| `validate` | `() => boolean` | 等於 `!hasInvalid()`，全部通過時為 `true` |\n| `hasInvalid` | `(options?) => boolean` | 執行所有驗證函式，有任何失敗時為 `true`；可用選項控制要不要捲動 |\n| `isValidate` | `ComputedRef<boolean>` | 所有 computed 來源皆為 truthy 時為 `true` |\n\n來源：1. [useInputValidationController.ts][]\n\n## 用法\n\n```ts\nconst controller = useInputValidationController()\n\ncontroller.addValidator(() => ({\n  valid: !!name.value,\n  element: nameInputRef,\n}))\n\ncontroller.addValidatorComputed(computed(() => email.value.includes('@')))\n\nfunction onSubmit() {\n  if (!controller.validate()) return // 失敗會自動捲動到出錯欄位\n  // 送出...\n}\n```\n\n## 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| 驗證函式回傳 | 可回傳 `boolean`，或 `{ valid, element }` 物件 |\n| 捲動候選 | 只有物件回傳、`valid` 為 `false` 且帶 `element` 的項目會列入 |\n| 元件實例 | `element` 為 Vue 元件實例時取其 `$el` |\n| 捲動目標 | 候選元素中畫面位置最靠上的錯誤欄位 |\n| 捲動方式 | `scrollIntoView`，平滑捲動並置中 |\n| 關閉捲動 | 呼叫 `hasInvalid({ scrollToFirstElement: false })`；`validate()` 一律會捲動 |\n| computed 為字串 | 非空字串視為通過，空字串視為失敗 |\n| 移除未註冊項目 | 移除從未加入的項目時不做任何事，不影響其他項目 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useInputValidationController.ts | [app/composables/useInputValidationController.ts](../../../../app/composables/useInputValidationController.ts) |\n\n[useInputValidationController.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"輸入驗證控制器","summary":"useInputValidationController 集中管理一個表單內的多個驗證來源：驗證函式清單用於送出前批次驗證，失敗時自動捲動到出錯欄位；computed 清單用於即時算出整體是否有效。兩套清單彼此獨立，各自註冊、各自判斷。"},"features/composables/useIsValidKey.md":{"md":"# useIsValidKey\n\n## Summary\n\nuseIsValidKey 以 in 運算子判斷一個 key 是否存在於物件中，宣告為泛型的 TypeScript 型別守衛。守衛成立後 key 會被收窄成該物件的鍵型別，之後可以直接用它安全地取值。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useIsValidKey: <T extends object>(\n  key: PropertyKey,\n  object: T,\n) => key is keyof T\n```\n\n### 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `key` | `PropertyKey` | 必填 | 要檢查的鍵 |\n| `object` | `T` | 必填 | 要檢查的物件 |\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| 回傳值 | `key is keyof T` | `key in object` 的結果 |\n\n來源：1. [useIsValidKey.ts][]\n\n## 用法\n\n```ts\nconst letterMap = { A: 10, B: 11 }\nconst char = input.charAt(0)\nif (!useIsValidKey(char, letterMap)) {\n  return false\n}\nconst num = letterMap[char]\n```\n\n## 規則\n\n| 規則 | 說明 |\n| --- | --- |\n| 原型鏈 | `in` 會找原型鏈，`'toString'` 對一般物件也會回傳 `true` |\n| 型別收窄 | 收窄成物件的鍵型別，取得的值是該物件的屬性型別 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useIsValidKey.ts | [app/composables/useIsValidKey.ts](../../../../app/composables/useIsValidKey.ts) |\n\n[useIsValidKey.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useIsValidKey","summary":"useIsValidKey 以 in 運算子判斷一個 key 是否存在於物件中，宣告為泛型的 TypeScript 型別守衛。守衛成立後 key 會被收窄成該物件的鍵型別，之後可以直接用它安全地取值。"},"features/composables/useLazyImage.md":{"md":"# useLazyImage\n\n## Summary\n\nuseLazyImage 以程式建立 Image 物件預載入圖片，提供載入中、完成、失敗等響應式狀態，以及載入完成後的圖片元素與是否為橫向圖。預設不自動載入，呼叫 load 才開始；只能在瀏覽器端使用。\n\n## 介面\n\n### 簽章\n\n```ts\nconst useLazyImage: (\n  src: MaybeRefOrGetter<string | undefined>,\n  options?: LazyImageOptions,\n) => {\n  isLoading: Ref<boolean>\n  isError: Ref<boolean>\n  isReady: Ref<boolean>\n  isPending: Ref<boolean>\n  load: () => void\n  image: Ref<HTMLImageElement | null>\n  isLandscapeImage: ComputedRef<boolean>\n}\n\nexport interface LazyImageOptions {\n  immediate?: boolean\n}\n```\n\n### 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `src` | `MaybeRefOrGetter<string \\| undefined>` | 必填 | 圖片網址，呼叫 `load` 時才取值 |\n| `options.immediate` | `boolean` | — | 為 `true` 時建立後立即呼叫 `load` |\n\n### 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `isLoading` | `Ref<boolean>` | 是否載入中，初始為 `true` |\n| `isPending` | `Ref<boolean>` | 是否等待中，
