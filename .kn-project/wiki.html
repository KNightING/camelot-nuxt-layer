 | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | `{ data: T, index: number, isSelected: boolean }` | 自訂單一分頁內容；預設為帶漣漪的膠囊分頁 |\n\n## 運作方式\n\n### 選取與捲動\n\n1. 點擊未選中的分頁：更新選中索引，並發出 `changedWithClick`；點已選中的分頁不動作。\n2. 選中索引改變時，不論來自點擊或外部，分頁列都捲動讓該分頁置中，最左只捲到起點。\n3. `scrollSmooth` 為假時直接跳到目標位置。\n\n來源：1. [RippleTabs.vue][]\n\n### 顯示文字與外觀\n\n1. 項目是物件且 `displayKey` 是它的欄位時，顯示該欄位的值；否則直接顯示項目本身。\n2. 分頁不換行，間距 20px，捲軸隱藏。\n3. 未選中分頁用表面底色；選中分頁的底色、框線與文字改用色彩角色的 container 色階。\n\n來源：1. [RippleTabs.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| RippleTabs.vue | [app/components/Camelot/RippleTabs.vue](../../../../app/components/Camelot/RippleTabs.vue) |\n\n[RippleTabs.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"RippleTabs","summary":"`CamelotRippleTabs` 是可水平捲動的膠囊式分頁列：每個分頁點擊時有漣漪效果，選中的分頁以色彩角色的 container 色階標示，並自動捲到分頁列中央。資料可以是字串陣列或物件陣列，也能用預設 slot 完全自訂分頁外觀。泛型元件，資料型別由 `data` 推得。"},"features/components/Scifi-Button.md":{"md":"# Scifi Button\n\n## Summary\n\n`CamelotScifiButton` 是 Sci-Fi 主題的按鈕：外層包 HUD 外框，平時有掃描線，hover 時有光澤掠過與準星，按下時整個外框填滿色彩角色。文字為粗體大寫並加寬字距。一般不直接使用，而是由 `CamelotButton` 在 Sci-Fi 主題下自動選用；色彩角色由外層元件提供。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabled` | `boolean` | `false` | 是否停用按鈕 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `click` | `event: MouseEvent` | 點擊按鈕時觸發 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 按鈕內容 |\n\n## 運作方式\n\n### 互動狀態\n\n| 狀態 | HUD 外框效果 |\n| :--- | :--- |\n| 平時 | 顯示掃描線 |\n| hover | 光澤掠過，準星啟動 |\n| 聚焦 | 外框聚焦樣式，準星啟動 |\n| 按下 | 外框填滿色彩角色，文字改用角色前景色 |\n| 停用 | 關閉掃描線與所有互動效果，透明度 60%，不接受點擊，也無法以 Tab 聚焦 |\n\n來源：1. [Scifi/Button.vue][]　2. [Scifi/Frame.vue][]\n\n### 外觀\n\n按鈕內容區最低 40px、最窄 120px，左右留白 24px；文字取色彩角色混入兩成白色，粗體、全大寫、字距加寬。\n\n來源：1. [Scifi/Button.vue][]\n\n## 相關頁面\n\n- [Button](./Button.md)\n- [Scifi Frame](./Scifi-Frame.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Scifi/Button.vue | [app/components/Camelot/Scifi/Button.vue](../../../../app/components/Camelot/Scifi/Button.vue) |\n| Scifi/Frame.vue | [app/components/Camelot/Scifi/Frame.vue](../../../../app/components/Camelot/Scifi/Frame.vue) |\n\n[Scifi/Button.vue]: #references\n[Scifi/Frame.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Scifi Button","summary":"`CamelotScifiButton` 是 Sci-Fi 主題的按鈕：外層包 HUD 外框，平時有掃描線，hover 時有光澤掠過與準星，按下時整個外框填滿色彩角色。文字為粗體大寫並加寬字距。一般不直接使用，而是由 `CamelotButton` 在 Sci-Fi 主題下自動選用；色彩角色由外層元件提供。"},"features/components/Scifi-Checkbox.md":{"md":"# ScifiCheckbox\n\n## Summary\n\n`CamelotScifiCheckbox` 是 Sci-Fi 主題的核取方塊：18px 的 HUD 方框，勾選時中央亮起帶光暈的方塊並有一道掃描線反覆掃過，hover 時顯示準星。半選狀態與勾選狀態外觀相同。一般不直接使用，而是由 `CamelotCheckbox` 在 Sci-Fi 主題下自動選用；標籤與色彩角色由外層元件提供。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabled` | `boolean` | `false` | 是否停用 |\n| `indeterminate` | `boolean` | `false` | 半選（未定）狀態，外觀與勾選相同 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `change` | `checked: boolean` | 勾選狀態切換時觸發，帶入切換後的值 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `boolean`（預設 `false`） | 是否為勾選狀態 |\n\n## 運作方式\n\n### 狀態外觀\n\n| 狀態 | 外觀 |\n| :--- | :--- |\n| 未勾選 | 淡色細框，左右兩側有較深的括號狀邊 |\n| 勾選或半選 | 括號邊改為實色並發光，中央 10px 方塊亮起，掃描線每秒掃過一次 |\n| hover | 方框周圍顯示準星 |\n| 停用 | 透明度 30%、灰階，不接受點擊 |\n\n來源：1. [Scifi/Checkbox.vue][]\n\n### 點擊\n\n1. 點擊即切換勾選狀態，並以新值發出 `change`；與 Radio 不同，已勾選時點擊會取消。\n2. 半選狀態下點擊，切換的是勾選值；因為半選外觀與勾選相同，畫面可能看不出變化，半選旗標要由外部清除。\n3. 停用時不接受點擊，不發出 `change`。\n\n來源：1. [Scifi/Checkbox.vue][]\n\n## 相關頁面\n\n- [Checkbox](./Checkbox.md)\n- [Scifi Reticle](./Scifi-Reticle.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Scifi/Checkbox.vue | [app/components/Camelot/Scifi/Checkbox.vue](../../../../app/components/Camelot/Scifi/Checkbox.vue) |\n\n[Scifi/Checkbox.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"ScifiCheckbox","summary":"`CamelotScifiCheckbox` 是 Sci-Fi 主題的核取方塊：18px 的 HUD 方框，勾選時中央亮起帶光暈的方塊並有一道掃描線反覆掃過，hover 時顯示準星。半選狀態與勾選狀態外觀相同。一般不直接使用，而是由 `CamelotCheckbox` 在 Sci-Fi 主題下自動選用；標籤與色彩角色由外層元件提供。"},"features/components/Scifi-Frame.md":{"md":"# Scifi Frame\n\n## Summary\n\nSci-Fi 主題的 HUD 外框容器，以切角、格線、掃描線、脈衝與光澤等裝飾包住內容，是 Sci-Fi 版輸入框、按鈕等控制項的共用外殼，通常不直接在頁面上使用。匯入名稱為 `CamelotScifiFrame`（Nuxt 自動匯入）。\n\n## 運作方式\n\n1. 外框主色取自目前色彩變數，沒有設定時退回主題主色，再退回文字顏色。\n2. 預設裁切左上與右下兩角，並在這兩角畫角落裝飾；改用四角樣式時四個角都會裁切。\n3. 關閉切角裁切時，角落裝飾一併隱藏。\n4. 外框內建一個準星裝飾，由啟用準星的設定控制收合與發光。\n5. 內容區的最低高度繼承外框本身，讓外層設定的高度能傳到內容。\n\n來源：1. [Scifi/Frame.vue][]　2. [Scifi/Reticle.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `variant` | `'2-corner' \\| '4-corner'` | `'2-corner'` | 切角樣式；`4-corner` 為四角皆切。 |\n| `showGrid` | `boolean` | `true` | 顯示格線背景。 |\n| `showScanline` | `boolean` | `true` | 顯示掃描線動畫。 |\n| `showPulse` | `boolean` | `false` | 顯示水平脈衝掃描背景。 |\n| `focused` | `boolean` | `false` | 聚焦狀態，套用光暈與內陰影。 |\n| `filled` | `boolean` | `false` | 以主色填滿背景。 |\n| `showShine` | `boolean` | `false` | 觸發一次光澤滑掠動畫。 |\n| `activeReticle` | `boolean` | `false` | 啟用角落準星效果。 |\n| `showBorders` | `boolean` | `true` | 顯示外框邊界背景；`false` 時背景不透明度設為 0。 |\n| `showCorners` | `boolean` | `true` | 顯示左上與右下角落裝飾，需同時開啟 `clipCorners`。 |\n| `clipCorners` | `boolean` | `true` | 啟用切角裁切；`false` 時不裁切邊角。 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 外框內容。 |\n\n## 相關頁面\n\n- [Scifi Reticle](./Scifi-Reticle.md)\n- [Scifi Input](./Scifi-Input.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Scifi/Frame.vue | [app/components/Camelot/Scifi/Frame.vue](../../../../app/components/Camelot/Scifi/Frame.vue) |\n| Scifi/Reticle.vue | [app/components/Camelot/Scifi/Reticle.vue](../../../../app/components/Camelot/Scifi/Reticle.vue) |\n\n[Scifi/Frame.vue]: #references\n[Scifi/Reticle.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Scifi Frame","summary":"Sci-Fi 主題的 HUD 外框容器，以切角、格線、掃描線、脈衝與光澤等裝飾包住內容，是 Sci-Fi 版輸入框、按鈕等控制項的共用外殼，通常不直接在頁面上使用。匯入名稱為 `CamelotScifiFrame`（Nuxt 自動匯入）。"},"features/components/Scifi-Input.md":{"md":"# Scifi Input\n\n## Summary\n\nSci-Fi 主題的輸入框實作：以 HUD 外框包住原生輸入欄，依聚焦與懸停切換光暈、光澤與準星效果。內容區最低 40px，加上外框共 42px，字級繼承外層。通常由公開的 Input 依主題自動選用，匯入名稱為 `CamelotScifiInput`（Nuxt 自動匯入）。\n\n## 運作方式\n\n| 狀態 | 外框效果 |\n|---|---|\n| 聚焦 | 外框光暈與內陰影，準星收合 |\n| 懸停且未停用 | 播放一次光澤滑掠，準星收合 |\n| 停用 | 關閉掃描線 |\n| 任何狀態 | 不顯示格線背景 |\n\n內容區最低高度 40px，輸入欄本身不設字級，沿用外層字級。\n\n來源：1. [Scifi/Input.vue][]　2. [Scifi/Frame.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `placeholder` | `string` | `''` | 輸入框佔位文字。 |\n| `disabled` | `boolean` | `false` | 停用輸入。 |\n| `type` | `CamelotInputType` | `'text'` | 原生 input type，由公開 Input 依實際類型下傳。 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model` | `string \\| number` | 輸入框的值。 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `before` | — | 輸入框前方內容，例如圖示。 |\n| `after` | — | 輸入框後方內容，例如圖示。 |\n\n## Exposed\n| 名稱 | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `inputEl` | `HTMLInputElement \\| null` | 原生 input 元素，供公開 Input 轉接給使用端呼叫聚焦或選取。 |\n\n## 相關頁面\n\n- [Scifi Frame](./Scifi-Frame.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Scifi/Input.vue | [app/components/Camelot/Scifi/Input.vue](../../../../app/components/Camelot/Scifi/Input.vue) |\n| Scifi/Frame.vue | [app/components/Camelot/Scifi/Frame.vue](../../../../app/components/Camelot/Scifi/Frame.vue) |\n\n[Scifi/Input.vue]: #references\n[Scifi/Frame.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Scifi Input","summary":"Sci-Fi 主題的輸入框實作：以 HUD 外框包住原生輸入欄，依聚焦與懸停切換光暈、光澤與準星效果。內容區最低 40px，加上外框共 42px，字級繼承外層。通常由公開的 Input 依主題自動選用，匯入名稱為 `CamelotScifiInput`（Nuxt 自動匯入）。"},"features/components/Scifi-Radio.md":{"md":"# ScifiRadio\n\n## Summary\n\nSci-Fi 主題的單選圓鈕視覺實作，選取時邊框發光、中央指示點以縮放方式出現。通常由公開的 Radio 依主題自動選用，匯入名稱為 `CamelotScifiRadio`（Nuxt 自動匯入）。\n\n## 運作方式\n\n1. 停用時點擊不作用。\n2. 已選取且未開啟可取消選取時，再次點擊不會取消。\n3. 其餘情況點擊會切換選取狀態，並發出變更事件。\n4. 選取時邊框發光，中央指示點縮為一半大小，顏色取目前色彩變數。\n\n來源：1. [Scifi/Radio.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabled` | `boolean` | `false` | 是否停用。 |\n| `deselectable` | `boolean` | `false` | 點擊已選取項可取消選取，用於非必填情境。 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `change` | `checked: boolean` | 選取狀態切換時觸發。 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `boolean`，預設 `false` | 是否為選取狀態。 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Scifi/Radio.vue | [app/components/Camelot/Scifi/Radio.vue](../../../../app/components/Camelot/Scifi/Radio.vue) |\n\n[Scifi/Radio.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"ScifiRadio","summary":"Sci-Fi 主題的單選圓鈕視覺實作，選取時邊框發光、中央指示點以縮放方式出現。通常由公開的 Radio 依主題自動選用，匯入名稱為 `CamelotScifiRadio`（Nuxt 自動匯入）。"},"features/components/Scifi-Reticle.md":{"md":"# Scifi Reticle\n\n## Summary\n\nSci-Fi 主題的四角瞄準框裝飾，啟用或滑鼠移入時四角向內收合並發光。它由 HUD 外框與 Sci-Fi 開關內建使用，通常不直接放在頁面上，匯入名稱為 `CamelotScifiReticle`（Nuxt 自動匯入）。\n\n## 運作方式\n\n1. 以絕對定位貼在父層外圍，四邊各向外延伸 8px。\n2. 預設不接收滑鼠事件；開啟可懸停時改為接收，讓滑鼠移入也能觸發收合。\n3. 顏色取目前色彩變數，沒有時退回主題主色，再退回文字顏色。\n\n來源：1. [Scifi/Reticle.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `active` | `boolean` | — | 是否啟用，四角收合並發光。 |\n| `hoverable` | `boolean` | — | 是否可由滑鼠移入觸發，並開啟指標事件。 |\n\n## 相關頁面\n\n- [Scifi Frame](./Scifi-Frame.md)\n- [Scifi Switch](./Scifi-Switch.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Scifi/Reticle.vue | [app/components/Camelot/Scifi/Reticle.vue](../../../../app/components/Camelot/Scifi/Reticle.vue) |\n\n[Scifi/Reticle.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Scifi Reticle","summary":"Sci-Fi 主題的四角瞄準框裝飾，啟用或滑鼠移入時四角向內收合並發光。它由 HUD 外框與 Sci-Fi 開關內建使用，通常不直接放在頁面上，匯入名稱為 `CamelotScifiReticle`（Nuxt 自動匯入）。"},"features/components/Scifi-Switch.md":{"md":"# Scifi Switch\n\n## Summary\n\nSci-Fi 主題的開關切換元件：滑塊旁顯示 ON 或 OFF 狀態字，外圍有準星裝飾，切換時閃一下亮光。通常由公開的 Switch 依主題自動選用，匯入名稱為 `CamelotScifiSwitch`（Nuxt 自動匯入）。\n\n## 運作方式\n\n1. 點擊時切換開關狀態，並發出變更事件，帶入切換後的值。\n2. 切換瞬間播放約 200ms 的亮度閃爍與光暈動畫。\n3. 準星裝飾平時半透明，懸停或開啟時完整顯示。\n4. 停用時忽略點擊、不發出事件，外觀轉為灰階半透明。\n\n來源：1. [Scifi/Switch.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabled` | `boolean` | `false` | 是否停用，停用時不可點擊並套用灰階透明樣式。 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `change` | `checked: boolean` | 切換狀態時觸發，帶入切換後的值。 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `boolean`，預設 `false` | 開關狀態，開為 `true`、關為 `false`。 |\n\n## 相關頁面\n\n- [Scifi Reticle](./Scifi-Reticle.md)\n- [Switch](./Switch.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Scifi/Switch.vue | [app/components/Camelot/Scifi/Switch.vue](../../../../app/components/Camelot/Scifi/Switch.vue) |\n\n[Scifi/Switch.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Scifi Switch","summary":"Sci-Fi 主題的開關切換元件：滑塊旁顯示 ON 或 OFF 狀態字，外圍有準星裝飾，切換時閃一下亮光。通常由公開的 Switch 依主題自動選用，匯入名稱為 `CamelotScifiSwitch`（Nuxt 自動匯入）。"},"features/components/Scrollbar.md":{"md":"# Scrollbar\n\n## Summary\n\n自訂捲軸容器：隱藏原生捲軸，捲動時淡入一條可拖曳的細捲軸，停止捲動後自動淡出，支援垂直與水平兩種模式。匯入名稱為 `CamelotScrollbar`（Nuxt 自動匯入）。\n\n## 運作方式\n\n1. 原生捲軸以樣式隱藏，內容仍可正常捲動。\n2. 捲動時捲軸淡入；停止捲動 1 秒後淡出。\n3. 捲軸滑塊的長度與位置依可視範圍占總內容的比例計算。\n4. 按住滑塊拖曳時，依拖曳距離換算並同步內容的捲動位置。\n5. 捲動與視窗縮放觸發的量測合併到下一個畫面幀，每幀最多重算一次；捲動監聽為 passive。\n6. 掛載時立即量測一次。\n\n來源：1. [Scrollbar.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `horizontal` | `boolean` | — | 是否為水平捲動模式，否則為垂直。 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 捲動容器內容。 |\n\n## Exposed\n| 名稱 | 說明 |\n| :--- | :--- |\n| `scrollToTop(options?)` | 捲動至頂端；`options.behavior` 預設 `'smooth'`。 |\n| `scrollToBottom(options?)` | 捲動至底端；`options.behavior` 預設 `'smooth'`。 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Scrollbar.vue | [app/components/Camelot/Scrollbar.vue](../../../../app/components/Camelot/Scrollbar.vue) |\n\n[Scrollbar.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Scrollbar","summary":"自訂捲軸容器：隱藏原生捲軸，捲動時淡入一條可拖曳的細捲軸，停止捲動後自動淡出，支援垂直與水平兩種模式。匯入名稱為 `CamelotScrollbar`（Nuxt 自動匯入）。"},"features/components/SelectV2.md":{"md":"# SelectV2\n\n## Summary\n\n泛型下拉選擇器：點觸發器展開選項面板，支援搜尋過濾、虛擬滾動、單一選項停用與自訂選項插槽，觸發器與面板依主題切換樣式。觸發器最低 42px，字級 1rem 設在根節點。匯入名稱為 `CamelotSelectV2`（Nuxt 自動匯入）。\n\n## 運作方式\n\n### 觸發器\n\n| 主題 | 樣式 | 展開時 |\n|---|---|---|\n| Material | Filled：淺底、只有下框線 | 下框線換主色，並加 1px 內陰影 |\n| Cupertino | 淺底、無可見框線 | 轉亮底，並加 inset 主色框 |\n| Aqua | 玻璃底 | 可搜尋時由聚焦光暈表現，框線不變 |\n| Sci-Fi | HUD 外框包住內容，內容區 40px | 外框樣式不變 |\n| 預設 | 一般框線 | 框線換主色 |\n\n1. 觸發器最低 42px；Sci-Fi 內容區 40px，加上外框共 42px。\n2. 可搜尋時觸發器是輸入欄：展開後輸入文字即過濾，有文字時右側出現清除鈕。\n3. 關閉面板時清空搜尋文字。\n\n來源：1. [SelectV2.vue][]\n\n### 選項與預設值\n\n1. 選項顯示文字依序取 label、name、value。\n2. 有自訂過濾函式時用它；否則以不分大小寫比對 value、label、name。\n3. 開啟預設選取且目前沒有值時，自動選第一個「未停用」的選項。\n4. 選取值改變時發出變更事件，帶入整筆選項資料。\n5. 開啟選取後不關閉時，再點一次已選中的項目仍會關閉，視為確認。\n\n來源：1. [SelectV2.vue][]　2. [selectOptions.ts][]\n\n### 選項面板\n\n1. 面板寬度預設最小等於觸發器，選項較長時隨內容加寬；需要同寬時用 same-target。\n2. 展開時把已選項捲到面板中央；虛擬滾動時改捲到已選項的索引。\n3. 選項列帶 title，文字被截斷時可懸停看到完整內容。\n4. 面板本身設定文字色，自訂插槽內容不必再指定。\n5. 選中與懸停樣式和 [CascadeMenu](./CascadeMenu.md) 共用同一組主題設定。\n6. 面板陰影畫在浮層外層，避免被面板的溢出裁切切成方形。\n\n來源：1. [SelectV2.vue][]　2. [useCamelotMenuItemTheme.ts][]\n\n### Sci-Fi 面板差異\n\nSci-Fi 主題的選項面板包在 HUD 外框內，固定最高 200px，不支援虛擬滾動，也不支援依值指定的選項插槽。\n\n來源：1. [SelectV2.vue][]\n\n### 停用\n\n| 情境 | 行為 |\n|---|---|\n| 整個元件停用 | 面板不展開，整體半透明、游標顯示禁止 |\n| 單一選項停用 | 該列不可點、不套懸停效果，透明度 0.38 |\n| 停用選項剛好是目前值 | 仍保留選中樣式，看得出選在哪 |\n| 搜尋時 | 停用選項仍會出現在結果中 |\n\n自訂選項插槽自行送出的點擊也會被擋下，停用選項無法藉此被選取。\n\n來源：1. [SelectV2.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `options` | `SelectOptions<T>` | — | 選項清單。 |\n| `optionsContainerMaxHeight` | `number` | `200` | 選項容器最大高度，單位 px。 |\n| `zIndex` | `number` | — | 浮層 z-index。 |\n| `disableCloseWhenSelected` | `boolean` | — | 選取後不自動關閉；再點已選中的項目仍會關閉。 |\n| `default` | `boolean` | `true` | 未選值時自動選第一個未停用的選項。 |\n| `disabledCloseWhenScrolling` | `boolean` | `true` | 捲動時不關閉浮層。 |\n| `searchable` | `boolean` | `true` | 觸發器改為可輸入搜尋。 |\n| `searchPlaceholder` | `string` | `'搜尋...'` | 搜尋提示字。 |\n| `filterFunction` | `(option: SelectOption<T>, query: string) => boolean` | — | 自訂過濾函式。 |\n| `popupWidthMode` | `'fit-content' \\| 'min-target' \\| 'same-target'` | `'min-target'` | 浮層寬度模式。 |\n| `optionsContainerClass` | `string \\| string[] \\| Record<string, boolean>` | — | 選項容器自訂 class。 |\n| `placeholder` | `string` | `'請選擇...'` | 未選時的提示字。 |\n| `virtualScroll` | `boolean` | `false` | 啟用虛擬滾動，Sci-Fi 主題不適用。 |\n| `itemHeight` | `number` | `36` | 虛擬滾動列高，單位 px。 |\n| `overscan` | `number` | `5` | 虛擬滾動預繪列數。 |\n| `disabled` | `boolean` | `false` | 是否停用。 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色。 |\n| `label` | `string` | — | 欄位標題文字。 |\n| `required` | `boolean` | — | 是否顯示必填標記。 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `changed` | `SelectOption<T>` | 選中資料變動時觸發。 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `string \\| number` | 目前選取選項的值。 |\n| `open` | `boolean`，預設 `false` | 浮層是否展開。 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `label` | `{ label: string }` | 自訂欄位標題，預設渲染 FieldLabel。 |\n| `default` | `{ selectedData }` | 自訂觸發器內容，預設依主題渲染靜態或搜尋觸發器。 |\n| `header` | `{ searchValue, setSearchValue }` | 選項清單上方的自訂表頭。 |\n| `option` | `{ index, data, isSelected }` | 所有選項共用的呈現覆寫。 |\n| `option-${value}` | `{ index, data, isSelected }` | 特定值選項的呈現覆寫，優先於 `option`；Sci-Fi 不支援。 |\n| `empty-options` | — | 無可選選項時的內容。 |\n\n## 相關頁面\n\n- [FieldLabel](./FieldLabel.md)\n- [PopupV2](./PopupV2.md)\n- [CascadeMenu](./CascadeMenu.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| SelectV2.vue | [app/components/Camelot/SelectV2.vue](../../../../app/components/Camelot/SelectV2.vue) |\n| selectOptions.ts | [shared/types/selectOptions.ts](../../../../shared/types/selectOptions.ts) |\n| useCamelotMenuItemTheme.ts | [app/composables/useCamelotMenuItemTheme.ts](../../../../app/composables/useCamelotMenuItemTheme.ts) |\n\n[SelectV2.vue]: #references\n[selectOptions.ts]: #references\n[useCamelotMenuItemTheme.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"SelectV2","summary":"泛型下拉選擇器：點觸發器展開選項面板，支援搜尋過濾、虛擬滾動、單一選項停用與自訂選項插槽，觸發器與面板依主題切換樣式。觸發器最低 42px，字級 1rem 設在根節點。匯入名稱為 `CamelotSelectV2`（Nuxt 自動匯入）。"},"features/components/Skeleton.md":{"md":"# Skeleton\n\n## Summary\n\n載入中的骨架佔位元件：載入時依目前主題顯示不同的載入動畫，載入完成後改顯示預設插槽的實際內容。匯入名稱為 `CamelotSkeleton`（Nuxt 自動匯入）。\n\n## 運作方式\n\n| 主題 | 載入動畫 |\n|---|---|\n| Aqua | 毛玻璃底加 shimmer 光帶 |\n| Sci-Fi | HUD 外框，無邊界、不切角，開啟格線、掃描線與脈衝，最低 24px |\n| Cupertino、Material | 閃光掃過的預設骨架 |\n\n元件不自動繼承屬性，傳入的 class 等屬性會轉交給實際的骨架容器。\n\n來源：1. [Skeleton.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `isLoading` | `boolean` | `true` | 是否顯示骨架；`false` 時改為渲染預設插槽。 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 載入完成後顯示的實際內容。 |\n\n## 相關頁面\n\n- [Scifi Frame](./Scifi-Frame.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Skeleton.vue | [app/components/Camelot/Skeleton.vue](../../../../app/components/Camelot/Skeleton.vue) |\n\n[Skeleton.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Skeleton","summary":"載入中的骨架佔位元件：載入時依目前主題顯示不同的載入動畫，載入完成後改顯示預設插槽的實際內容。匯入名稱為 `CamelotSkeleton`（Nuxt 自動匯入）。"},"features/components/SlideTransitionGroup.md":{"md":"# SlideTransitionGroup\n\n## Summary\n\n以左右滑動轉場切換單一顯示項目的泛型容器：同一時間只顯示目前索引的項目，透過公開的上一項、下一項方法切換。匯入名稱為 `CamelotSlideTransitionGroup`（Nuxt 自動匯入）。\n\n## 運作方式\n\n1. 項目清單每項需含唯一的 key 與 value，data 可選，會傳給插槽。\n2. 只渲染索引等於目前值的項目，並置中疊放。\n3. 上一項：索引減 1，以向右滑動的轉場切換；索引已小於等於 0 時不作動。\n4. 下一項：索引加 1，以向左滑動的轉場切換；已在最後一項時不作動。\n\n來源：1. [SlideTransitionGroup.vue][]　2. [items.ts][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `items` | `Items<T>` | — | 項目清單，每項需含 `key` 與 `value`，`data` 可選。 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model` | `number` | 目前顯示項目的索引，預設 `0`。 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | `{ item, data, index }` | 目前項目、其 `data` 與索引。 |\n\n## Exposed\n| 名稱 | 說明 |\n| :--- | :--- |\n| `prev` | 切換至上一項。 |\n| `next` | 切換至下一項。 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| SlideTransitionGroup.vue | [app/components/Camelot/SlideTransitionGroup.vue](../../../../app/components/Camelot/SlideTransitionGroup.vue) |\n| items.ts | [shared/types/items.ts](../../../../shared/types/items.ts) |\n\n[SlideTransitionGroup.vue]: #references\n[items.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"SlideTransitionGroup","summary":"以左右滑動轉場切換單一顯示項目的泛型容器：同一時間只顯示目前索引的項目，透過公開的上一項、下一項方法切換。匯入名稱為 `CamelotSlideTransitionGroup`（Nuxt 自動匯入）。"},"features/components/Slider.md":{"md":"# Slider\n\n## Summary\n\n滑桿元件：拖曳把手或點軌道選取數值，支援單值與雙把手區間、步進吸附、刻度與文字標記、數值提示，並依主題切換軌道、填色與把手樣式。匯入名稱為 `CamelotSlider`（Nuxt 自動匯入）。\n\n## 運作方式\n\n### 拖曳與點軌道\n\n1. 拖曳把手時即時改值，每次都吸附到步進值的倍數，並限制在最小與最大值之間。\n2. 點軌道時，離點擊位置最近的把手移過去，並可接著拖曳。\n3. 區間模式下兩個把手不會交錯，起點不超過終點。\n4. 聚焦把手後，右鍵與上鍵加一個步進，左鍵與下鍵減一個步進。\n5. 停用時擋掉拖曳、點軌道與方向鍵，值不會改變。\n\n來源：1. [Slider.vue][]\n\n### 值的校正\n\n1. 載入時與外部改值時，會把值吸附到步進值的倍數，避免把手和刻度錯位。\n2. 改變步進、最小或最大值時也會重新吸附。\n3. 吸附時依步進值的小數位數四捨五入，避免浮點誤差。\n\n來源：1. [Slider.vue][]\n\n### 標記與提示\n\n| 設定 | 行為 |\n|---|---|\n| 標記為 true | 依步進自動產生刻度與數字；刻度超過 20 個時不產生 |\n| 標記為陣列 | 依陣列畫刻度，有 label 的顯示文字 |\n| 開啟數值提示 | 每個把手上方常駐顯示目前數值 |\n\nSci-Fi 主題的軌道與把手為直角，其他主題為圓角。\n\n來源：1. [Slider.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `min` | `number` | `0` | 最小值。 |\n| `max` | `number` | `100` | 最大值。 |\n| `step` | `number` | `1` | 步進值，數值吸附到它的倍數。 |\n| `range` | `boolean` | `false` | 雙把手區間模式，值為 `[起, 迄]`。 |\n| `height` | `number` | `6` | 軌道高度，單位 px。 |\n| `marks` | `boolean \\| { value: number, label?: string }[]` | `false` | 刻度與文字；`true` 時依步進自動產生。 |\n| `showTooltip` | `boolean` | `false` | 在把手上方顯示數值提示。 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色。 |\n| `disabled` | `boolean` | `false` | 停用滑桿。 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model` | `number \\| [number, number]` | 目前值；區間模式為 `[起, 迄]`，預設 `0`。 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Slider.vue | [app/components/Camelot/Slider.vue](../../../../app/components/Camelot/Slider.vue) |\n\n[Slider.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Slider","summary":"滑桿元件：拖曳把手或點軌道選取數值，支援單值與雙把手區間、步進吸附、刻度與文字標記、數值提示，並依主題切換軌道、填色與把手樣式。匯入名稱為 `CamelotSlider`（Nuxt 自動匯入）。"},"features/components/Steps.md":{"md":"# Steps\n\n## Summary\n\n步驟指示器：依目前步驟索引顯示流程進度，已完成的步驟打勾、進行中的步驟以主色標示，可選擇開放點擊切換步驟。Cupertino、Sci-Fi、Aqua 主題有專屬樣式。匯入名稱為 `CamelotSteps`（Nuxt 自動匯入）。\n\n## 運作方式\n\n### 步驟狀態\n\n| 狀態 | 條件 | 預設圓點 |\n|---|---|---|\n| 已完成 | 索引小於目前步驟 | 顯示 ✓ |\n| 進行中 | 索引等於目前步驟 | 顯示序號，主色標示 |\n| 未開始 | 索引大於目前步驟 | 顯示序號 |\n\n來源：1. [Steps.vue][]\n\n### 點擊切換\n\n1. 未開啟點擊切換時，點擊不作用。\n2. 禁止往後時，點目前步驟之後的步驟不作用。\n3. 禁止往前時，點目前步驟之前的步驟不作用。\n4. 其餘情況把目前步驟改成被點的索引。\n\n來源：1. [Steps.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `steps` | `string[]` | — | 步驟文字陣列，必填。 |\n| `enableChangeByClick` | `boolean` | — | 啟用點擊切換步驟。 |\n| `disableClickToNext` | `boolean` | — | 禁止點擊切換到後面的步驟。 |\n| `disableClickToPrevision` | `boolean` | — | 禁止點擊切換到前面的步驟。 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色。 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model` | `number` | 目前步驟索引，從 0 起算，預設 `0`。 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `dot` | `{ value, index, isComplete, isDoing }` | 自訂步驟圓點。 |\n| `content` | `{ value, index, isComplete, isDoing }` | 自訂步驟文字內容。 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Steps.vue | [app/components/Camelot/Steps.vue](../../../../app/components/Camelot/Steps.vue) |\n\n[Steps.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Steps","summary":"步驟指示器：依目前步驟索引顯示流程進度，已完成的步驟打勾、進行中的步驟以主色標示，可選擇開放點擊切換步驟。Cupertino、Sci-Fi、Aqua 主題有專屬樣式。匯入名稱為 `CamelotSteps`（Nuxt 自動匯入）。"},"features/components/Switch.md":{"md":"# Switch\n\n## Summary\n\n開關主元件：依目前主題自動選用 Material、Cupertino、Aqua 或 Sci-Fi 的開關實作，可在右側附標籤，點標籤也能切換。匯入名稱為 `CamelotSwitch`（Nuxt 自動匯入）。\n\n## 運作方式\n\n### 主題選用\n\n| 主題 | 使用的實作 |\n|---|---|\n| Sci-Fi | [Scifi Switch](./Scifi-Switch.md) |\n| Cupertino | Cupertino Switch |\n| Aqua | Aqua Switch |\n| 其他 | Material Switch |\n\n1. 開關本身與標籤都會切換狀態，並發出變更事件，帶入切換後的值。\n2. 停用時點標籤不作用，標籤轉為半透明、游標顯示禁止。\n3. 色彩角色與容器色情境會套到整個元件，子實作取用同一組目前色彩。\n\n來源：1. [Switch.vue][]\n\n### 尺寸\n\n各主題的開關高度都是 22px，和勾選框並排時對齊。\n\n| 主題 | 軌道 | 把手 |\n| :--- | :--- | :--- |\n| Aqua | 40×22 | 18 |\n| Material | 40×22 | 未選 12、選中 16 |\n| Cupertino | 40×22 | 18 |\n| Sci-Fi | 48×22，軌道內顯示 ON、OFF 文字 | 14 |\n\n來源：1. [Aqua/Switch.vue][]　2. [Material/Switch.vue][]　3. [Cupertino/Switch.vue][]　4. [Scifi/Switch.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `label` | `string` | `''` | 標籤文字。 |\n| `disabled` | `boolean` | `false` | 是否停用。 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色。 |\n| `isContainer` | `boolean` | `false` | 是否使用容器色情境。 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `change` | `checked: boolean` | 切換狀態時觸發，帶入切換後的值。 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `boolean`，預設 `false` | 開關狀態。 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `label` | `{ label: string }` | 自訂標籤內容，預設渲染 FieldLabel。 |\n\n## 相關頁面\n\n- [FieldLabel](./FieldLabel.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Switch.vue | [app/components/Camelot/Switch.vue](../../../../app/components/Camelot/Switch.vue) |\n| Aqua/Switch.vue | [app/components/Camelot/Aqua/Switch.vue](../../../../app/components/Camelot/Aqua/Switch.vue) |\n| Material/Switch.vue | [app/components/Camelot/Material/Switch.vue](../../../../app/components/Camelot/Material/Switch.vue) |\n| Cupertino/Switch.vue | [app/components/Camelot/Cupertino/Switch.vue](../../../../app/components/Camelot/Cupertino/Switch.vue) |\n| Scifi/Switch.vue | [app/components/Camelot/Scifi/Switch.vue](../../../../app/components/Camelot/Scifi/Switch.vue) |\n\n[Switch.vue]: #references\n[Aqua/Switch.vue]: #references\n[Material/Switch.vue]: #references\n[Cupertino/Switch.vue]: #references\n[Scifi/Switch.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Switch","summary":"開關主元件：依目前主題自動選用 Material、Cupertino、Aqua 或 Sci-Fi 的開關實作，可在右側附標籤，點標籤也能切換。匯入名稱為 `CamelotSwitch`（Nuxt 自動匯入）。"},"features/components/Table.md":{"md":"# Table\n\n## Summary\n\n泛型資料表格：以原生表格結構呈現欄與列，支援虛擬滾動、固定表頭、左右固定欄、置頂列、斑馬紋、懸停底色與自訂覆蓋式捲軸。列資料型別為任意物件。匯入名稱為 `CamelotTable`（Nuxt 自動匯入）。\n\n## 運作方式\n\n### 欄位定義與取值\n\n| 欄位屬性 | 說明 |\n|---|---|\n| key | 對應列資料的欄位，也用於表頭與儲存格插槽命名 |\n| title | 表頭標題 |\n| width | 欄寬；固定欄建議明確指定，偏移才算得準 |\n| align | 對齊：left、center、right |\n| fixed | 固定欄：left 或 right |\n| accessor | 取值函式，供巢狀或衍生欄位使用 |\n\n1. 儲存格值優先取 accessor 的結果，否則取列資料中與 key 同名的欄位。\n2. 列鍵依序取：列鍵函式的結果、列資料中指定欄位的值，都沒有時用列索引。\n\n來源：1. [Table.vue][]　2. [table.ts][]\n\n### 虛擬滾動\n\n開啟虛擬滾動時，表格只渲染可視範圍內的列，並在表身上下各插一列空白列，撐出其餘列的高度。\n\n這個做法保留原生表格的欄寬對齊，固定表頭、固定欄、斑馬紋、懸停、置頂列與儲存格插槽都照常運作，插槽拿到的列索引仍是真實索引。\n\n列高不需固定：尚未量測的列以預估列高計算，渲染後再量實際高度修正；同一列只註冊一次尺寸觀察。\n\n關閉虛擬滾動時一次渲染全部資料列。虛擬滾動要搭配固定高度或高度上限，容器有高度上限才有效益。\n\n來源：1. [Table.vue][]　2. [useCamelotVirtual.ts][]\n\n### 固定表頭、固定欄與置頂列\n\n三者都以 sticky 定位實作。置頂列的頂端位置等於量測到的表頭高度，因此固定在表頭正下方。\n\n固定欄依前面各固定欄的寬度累計偏移；最後一個左固定欄與第一個右固定欄帶陰影，與捲動內容分隔。\n\n外層容器負責圓角並裁切內容，捲動發生在內層容器，捲軸因此不會溢出圓角。\n\n來源：1. [Table.vue][]\n\n### 捲軸與表頭底色\n\n1. 原生捲軸隱藏，改用兩條覆蓋式捲軸：水平捲軸可浮動在視窗底，垂直捲軸貼在右側，都跟隨色彩角色。\n2. 保留捲軸空間時，右側與底部各留 6px 透明邊框給捲軸；關閉時捲軸直接覆蓋在表格上。\n3. 表頭底色刻意不透明，Aqua 主題也一樣。每個表頭格若各自半透明加模糊，都會成為獨立合成層，欄越多越吃效能。\n4. Aqua 的玻璃質感改由表格容器承擔。\n\n來源：1. [Table.vue][]　2. [OverlayScrollbar.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `columns` | `CamelotTableColumn<T>[]` | — | 欄位定義。 |\n| `data` | `T[]` | — | 資料列。 |\n| `rowKey` | `string \\| ((row: T) => string \\| number)` | — | 列鍵，未給則以索引為鍵。 |\n| `stripe` | `boolean` | `false` | 斑馬紋。 |\n| `hover` | `boolean` | `true` | 列懸停底色。 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色，套用於捲軸、列懸停底色、表頭底線等強調處。 |\n| `height` | `string` | — | 固定高度，例如 `\"480px\"`；內容少時保留空白、多時內部捲動。 |\n| `maxHeight` | `string` | — | 高度上限，內容少於上限時容器會縮短。 |\n| `floatingScrollbar` | `boolean` | `true` | 表格底部落在視窗外時，於視窗底浮現同步的水平捲軸。 |\n| `pinnedTopRows` | `T[]` | `[]` | 固定置頂列。 |\n| `virtual` | `boolean` | `true` | 虛擬滾動，支援可變列高，需搭配 `height` 或 `maxHeight`。 |\n| `estimatedRowHeight` | `number` | `44` | 預估列高，單位 px，尚未量測的列以此估算。 |\n| `reserveVerticalScrollbar` | `boolean` | `true` | 是否為垂直捲軸保留固定空間；關閉則捲軸覆蓋於表格上。 |\n| `reserveHorizontalScrollbar` | `boolean` | `true` | 是否為水平捲軸保留固定空間；關閉則捲軸覆蓋於表格上。 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `head-${key}` | `{ column }` | 自訂某欄的表頭內容，未提供時顯示欄位標題。 |\n| `cell-${key}` | `{ row, column, value, rowIndex, pinned }` | 自訂某欄的儲存格內容，`pinned` 表示是否為置頂列。 |\n| `empty` | — | 無資料時顯示，預設為「無資料」。 |\n\n## 相關頁面\n\n- [OverlayScrollbar](./OverlayScrollbar.md)\n- [VirtualScroll](./VirtualScroll.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Table.vue | [app/components/Camelot/Table.vue](../../../../app/components/Camelot/Table.vue) |\n| table.ts | [shared/types/table.ts](../../../../shared/types/table.ts) |\n| useCamelotVirtual.ts | [app/composables/useCamelotVirtual.ts](../../../../app/composables/useCamelotVirtual.ts) |\n| OverlayScrollbar.vue | [app/components/Camelot/OverlayScrollbar.vue](../../../../app/components/Camelot/OverlayScrollbar.vue) |\n\n[Table.vue]: #references\n[table.ts]: #references\n[useCamelotVirtual.ts]: #references\n[OverlayScrollbar.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Table","summary":"泛型資料表格：以原生表格結構呈現欄與列，支援虛擬滾動、固定表頭、左右固定欄、置頂列、斑馬紋、懸停底色與自訂覆蓋式捲軸。列資料型別為任意物件。匯入名稱為 `CamelotTable`（Nuxt 自動匯入）。"},"features/components/Tabs.md":{"md":"# Tabs\n\n## Summary\n\n泛型分頁切換元件：橫向列出分頁，以滑動指示器標出目前選取項，選取項會自動捲到可視範圍中央。指示器與分頁樣式依主題切換。匯入名稱為 `CamelotTabs`（Nuxt 自動匯入）。\n\n## 運作方式\n\n### 切換\n\n1. 點擊分頁時一律發出點擊事件。\n2. 手動模式只發出點擊事件，不改變選取，由使用端決定。\n3. 懸停模式下滑鼠移入分頁即視同點擊。\n4. 點到已選取的分頁不重複切換；切到新分頁時更新選取值，並發出變更事件。\n5. 分頁文字預設取選項的 name；有指定資料欄位名且選項資料含該欄位時，改取該欄位。\n\n來源：1. [Tabs.vue][]\n\n### 指示器與捲動\n\n| 主題 | 容器 | 指示器 |\n|---|---|---|\n| Aqua | 藥丸形玻璃軌道 | 藥丸形填滿 |\n| Material | 底部分隔線 | 3px 主色底線 |\n| Cupertino | 淺底區段控制 | 亮底浮起的區段 |\n| Sci-Fi | 無外框 | 2px 發光底線 |\n\n1. 指示器位置在執行期量測分頁的實際位置與寬度，並換算成可捲動內容內的座標。\n2. 選取、選項或主題變更，容器尺寸變化，以及字型載入完成後都會重算。\n3. 元件更新時把選取分頁捲到中央；可選擇平滑捲動或直接跳過去。\n\n來源：1. [Tabs.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `options` | `SelectOptions<T>` | — | 分頁選項清單。 |\n| `dataKey` | `string` | — | 從 `option.data` 取顯示文字的欄位名。 |\n| `scrollSmooth` | `boolean` | `true` | 切換時平滑捲動至選取分頁。 |\n| `trigger` | `'click' \\| 'hover' \\| 'manual'` | — | 觸發切換方式；`manual` 時僅發出事件不改變選取。 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色。 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `click` | `(index: number, option: SelectOption<T>)` | 點擊分頁時觸發，懸停模式的移入也算。 |\n| `changed` | `(index: number, option: SelectOption<T>)` | 選取變更時觸發。 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model` | `string \\| number` | 目前選取項的 `value`。 |\n| `v-model:selectedIndex` | `number \\| undefined` | 目前選取項的索引，與 value 雙向對應。 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | `{ item, option, data, text, index, isSelected }` | 自訂單一分頁內容。 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Tabs.vue | [app/components/Camelot/Tabs.vue](../../../../app/components/Camelot/Tabs.vue) |\n\n[Tabs.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Tabs","summary":"泛型分頁切換元件：橫向列出分頁，以滑動指示器標出目前選取項，選取項會自動捲到可視範圍中央。指示器與分頁樣式依主題切換。匯入名稱為 `CamelotTabs`（Nuxt 自動匯入）。"},"features/components/Tag.md":{"md":"# Tag\n\n## Summary\n\n標籤徽章：以短文字標示狀態或分類，支援實心、柔色、外框三種外觀，兩種尺寸，並可加上關閉按鈕。形狀依主題切換。匯入名稱為 `CamelotTag`（Nuxt 自動匯入）。\n\n## 運作方式\n\n### 外觀與尺寸\n\n| 外觀 | 樣式 |\n|---|---|\n| solid | 主色底、配對前景色文字 |\n| soft | 主色淡底、主色文字；Sci-Fi 另加半透明邊框與外發光 |\n| outline | 主色框線、主色文字 |\n\n| 主題 | 形狀 |\n|---|---|\n| Aqua | 藥丸形，背景模糊 |\n| Sci-Fi | 切角、直角，文字大寫加寬字距 |\n| Cupertino | 圓角 |\n| 其他 | 中圓角 |\n\n小尺寸用較小字級與內距，預設為中尺寸。\n\n來源：1. [Tag.vue][]\n\n### 關閉與停用\n\n1. 開啟可關閉時，文字後方顯示關閉按鈕；點擊發出關閉事件，不會冒泡到外層。\n2. 停用時整個標籤半透明，關閉按鈕不可點。\n\n來源：1. [Tag.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `label` | `string` | — | 標籤文字，也可用預設插槽覆寫。 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色。 |\n| `variant` | `'solid' \\| 'soft' \\| 'outline'` | `'soft'` | 外觀。 |\n| `size` | `'sm' \\| 'md'` | `'md'` | 尺寸。 |\n| `closable` | `boolean` | — | 是否顯示關閉按鈕。 |\n| `disabled` | `boolean` | — | 停用，降低透明度、關閉按鈕不可點。 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `close` | — | 點擊關閉按鈕時觸發。 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `icon` | — | 標籤前置圖示。 |\n| `default` | — | 標籤內容，未提供時顯示 `label`。 |\n\n## 相關頁面\n\n- [TagGroup](./TagGroup.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Tag.vue | [app/components/Camelot/Tag.vue](../../../../app/components/Camelot/Tag.vue) |\n\n[Tag.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Tag","summary":"標籤徽章：以短文字標示狀態或分類，支援實心、柔色、外框三種外觀，兩種尺寸，並可加上關閉按鈕。形狀依主題切換。匯入名稱為 `CamelotTag`（Nuxt 自動匯入）。"},"features/components/TagGroup.md":{"md":"# TagGroup\n\n## Summary\n\n可新增與刪除的標籤群組：以 Tag 列出目前標籤，尾端的新增按鈕展開行內輸入框，支援去重、逐項鎖定、逐項顏色與外觀，以及數量上限。匯入名稱為 `CamelotTagGroup`（Nuxt 自動匯入）。\n\n## 運作方式\n\n### 項目格式\n\n每一項可以是純字串，或帶 label、color、variant、locked 的物件；物件沒給的欄位沿用群組預設。\n\n來源：1. [TagGroup.vue][]　2. [camelot.ts][]\n\n### 新增\n\n1. 點新增按鈕展開輸入框並自動聚焦。\n2. 按 Enter 或輸入框失焦時提交；按 Esc 取消並關閉輸入框。\n3. 提交空白內容時直接關閉輸入框。\n4. 不允許重複時，輸入已存在的值會清空輸入框但不新增。\n5. 新增成功後發出新增與變更事件。\n6. 連續新增模式下輸入框保持開啟；關閉連續新增或達到上限時，新增後自動關閉。\n\n來源：1. [TagGroup.vue][]\n\n### 刪除與停用\n\n| 情境 | 行為 |\n|---|---|\n| 點標籤的關閉鈕 | 移除該項，發出移除與變更事件 |\n| 輸入框為空時按 Backspace | 移除最後一個標籤 |\n| 鎖定項 | 沒有關閉鈕，Backspace 也不會移除 |\n| 整組停用 | 隱藏新增按鈕，所有標籤都沒有關閉鈕 |\n| 達到數量上限 | 隱藏新增按鈕 |\n\n來源：1. [TagGroup.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `color` | `CamelotColorRole` | `'primary'` | 群組預設顏色，逐項可用 `item.color` 覆寫。 |\n| `variant` | `CamelotTagVariant` | `'soft'` | 群組預設外觀，逐項可用 `item.variant` 覆寫。 |\n| `size` | `'sm' \\| 'md'` | `'md'` | 尺寸。 |\n| `disabled` | `boolean` | `false` | 整組停用：隱藏新增按鈕並移除刪除鈕。 |\n| `addable` | `boolean` | `true` | 是否顯示新增按鈕。 |\n| `allowDuplicate` | `boolean` | `false` | 是否允許重複值。 |\n| `continuousAdd` | `boolean` | `true` | `true` 新增後維持輸入；`false` 新增一個即關閉輸入框。 |\n| `max` | `number` | — | 標籤數上限，未設定表示不限制。 |\n| `placeholder` | `string` | `'新增標籤…'` | 輸入框佔位文字。 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `add` | `value: string` | 新增一個標籤時觸發。 |\n| `remove` | `value: string, index: number` | 移除一個標籤時觸發。 |\n| `change` | `values: CamelotTagInput[]` | 新增或移除後觸發，帶入新清單。 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model` | `CamelotTagInput[]` | 標籤清單，純字串或物件，預設 `[]`。 |\n\n## 相關頁面\n\n- [Tag](./Tag.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| TagGroup.vue | [app/components/Camelot/TagGroup.vue](../../../../app/components/Camelot/TagGroup.vue) |\n| camelot.ts | [shared/types/camelot.ts](../../../../shared/types/camelot.ts) |\n\n[TagGroup.vue]: #references\n[camelot.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"TagGroup","summary":"可新增與刪除的標籤群組：以 Tag 列出目前標籤，尾端的新增按鈕展開行內輸入框，支援去重、逐項鎖定、逐項顏色與外觀，以及數量上限。匯入名稱為 `CamelotTagGroup`（Nuxt 自動匯入）。"},"features/components/Textarea.md":{"md":"# Textarea\n\n## Summary\n\n多行文字輸入元件：上方以 FieldLabel 顯示欄位標題，支援自動增高、最大列數、手動縮放方向與字數統計，外觀依主題切換。匯入名稱為 `CamelotTextarea`（Nuxt 自動匯入）。\n\n## 運作方式\n\n### 自動增高\n\n1. 開啟自動增高時，輸入、值變動與掛載後都會依內容重新計算高度。\n2. 設定最大列數時，高度上限以行高乘列數再加上內距推算。\n3. 自動增高時一律不可手動縮放；未開啟時依縮放設定決定可拖曳的方向。\n\n來源：1. [Textarea.vue][]\n\n### 外觀與狀態\n\n| 主題 | 樣式 | 聚焦時 |\n|---|---|---|\n| Aqua | 玻璃底 | 聚焦光暈 |\n| Sci-Fi | 直角半透明主色框、等寬字 | 框線換主色並外發光 |\n| Cupertino | 圓角細框、淺底 | 框線換主色 |\n| Material | Filled：淺底、只有下框線 | 下框線加粗並換主色 |\n\n1. 字級為 1rem，游標顏色跟隨色彩角色。\n2. 停用時整個元件半透明、游標顯示禁止。\n3. 同時設定字數上限與顯示字數時，右下角顯示「目前字數 / 上限」。\n\n來源：1. [Textarea.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `label` | `string` | — | 欄位標題文字。 |\n| `required` | `boolean` | — | 是否在標題顯示必填星號。 |\n| `placeholder` | `string` | — | 提示文字。 |\n| `disabled` | `boolean` | — | 是否停用。 |\n| `rows` | `number` | `3` | 預設顯示列數。 |\n| `autosize` | `boolean` | `false` | 是否隨內容自動增高。 |\n| `maxRows` | `number` | — | 自動增高時的最大列數。 |\n| `resize` | `'none' \\| 'vertical' \\| 'both'` | `'vertical'` | 手動縮放方向，`autosize` 開啟時不可縮放。 |\n| `maxlength` | `number` | — | 最大字元數。 |\n| `showCount` | `boolean` | `false` | 是否顯示字數統計，需同時設定 `maxlength`。 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色。 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `string`，預設 `''` | 文字輸入值。 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `label` | `{ label: string }` | 自訂標題區塊，預設渲染 FieldLabel。 |\n\n## 相關頁面\n\n- [FieldLabel](./FieldLabel.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Textarea.vue | [app/components/Camelot/Textarea.vue](../../../../app/components/Camelot/Textarea.vue) |\n\n[Textarea.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Textarea","summary":"多行文字輸入元件：上方以 FieldLabel 顯示欄位標題，支援自動增高、最大列數、手動縮放方向與字數統計，外觀依主題切換。匯入名稱為 `CamelotTextarea`（Nuxt 自動匯入）。"},"features/components/TimeV2.md":{"md":"# TimeV2\n\n## Summary\n\n時間選擇器：點觸發欄位後，以浮層或對話框顯示時、分、秒選擇列與確認按鈕，支援 12 與 24 小時制及精細度控制。欄位標題用 FieldLabel；觸發欄位最低 42px，樣式跟各主題的 Input 一致，Sci-Fi 另包 HUD 外框。匯入名稱為 `CamelotTimeV2`（Nuxt 自動匯入）。\n\n## 運作方式\n\n### 觸發欄位\n\n| 主題 | 樣式 | 展開時 |\n|---|---|---|\n| Material | Filled：淺底、只有下框線 | 下框線換主色，並加 1px 內陰影 |\n| Cupertino | 淺底、無可見框線 | 轉亮底，並加 inset 主色框 |\n| Aqua | 玻璃底 | 聚焦光暈 |\n| Sci-Fi | HUD 外框，內容區 40px | 外框進入聚焦狀態 |\n\n1. 欄位最低 42px，字級 1rem 設在根節點；左側為時鐘圖示，輸入欄唯讀。\n2. 點欄位切換開關；停用時不作用，欄位轉灰並半透明。\n3. 錯誤狀態時框線改為錯誤色。\n4. 額外屬性會綁到內部唯讀輸入欄。\n\n點圖示等非輸入欄的位置時，欄位會阻止預設行為；否則瀏覽器會再對輸入欄補發一次點擊，把剛開的浮層又關掉。\n\n來源：1. [TimeV2.vue][]　2. [useCamelotPickerTheme.ts][]　3. [FieldFrame.vue][]\n\n### 呈現方式\n\n| 設定 | 呈現 |\n|---|---|\n| auto | 手機用對話框，其他裝置用浮層 |\n| popup | 浮層；點欄位與面板以外的地方即關閉 |\n| dialog | 對話框 |\n\n時、分、秒各欄的下拉清單會傳送到最近的對話框，沒有時傳到 body，層級比時間浮層高一層，在 Dialog 或 Sheet 內也能正常顯示與點選。\n\n來源：1. [TimeV2.vue][]　2. [TimeField.vue][]　3. [useCamelotTeleportTarget.ts][]\n\n### 值與顯示\n\n1. 綁定值一律是 24 小時制字串：精細度到秒時為時分秒，其餘為時分。\n2. 讀入綁定值時，時限制在 0 到 23，分與秒限制在 0 到 59。\n3. 調整選擇列即寫回綁定值。\n4. 欄位顯示依小時制與精細度轉換；12 小時制在時間後加上 AM 或 PM。\n5. 首次開啟未調整就按確認，會套用目前的內部值，預設為 00:00。\n\n來源：1. [TimeV2.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色。 |\n| `label` | `string` | — | 欄位標題。 |\n| `required` | `boolean` | — | 標題旁顯示必填星號。 |\n| `disabled` | `boolean` | — | 停用。 |\n| `isError` | `boolean` | — | 錯誤狀態，框線改為錯誤色。 |\n| `placeholder` | `string` | `'HH:mm'` | 未選值時的提示文字。 |\n| `showType` | `'auto' \\| 'popup' \\| 'dialog'` | `'auto'` | 呈現方式；`auto` 時手機用對話框、其他用浮層。 |\n| `selectZIndex` | `number` | — | 浮層 z-index。 |\n| `timePrecision` | `'hour' \\| 'minute' \\| 'second'` | `'minute'` | 精細度：`hour` 僅時、`minute` 時分、`second` 時分秒。 |\n| `hourFormat` | `'12' \\| '24'` | `'24'` | 12 或 24 小時制。 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model` | `string` | 24 小時制時間字串，`\"HH:mm\"` 或 `\"HH:mm:ss\"`。 |\n\n## 相關頁面\n\n- [FieldLabel](./FieldLabel.md)\n- [Internal TimeRow](./Internal-TimeRow.md)\n- [Internal TimeField](./Internal-TimeField.md)\n- [Internal FieldFrame](./Internal-FieldFrame.md)\n- [useCamelotTeleportTarget](../composables/useCamelotTeleportTarget.md)\n- [時間選擇器](../time-picker.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| TimeV2.vue | [app/components/Camelot/TimeV2.vue](../../../../app/components/Camelot/TimeV2.vue) |\n| useCamelotPickerTheme.ts | [app/composables/useCamelotPickerTheme.ts](../../../../app/composables/useCamelotPickerTheme.ts) |\n| FieldFrame.vue | [app/components/Camelot/Internal/FieldFrame.vue](../../../../app/components/Camelot/Internal/FieldFrame.vue) |\n| TimeField.vue | [app/components/Camelot/Internal/TimeField.vue](../../../../app/components/Camelot/Internal/TimeField.vue) |\n| useCamelotTeleportTarget.ts | [app/composables/useCamelotTeleportTarget.ts](../../../../app/composables/useCamelotTeleportTarget.ts) |\n\n[TimeV2.vue]: #references\n[useCamelotPickerTheme.ts]: #references\n[FieldFrame.vue]: #references\n[TimeField.vue]: #references\n[useCamelotTeleportTarget.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"TimeV2","summary":"時間選擇器：點觸發欄位後，以浮層或對話框顯示時、分、秒選擇列與確認按鈕，支援 12 與 24 小時制及精細度控制。欄位標題用 FieldLabel；觸發欄位最低 42px，樣式跟各主題的 Input 一致，Sci-Fi 另包 HUD 外框。匯入名稱為 `CamelotTimeV2`（Nuxt 自動匯入）。"},"features/components/Timeline.md":{"md":"# Timeline\n\n## Summary\n\n時間軸元件：依項目清單沿一條軸線排列軸點與內容，支援垂直或水平方向、單側或交錯排列，以及捲動時逐一淡入。項目型別定義在元件內，每項可帶標題、內容文字與圖片。匯入名稱為 `CamelotTimeline`（Nuxt 自動匯入）。\n\n## 運作方式\n\n### 排列\n\n| 方向 | before | after |\n|---|---|---|\n| 垂直 | 內容在軸線左側，文字靠右 | 內容在軸線右側 |\n| 水平 | 內容在軸線上方，貼齊軸線 | 內容在軸線下方，貼齊軸線 |\n\n1. 交錯排列時，第 1、3、5… 項放 after 側，第 2、4、6… 項放 before 側。\n2. 交錯排列用三條軌道，軸線置中；單側排列用兩條軌道，軸線靠邊。\n3. 垂直方向以欄分軌、水平方向以列分軌，讓軸點與軸線永遠對齊。\n\n來源：1. [Timeline.vue][]\n\n### 軸點與淡入\n\n1. 預設軸點為圓點，Sci-Fi 主題帶發光；可用插槽自訂。\n2. 開啟淡入時，項目進入視窗 20% 後才淡入並滑入定位，每項只觸發一次。\n3. 未開啟淡入或在伺服器端渲染時，所有項目直接顯示。\n\n來源：1. [Timeline.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `items` | `TimelineItem[]` | — | 時間軸項目清單。 |\n| `direction` | `'vertical' \\| 'horizontal'` | `'vertical'` | 排列方向。 |\n| `side` | `'before' \\| 'after' \\| 'alternate'` | `'after'` | 內容位置，`alternate` 為交錯。 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色。 |\n| `animate` | `boolean` | `false` | 捲動逐一淡入。 |\n\n### TimelineItem\n| 欄位 | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `title` | `string?` | 標題。 |\n| `content` | `string?` | 內容文字。 |\n| `image` | `string?` | 內容圖片網址，渲染於文字下方；自訂 `content` 插槽時不套用。 |\n| `key` | `string \\| number?` | 列表 key。 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `title` | `{ item: TimelineItem, index: number }` | 自訂標題，預設渲染 `item.title`。 |\n| `content` | `{ item: TimelineItem, index: number }` | 自訂內容，預設渲染 `item.content` 與 `item.image`。 |\n| `node` | `{ item: TimelineItem, index: number }` | 自訂軸點，預設渲染圓點。 |\n\n## 相關頁面\n\n- [時間軸](../timeline.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Timeline.vue | [app/components/Camelot/Timeline.vue](../../../../app/components/Camelot/Timeline.vue) |\n\n[Timeline.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Timeline","summary":"時間軸元件：依項目清單沿一條軸線排列軸點與內容，支援垂直或水平方向、單側或交錯排列，以及捲動時逐一淡入。項目型別定義在元件內，每項可帶標題、內容文字與圖片。匯入名稱為 `CamelotTimeline`（Nuxt 自動匯入）。"},"features/components/Toast.md":{"md":"# Toast\n\n## Summary\n\n全域通知容器：讀取 useCamelotToast 的通知清單，依九種位置分組堆疊顯示，每張卡片有狀態色、標題與訊息、動作按鈕與關閉鈕，進退場只做淡入淡出。整個 App 通常掛一個即可。匯入名稱為 `CamelotToast`（Nuxt 自動匯入）。\n\n## 運作方式\n\n### 位置與堆疊\n\n1. 通知依位置分組，未指定時為 bottom。\n2. 支援 top、bottom、left、right、center、top-left、top-right、bottom-left、bottom-right。\n3. 底部三個位置由下往上堆疊，其餘由上往下。\n4. center 以頂端錨在畫面中央往下堆疊，新增通知時既有通知不會跳動。\n5. 容器只在瀏覽器端渲染，並掛到 body 底下。\n\n來源：1. [Toast.vue][]　2. [useCamelotToast.ts][]\n\n### 狀態色\n\n| 通知設定 | 使用的色彩角色 |\n|---|---|\n| 有指定 color | 指定的色彩角色 |\n| type 為 success、error、warning | 同名的狀態色 |\n| type 為 info 或未指定 | primary |\n\n來源：1. [Toast.vue][]\n\n### 外觀\n\n1. 卡片左側有 4px 狀態色邊，卡片底下再疊一層 16% 的狀態色，並加上狀態圓點，讓類型一眼可辨。\n2. Aqua 主題的通知卡用 55% 不透明度的 surface 底，比一般玻璃面板更透。\n3. 有標題時標題在上、訊息用次要文字色；沒有標題時訊息用主要文字色。\n4. 預設動作按鈕的文字跟隨色彩角色；點擊時執行動作並關閉該通知。\n\n來源：1. [Toast.vue][]\n\n### 只做淡入淡出的原因\n\n進場與退場只改透明度，不用位移動畫：元素在 transform 期間，backdrop-filter 取樣會失效，毛玻璃會等動畫結束才突然出現。\n\n透明度套在帶模糊的卡片自身，而不是它的祖先。套在祖先上會把卡片隔離在另一個 backdrop root 裡，模糊取樣不到真正的背景。\n\n進場 300ms、退場 260ms。\n\n來源：1. [Toast.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `zIndex` | `number` | `1000` | 容器 z-index。 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | `{ toast, type, color }` | 自訂整張卡片；`type` 未指定時為 `'info'`，`color` 依上表推導。 |\n| `action` | `{ toast, run, close }` | 自訂動作區；`run()` 執行動作並關閉，`close()` 移除該通知。 |\n\n## 相關頁面\n\n- [useCamelotToast](../composables/useCamelotToast.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Toast.vue | [app/components/Camelot/Toast.vue](../../../../app/components/Camelot/Toast.vue) |\n| useCamelotToast.ts | [app/composables/useCamelotToast.ts](../../../../app/composables/useCamelotToast.ts) |\n\n[Toast.vue]: #references\n[useCamelotToast.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Toast","summary":"全域通知容器：讀取 useCamelotToast 的通知清單，依九種位置分組堆疊顯示，每張卡片有狀態色、標題與訊息、動作按鈕與關閉鈕，進退場只做淡入淡出。整個 App 通常掛一個即可。匯入名稱為 `CamelotToast`（Nuxt 自動匯入）。"},"features/components/Tooltip.md":{"md":"# Tooltip\n\n## Summary\n\n提示浮層：滑鼠或觸控筆懸停、觸控長壓、鍵盤 Tab 聚焦時顯示，點擊不觸發。浮層自行找空間，偏好在觸發元素上方，不夠時翻到下方，水平置中並限制在可視範圍內，外觀依主題切換。匯入名稱為 `CamelotTooltip`（Nuxt 自動匯入）。\n\n## 運作方式\n\n### 觸發\n\n| 輸入方式 | 開啟 | 關閉 |\n|---|---|---|\n| 滑鼠、觸控筆 | 移入後等待開啟延遲 | 移出 |\n| 觸控 | 長壓達設定時間 | 手指放開、取消或滑動超過 10px |\n| 鍵盤 | Tab 聚焦且為 focus-visible | 失焦 |\n\n1. 點擊造成的聚焦不會開啟，避免變成「點一下就出現」。\n2. 長壓期間抑制系統的長壓選單與文字選取。\n3. 停用時立即關閉，並清掉等待中的計時。\n4. 只在截斷時顯示的模式下，每次開啟前檢查觸發器或其直接子元素是否水平溢出超過 1px。\n\n來源：1. [Tooltip.vue][]\n\n### 定位\n\n1. 固定上方或下方時照設定；自動時上方放得下或上方空間不小於下方就放上方，否則放下方。\n2. 水平以觸發元素為中心，再限制在可視範圍內，四邊留 8px 邊距。\n3. 可視範圍以 visual viewport 為準，行動裝置鍵盤彈出時仍能正確避開。\n4. 開啟期間每個畫面幀重算位置，觸發元素因捲動或動畫位移時也能跟上。\n\n來源：1. [Tooltip.vue][]\n\n### 疊層與無障礙\n\n1. 浮層傳送到最近的對話框，沒有時傳到 body，避免被對話框的 top layer 壓住。\n2. 浮層帶有 popup 標記，[BaseDialogV2](./BaseDialogV2.md) 不會把對它的點擊當成點遮罩。\n3. 浮層角色為 tooltip，開啟時觸發器以 aria-describedby 指向它。\n4. 預設層級用[疊層刻度](../../platform/layering.md)的 popup 層。\n\n來源：1. [Tooltip.vue][]　2. [useCamelotTeleportTarget.ts][]\n\n### 用例\n\n[Internal Calendar](./Internal-Calendar.md) 的日期標籤以區塊排版加「只在截斷時顯示」，文字被截斷時才提示完整內容。\n\n來源：1. [Calendar.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `content` | `string` | `''` | 純文字內容；富內容改用 `content` 插槽。 |\n| `placement` | `'auto' \\| 'top' \\| 'bottom'` | `'auto'` | 偏好位置，`auto` 會依空間翻轉。 |\n| `openDelay` | `number` | `150` | 懸停開啟延遲，單位 ms。 |\n| `longPressDuration` | `number` | `500` | 觸控長壓多久顯示，單位 ms。 |\n| `offset` | `number` | `6` | 與觸發元素的距離，單位 px。 |\n| `disabled` | `boolean` | `false` | 停用。 |\n| `zIndex` | `number` | — | 浮層 z-index；未設定時用 popup 層的 CSS 變數。 |\n| `block` | `boolean` | `false` | 觸發器改為區塊排版並可收縮，預設為行內區塊；供內含截斷文字、需撐滿寬度的情境。 |\n| `onlyWhenTruncated` | `boolean` | `false` | 只在觸發器文字被截斷時才顯示。 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 觸發元素。 |\n| `content` | — | 浮層富內容，優先於 `content` prop。 |\n\n## 相關頁面\n\n- [useCamelotTeleportTarget](../composables/useCamelotTeleportTarget.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Tooltip.vue | [app/components/Camelot/Tooltip.vue](../../../../app/components/Camelot/Tooltip.vue) |\n| useCamelotTeleportTarget.ts | [app/composables/useCamelotTeleportTarget.ts](../../../../app/composables/useCamelotTeleportTarget.ts) |\n| Calendar.vue | [app/components/Camelot/Internal/Calendar.vue](../../../../app/components/Camelot/Internal/Calendar.vue) |\n\n[Tooltip.vue]: #references\n[useCamelotTeleportTarget.ts]: #references\n[Calendar.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Tooltip","summary":"提示浮層：滑鼠或觸控筆懸停、觸控長壓、鍵盤 Tab 聚焦時顯示，點擊不觸發。浮層自行找空間，偏好在觸發元素上方，不夠時翻到下方，水平置中並限制在可視範圍內，外觀依主題切換。匯入名稱為 `CamelotTooltip`（Nuxt 自動匯入）。"},"features/components/Tree.md":{"md":"# Tree\n\n## Summary\n\n樹狀結構元件：遞迴渲染節點清單，支援展開與收合、以葉節點為準的勾選與父節點半選推導，以及自訂節點呈現。勾選框直接使用 Checkbox。匯入名稱為 `CamelotTree`（Nuxt 自動匯入）。\n\n## 運作方式\n\n### 節點資料\n\n每個節點有顯示文字與唯一值，可另帶子節點、停用旗標與任意附帶資料。\n\n來源：1. [tree.ts][]\n\n### 勾選與展開狀態\n\n1. 勾選清單只記錄葉節點的值。\n2. 父節點的所有子孫葉節點都勾選時為勾選；部分勾選時為半選。\n3. 勾選父節點時，若子孫葉節點尚未全選就全部勾選，否則全部取消。\n4. 展開清單記錄已展開節點的值。\n5. 開啟初始全部展開且展開清單為空時，掛載後展開所有含子節點的節點。\n\n來源：1. [Tree.vue][]\n\n### 點擊\n\n1. 可勾選模式下，點整行、包含空白處，都會切換該節點的勾選；展開與收合只由左側箭頭按鈕負責。\n2. 不可勾選時，點含子節點的行會展開或收合。\n3. 兩種模式點擊後都會發出節點點擊事件。\n4. 停用節點半透明且不回應點擊。\n\n來源：1. [TreeNode.vue][]\n\n### 勾選框與自訂節點\n\n勾選框直接使用 [Checkbox](./Checkbox.md)，四種主題與半選狀態都和單獨使用時相同。\n\n沒有提供 `node` 插槽時，節點文字交給 Checkbox 的 label 渲染，外觀與獨立的 Checkbox 一致。\n\n提供 `node` 插槽時改成不帶 label 的勾選框加上自訂內容。Tree 在建立時偵測插槽是否存在，並透過注入的上下文告訴每個節點。\n\n色彩角色以 getter 放進上下文，執行期改變色彩角色時，列內的勾選框會跟著換色。\n\n每一行最低 40px，每深一層縮排 20px，勾選時不會造成版面位移。\n\n來源：1. [Tree.vue][]　2. [TreeNode.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `nodes` | `CamelotTreeNode[]` | — | 樹狀節點資料，必填。 |\n| `checkable` | `boolean` | `false` | 是否顯示勾選框。 |\n| `defaultExpandAll` | `boolean` | `false` | 初始展開全部節點。 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色。 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `nodeClick` | `(node: CamelotTreeNode)` | 點擊未停用的節點列時觸發。 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model:checked` | `(string \\| number)[]` | 已勾選的葉節點值，預設 `[]`。 |\n| `v-model:expanded` | `(string \\| number)[]` | 已展開的節點值，預設 `[]`。 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `node` | `{ node, level, isChecked, isExpanded }` | 自訂單一節點的呈現，遞迴傳給所有子節點。 |\n\n## 相關頁面\n\n- [Checkbox](./Checkbox.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| tree.ts | [shared/types/tree.ts](../../../../shared/types/tree.ts) |\n| Tree.vue | [app/components/Camelot/Tree.vue](../../../../app/components/Camelot/Tree.vue) |\n| TreeNode.vue | [app/components/Camelot/Internal/TreeNode.vue](../../../../app/components/Camelot/Internal/TreeNode.vue) |\n\n[tree.ts]: #references\n[Tree.vue]: #references\n[TreeNode.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Tree","summary":"樹狀結構元件：遞迴渲染節點清單，支援展開與收合、以葉節點為準的勾選與父節點半選推導，以及自訂節點呈現。勾選框直接使用 Checkbox。匯入名稱為 `CamelotTree`（Nuxt 自動匯入）。"},"features/components/VirtualScroll.md":{"md":"# VirtualScroll\n\n## Summary\n\n泛型虛擬滾動容器：只渲染可視範圍內的項目，渲染後量測實際尺寸修正範圍，因此項目不必等高；支援垂直與水平方向、前後預繪數量與捲到指定索引。匯入名稱為 `CamelotVirtualScroll`（Nuxt 自動匯入）。\n\n## 運作方式\n\n### 可變高度計算\n\nVirtualScroll 不要求項目等高，可視範圍由 [useCamelotVirtual](../composables/useCamelotVirtual.md) 計算：\n\n1. 尚未量測的項目以預估尺寸計算。\n2. 項目渲染後以尺寸觀察量出實際尺寸，寫回尺寸快取；水平時量寬度，垂直時量高度。\n3. 依尺寸快取維護前綴和位移；只有變動點之後的區段需要重算。\n4. 依捲動位置以二分搜尋找出可視範圍，前後再多渲染設定的預繪數量。\n5. 元件拿回前後留白與可視索引組出清單，並對外提供捲到指定索引的方法。\n\n[Table](./Table.md) 的虛擬滾動使用同一個 composable。\n\n來源：1. [VirtualScroll.vue][]　2. [useCamelotVirtual.ts][]\n\n### 項目鍵與插槽\n\n1. 項目鍵依序取：取值函式的結果、項目中指定欄位的值，都沒有時用索引。\n2. 可視索引先解析成索引與項目的配對，濾掉不存在的項目後才交給插槽，插槽拿到的項目一定有值。\n3. 項目清單換成新陣列時，重新讀取捲動位置並量測一次。\n\n來源：1. [VirtualScroll.vue][]\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `items` | `T[]` | — | 資料項目陣列，必填。 |\n| `itemKey` | `string \\| ((item: T, index: number) => string \\| number)` | — | 每項唯一鍵：欄位名或取值函式，預設用索引。 |\n| `estimatedItemSize` | `number` | `44` | 預估單項尺寸，單位 px，用於尚未量測的項目。 |\n| `overscan` | `number` | `4` | 可視範圍前後多渲染的項目數。 |\n| `horizontal` | `boolean` | `false` | 水平虛擬滾動。 |\n| `height` | `string` | — | 固定高度，例如 `'320px'`。 |\n| `maxHeight` | `string` | — | 最大高度，內容不足時自適應。 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | `{ item: T, index: number }` | 單一項目的呈現，`item` 保證不是 `undefined`。 |\n\n## Exposed\n| 名稱 | 說明 |\n| :--- | :--- |\n| `scrollToIndex` | 捲動至指定索引的項目。 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| VirtualScroll.vue | [app/components/Camelot/VirtualScroll.vue](../../../../app/components/Camelot/VirtualScroll.vue) |\n| useCamelotVirtual.ts | [app/composables/useCamelotVirtual.ts](../../../../app/composables/useCamelotVirtual.ts) |\n\n[VirtualScroll.vue]: #references\n[useCamelotVirtual.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"VirtualScroll","summary":"泛型虛擬滾動容器：只渲染可視範圍內的項目，渲染後量測實際尺寸修正範圍，因此項目不必等高；支援垂直與水平方向、前後預繪數量與捲到指定索引。匯入名稱為 `CamelotVirtualScroll`（Nuxt 自動匯入）。"},"features/composables/useAnchorLink.md":{"md":"# useAnchorLink\n\n## Summary\n\n`useAnchorLink(url, options)` 建立一個不掛進 DOM 的 `<a>` 錨點元素，呼叫 `open()` 時以程式方式點擊它，開啟指定網址；未指定開啟目標時在新分頁開啟。錨點在第一次 `open()` 時才建立，因此 `open()` 只能在瀏覽器端執行。\n\n## 運作方式\n\n1. 錨點元素由 computed 產生，網址或選項變動時重新建立。\n2. computed 是惰性的：第一次呼叫 `open()` 時才真正建立元素。\n3. 建立時先把開啟目標設為新分頁，選項有指定目標時再覆寫。\n4. `open()` 對元素呼叫 click，由瀏覽器處理導覽。\n\n來源：1. [useAnchorLink.ts][]\n\n## 用法\n\n```ts\nconst { open } = useAnchorLink('https://example.com', { target: '_self' })\nopen()\n```\n\n來源：1. [useAnchorLink.ts][]\n\n## 簽章\n\n```ts\nuseAnchorLink(\n  url: MaybeRef<string>,\n  options?: MaybeRef<AnchorLinkOptions | undefined>\n): { open: () => void }\n\ntype AnchorLinkOptions = {\n  target?: '_self' | '_blank' | '_parent' | '_top' | '_unfencedTop'\n}\n```\n\n## 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `url` | `MaybeRef<string>` | — | 要開啟的網址 |\n| `options` | `MaybeRef<AnchorLinkOptions \\| undefined>` | `undefined` | 選項物件 |\n| `options.target` | `'_self' \\| '_blank' \\| '_parent' \\| '_top' \\| '_unfencedTop'` | `'_blank'` | 錨點的開啟目標 |\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `open` | `() => void` | 點擊目前的錨點元素，開啟網址 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useAnchorLink.ts | [app/composables/useAnchorLink.ts](../../../../app/composables/useAnchorLink.ts) |\n\n[useAnchorLink.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useAnchorLink","summary":"`useAnchorLink(url, options)` 建立一個不掛進 DOM 的 `<a>` 錨點元素，呼叫 `open()` 時以程式方式點擊它，開啟指定網址；未指定開啟目標時在新分頁開啟。錨點在第一次 `open()` 時才建立，因此 `open()` 只能在瀏覽器端執行。"},"features/composables/useAutoLink.md":{"md":"# useAutoLink\n\n## Summary\n\n`useAutoLink(text, options)` 把純文字中的網址、Email 與電話號碼轉成 `<a>` 超連結，回傳隨輸入更新的 HTML 字串 computed；三種轉換可各自停用。結果需以 `v-html` 渲染，非連結的文字一律先做 HTML 跳脫。\n\n## 運作方式\n\n1. 把未停用的規則合成一條正則，在原始文字上一次掃描。\n2. 同一位置同時符合多條規則時，優先序是網址、Email、電話。\n3. 比對到的片段轉成連結，已轉成連結的片段不會再被其他規則改寫。\n4. 連結以外的文字一律做 HTML 跳脫；三種規則都停用時，回傳整段跳脫後的文字。\n5. 停用某個規則時，其餘規則照常生效。\n\n| 類型 | 比對條件 | 產出 |\n| --- | --- | --- |\n| 網址 | http、https、ftp、file 協定開頭，或 www. 開頭 | 新分頁開啟，加上 noopener 與 noreferrer；www. 開頭時補上 http 協定 |\n| Email | 一般 Email 格式 | mailto 連結 |\n| 電話 | 數字與橫線、點、空白、括號的簡化組合 | tel 連結；移除分隔符號後至少 7 碼才轉換，未達時保留原文 |\n\n來源：1. [useAutoLink.ts][]\n\n## 用法\n\n```ts\nconst html = useAutoLink(() => props.text, { disabledPhone: true })\n```\n\n```vue\n<p v-html=\"html\" />\n```\n\n來源：1. [useAutoLink.ts][]\n\n## 簽章\n\n```ts\nuseAutoLink(\n  textRef: MaybeRefOrGetter<string | undefined>,\n  options?: MaybeRef<AutoLinkOptions>\n): ComputedRef<string>\n\ntype AutoLinkOptions = {\n  disabledUrl?: boolean\n  disabledEmail?: boolean\n  disabledPhone?: boolean\n}\n```\n\n## 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `textRef` | `MaybeRefOrGetter<string \\| undefined>` | — | 原始文字；為 `undefined` 時回傳空字串 |\n| `options` | `MaybeRef<AutoLinkOptions>` | `undefined` | 各類轉換的停用開關 |\n| `options.disabledUrl` | `boolean` | `false` | 不轉換網址 |\n| `options.disabledEmail` | `boolean` | `false` | 不轉換 Email |\n| `options.disabledPhone` | `boolean` | `false` | 不轉換電話號碼 |\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| （回傳值） | `ComputedRef<string>` | 已把符合內容替換成超連結的 HTML 字串 |\n\n## 注意事項\n\n| 情況 | 說明 |\n| --- | --- |\n| 使用者輸入 | 文字會先跳脫，含 HTML 的輸入以純文字顯示 |\n| 網址含長數字 | 網址整段轉成連結，其中的數字不會再被當成電話 |\n| 電話格式 | 規則為簡化版，7 碼以上的編號等數字串仍可能被誤判 |\n\n來源：1. [useAutoLink.ts][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useAutoLink.ts | [app/composables/useAutoLink.ts](../../../../app/composables/useAutoLink.ts) |\n\n[useAutoLink.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useAutoLink","summary":"`useAutoLink(text, options)` 把純文字中的網址、Email 與電話號碼轉成 `<a>` 超連結，回傳隨輸入更新的 HTML 字串 computed；三種轉換可各自停用。結果需以 `v-html` 渲染，非連結的文字一律先做 HTML 跳脫。"},"features/composables/useBaseApi.md":{"md":"# useBaseApi\n\n## Summary\n\n`useBaseApi(baseOptions)` 以一組共用設定建立 API 用戶端，回傳 get、post、put、patch、del 五個方法。每個方法產生一個請求物件，可用 useFetch 系列或 `fetch()` 取用，並內建安全標頭、日期還原、快取取值與自動 refresh token。同一模組另匯出 `BaseApi` 類別與 Basic、Bearer 授權攔截器。情境導向的組法見 API 用戶端頁，本頁只放 API 參考。\n\n## 運作方式\n\n### 選項合併\n\n1. 各方法把呼叫時的選項淺層覆蓋在 baseOptions 上，同名欄位以呼叫時為準。\n2. 未指定時補上預設：JSON 內容型別、不使用快取、加上安全標頭。\n3. refresh 相關設定與 transDateKeys 在建立請求物件時就固定，之後取用方式共用同一份。\n\n來源：1. [useBaseApi.ts][]\n\n### 請求與回應攔截\n\n1. 內容型別為 JSON 時，設定 Content-Type 標頭。\n2. 開啟安全標頭時，加上 X-Content-Type-Options 與 Referrer-Policy。\n3. 依陣列順序執行 `onRequests`。\n4. 回應後依序執行 `onResponses`；回應錯誤時依序執行 `onResponseErrors`。\n\n來源：1. [useBaseApi.ts][]\n\n### 自動 refresh token\n\n1. 觸發條件：開啟 `autoRefreshToken`、有提供 handler，且判斷函式成立；預設判斷是狀態碼 401。\n2. 同一個 handler 共用一把鎖，多個請求同時需要刷新時只呼叫一次 handler，其餘等待同一個結果。\n3. 刷新成功：useFetch 系列在 nextTick 後自動 refresh；`fetch()` 重新呼叫原請求。\n4. 刷新失敗或已達重試上限：照常走錯誤攔截器並把錯誤交給呼叫端。\n\n可自動回復的 401 在這裡就地刷新並重送，不會進入全域錯誤佇列；刷新也失敗的錯誤才交由 [useCamelotError](./useCamelotError.md) 提示。\n\n| 規則 | 說明 |\n| --- | --- |\n| useFetch 系列刷新成功 | 直接 refresh，本次回應不執行 `onResponses` 與 `onResponseErrors` |\n| `fetch()` 的攔截器 | 無論是否需要刷新，本次回應的攔截器都會先執行 |\n| 重試計數 | useFetch 系列在收到不需刷新的回應時歸零；`fetch()` 每次呼叫各自計數 |\n| 重送的中止訊號 | `fetch()` 重送時不帶原本的 AbortSignal |\n| 相容忽略錯誤模式 | `ignoreResponseError` 開啟時同樣能觸發刷新 |\n\n來源：1. [useBaseApi.ts][]\n\n### 日期還原與回應解析\n\n1. 設定 `transDateKeys` 時會改寫 transform：回應是陣列就逐項處理，否則處理物件本身。\n2. 只處理第一層欄位；值為字串、數字或 Date 時轉成 Date 物件。\n3. `fetch()` 一律以 JSON 解析回應本文，再套用 transform。\n\n來源：1. [useBaseApi.ts][]\n\n### 快取\n\n`cachePolicy` 為 cache 時，useFetch 系列先以 useNuxtData 依 key 取已有資料，有資料就不重新請求；需要自行設定 key。\n\n來源：1. [useBaseApi.ts][]\n\n## 用法\n\n```ts\nconst api = useBaseApi({ baseURL: '/api', autoRefreshToken: true, refreshTokenHandler })\nconst { data, pending } = api.get<User[]>('/users').useBFetch()\nconst detail = await api.post<Detail>('/detail', { body: { id } }).fetch()\n```\n\n## 簽章\n\n```ts\nuseBaseApi(baseOptions: ApiFetchOptions<any>): {\n  get: <DataT>(url: Url, options?: ApiFetchOptions<DataT>) => ApiFetch<DataT>\n  post: <DataT>(url: Url, options?: ApiFetchOptions<DataT>) => ApiFetch<DataT>\n  put: <DataT>(url: Url, options?: ApiFetchOptions<DataT>) => ApiFetch<DataT>\n  patch: <DataT>(url: Url, options?: ApiFetchOptions<DataT>) => ApiFetch<DataT>\n  del: <DataT>(url: Url, options?: ApiFetchOptions<DataT>) => ApiFetch<DataT>\n}\n\ntype Url = string | Request | Ref<string | Request> | (() => string | Request)\n\nenum ContentType { Json, MultiPartFormData }\n```\n\n`ApiFetch` 在原始碼中沒有具名型別，這裡用來指稱請求物件，成員見下方「回傳」。\n\n## 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `baseOptions` | `ApiFetchOptions<any>` | — | 各方法共用的基礎設定 |\n\n選項型別延伸自 Nuxt 的 useFetch 選項，但移除四個單一攔截器欄位，改用下表的陣列版本。\n\n| 欄位 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `contentType` | `ContentType` | `ContentType.Json` | Json 時自動加上 JSON 的 Content-Type |\n| `cachePolicy` | `'none' \\| 'cache'` | `'none'` | cache 時以 useNuxtData 取回已有資料，需設定 key |\n| `onRequests` | `OnRequest[]` | — | 請求前依序執行的攔截器 |\n| `onResponses` | `OnResponse<DataT>[]` | — | 回應後依序執行的攔截器 |\n| `onResponseErrors` | `OnResponseError<DataT>[]` | — | 回應錯誤時依序執行的攔截器 |\n| `addSecureHeaderRequest` | `boolean` | `true` | 是否加上安全標頭 |\n| `transDateKeys` | `string[]` | — | 回應中要還原為 Date 的欄位名 |\n| `autoRefreshToken` | `boolean` | — | 啟用自動 refresh token |\n| `refreshTokenHandler` | `RefreshTokenHandler` | — | 實際刷新的函式，回傳 `true` 代表成功 |\n| `shouldRefreshToken` | `ShouldRefreshTokenFn` | 狀態碼 401 | 自訂是否需要刷新的判斷 |\n| `maxRefreshRetry` | `number` | `1` | 刷新後重送的最大次數 |\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `get`、`post`、`put`、`patch`、`del` | `(url, options?) => ApiFetch<DataT>` | 各 HTTP 方法；`del` 送出 DELETE |\n\n每個請求物件包含下列取用方式：\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `useFetch` | `(coverOptions?) => AsyncData` | Nuxt useFetch 的包裝 |\n| `useFetchBetter`、`useBFetch` | `(coverOptions?) => { data, refresh, error, clear, status, idle, pending, success }` | 另提供由 status 衍生的三個 computed |\n| `useLazyFetch`、`useLFetch` | `(coverOptions?) => 同上` | 預設不立即執行、不 watch、只在 client、dedupe 為 defer |\n| `fetch` | `(coverOptions?, retryCount?, abortSignal?) => Promise<DataT>` | 以 $fetch 直接送出並回傳資料 |\n\n## 其他匯出\n\n| 名稱 | 說明 |\n| --- | --- |\n| `useBasicToken(account, pwd)` | 回傳帳密組合的 Base64 字串 |\n| `useBasicTokenRequest(account, pwd)` | 產生加上 Basic 授權標頭的請求攔截器；任一值為空時不加 |\n| `useBearerTokenRequest(token)` | 產生加上 Bearer 授權標頭的請求攔截器；token 為空時不加 |\n| `secureHeaderRequest` | 加上安全標頭的請求攔截器 |\n| `BaseApi` | 類別，建構子接收 baseOptions，`api` 屬性即 useBaseApi 的結果 |\n| `ContentType` | 列舉：Json、MultiPartFormData |\n| `RefreshTokenHandler`、`ShouldRefreshTokenFn` | refresh token 相關函式型別 |\n| `OnRequest`、`OnResponse`、`OnResponseError` | 攔截器函式型別 |\n\n來源：1. [useBaseApi.ts][]\n\n## 相關頁面\n\n- [API 用戶端](../../platform/api-client.md)：應用層 API 類別、取用方式的選擇與 refresh token 接法。\n- [錯誤處理系統](../../platform/error-handling.md)：無法回復的錯誤如何提示。\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useBaseApi.ts | [app/composables/useBaseApi.ts](../../../../app/composables/useBaseApi.ts) |\n\n[useBaseApi.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useBaseApi","summary":"`useBaseApi(baseOptions)` 以一組共用設定建立 API 用戶端，回傳 get、post、put、patch、del 五個方法。每個方法產生一個請求物件，可用 useFetch 系列或 `fetch()` 取用，並內建安全標頭、日期還原、快取取值與自動 refresh token。同一模組另匯出 `BaseApi` 類別與 Basic、Bearer 授權攔截器。情境導向的組法見 API 用戶端頁，本頁只放 API 參考。"},"features/composables/useBaseUrl.md":{"md":"# useBaseUrl\n\n## Summary\n\n`useBaseUrl()` 在瀏覽器端回傳目前網站的 origin 加上 Nuxt runtime config 的 `app.baseURL`，組成應用程式的基底網址；在伺服器端回傳空字串。\n\n## 運作方式\n\n1. 以 VueUse 的 `isClient` 判斷執行環境。\n2. 瀏覽器端：讀取 runtime config，回傳 origin 與 `app.baseURL` 直接相接的字串。\n3. 伺服器端：回傳空字串，不讀取 runtime config。\n\n來源：1. [useBaseUrl.ts][]\n\n## 用法\n\n```ts\nconst baseUrl = useBaseUrl()\nconst shareLink = `${baseUrl}orders/${id}`\n```\n\n## 簽章\n\n```ts\nuseBaseUrl(): string\n```\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| （回傳值） | `string` | 瀏覽器端為 origin 加上 `app.baseURL`；伺服器端為 `''` |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useBaseUrl.ts | [app/composables/useBaseUrl.ts](../../../../app/composables/useBaseUrl.ts) |\n\n[useBaseUrl.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useBaseUrl","summary":"`useBaseUrl()` 在瀏覽器端回傳目前網站的 origin 加上 Nuxt runtime config 的 `app.baseURL`，組成應用程式的基底網址；在伺服器端回傳空字串。"},"features/composables/useBlobDownload.md":{"md":"# useBlobDownload\n\n## Summary\n\n`useBlobDownload(obj, fileName)` 把一個 Blob 或 MediaSource 以指定檔名立即下載：為它建立物件網址，指給一個暫時的 `<a>` 元素後點擊。呼叫即觸發下載，只能在瀏覽器端使用。\n\n## 運作方式\n\n1. 以 createObjectURL 為物件建立網址。\n2. 建立 `<a>` 元素，設定下載檔名與網址，不掛進 DOM。\n3. 呼叫 click 觸發下載，回傳值為 `undefined`。\n4. 下一輪事件循環釋放物件網址。\n\n| 規則 | 說明 |\n| --- | --- |\n| 物件網址 | 觸發下載後自動釋放，不會常駐記憶體 |\n| 執行環境 | 需要 document 與 URL，伺服器端呼叫會出錯 |\n\n來源：1. [useBlobDownload.ts][]\n\n## 用法\n\n```ts\nconst blob = new Blob([csvText], { type: 'text/csv' })\nuseBlobDownload(blob, 'report.csv')\n```\n\n## 簽章\n\n```ts\nuseBlobDownload(obj: Blob | MediaSource, fileName: string): void\n```\n\n## 參數\n\n| 參數 | 型別 | 預設 | 說明 |\n| --- | --- | --- | --- |\n| `obj` | `Blob \\| MediaSource` | — | 要下載的物件 |\n| `fileName` | `string` | — | 下載時使用的檔名 |\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useBlobDownload.ts | [app/composables/useBlobDownload.ts](../../../../app/composables/useBlobDownload.ts) |\n\n[useBlobDownload.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useBlobDownload","summary":"`useBlobDownload(obj, fileName)` 把一個 Blob 或 MediaSource 以指定檔名立即下載：為它建立物件網址，指給一個暫時的 `<a>` 元素後點擊。呼叫即觸發下載，只能在瀏覽器端使用。"},"features/composables/useCamelotColorMode.md":{"md":"# useCamelotColorMode\n\n## Summary\n\n`useCamelotColorMode()` 回傳全站共用的單一 VueUse `useColorMode` 實例，負責深淺色模式。實例在模組載入時建立一次，之後每次呼叫都拿到同一份。Layer 內需要深淺色狀態的程式碼一律透過它取得，不自行呼叫 `useColorMode()`。\n\n## 運作方式\n\n### 為什麼必須共用\n\nVueUse 的 `useColorMode` 每建立一個實例，就會註冊一份 watcher，在模式變動時往 `<html>` 寫 class。\n\n[useCamelotTheme](./useCamelotTheme.md) 被數十個 Camelot 元件呼叫，單頁可達數百個呼叫端。逐一建立實例的話，切換一次深淺色就會產生數百次重複的 class 寫入。\n\n深淺色是全站單一狀態，實例收斂為模組層一份即可。\n\n> [!IMPORTANT]\n> 在本 Layer 內**不要**直接呼叫 `useColorMode()`，一律改用本 composable。\n\n來源：1. [useCamelotColorMode.ts][]\n\n### 使用者\n\n| 使用者 | 用途 |\n| --- | --- |\n| [useCamelotTheme](./useCamelotTheme.md) | 回傳深淺色設定給元件，並在切換時觸發顏色漸變 |\n| [useCustomColorScheme](./useCustomColorScheme.md) | 判斷目前是否深色，決定採用哪組色彩方案 |\n| [useMaterial3ColorScheme](./useMaterial3ColorScheme.md) | 同上 |\n\n來源：1. [useCamelotTheme.ts][]　2. [useCustomColorScheme.ts][]　3. [useMaterial3ColorScheme.ts][]\n\n## 用法\n\n```ts\nconst { system, store } = useCamelotColorMode()\n\nstore.value = 'dark'\n```\n\n## 簽章\n\n```ts\nuseCamelotColorMode(): ReturnType<typeof useColorMode>\n```\n\n## 回傳\n\nVueUse `useColorMode()` 的回傳值，全站共用同一個實例：\n\n| 名稱 | 說明 |\n| --- | --- |\n| `store` | 使用者設定的模式，可寫；`auto` 代表跟隨系統 |\n| `system` | 系統偏好的深淺色 |\n| `state` | 實際套用的模式 |\n\n## 相關頁面\n\n- [色彩主題系統](../../platform/color-scheme.md)\n- [Composables 清單](../composables.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCamelotColorMode.ts | [app/composables/useCamelotColorMode.ts](../../../../app/composables/useCamelotColorMode.ts) |\n| useCamelotTheme.ts | [app/composables/useCamelotTheme.ts](../../../../app/composables/useCamelotTheme.ts) |\n| useCustomColorScheme.ts | [app/composables/useCustomColorScheme.ts](../../../../app/composables/useCustomColorScheme.ts) |\n| useMaterial3ColorScheme.ts | [app/composables/useMaterial3ColorScheme.ts](../../../../app/composables/useMaterial3ColorScheme.ts) |\n\n[useCamelotColorMode.ts]: #references\n[useCamelotTheme.ts]: #references\n[useCustomColorScheme.ts]: #references\n[useMaterial3ColorScheme.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useCamelotColorMode","summary":"`useCamelotColorMode()` 回傳全站共用的單一 VueUse `useColorMode` 實例，負責深淺色模式。實例在模組載入時建立一次，之後每次呼叫都拿到同一份。Layer 內需要深淺色狀態的程式碼一律透過它取得，不自行呼叫 `useColorMode()`。"},"features/composables/useCamelotError.md":{"md":"# useCamelotError\n\n## Summary\n\n`useCamelotError()` 是全域單例的錯誤佇列，可累積多筆非致命錯誤，由錯誤對話框一次顯示一則。入列只接受 `CamelotErrorType`；任意原始錯誤先經可註冊的轉換器轉成統一格式，再經攔截器處理副作用後入列。與 Nuxt 的 `useError` 互補：後者承載單一致命錯誤並切換到錯誤頁。管線總覽見錯誤處理系統頁。\n\n## 運作方式\n\n### 處理管線\n\n1. handle 收到原始錯誤；值為 null 或 undefined 時直接略過。\n2. 轉換：依優先權由高到低逐一嘗試轉換器，第一個有回傳結果的勝出。\n3. 全部落空時產生保底錯誤：等級為 error，data 掛原始物件，不會靜默吞錯。\n4. 攔截：依優先權執行攔截器，任一個回傳 true 即視為已處理，不入列、handle 回傳 undefined。\n5. 入列：補上隨機 id 並回傳，顯示層一次呈現佇列第一筆。\n\n來源：1. [useCamelotError.ts][]\n\n### 轉換器與攔截器規則\n\n| 規則 | 說明 |\n| --- | --- |\n| 優先權 | 數字大者先跑，未指定為 0 |\n| 同名註冊 | 視為覆蓋 |\n| 註冊表 | 模組層 Map，不用 useState；兩者都是函式，無法通過 SSR 序列化 |\n| 排序快取 | 排序結果會快取，註冊或註銷時失效 |\n| 註冊函式 | 可從 composable 取得，也可直接具名匯入 |\n\n內建三個不含業務語意的轉換器，優先權皆為 -100，確保消費端註冊的一律先試：\n\n| 名稱 | 命中條件 | 產出 |\n| --- | --- | --- |\n| `camelot:fetch-error` | 物件且有 `statusCode` 欄位 | code 取狀態碼，message 取 statusMessage 或 message，data 取回應資料 |\n| `camelot:native-error` | 是 Error 實例 | message 取錯誤訊息，data 為錯誤本身 |\n| `camelot:string` | 是字串 | message 為該字串 |\n\n來源：1. [useCamelotError.ts][]\n\n### 呼叫端選項與關閉\n\n1. 呼叫端選項的三個動作欄位會覆寫錯誤自帶的同名動作。\n2. onConfirm 則是串接：呼叫端的先跑，錯誤自帶的後跑，讓攔截器掛上的導頁留在最後。\n3. only 為 true 時先清空佇列，只保留這一筆。\n4. dismiss 先把錯誤移出佇列，再執行它的 onConfirm。\n5. runAction 先執行按鈕 handler；除非 close 明確為 false，否則接著 dismiss。\n\n來源：1. [useCamelotError.ts][]\n\n## 用法\n\n```ts\nconst { push, handle, watch } = useCamelotError()\n\npush({\n  title: '連線失敗',\n  message: '無法取得資料。',\n  positive: { label: '重試', close: false, handler: retry },\n  negative: { label: '關閉' },\n})\n\nhandle(rawError)\n\nconst { error } = await useFetch('/api/orders')\nwatch(error, { onConfirm: () => router.back() })\n```\n\n## 簽章\n\n```ts\nuseCamelotError(): {\n  errors: Ref<CamelotErrorType[]>\n  currentError: ComputedRef<CamelotErrorType | null>\n  push: (error: CamelotErrorType, options?: CamelotErrorOptions) => string\n  handle: (raw: unknown, options?: CamelotErrorOptions) => string | undefined\n  dismiss: (id?: string) => void\n  runAction: (action: CamelotErrorAction, id?: string) => void\n  clear: () => void\n  registerErrorResolver: <TData>(resolver: CamelotErrorResolver<TData>) => () => void\n  registerErrorInterceptor: <TData>(interceptor: CamelotErrorInterceptor<TData>) => () => void\n  watch: (errors: Ref<unknown> | Ref<unknown>[], options?: CamelotErrorOptions) => void\n}\n```\n\n## 回傳\n\n| 名稱 | 型別 | 說明 |\n| --- | --- | --- |\n| `errors` | `Ref<CamelotErrorType[]>` | 錯誤佇列，以 useState 的 `Camelot:Errors` 保存 |\n| `currentError` | `ComputedRef<CamelotErrorType \\| null>` | 佇列第一筆；沒有則為 `null` |\n| `push` | `(error, options?) => string` | 入列一筆已是統一格式的錯誤，回傳補上的 id |\n| `handle` | `(raw, options?) => string \\| undefined` | 原始錯誤的入口：轉換、攔截、入列；被攔下時回傳 `undefined` |\n| `dismiss` | `(id?) => void` | 移除錯誤並執行其 onConfirm；未指定 id 時移除目前顯示的那筆 |\n| `runAction` | `(action, id?) => void` | 執行動作按鈕，視 close 決定是否一併關閉 |\n| `clear` | `() => void` | 清空佇列，不執行 onConfirm |\n| `registerErrorResolver` | `(resolver) => () => void` | 註冊轉換器，回傳註銷函式 |\n| `registerErrorInterceptor` | `(interceptor) => () => void` | 註冊攔截器，回傳註銷函式 |\n| `watch` | `(errors, options?) => void` | 立即監看單一或多個錯誤 ref，值為 truthy 時送進 handle |\n\n## 型別\n\n| 型別 | 欄位 |\n| --- | --- |\n| `CamelotErrorType<TData = unknown>` | `id?`、`title?`、`message?`、`messageHtml?`、`code?`、`level?`、`data?`、`onConfirm?`、`positive?`、`neutral?`、`negative?`、`zIndex?` |\n| `CamelotErrorLevel` | `'error' \\| 'warning' \\| 'info'`；未指定時顯示層視為 error |\n| `CamelotErrorAction` | `{ label: string; color?: CamelotColorRole; close?: boolean; handler?: () => void }` |\n| `CamelotErrorResolver<TData>` | `{ name: string; priority?: number; resolve: (raw: unknown) => CamelotErrorType<TData> \\| undefined }` |\n| `CamelotErrorInterceptor<TData>` | `{ name: string; priority?: number; intercept: (error: CamelotErrorType<TData>) => boolean \\| undefined }` |\n| `CamelotErrorOptions` | `only?`、`onConfirm?`、`positive?`、`neutral?`、`negative?` |\n\n| 欄位規則 | 說明 |\n| --- | --- |\n| `messageHtml` | 富文字內容，與 message 二擇一；內容必須來自可信來源 |\n| `neutral`、`negative` | 未指定則不顯示該按鈕 |\n| `positive` | 未指定時沿用顯示層的預設確認鈕 |\n| `close: false` | 對話框留著，由呼叫端決定何時 dismiss，例如重試流程 |\n\n## 相關頁面\n\n- [錯誤處理系統](../../platform/error-handling.md)：管線總覽與消費端註冊範例。\n- [ErrorDialog](../components/ErrorDialog.md)：顯示佇列的對話框元件。\n- [useErrorRef](./useErrorRef.md)：只把多個錯誤 ref 匯總成一個，不含佇列、轉換與顯示。\n- [Composables 清單](../composables.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCamelotError.ts | [app/composables/useCamelotError.ts](../../../../app/composables/useCamelotError.ts) |\n\n[useCamelotError.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"useCamelotError","summary":"`useCamelotError()` 是全域單例的錯誤佇列，可累積多筆非致命錯誤，由錯誤對話框一次顯示一則。入列只接受 `CamelotErrorType`；任意原始錯誤先經可註冊的轉換器轉成統一格式，再經攔截器處理副作用後入列。與 Nuxt 的 `useError` 互補：後者承載單一致命錯誤並切換到錯誤頁。管線總覽見錯誤處理系統頁。"},"features/composables/useCamelotFileDrop.md":{"md":"# useCamelotFileDrop\n\n## Summary\n\n`useCamelotFileDrop(options)` 是檔案拖放與選擇的 headless 核心：以 v-model 的檔案清單為單一真相來源，衍生含型別、大小文字與縮圖的項目，並提供拖放事件處理與檔案選擇器。FileDropzone 與 ImageDropzone 共用它，也可單獨把任意元素變成拖放區。\n\n## 運作方式\n\n### 寫入檔案\n\n1. 停用時忽略。\n2. 以 accept 過濾檔案；過濾後沒有檔案就不變更。\n3. 多選時接在既有清單後面，單選時只取第一個。\n4. 有上限時截斷到上限數量。\n5. 寫回 model，並以新清單呼叫 onSelect。\n\n移除單一檔案走同樣的寫回與回呼，但不檢查停用狀態。\n\n來源：1. [useCamelotFileDrop.ts][]\n\n### accept 比對\n\n| 寫法 | 比對方式 |\n| --- | --- |\n| 星號、星號斜線星號 | 接受全部 |\n| 型別加斜線星號，如 image/* | 比對 MIME 前綴 |\n| 點開頭，如 .pdf | 比對檔名結尾，不分大小寫 |\n| 完整 MIME | 與檔案 MIME 完全相同 |\n\n多個條件以逗號分隔，任一符合即接受。\n\n來源：1. [useCamelotFileDrop.ts][]\n\n### 項目與縮圖\n\n1. model 或縮圖開關變動時立即重建項目清單，外部改 v-model 也會同步。\n2. 重建前先釋放舊縮圖的物件網址，元件卸載前也會釋放。\n3. 只有圖片類型且開啟縮圖時才建立物件網址，其餘為空字串。\n4. 每項的 key 由檔名、大小、最後修改時間與索引組成。\n\n來源：1. [useCamelotFileDrop.ts][]\n\n### 拖放與選擇器\n\n1. dragenter 與 dragover 都綁 onDragOver，以深度計數處理子元素進出，計數歸零才取消懸停。\n2. onDrop 重設懸停狀態，停用時忽略，否則寫入拖入的檔案。\n3. pick 動態建立隱藏的檔案輸入元素並點擊；停用、已達上限或非瀏覽器環境時不作用。\n\n來源：1. [useCamelotFileDrop.ts][]\n\n## 用法\n\n```ts\nconst files = ref<File[] | null>(null)\nconst drop = useCamelotFileDrop({ model: files, accept: 'image/*', max: 5 })\n```\n\n```vue\n<div\n  @dragover.prevent=\"drop.onDragOver\"\n  @dragenter.prevent=\"drop.onDragOver\"\n  @dragleave.prevent=\"drop.onDragLeave\"\n  @drop.prevent=\"drop.onDrop\"\n  @click=\"drop.pick()\"\n>\n  <img v-for=\"e in drop.entries.value\" :key=\"e.key\" :src=\"e.url\">\n<\/div>\n```\n\n## 簽章\n\
