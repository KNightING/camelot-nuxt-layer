ssues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Aqua/Button.vue | [app/components/Camelot/Aqua/Button.vue](../../../../app/components/Camelot/Aqua/Button.vue) |\n\n[Aqua/Button.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Aqua Button","summary":"Aqua Button 是 Aqua 主題（毛玻璃風格）的按鈕外觀實作，匯入名稱 `CamelotAquaButton`（Nuxt 自動匯入）。一般不直接使用，而是在 Aqua 主題下由公開元件 [Button](./Button.md) 自動選用；它只負責外觀、停用狀態與轉發點擊事件。"},"features/components/Aqua-Checkbox.md":{"md":"# Aqua Checkbox\n\n## Summary\n\nAqua Checkbox 是 Aqua 主題（毛玻璃風格）的核取方塊外觀實作，匯入名稱 `CamelotAquaCheckbox`。支援方形與圓形外框、未定（半選）狀態，一般在 Aqua 主題下由 [Checkbox](./Checkbox.md) 自動選用。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabled` | `boolean` | `false` | 是否停用 |\n| `shape` | `'square' \\| 'circle'` | `'square'` | 外框形狀 |\n| `indeterminate` | `boolean` | `false` | 未定（半選）狀態，顯示橫線標記 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `change` | `checked: boolean` | 切換狀態時觸發，帶入切換後的值 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `boolean`（預設 `false`） | 核取狀態 |\n\n## 運作方式\n\n| 狀態 | 外觀 |\n|---|---|\n| 未勾選 | 玻璃軌道底色 |\n| 勾選 | 玻璃填色，顯示打勾標記 |\n| 未定且未勾選 | 玻璃填色，顯示橫線標記 |\n| 停用 | 半透明並灰階，點擊無效、不觸發 change |\n\n來源：1. [Aqua/Checkbox.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Aqua/Checkbox.vue | [app/components/Camelot/Aqua/Checkbox.vue](../../../../app/components/Camelot/Aqua/Checkbox.vue) |\n\n[Aqua/Checkbox.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Aqua Checkbox","summary":"Aqua Checkbox 是 Aqua 主題（毛玻璃風格）的核取方塊外觀實作，匯入名稱 `CamelotAquaCheckbox`。支援方形與圓形外框、未定（半選）狀態，一般在 Aqua 主題下由 [Checkbox](./Checkbox.md) 自動選用。"},"features/components/Aqua-Input.md":{"md":"# Aqua Input\n\n## Summary\n\nAqua Input 是 Aqua 主題（毛玻璃風格）的輸入框外觀實作，匯入名稱 `CamelotAquaInput`（Nuxt 自動匯入）。一般在 Aqua 主題下由公開元件 [Input](./Input.md) 自動選用，聚焦時外框出現光暈；它提供前後插槽，並把原生 input 元素暴露給外層。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `placeholder` | `string` | `''` | 佔位提示文字 |\n| `disabled` | `boolean` | `false` | 是否停用輸入框 |\n| `type` | `CamelotInputType` | `'text'` | 原生 input type，由 Input 依密碼顯示切換狀態下傳 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `string \\| number` | 輸入框的值 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `before` | — | 輸入框前方內容（如圖示） |\n| `after` | — | 輸入框後方內容（如圖示） |\n\n## Exposed\n| 名稱 | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `inputEl` | `Ref<HTMLInputElement \\| null>` | 原生 input，供 Input 轉接給消費端呼叫 focus、select |\n\n## 運作方式\n\n| 項目 | 行為 |\n|---|---|\n| 尺寸 | 最低高度 42px，字級繼承自 Input 根節點；字級變大時跟著撐高 |\n| 外觀 | 玻璃軌道底色、12px 控制項圓角 |\n| 聚焦 | 聚焦期間外框加上光暈，失焦後移除 |\n\n來源：1. [Aqua/Input.vue][]\n\n## 相關頁面\n- [主題系統](../../platform/theme-system.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Aqua/Input.vue | [app/components/Camelot/Aqua/Input.vue](../../../../app/components/Camelot/Aqua/Input.vue) |\n\n[Aqua/Input.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Aqua Input","summary":"Aqua Input 是 Aqua 主題（毛玻璃風格）的輸入框外觀實作，匯入名稱 `CamelotAquaInput`（Nuxt 自動匯入）。一般在 Aqua 主題下由公開元件 [Input](./Input.md) 自動選用，聚焦時外框出現光暈；它提供前後插槽，並把原生 input 元素暴露給外層。"},"features/components/Aqua-Radio.md":{"md":"# Aqua Radio\n\n## Summary\n\nAqua Radio 是 Aqua 主題（毛玻璃風格）的單選圓鈕外觀實作，匯入名稱 `CamelotAquaRadio`。一般在 Aqua 主題下由 [Radio](./Radio.md) 自動選用；預設選取後不能再點掉，開啟可取消選取時才允許點已選項取消。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabled` | `boolean` | `false` | 是否停用 |\n| `deselectable` | `boolean` | `false` | 是否允許點擊已選取項目以取消選取（非必填情境） |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `change` | `checked: boolean` | 切換狀態時觸發，帶入切換後的值 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `boolean`（預設 `false`） | 是否選取 |\n\n## 運作方式\n\n| 狀態 | 行為 |\n|---|---|\n| 未選取 | 玻璃軌道底色，點擊後選取 |\n| 已選取 | 玻璃填色，中央圓點放大浮現 |\n| 已選取再點 | 預設不變；開啟可取消選取時改回未選取 |\n| 停用 | 半透明並灰階，點擊無效 |\n\n中央圓點以滿版圓縮放呈現，避免非整數像素比螢幕下的半像素偏移。\n\n來源：1. [Aqua/Radio.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Aqua/Radio.vue | [app/components/Camelot/Aqua/Radio.vue](../../../../app/components/Camelot/Aqua/Radio.vue) |\n\n[Aqua/Radio.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Aqua Radio","summary":"Aqua Radio 是 Aqua 主題（毛玻璃風格）的單選圓鈕外觀實作，匯入名稱 `CamelotAquaRadio`。一般在 Aqua 主題下由 [Radio](./Radio.md) 自動選用；預設選取後不能再點掉，開啟可取消選取時才允許點已選項取消。"},"features/components/Aqua-Switch.md":{"md":"# Aqua Switch\n\n## Summary\n\nAqua Switch 是 Aqua 主題（毛玻璃風格）的開關外觀實作，匯入名稱 `CamelotAquaSwitch`。一般在 Aqua 主題下由 [Switch](./Switch.md) 自動選用，點擊切換開關並送出 change 事件。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabled` | `boolean` | `false` | 停用開關 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `change` | `checked: boolean` | 切換狀態改變時觸發 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `boolean`（預設 `false`） | 開關狀態 |\n\n## 運作方式\n\n| 狀態 | 外觀 |\n|---|---|\n| 關 | 玻璃軌道底色，圓鈕在左 |\n| 開 | 玻璃填色，圓鈕滑到右側 |\n| 停用 | 半透明並灰階，點擊不切換 |\n\n來源：1. [Aqua/Switch.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Aqua/Switch.vue | [app/components/Camelot/Aqua/Switch.vue](../../../../app/components/Camelot/Aqua/Switch.vue) |\n\n[Aqua/Switch.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Aqua Switch","summary":"Aqua Switch 是 Aqua 主題（毛玻璃風格）的開關外觀實作，匯入名稱 `CamelotAquaSwitch`。一般在 Aqua 主題下由 [Switch](./Switch.md) 自動選用，點擊切換開關並送出 change 事件。"},"features/components/BaseBottomSheetV2.md":{"md":"# BaseBottomSheetV2\n\n## Summary\n\nBaseBottomSheetV2 是由畫面底部滑入的底部彈出面板（Bottom Sheet），匯入名稱 `CamelotBaseBottomSheetV2`（Nuxt 自動匯入）。它建立在 [BaseDialogV2](./BaseDialogV2.md) 之上，依當前主題切換四種外觀；使用者壓住頂部把手向下拖曳即可關閉，遮罩隨拖曳進度漸淡。本元件不提供關閉按鈕，除拖曳外的關閉方式由使用端負責。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `draggable` | `boolean` | `true` | 是否允許從頂部把手拖曳關閉 |\n| `dismissThreshold` | `number` | `0.35` | 拖曳超過面板高度的多少比例即關閉（0–1） |\n\n其餘屬性與 cancel 事件會透傳到 BaseDialogV2，包含 closeByMask、tag、zIndex、query。\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model:open` | `boolean`（預設 `false`） | 是否開啟 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 面板內容 |\n\n## 運作方式\n\n### 版面\n\n1. 以 BaseDialogV2 的自訂外層插槽渲染，不使用對話框的置中內容框。\n2. 依主題渲染 scifi、cupertino、aqua 或 material 面板，未知主題用 material。\n3. 各面板頂端是共用的 [SheetHandle](./Internal-SheetHandle.md) 把手，開啟時由底部滑入。\n4. 面板最高佔視窗 85%，內容超出時在面板內捲動。\n\n內容只放內容即可：外框、內距與寬度已由本元件負責，插槽內再包一層完整盒子會造成雙層邊框與寬度溢出。\n\n來源：1. [BaseBottomSheetV2.vue][]\n\n### 手勢關閉\n\n1. 只有從把手按下才開始拖曳，並鎖定該指標。\n2. 面板跟著手指垂直位移，只允許向下；向上會露出面板底下的空白，因此位移下限為 0。\n3. 放開時符合任一條件就關閉：拖曳距離達面板高度的門檻比例，或向下甩動。\n4. 關閉時保留目前位移，讓離場動畫從手指放開處接續；未達條件則以彈簧曲線彈回。\n5. 拖曳進度同步回寫給 BaseDialogV2，遮罩逐幀跟著變淡。\n\n| 規則 | 說明 |\n|---|---|\n| 甩動 | 速度 ≥ 0.6px/ms 且距離 ≥ 32px |\n| 停頓 | 放開前停住超過 100ms，速度視為 0 |\n| 再次開啟 | 位移重設為 0 |\n\n拖曳位移放在面板外層之內的另一層：外層的滑入動畫會保留最後的 transform，蓋過同一元素上的行內位移。\n\n來源：1. [BaseBottomSheetV2.vue][]\n\n### 尺寸與疊層\n\n| 規則 | 說明 |\n|---|---|\n| 寬度 | 面板用撐滿父層寬度，不用視窗寬度單位；視窗寬度含捲軸寬，會產生水平捲軸 |\n| 疊層 | 使用 sheet 層級，低於 popup，面板內的選單浮層會疊在面板之上 |\n\n來源：1. [BaseBottomSheetV2.vue][]\n\n## 相關頁面\n- [疊層刻度](../../platform/layering.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| BaseBottomSheetV2.vue | [app/components/Camelot/BaseBottomSheetV2.vue](../../../../app/components/Camelot/BaseBottomSheetV2.vue) |\n\n[BaseBottomSheetV2.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"BaseBottomSheetV2","summary":"BaseBottomSheetV2 是由畫面底部滑入的底部彈出面板（Bottom Sheet），匯入名稱 `CamelotBaseBottomSheetV2`（Nuxt 自動匯入）。它建立在 [BaseDialogV2](./BaseDialogV2.md) 之上，依當前主題切換四種外觀；使用者壓住頂部把手向下拖曳即可關閉，遮罩隨拖曳進度漸淡。本元件不提供關閉按鈕，除拖曳外的關閉方式由使用端負責。"},"features/components/BaseDialogV2.md":{"md":"# BaseDialogV2\n\n## Summary\n\nBaseDialogV2 是以原生 dialog 元素為基底的模態對話框，匯入名稱 `CamelotBaseDialogV2`。它依當前主題提供四種內容框，支援點遮罩或按 Esc 關閉，並可把開關狀態同步到網址查詢字串。本元件不提供內建關閉按鈕，需要標準按鈕列時改用 [ConfirmDialog](./ConfirmDialog.md)。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `closeByMask` | `boolean` | `true` | 點擊遮罩（內容框之外）或按 Esc 是否關閉 |\n| `backdropProgress` | `number` | `0` | 遮罩褪去進度 0–1，遮罩不透明度為 1 減進度；[BaseBottomSheetV2](./BaseBottomSheetV2.md) 拖曳時回寫 |\n| `backdropImmediate` | `boolean` | `false` | 為 true 時關閉遮罩 transition，讓進度逐幀即時反映（拖曳中） |\n| `tag` | `string` | — | 對話框 id；亦作為預設的網址查詢字串值 |\n| `zIndex` | `number` | — | 對話框 z-index |\n| `query` | `CamelotDialogQuery` | — | 自訂網址查詢字串同步設定（優先於 `tag`） |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `cancel` | — | 透過遮罩或 Esc 關閉時觸發 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model:open` | `boolean` | 是否開啟（預設 `false`） |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `wrapper` | — | 覆寫整個全螢幕置中容器；自訂後遮罩判斷改為點在 dialog 本身 |\n| `default` | — | 對話框內容（置於各主題內容框內） |\n\n## 運作方式\n\n### 開啟與關閉\n\n1. 開啟時呼叫原生 showModal，產生背景遮罩並進入 top layer。\n2. 依主題呈現內容框：scifi 四角框、cupertino、aqua 毛玻璃，其他一律 material。\n3. 關閉時先播淡出動畫，延遲 400ms 再關閉原生 dialog。\n4. 開啟期間鎖定頁面捲動；全站保留捲軸空間，所以鎖定時版面寬度不跳動。\n\n`closeByMask` 設為 false 會連帶停用 Esc 關閉，用於強制決策的對話框；此時使用端必須自行提供關閉途徑。\n\n來源：1. [BaseDialogV2.vue][]　2. [tailwind.css][]\n\n### 遮罩點擊判斷\n\n點在本對話框的內容框之外就關閉並送出 cancel，但以下情形先排除：\n\n| 情形 | 為什麼排除 |\n|---|---|\n| 點在帶 popup 標記的浮層內 | [PopupV2](./PopupV2.md) 把浮層傳送進本對話框，位置落在內容框外，不排除會選不到選項 |\n| 事件目標已脫離文件 | 巢狀對話框選取後先被移除，外層才收到事件，會被誤判成點遮罩 |\n| 點在巢狀對話框內 | 交由內層自行處理遮罩與關閉 |\n| 內容框屬於巢狀對話框 | 只認屬於本對話框的內容框；否則自訂外層的 Sheet 會誤用內層的內容框而整個被關掉 |\n\n來源：1. [BaseDialogV2.vue][]\n\n### 網址同步\n\n1. 設定 `tag` 或 `query` 後才啟用。\n2. 開啟時 push 查詢字串，並附帶 isDialog 為 true。\n3. 關閉時若能返回上一頁就 back，否則 replace 移除這兩個查詢參數。\n4. 監聽路由變化反向同步開關：查詢字串符合就開啟，否則關閉。\n\n來源：1. [BaseDialogV2.vue][]\n\n### 裁切方式\n\n對話框用 clip 而非 hidden 裁切溢出。GPU transform 讓對話框成為內部固定定位元素的定位基準，例如 BottomSheet 的面板；hidden 仍是可捲動容器，showModal 自動聚焦時會把內容往上捲，Sheet 就浮離視窗底部。clip 不建立捲動容器，捲動位置恆為 0。\n\n來源：1. [BaseDialogV2.vue][]\n\n## 相關頁面\n- [Drawer](./Drawer.md)：另一個鎖定頁面捲動的元件\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| BaseDialogV2.vue | [app/components/Camelot/BaseDialogV2.vue](../../../../app/components/Camelot/BaseDialogV2.vue) |\n| tailwind.css | [app/assets/css/tailwind.css](../../../../app/assets/css/tailwind.css) |\n\n[BaseDialogV2.vue]: #references\n[tailwind.css]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"BaseDialogV2","summary":"BaseDialogV2 是以原生 dialog 元素為基底的模態對話框，匯入名稱 `CamelotBaseDialogV2`。它依當前主題提供四種內容框，支援點遮罩或按 Esc 關閉，並可把開關狀態同步到網址查詢字串。本元件不提供內建關閉按鈕，需要標準按鈕列時改用 [ConfirmDialog](./ConfirmDialog.md)。"},"features/components/Breadcrumb.md":{"md":"# Breadcrumb\n\n## Summary\n\nBreadcrumb 是麵包屑導覽列，匯入名稱 `CamelotBreadcrumb`。它依序顯示層級路徑，項目之間以分隔符號隔開；最後一項代表目前頁面，以角色色加粗顯示且不可點擊，其餘項目點擊時送出 select 事件。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `items` | `BreadcrumbItem[]` | —（必填） | 麵包屑項目陣列 |\n| `separator` | `string` | — | 自訂分隔字元；留空則用 chevron 圖示 |\n| `color` | `CamelotColorRole` | `'primary'` | 角色色彩，用於目前頁與 hover 文字色 |\n\n### BreadcrumbItem\n| 欄位 | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `label` | `string` | 顯示文字 |\n| `value` | `string \\| number` | 選填；有值時作為列表 key |\n| `href` | `string` | 選填；有值時渲染為連結 |\n| `disabled` | `boolean` | 選填；為 true 時點擊不送出 select |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `select` | `(item: BreadcrumbItem, index: number)` | 點擊非最後一項且未停用時觸發 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `item` | `{ item, index, isLast }` | 自訂單一項目內容；預設顯示項目文字 |\n| `separator` | — | 自訂分隔符號；預設 chevron 圖示或 `separator` 字元 |\n\n## 運作方式\n\n| 規則 | 說明 |\n|---|---|\n| 元素 | 有 href 的項目渲染為連結，否則為按鈕 |\n| 最後一項 | 標記為目前頁面，停用滑鼠事件，不送出 select |\n| 停用項目 | 仍照常顯示，點擊不送出 select |\n| Scifi 主題 | 改用等寬字體、全大寫與加寬字距 |\n\n來源：1. [Breadcrumb.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Breadcrumb.vue | [app/components/Camelot/Breadcrumb.vue](../../../../app/components/Camelot/Breadcrumb.vue) |\n\n[Breadcrumb.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Breadcrumb","summary":"Breadcrumb 是麵包屑導覽列，匯入名稱 `CamelotBreadcrumb`。它依序顯示層級路徑，項目之間以分隔符號隔開；最後一項代表目前頁面，以角色色加粗顯示且不可點擊，其餘項目點擊時送出 select 事件。"},"features/components/Breakpoints.md":{"md":"# Breakpoints\n\n## Summary\n\nBreakpoints 是依裝置斷點選擇插槽渲染的響應式容器，匯入名稱 `CamelotBreakpoints`（Nuxt 自動匯入）。斷點分為 mobile、tablet、laptop、desktop；目前斷點沒有提供插槽時，預設會回退到較小斷點的插槽，都沒有才渲染預設插槽。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabledDownward` | `boolean` | — | 關閉向下相容；停用後大斷點不再回退使用較小斷點的插槽 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `mobile` | — | 行動裝置版面 |\n| `tablet` | — | 平板版面 |\n| `laptop` | — | 筆電版面 |\n| `desktop` | — | 桌機版面 |\n| `default` | `{ isMobile, isTablet, isLaptop, isDesktop }` | 無對應具名插槽時的後備內容，並提供各斷點布林值 |\n\n## 運作方式\n\n1. 從 [useDeviceBreakpoints](../composables/useDeviceBreakpoints.md) 取得目前斷點。\n2. 有目前斷點的插槽就渲染它。\n3. 沒有時依序往較小斷點找，例如 desktop 依序找 laptop、tablet、mobile。\n4. 開啟 `disabledDownward` 時跳過第 3 步。\n5. 都找不到就渲染預設插槽。\n\n來源：1. [Breakpoints.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Breakpoints.vue | [app/components/Camelot/Breakpoints.vue](../../../../app/components/Camelot/Breakpoints.vue) |\n\n[Breakpoints.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Breakpoints","summary":"Breakpoints 是依裝置斷點選擇插槽渲染的響應式容器，匯入名稱 `CamelotBreakpoints`（Nuxt 自動匯入）。斷點分為 mobile、tablet、laptop、desktop；目前斷點沒有提供插槽時，預設會回退到較小斷點的插槽，都沒有才渲染預設插槽。"},"features/components/Button.md":{"md":"# Button\n\n## Summary\n\nButton 是依當前主題自動切換外觀的公開按鈕元件，匯入名稱 `CamelotButton`（Nuxt 自動匯入）。它依主題選用 Scifi、Cupertino、Aqua 或 Material 的按鈕實作，統一處理文字、角色色彩、停用與點擊事件；四種主題字級都是 1rem、最低高度 42px。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `label` | `string` | `'Button'` | 按鈕文字（無 default 插槽內容時顯示） |\n| `disabled` | `boolean` | `false` | 是否停用按鈕 |\n| `color` | `CamelotColorRole` | `'primary'` | 角色色彩，四種主題都套用 |\n| `isContainer` | `boolean` | `false` | 改用角色的容器色 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `click` | `event: MouseEvent` | 按鈕點擊事件 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 按鈕內容；未提供時顯示 `label` |\n\n## 運作方式\n\n### 主題切換\n\n1. 讀取目前主題模式。\n2. 依模式渲染對應實作；未知模式一律用 Material。\n3. 外層容器設定字級 1rem，並依 color 與 isContainer 設定目前角色色，內層實作取用這組顏色。\n\n| 主題 | 實作 |\n|---|---|\n| scifi | [Scifi Button](./Scifi-Button.md) |\n| cupertino | [Cupertino Button](./Cupertino-Button.md) |\n| aqua | [Aqua Button](./Aqua-Button.md) |\n| 其他（預設 material） | [Material Button](./Material-Button.md)，另外收到 color 與 isContainer 以決定漣漪顏色 |\n\n來源：1. [Button.vue][]\n\n### 尺寸\n\n四種主題最低高度都是 42px；字級變大時按鈕會跟著撐高，不會裁切文字。\n\n來源：1. [Button.vue][]\n\n## 相關頁面\n- [useCamelotTheme](../composables/useCamelotTheme.md)\n- [useCamelotRoleColorClass](../composables/useCamelotRoleColorClass.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Button.vue | [app/components/Camelot/Button.vue](../../../../app/components/Camelot/Button.vue) |\n\n[Button.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Button","summary":"Button 是依當前主題自動切換外觀的公開按鈕元件，匯入名稱 `CamelotButton`（Nuxt 自動匯入）。它依主題選用 Scifi、Cupertino、Aqua 或 Material 的按鈕實作，統一處理文字、角色色彩、停用與點擊事件；四種主題字級都是 1rem、最低高度 42px。"},"features/components/Carousel.md":{"md":"# Carousel\n\n## Summary\n\nCarousel 是泛型輪播元件，匯入名稱 `CamelotCarousel`。支援六種切換特效、水平或垂直方向、循環、自動播放、拖曳跟手換頁，以及可自訂的箭頭與指標；只渲染當前項附近的投影片，並尊重使用者的減少動態偏好。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `items` | `T[]` | — | 輪播項目陣列 |\n| `itemKey` | `string \\| ((item: T, index: number) => string \\| number)` | — | 項目 key 取值方式 |\n| `direction` | `'horizontal' \\| 'vertical'` | `'horizontal'` | 排列方向 |\n| `effect` | `'slide' \\| 'fade' \\| 'zoom' \\| 'coverflow' \\| 'cardStack' \\| 'flip'` | `'slide'` | 切換特效 |\n| `loop` | `boolean` | `false` | 是否循環 |\n| `autoplay` | `boolean` | `false` | 是否自動播放 |\n| `interval` | `number` | `4000` | 自動播放間隔（ms） |\n| `pauseOnHover` | `boolean` | `true` | 滑鼠移入時暫停自動播放 |\n| `peek` | `number` | `0` | slide/coverflow/zoom 模式下當前項前後各顯示幾個鄰項 |\n| `gap` | `number` | `0` | 相鄰項間距（px），以投影片內距實作，不破壞比例 |\n| `duration` | `number` | `450` | 切換動畫時長（ms） |\n| `showArrows` | `boolean` | `true` | 顯示左右箭頭 |\n| `showDots` | `boolean` | `true` | 顯示指標圓點 |\n| `height` | `string` | `'320px'` | 容器高度 |\n| `color` | `CamelotColorRole` | `'primary'` | 角色色彩 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `number` | 目前顯示的索引（預設 `0`） |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | `{ item, index, isActive }` | 自訂單張投影片內容 |\n| `dot` | `{ index, active, go }` | 自訂指標點，轉送給 CarouselIndicator |\n| `prev` | `{ prev, next, go, current, total, disabled }` | 整顆換掉左或上箭頭；定位由元件負責，slot 只管長相與觸發。`disabled` 為非 loop 且已在第一張 |\n| `next` | `{ prev, next, go, current, total, disabled }` | 整顆換掉右或下箭頭；`disabled` 為非 loop 且已在最後一張 |\n\n## Exposed\n| 名稱 | 說明 |\n| :--- | :--- |\n| `next()` | 切換至下一項 |\n| `prev()` | 切換至上一項 |\n| `go(i)` | 切換至指定索引（loop 時環繞、否則夾在範圍內） |\n\n## 運作方式\n\n### 投影片定位\n\n每張投影片的位移與透明度，都由它與當前項的帶號距離推導；loop 模式下距離會環繞計算。\n\n1. 無限循環因此自然成立，不需要複製頭尾投影片。\n2. 只有距離落在可視半徑內的投影片會被渲染，半徑依特效與 `peek` 決定。\n3. slide、coverflow、zoom 可用 `peek` 在兩側露出前後各 N 張鄰項。\n\n來源：1. [Carousel.vue][]\n\n### 拖曳換頁\n\n1. 項目少於 2 張時不啟用拖曳。\n2. 在控制項上按下時不進入拖曳，例如按鈕、連結、表單欄位、label、按鈕或分頁角色的元素。\n3. 拖曳中位移直接畫在投影片上並關閉過場，畫面跟著手指走。\n4. 非 loop 時拖出頭尾會套 0.35 阻尼，讓「已經到底」有回饋。\n5. 放開時位移超過 40px 才換頁，否則彈回原位。\n\n| 規則 | 說明 |\n|---|---|\n| 跟手特效 | slide、coverflow、zoom、cardStack；fade 與 flip 沒有平移可跟，只做門檻式換頁 |\n| 控制項排除 | 拖曳會捕獲指標，放開事件改派給輪播本身，控制項會收不到點擊 |\n| 捕獲失敗 | 指標已失效時捕獲會丟錯，一律吞掉，避免換頁判斷整段中斷 |\n| 位移順序 | 拖曳位移接在置中之後、特效位移之前；coverflow 的旋轉才不會讓位移歪掉 |\n| 觸控 | 水平輪播把垂直捲動留給瀏覽器，垂直輪播反之，滑動換頁不會擋住頁面捲動 |\n\n來源：1. [Carousel.vue][]\n\n### 自動播放\n\n以下條件全部成立才會啟動，任一不成立即暫停：\n\n1. 開啟 `autoplay`。\n2. 使用者未開啟減少動態偏好；開啟時也同時停用轉場動畫。\n3. 項目超過 1 張。\n4. 未因 `pauseOnHover` 而處於滑鼠移入狀態。\n5. 不在拖曳中。\n\n來源：1. [Carousel.vue][]\n\n### 箭頭與指標\n\n1. 項目超過 1 張才顯示箭頭與指標。\n2. 要完全移除時把 `showArrows` 或 `showDots` 設為 false；只想改長相則用 prev、next、dot 插槽。\n3. 指標使用獨立的 [CarouselIndicator](./CarouselIndicator.md)，方向與角色色沿用輪播設定。\n\n來源：1. [Carousel.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Carousel.vue | [app/components/Camelot/Carousel.vue](../../../../app/components/Camelot/Carousel.vue) |\n\n[Carousel.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Carousel","summary":"Carousel 是泛型輪播元件，匯入名稱 `CamelotCarousel`。支援六種切換特效、水平或垂直方向、循環、自動播放、拖曳跟手換頁，以及可自訂的箭頭與指標；只渲染當前項附近的投影片，並尊重使用者的減少動態偏好。"},"features/components/CarouselIndicator.md":{"md":"# CarouselIndicator\n\n## Summary\n\nCarouselIndicator 是輪播指標（圓點）元件，匯入名稱 `CamelotCarouselIndicator`（Nuxt 自動匯入）。當前點拉長成膠囊狀凸顯，點擊任一點即切換索引；[Carousel](./Carousel.md) 內建使用它，也可單獨搭配其他輪播使用。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `total` | `number` | —（必填） | 指標數量 |\n| `direction` | `'horizontal' \\| 'vertical'` | `'horizontal'` | 排列方向 |\n| `gap` | `number` | `8` | 點與點間距（px） |\n| `size` | `number` | `8` | 點尺寸（px） |\n| `color` | `CamelotColorRole` | `'primary'` | 角色色彩 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `number` | 目前選中的索引（預設 `0`） |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `dot` | `{ index, active, go }` | 自訂單一指標點；`go` 為切換至指定索引的函式 |\n\n## 運作方式\n\n| 規則 | 說明 |\n|---|---|\n| 結構 | 每個點是一顆按鈕，整組標記為分頁列，當前點標記為已選取 |\n| 當前點 | 沿排列方向拉長為尺寸的 2.2 倍，填入角色色 |\n| 其他點 | 半透明圓點，hover 時加深 |\n| Scifi 主題 | 當前點附帶同色發光陰影 |\n\n來源：1. [CarouselIndicator.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| CarouselIndicator.vue | [app/components/Camelot/CarouselIndicator.vue](../../../../app/components/Camelot/CarouselIndicator.vue) |\n\n[CarouselIndicator.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"CarouselIndicator","summary":"CarouselIndicator 是輪播指標（圓點）元件，匯入名稱 `CamelotCarouselIndicator`（Nuxt 自動匯入）。當前點拉長成膠囊狀凸顯，點擊任一點即切換索引；[Carousel](./Carousel.md) 內建使用它，也可單獨搭配其他輪播使用。"},"features/components/CascadeMenu.md":{"md":"# CascadeMenu\n\n## Summary\n\nCascadeMenu 是以觸發器包裹的多層級聯選單，匯入名稱 `CamelotCascadeMenu`。點擊觸發器開啟根面板，子選單以 hover 或點擊往側邊飛出；點擊外部、按 Esc 或捲動視窗時關閉，面板會傳送到最近的對話框或 body，在 Dialog 與 Sheet 內也能正常使用。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `items` | `CamelotCascadeMenuItem[]` | — | 選單項目清單。 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色。 |\n| `submenuTrigger` | `'hover' \\| 'click'` | `'hover'` | 子選單展開方式。 |\n| `openDelay` | `number` | `80` | 展開延遲（ms）。 |\n| `closeDelay` | `number` | `160` | 關閉延遲（ms）。 |\n| `zIndex` | `number` | — | 面板基底 z-index，實際層級 = 基底 + level。未指定時回落 `calc(var(--cml-z-popup) + level)`（見[疊層刻度](../../platform/layering.md)）。 |\n| `disabled` | `boolean` | `false` | 是否停用。 |\n| `closeOnSelect` | `boolean` | `true` | 選取後是否關閉整組選單。 |\n| `maxHeight` | `number \\| string` | `360` | 單一面板選項區最大高度（number 視為 px），超過則該面板內部捲動。 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `select` | `item: CamelotCascadeMenuItem` | 選取某項目時觸發。 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `open` | `boolean`（預設 `false`） | 選單是否展開。 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | `{ open: boolean }` | 觸發器內容，點擊可切換展開狀態。 |\n\n## 運作方式\n\nCascadeMenu 是浮層飛出式選單，子層往側邊展開；行內手風琴式、子層往下縮排的選單請用 [Menu](./Menu.md)。\n\n### 展開與收合\n\n1. 根面板一律由點擊觸發器開啟。\n2. hover 模式下，滑入含子項的列，經過 `openDelay` 後展開子面板；滑到同層葉節點時收起已展開的兄弟子面板。\n3. 滑出面板後經過 `closeDelay` 才收合；途中滑入子面板時，會沿祖先鏈取消所有收合計時。\n4. hover 模式點含子項的父項，不會收合也不會關閉選單；只有葉節點會觸發選取。\n5. click 模式下點父項切換子面板，不受滑鼠進出影響。\n\n子面板 Teleport 出去後，在 DOM 上不是父面板的後代，滑向子面板時父面板一定先收到滑出事件，所以第 3 步要沿祖先鏈取消。\n\n兄弟項目切換時，子面板以展開項的值作為 key 重建，舊面板不會殘留，也不會在淡出時飛到角落。\n\n來源：1. [CascadeMenuPanel.vue][]\n\n### 定位\n\n面板掛載時在瀏覽器繪製前同步量測錨點與自身尺寸，算出位置後凍結，只在視窗 resize 時重算。\n\n定位完成前面板以隱藏狀態佔位，開啟的第一幀不會從左上角閃現。\n\n| 面板 | 預設位置 | 空間不足時 |\n| :--- | :--- | :--- |\n| 根面板 | 觸發器下緣、左對齊 | 右側不足改為右對齊；下方不足翻到觸發器上方 |\n| 子面板 | 該列右側、頂端對齊 | 右側不足翻到左側；下方不足往上移 |\n\n面板與視窗邊緣至少保留 8px。\n\n來源：1. [CascadeMenuPanel.vue][]\n\n### 捲動\n\n單一面板選項區的最大高度，取 `maxHeight` 與視窗高度減 16px 的較小值，超過時在面板內捲動。\n\n捲動容器放在內層，面板本身裁切內容，捲軸貼齊面板內緣且不破壞圓角。\n\n來源：1. [CascadeMenuPanel.vue][]\n\n### 外觀\n\n| 主題 | 面板 |\n| :--- | :--- |\n| aqua | 圓角玻璃面板 |\n| scifi | 直角、等寬字、30% 角色色邊框與內發光 |\n| cupertino | 背景模糊的半透明圓角面板 |\n| material | 實色圓角面板與陰影 |\n\n選中與 hover 樣式和 [SelectV2](./SelectV2.md) 的下拉選項共用同一組主題設定，兩者效果一致。\n\n來源：1. [CascadeMenuPanel.vue][]　2. [useCamelotMenuItemTheme.ts][]\n\n### 型別放置\n\n選項資料契約放在 shared 型別目錄。面板之間的上下文型別與注入 key 含 DOM 型別，只能放在 app 端的型別目錄，規則見 [Layer 整合](../../dev/layer-integration.md)。\n\n來源：1. [shared/types/cascadeMenu.ts][]　2. [app/types/cascadeMenu.ts][]\n\n### 關閉與共享設定\n\n1. 根元件向各層面板提供設定、選取、全部關閉與面板註冊函式。\n2. 在觸發器與所有已註冊面板之外按下指標時關閉。\n3. 按 Esc 或視窗捲動時關閉。\n4. 元件更新時若處於停用狀態，強制關閉。\n\n| 規則 | 說明 |\n|---|---|\n| 設定讀取時機 | 展開方式、延遲、基底 z-index、最大高度在元件建立時讀取一次，之後變更不生效 |\n| 色彩角色 | 面板傳送出去後 CSS 變數繼承中斷，每個面板各自套用角色色 class 補回 |\n| 傳送目標 | 經 [useCamelotTeleportTarget](../composables/useCamelotTeleportTarget.md) 找最近的對話框，沒有則用 body |\n\n來源：1. [CascadeMenu.vue][]　2. [CascadeMenuPanel.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| CascadeMenu.vue | [app/components/Camelot/CascadeMenu.vue](../../../../app/components/Camelot/CascadeMenu.vue) |\n| CascadeMenuPanel.vue | [app/components/Camelot/Internal/CascadeMenuPanel.vue](../../../../app/components/Camelot/Internal/CascadeMenuPanel.vue) |\n| useCamelotMenuItemTheme.ts | [app/composables/useCamelotMenuItemTheme.ts](../../../../app/composables/useCamelotMenuItemTheme.ts) |\n| shared/types/cascadeMenu.ts | [shared/types/cascadeMenu.ts](../../../../shared/types/cascadeMenu.ts) |\n| app/types/cascadeMenu.ts | [app/types/cascadeMenu.ts](../../../../app/types/cascadeMenu.ts) |\n\n[CascadeMenu.vue]: #references\n[CascadeMenuPanel.vue]: #references\n[useCamelotMenuItemTheme.ts]: #references\n[shared/types/cascadeMenu.ts]: #references\n[app/types/cascadeMenu.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"CascadeMenu","summary":"CascadeMenu 是以觸發器包裹的多層級聯選單，匯入名稱 `CamelotCascadeMenu`。點擊觸發器開啟根面板，子選單以 hover 或點擊往側邊飛出；點擊外部、按 Esc 或捲動視窗時關閉，面板會傳送到最近的對話框或 body，在 Dialog 與 Sheet 內也能正常使用。"},"features/components/Checkbox.md":{"md":"# Checkbox\n\n## Summary\n\nCheckbox 是核取方塊的公開元件，匯入名稱 `CamelotCheckbox`。它依當前主題選用 Scifi、Cupertino、Aqua 或 Material 的實作，支援未定（半選）狀態與圓形外框，並可在右側附帶可點擊的標籤。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `label` | `string` | `''` | 標籤文字 |\n| `disabled` | `boolean` | `false` | 是否停用 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色 |\n| `isContainer` | `boolean` | `false` | 改用角色的容器色 |\n| `shape` | `'square' \\| 'circle'` | `'square'` | 外框形狀（Scifi / Material 實作不套用） |\n| `indeterminate` | `boolean` | `false` | 未定（半選）狀態 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `change` | `checked: boolean` | 切換狀態時觸發，帶入切換後的值 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `boolean`（預設 `false`） | 核取狀態 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `label` | `{ label: string }` | 自訂標籤內容，預設渲染 FieldLabel |\n\n## 運作方式\n\n### 主題切換\n\n1. 依目前主題模式選用實作：scifi、cupertino、aqua，其餘一律 material。\n2. 外框形狀只傳給 Cupertino 與 Aqua；Scifi 與 Material 不接受，外框固定。\n3. 外層依 color 與 isContainer 設定目前角色色，內層實作取用這組顏色。\n4. 有標籤文字或 label 插槽時才渲染標籤；點標籤也會切換並送出 change，停用時無效。\n\n| 主題 | 實作 |\n|---|---|\n| scifi | [Scifi Checkbox](./Scifi-Checkbox.md) |\n| cupertino | [Cupertino Checkbox](./Cupertino-Checkbox.md) |\n| aqua | [Aqua Checkbox](./Aqua-Checkbox.md) |\n| 其他 | [Material Checkbox](./Material-Checkbox.md) |\n\n來源：1. [Checkbox.vue][]\n\n### 尺寸\n\n| 主題 | 方框 | 勾號 |\n| :--- | :--- | :--- |\n| aqua | 20×20 | 6×10 |\n| material | 18×18 | 6×10 |\n| cupertino | 22×22 | 12×8 |\n| scifi | 方塊指示器 | 不畫勾號 |\n\n來源：1. [Aqua/Checkbox.vue][]　2. [Material/Checkbox.vue][]　3. [Cupertino/Checkbox.vue][]　4. [Scifi/Checkbox.vue][]\n\n## 相關頁面\n- [CheckboxGroup](./CheckboxGroup.md)\n- [FieldLabel](./FieldLabel.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Checkbox.vue | [app/components/Camelot/Checkbox.vue](../../../../app/components/Camelot/Checkbox.vue) |\n| Aqua/Checkbox.vue | [app/components/Camelot/Aqua/Checkbox.vue](../../../../app/components/Camelot/Aqua/Checkbox.vue) |\n| Material/Checkbox.vue | [app/components/Camelot/Material/Checkbox.vue](../../../../app/components/Camelot/Material/Checkbox.vue) |\n| Cupertino/Checkbox.vue | [app/components/Camelot/Cupertino/Checkbox.vue](../../../../app/components/Camelot/Cupertino/Checkbox.vue) |\n| Scifi/Checkbox.vue | [app/components/Camelot/Scifi/Checkbox.vue](../../../../app/components/Camelot/Scifi/Checkbox.vue) |\n\n[Checkbox.vue]: #references\n[Aqua/Checkbox.vue]: #references\n[Material/Checkbox.vue]: #references\n[Cupertino/Checkbox.vue]: #references\n[Scifi/Checkbox.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Checkbox","summary":"Checkbox 是核取方塊的公開元件，匯入名稱 `CamelotCheckbox`。它依當前主題選用 Scifi、Cupertino、Aqua 或 Material 的實作，支援未定（半選）狀態與圓形外框，並可在右側附帶可點擊的標籤。"},"features/components/CheckboxGroup.md":{"md":"# CheckboxGroup\n\n## Summary\n\nCheckboxGroup 以選項清單渲染一組核取方塊，匯入名稱 `CamelotCheckboxGroup`。所有已勾選選項的值以陣列雙向綁定，可整組或逐選項停用，並可加上群組標題與必填標記。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `options` | `CamelotGroupOption[]` | —（必填） | 選項清單 |\n| `direction` | `'horizontal' \\| 'vertical'` | `'horizontal'` | 排列方向 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色 |\n| `disabled` | `boolean` | `false` | 整組停用；逐選項停用請用選項的 `disabled` |\n| `label` | `string` | `''` | 群組標題文字 |\n| `required` | `boolean` | `false` | 是否顯示必填標記 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `change` | `values: (string \\| number)[]` | 勾選狀態變動時，回傳更新後的已選值陣列 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `(string \\| number)[]`（預設 `[]`） | 目前所有已勾選選項的值陣列 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `label` | `{ label: string }` | 自訂群組標題，預設渲染 FieldLabel |\n\n## 運作方式\n\n1. 每個選項渲染為一個 [Checkbox](./Checkbox.md)，值在陣列中即為勾選。\n2. 點擊選項時，已勾選就從陣列移除，否則加到陣列尾端。\n3. 以新陣列更新綁定值，並送出 change。\n4. 整組或該選項停用時，點擊不作用。\n\n| 規則 | 說明 |\n|---|---|\n| 水平排列 | 自動換行，項目間距 24px |\n| 垂直排列 | 由上而下，項目間距 8px |\n\n來源：1. [CheckboxGroup.vue][]\n\n## 相關頁面\n- [FieldLabel](./FieldLabel.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| CheckboxGroup.vue | [app/components/Camelot/CheckboxGroup.vue](../../../../app/components/Camelot/CheckboxGroup.vue) |\n\n[CheckboxGroup.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"CheckboxGroup","summary":"CheckboxGroup 以選項清單渲染一組核取方塊，匯入名稱 `CamelotCheckboxGroup`。所有已勾選選項的值以陣列雙向綁定，可整組或逐選項停用，並可加上群組標題與必填標記。"},"features/components/ColorSchemeProvider.md":{"md":"# ColorSchemeProvider\n\n## Summary\n\nColorSchemeProvider 把自訂的明亮與暗色配色方案套用到整份文件根節點，匯入名稱 `CamelotColorSchemeProvider`。它是泛型元件，屬於全域套用：傳入的配色會合併進全站共用的配色方案，依目前色彩模式寫成 CSS 變數；需要只影響局部區塊時改用 [CustomColorSchemeProvider](./CustomColorSchemeProvider.md)。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `lightColorScheme` | `CustomColorScheme<T>` | — | 明亮模式使用的自訂配色方案 |\n| `darkColorScheme` | `CustomColorScheme<T>` | — | 暗色模式使用的自訂配色方案 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 原樣渲染的內容，本元件不額外包外層元素 |\n\n## Exposed\n| 名稱 | 說明 |\n| :--- | :--- |\n| `usedColorScheme` | 目前色彩模式下實際使用中的配色方案 |\n\n## 運作方式\n\n1. 建立時以 [useCustomColorScheme](../composables/useCustomColorScheme.md) 綁定文件根節點，把 props 合併進全站共用的明亮與暗色方案。\n2. 掛載後與每次更新時，再把 props 合併一次，讓 props 變動生效。\n3. 全站共用一個監聽器，色彩模式或方案變動時把使用中的方案寫到根節點的 CSS 變數。\n\n| 規則 | 說明 |\n|---|---|\n| 合併方式 | 只覆蓋有傳入的鍵，不會刪除先前設定過的顏色；明亮與暗色建議都設定 |\n| 卸載後 | 已合併的配色留在全站方案中，不會還原 |\n\n來源：1. [ColorSchemeProvider.vue][]　2. [useCustomColorScheme.ts][]\n\n## 相關頁面\n- [色彩方案](../../platform/color-scheme.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| ColorSchemeProvider.vue | [app/components/Camelot/ColorSchemeProvider.vue](../../../../app/components/Camelot/ColorSchemeProvider.vue) |\n| useCustomColorScheme.ts | [app/composables/useCustomColorScheme.ts](../../../../app/composables/useCustomColorScheme.ts) |\n\n[ColorSchemeProvider.vue]: #references\n[useCustomColorScheme.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"ColorSchemeProvider","summary":"ColorSchemeProvider 把自訂的明亮與暗色配色方案套用到整份文件根節點，匯入名稱 `CamelotColorSchemeProvider`。它是泛型元件，屬於全域套用：傳入的配色會合併進全站共用的配色方案，依目前色彩模式寫成 CSS 變數；需要只影響局部區塊時改用 [CustomColorSchemeProvider](./CustomColorSchemeProvider.md)。"},"features/components/ConfirmDialog.md":{"md":"# ConfirmDialog\n\n## Summary\n\nConfirmDialog 是帶標準按鈕列的確認對話框，匯入名稱 `CamelotConfirmDialog`。最多三顆按鈕（反向、中立、正向），預設只有「確認」且點擊即關閉；它組合 [BaseDialogV2](./BaseDialogV2.md) 與 [Button](./Button.md)，兩者已依主題切換外觀，所以本元件不另外實作版面。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `title` | `string` | — | 標題；未設定且未用 `title` slot 時不渲染標題列 |\n| `message` | `string` | — | 內文；未設定且未用預設 slot 時不渲染內文 |\n| `positiveLabel` | `string` | `'確認'` | 正向按鈕文字；設為空字串可隱藏此鈕 |\n| `neutralLabel` | `string` | — | 中立按鈕文字；**未設定則不顯示** |\n| `negativeLabel` | `string` | — | 反向按鈕文字；**未設定則不顯示** |\n| `positiveColor` | `CamelotColorRole` | `'primary'` | 正向按鈕色彩角色 |\n| `neutralColor` | `CamelotColorRole` | `'primary'` | 中立按鈕色彩角色（以 container 樣式呈現） |\n| `negativeColor` | `CamelotColorRole` | `'error'` | 反向按鈕色彩角色（以 container 樣式呈現） |\n| `autoClose` | `boolean` | `true` | 點擊任一按鈕後是否自動關閉 |\n| `closeByMask` | `boolean` | `true` | 透傳給 BaseDialogV2 |\n| `tag` | `string` | — | 透傳給 BaseDialogV2 |\n| `zIndex` | `number` | — | 透傳給 BaseDialogV2 |\n| `query` | `CamelotDialogQuery` | — | 透傳給 BaseDialogV2，用於網址查詢字串同步 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `positive` | — | 點擊正向按鈕 |\n| `neutral` | — | 點擊中立按鈕 |\n| `negative` | — | 點擊反向按鈕 |\n| `cancel` | — | 透過遮罩或 Esc 關閉（由 BaseDialogV2 轉發） |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model:open` | `boolean` | 是否開啟（預設 `false`） |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `title` | — | 取代 `title` 標題列 |\n| `default` | — | 取代 `message` 內文 |\n| `actions` | `close: () => void` | 完全接管按鈕列；`close` 可用來關閉對話框 |\n\n## 用法\n\n```vue\n<!-- 預設：只有一顆「確認」，點擊即關閉 -->\n<CamelotConfirmDialog\n  v-model:open=\"saved\"\n  title=\"已儲存\"\n  message=\"設定已套用。\"\n/>\n\n<!-- 三顆按鈕 -->\n<CamelotConfirmDialog\n  v-model:open=\"deleting\"\n  title=\"刪除這筆資料？\"\n  message=\"刪除後無法復原。\"\n  positive-label=\"刪除\"\n  positive-color=\"error\"\n  neutral-label=\"稍後再說\"\n  negative-label=\"取消\"\n  @positive=\"remove()\"\n/>\n\n<!-- 非同步流程：自行控制關閉時機 -->\n<CamelotConfirmDialog\n  v-model:open=\"submitting\"\n  :auto-close=\"false\"\n  positive-label=\"送出\"\n  @positive=\"onSubmit\"\n/>\n```\n\n## 運作方式\n\n### 按鈕列\n\n1. 依 label 是否有值決定每顆按鈕是否渲染；正向按鈕有預設文字，所以預設顯示。\n2. 按鈕順序固定為反向、中立、正向並靠右，四種主題一致；外觀差異由 Button 承擔。\n3. 反向與中立按鈕以容器色呈現，正向按鈕用一般色。\n4. 點擊按鈕先送出對應事件；`autoClose` 為 true 時接著關閉。\n\n`autoClose` 設為 false 時按鈕只送出事件不關閉，由使用端自行控制開關，適用於送出前需驗證或等待 API 的情境。\n\n內容只放內容即可：外框與內距已由 BaseDialogV2 負責。\n\n來源：1. [ConfirmDialog.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| ConfirmDialog.vue | [app/components/Camelot/ConfirmDialog.vue](../../../../app/components/Camelot/ConfirmDialog.vue) |\n\n[ConfirmDialog.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"ConfirmDialog","summary":"ConfirmDialog 是帶標準按鈕列的確認對話框，匯入名稱 `CamelotConfirmDialog`。最多三顆按鈕（反向、中立、正向），預設只有「確認」且點擊即關閉；它組合 [BaseDialogV2](./BaseDialogV2.md) 與 [Button](./Button.md)，兩者已依主題切換外觀，所以本元件不另外實作版面。"},"features/components/Container.md":{"md":"# Container\n\n## Summary\n\nContainer 是帶 Camelot 自訂捲軸的容器，匯入名稱 `CamelotContainer`（Nuxt 自動匯入）。它撐滿父層可用空間，並把內容包進 [Scrollbar](./Scrollbar.md) 的捲動區域，可切換為水平捲動。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `horizontal` | `boolean` | — | 是否開啟水平滾動模式 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 容器內容 |\n\n## 運作方式\n\n1. 外層以 grid 撐滿父層寬高，並允許在 flex 版面中縮小，捲動才會發生在容器內。\n2. 內層使用 Scrollbar，並把 `horizontal` 原樣傳下去。\n\n來源：1. [Container.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Container.vue | [app/components/Camelot/Container.vue](../../../../app/components/Camelot/Container.vue) |\n\n[Container.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Container","summary":"Container 是帶 Camelot 自訂捲軸的容器，匯入名稱 `CamelotContainer`（Nuxt 自動匯入）。它撐滿父層可用空間，並把內容包進 [Scrollbar](./Scrollbar.md) 的捲動區域，可切換為水平捲動。"},"features/components/Cupertino-Button.md":{"md":"# Cupertino Button\n\n## Summary\n\nCupertino Button 是 Cupertino 主題（iOS 風格）的按鈕外觀實作，匯入名稱 `CamelotCupertinoButton`。一般在 Cupertino 主題下由公開元件 [Button](./Button.md) 自動選用，按壓時縮小並淡出；它只負責外觀、停用狀態與轉發點擊事件。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabled` | `boolean` | `false` | 是否停用按鈕 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `click` | `event: MouseEvent` | 點擊按鈕時觸發 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 按鈕內容 |\n\n## 運作方式\n\n| 項目 | 行為 |\n|---|---|\n| 尺寸 | 最低高度 42px，字級沿用外層（由 Button 設為 1rem）；字級變大時按鈕跟著撐高 |\n| 色彩 | 背景用目前角色色，文字用對應的 on 色 |\n| 按壓 | 啟用時按下縮放到 0.97 並降低不透明度 |\n| 停用 | 降低不透明度並灰階，游標改為禁止 |\n\n來源：1. [Cupertino/Button.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Cupertino/Button.vue | [app/components/Camelot/Cupertino/Button.vue](../../../../app/components/Camelot/Cupertino/Button.vue) |\n\n[Cupertino/Button.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Cupertino Button","summary":"Cupertino Button 是 Cupertino 主題（iOS 風格）的按鈕外觀實作，匯入名稱 `CamelotCupertinoButton`。一般在 Cupertino 主題下由公開元件 [Button](./Button.md) 自動選用，按壓時縮小並淡出；它只負責外觀、停用狀態與轉發點擊事件。"},"features/components/Cupertino-Checkbox.md":{"md":"# Cupertino Checkbox\n\n## Summary\n\nCupertino Checkbox 是 Cupertino 主題（iOS 風格）的核取方塊外觀實作，匯入名稱 `CamelotCupertinoCheckbox`。支援方形與圓形外框、未定（半選）狀態，一般在 Cupertino 主題下由 [Checkbox](./Checkbox.md) 自動選用。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabled` | `boolean` | `false` | 是否停用 |\n| `shape` | `'square' \\| 'circle'` | `'square'` | 外框形狀 |\n| `indeterminate` | `boolean` | `false` | 未定（半選）狀態，顯示橫線標記 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `change` | `checked: boolean` | 切換狀態時觸發，帶入切換後的值 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `boolean`（預設 `false`） | 核取狀態 |\n\n## 運作方式\n\n| 狀態 | 外觀 |\n|---|---|\n| 未勾選 | 只有淡色外框 |\n| 勾選 | 以目前角色色填滿，顯示打勾標記 |\n| 未定且未勾選 | 以目前角色色填滿，顯示橫線標記 |\n| 停用 | 半透明並灰階，點擊無效、不觸發 change |\n\n來源：1. [Cupertino/Checkbox.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Cupertino/Checkbox.vue | [app/components/Camelot/Cupertino/Checkbox.vue](../../../../app/components/Camelot/Cupertino/Checkbox.vue) |\n\n[Cupertino/Checkbox.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Cupertino Checkbox","summary":"Cupertino Checkbox 是 Cupertino 主題（iOS 風格）的核取方塊外觀實作，匯入名稱 `CamelotCupertinoCheckbox`。支援方形與圓形外框、未定（半選）狀態，一般在 Cupertino 主題下由 [Checkbox](./Checkbox.md) 自動選用。"},"features/components/Cupertino-Input.md":{"md":"# Cupertino Input\n\n## Summary\n\nCupertino Input 是 Cupertino 主題（iOS 風格）的輸入框外觀實作，匯入名稱 `CamelotCupertinoInput`。一般在 Cupertino 主題下由公開元件 [Input](./Input.md) 自動選用，聚焦時切換背景並顯示內框線；它提供前後插槽，並把原生 input 元素暴露給外層。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `placeholder` | `string` | `''` | 佔位文字 |\n| `disabled` | `boolean` | `false` | 是否停用輸入框 |\n| `type` | `CamelotInputType` | `'text'` | 原生 input type，由 Input 依密碼顯示切換狀態下傳 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `string \\| number` | 輸入框的值 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `before` | — | 輸入框前方（左側）的內容 |\n| `after` | — | 輸入框後方（右側）的內容 |\n\n## Exposed\n| 名稱 | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `inputEl` | `Ref<HTMLInputElement \\| null>` | 原生 input，供 Input 轉接給消費端呼叫 focus、select |\n\n## 運作方式\n\n| 項目 | 行為 |\n|---|---|\n| 尺寸 | 最低高度 42px，字級繼承自 Input 根節點；字級變大時跟著撐高 |\n| 外觀 | 淺灰填色底、10px 圓角、無外框 |\n| 聚焦 | 背景改為 surface 色，並顯示目前角色色的內框線 |\n\n來源：1. [Cupertino/Input.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Cupertino/Input.vue | [app/components/Camelot/Cupertino/Input.vue](../../../../app/components/Camelot/Cupertino/Input.vue) |\n\n[Cupertino/Input.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Cupertino Input","summary":"Cupertino Input 是 Cupertino 主題（iOS 風格）的輸入框外觀實作，匯入名稱 `CamelotCupertinoInput`。一般在 Cupertino 主題下由公開元件 [Input](./Input.md) 自動選用，聚焦時切換背景並顯示內框線；它提供前後插槽，並把原生 input 元素暴露給外層。"},"features/components/Cupertino-Radio.md":{"md":"# Cupertino Radio\n\n## Summary\n\nCupertino Radio 是 Cupertino 主題（iOS 風格）的單選圓鈕外觀實作，匯入名稱 `CamelotCupertinoRadio`。一般在 Cupertino 主題下由 [Radio](./Radio.md) 自動選用；預設選取後不能再點掉，開啟可取消選取時才允許點已選項取消。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabled` | `boolean` | `false` | 是否停用 |\n| `deselectable` | `boolean` | `false` | 點擊已選取項可取消選取（非必填情境） |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `change` | `checked: boolean` | 選取狀態切換時觸發 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `boolean`（預設 `false`） | 是否為選取狀態 |\n\n## 運作方式\n\n| 狀態 | 行為 |\n|---|---|\n| 未選取 | 只有淡色外框，點擊後選取 |\n| 已選取 | 以目前角色色填滿，中央顯示 8px 白點 |\n| 已選取再點 | 預設不變；開啟可取消選取時改回未選取 |\n| 停用 | 半透明並灰階，點擊無效 |\n\n來源：1. [Cupertino/Radio.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Cupertino/Radio.vue | [app/components/Camelot/Cupertino/Radio.vue](../../../../app/components/Camelot/Cupertino/Radio.vue) |\n\n[Cupertino/Radio.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Cupertino Radio","summary":"Cupertino Radio 是 Cupertino 主題（iOS 風格）的單選圓鈕外觀實作，匯入名稱 `CamelotCupertinoRadio`。一般在 Cupertino 主題下由 [Radio](./Radio.md) 自動選用；預設選取後不能再點掉，開啟可取消選取時才允許點已選項取消。"},"features/components/Cupertino-Switch.md":{"md":"# Cupertino Switch\n\n## Summary\n\nCupertino Switch 是 Cupertino 主題（iOS 風格）的開關外觀實作，匯入名稱 `CamelotCupertinoSwitch`。一般在 Cupertino 主題下由 [Switch](./Switch.md) 自動選用，點擊切換開關並送出 change 事件。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabled` | `boolean` | `false` | 停用開關 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `change` | `checked: boolean` | 切換狀態改變時觸發 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `boolean`（預設 `false`） | 開關狀態 |\n\n## 運作方式\n\n| 狀態 | 外觀 |\n|---|---|\n| 關 | 半透明灰色軌道，白色圓鈕在左 |\n| 開 | 軌道改為目前角色色，圓鈕滑到右側 |\n| 停用 | 半透明並灰階，點擊不切換 |\n\n來源：1. [Cupertino/Switch.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Cupertino/Switch.vue | [app/components/Camelot/Cupertino/Switch.vue](../../../../app/components/Camelot/Cupertino/Switch.vue) |\n\n[Cupertino/Switch.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Cupertino Switch","summary":"Cupertino Switch 是 Cupertino 主題（iOS 風格）的開關外觀實作，匯入名稱 `CamelotCupertinoSwitch`。一般在 Cupertino 主題下由 [Switch](./Switch.md) 自動選用，點擊切換開關並送出 change 事件。"},"features/components/CustomColorSchemeProvider.md":{"md":"# 區域配色提供者\n\n## Summary\n\n區域配色提供者（CustomColorSchemeProvider）把自訂的明亮與暗色配色方案套用在自身包裹的區塊內，匯入名稱 `CamelotCustomColorSchemeProvider`。它是泛型元件，屬於區域套用：以全站配色為底合併傳入的配色，寫成該區塊的 CSS 變數，不影響區塊外；需要全域套用時改用 [ColorSchemeProvider](./ColorSchemeProvider.md)。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `lightColorScheme` | `CustomColorScheme<T>` | — | 明亮模式使用的自訂配色方案 |\n| `darkColorScheme` | `CustomColorScheme<T>` | — | 暗色模式使用的自訂配色方案 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 套用配色方案的內容，包在一個 div 容器內 |\n\n## Exposed\n| 名稱 | 說明 |\n| :--- | :--- |\n| `usedColorScheme` | 目前色彩模式下實際使用中的配色方案 |\n\n## 運作方式\n\n1. 建立時以 [useCustomColorScheme](../composables/useCustomColorScheme.md) 綁定自身的 div 容器，以當下的全站配色為底合併 props，成為本區塊專屬的方案。\n2. 每次更新時再把 props 合併一次，讓 props 變動生效。\n3. 色彩模式或方案變動時，把使用中的方案寫到容器的 CSS 變數，子元素透過繼承取得。\n\n| 規則 | 說明 |\n|---|---|\n| 作用範圍 | 只影響容器與其後代；傳送到 body 的浮層不在範圍內 |\n| 合併方式 | 只覆蓋有傳入的鍵，不會刪除先前設定過的顏色 |\n\n來源：1. [CustomColorSchemeProvider.vue][]　2. [useCustomColorScheme.ts][]\n\n## 相關頁面\n- [色彩方案](../../platform/color-scheme.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| CustomColorSchemeProvider.vue | [app/components/Camelot/CustomColorSchemeProvider.vue](../../../../app/components/Camelot/CustomColorSchemeProvider.vue) |\n| useCustomColorScheme.ts | [app/composables/useCustomColorScheme.ts](../../../../app/composables/useCustomColorScheme.ts) |\n\n[CustomColorSchemeProvider.vue]: #references\n[useCustomColorScheme.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"區域配色提供者","summary":"區域配色提供者（CustomColorSchemeProvider）把自訂的明亮與暗色配色方案套用在自身包裹的區塊內，匯入名稱 `CamelotCustomColorSchemeProvider`。它是泛型元件，屬於區域套用：以全站配色為底合併傳入的配色，寫成該區塊的 CSS 變數，不影響區塊外；需要全域套用時改用 [ColorSchemeProvider](./ColorSchemeProvider.md)。"},"features/components/DateRangeV2.md":{"md":"# DateRangeV2\n\n## Summary\n\nDateRangeV2（匯入名稱 `CamelotDateRangeV2`）是日期區間選擇器：點觸發欄位開啟月曆，依序點選起日與迄日，桌機預設並排雙月曆、手機單月曆。可連同起迄時間一起選，支援語系、逐日自訂屬性與自訂觸發器；觸發欄位外觀與同主題的 Input 一致，標題由 FieldLabel 渲染。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `minDate` | `Date \\| number` | - | 可選最小日期 |\n| `maxDate` | `Date \\| number` | - | 可選最大日期 |\n| `placeholder` | `string` | `'Select Date Range'` | 自訂觸發器拿到的 displayValue 在未選滿時的文字；內建觸發欄位固定顯示「請選擇起日」「請選擇迄日」 |\n| `disabled` | `boolean` | - | 停用 |\n| `isError` | `boolean` | - | 錯誤態，觸發欄位邊框改為 error 色 |\n| `showType` | `'auto' \\| 'popup' \\| 'dialog'` | `'auto'` | 呈現方式；auto 在手機用 dialog、桌機用 popup |\n| `selectZIndex` | `number` | - | 浮層 z-index |\n| `multiCalendars` | `boolean` | `true` | 桌機是否顯示雙月曆 |\n| `autoApply` | `boolean` | `true` | 選滿起迄後是否自動關閉；只在不含時間時生效 |\n| `displayFormat` | `(dates: [Date, Date]) => string` | - | 自訂 displayValue 字串，覆蓋預設的「起 ~ 迄」 |\n| `format` | `string` | `'yyyy-MM-dd'` | 日期格式；含時間時自動在後面接上時間格式 |\n| `enableTime` | `boolean` | `false` | 是否同時選擇起迄時間 |\n| `timePrecision` | `'hour' \\| 'minute' \\| 'second'` | `'second'` | 時間精細度，由秒往上關閉 |\n| `hourFormat` | `'12' \\| '24'` | `'24'` | 12 或 24 小時制 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色 |\n| `label` | `string` | - | 欄位標題，由 FieldLabel 渲染 |\n| `required` | `boolean` | - | 標題旁顯示必填星號 |\n| `getDayAttributes` | `(date: Date, dayOfWeek: number) => CalendarDayAttributes \\| undefined \\| null` | - | 逐日自訂屬性 |\n| `showDayLabel` | `boolean` | `true` | 是否顯示日期下方 label；關閉則不渲染、格高緊湊 |\n| `locale` | `string` | - | BCP47 語系；未給用預設中文 |\n| `weekStartsOn` | `0 \\| 1` | `0` | 週起始：0 為週日、1 為週一 |\n| `weekdayFormatter` | `(date: Date, index: number) => string` | - | 自訂週名 |\n| `monthFormatter` | `(monthIndex: number) => string` | - | 自訂月名 |\n| `yearFormatter` | `(year: number) => string` | - | 自訂年標題 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model`（預設） | `[Date, Date] \\| null` | 選中的日期區間，依序為起、迄 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | `{ displayValue, open, disabled, toggle }` | 自訂觸發器；未提供時使用內建起迄欄位 |\n| 透傳插槽 | 依 [Calendar](./Internal-Calendar.md) | 其餘插槽原樣轉給內部月曆 |\n\n## 運作方式\n\n### 觸發欄位\n\n內建觸發欄位是唯讀的起、迄兩格，前方有月曆圖示，點整個欄位即開關月曆。\n\n| 項目 | 行為 |\n| :--- | :--- |\n| 高度 | 最低 42px，字級放大時跟著變高 |\n| 圖示 | 大小以 em 計，跟著字級縮放 |\n| Material | Filled 樣式：上圓角、底線，開啟時底線轉為角色色 |\n| Cupertino | 無可見框線的填色底，開啟時內框轉為角色色 |\n| Aqua | 玻璃軌道底，開啟時發光 |\n| Sci-Fi | 外層包 HUD 外框，開啟時外框進入聚焦態 |\n| 輸入格寬度 | 依顯示內容自適應，最少 14 個字元寬 |\n| 手機且含時間 | 起迄改為上下兩行，各帶「起」「迄」標籤 |\n\n觸發欄位是 label 元素且阻止預設點擊行為：否則點到圖示或分隔符時，瀏覽器會再對內層輸入框補發一次點擊，把剛開的月曆又關掉。\n\n來源：1. [DateRangeV2.vue][]　2. [useCamelotPickerTheme.ts][]　3. [FieldFrame.vue][]\n\n### 選取流程\n\n1. 每次開啟都回到日曆視圖，檢視月份跳到目前的起日，沒有值則為本月。\n2. 第一次點選設起日，第二次設迄日；第二次早於起日時兩者自動對調。\n3. 起迄都選好即寫回 v-model。\n4. 不含時間且 autoApply 開啟時，隨即關閉月曆。\n5. 含時間時月曆保持開啟，起迄時間調整即時寫回，按「確認」或點外部才關閉。\n\n來源：1. [DateRangeV2.vue][]　2. [Calendar.vue][]\n\n### 單月曆與雙月曆\n\n第二個月曆只在開啟 multiCalendars 且非手機時顯示。只剩一個月曆時，它同時保留上一月與下一月箭頭。\n\n雙月曆時，任一月曆進入月份或年份選擇會隱藏另一個，並釘住原本的列寬，讓選擇器橫跨兩個月曆置中。\n\n啟用時間時，起迄時間列放在月曆下方：雙月曆時左右並排，單月曆時垂直堆疊，旁邊是「確認」按鈕。\n\n來源：1. [DateRangeV2.vue][]\n\n### 手機對話框\n\nshowType 為 auto 時，手機斷點改用置中的 [BaseDialogV2](./BaseDialogV2.md) 呈現月曆，桌機用浮層。\n\n1. 對話框本身已有主題外框，月曆不再疊一層面板樣式。\n2. 對話框內容最高 82dvh，超過時可捲動，極小或橫向螢幕也能看到完整月曆。\n3. 點外部關閉只在浮層模式生效；對話框模式由對話框自行處理遮罩與 Esc。\n\n來源：1. [DateRangeV2.vue][]\n\n## 相關頁面\n\n- [DateV2](./DateV2.md)\n- [FieldFrame](./Internal-FieldFrame.md)\n- [FieldLabel](./FieldLabel.md)\n- [月曆與日期選擇](../calendar.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| DateRangeV2.vue | [app/components/Camelot/DateRangeV2.vue](../../../../app/components/Camelot/DateRangeV2.vue) |\n| useCamelotPickerTheme.ts | [app/composables/useCamelotPickerTheme.ts](../../../../app/composables/useCamelotPickerTheme.ts) |\n| FieldFrame.vue | [app/components/Camelot/Internal/FieldFrame.vue](../../../../app/components/Camelot/Internal/FieldFrame.vue) |\n| Calendar.vue | [app/components/Camelot/Internal/Calendar.vue](../../../../app/components/Camelot/Internal/Calendar.vue) |\n\n[DateRangeV2.vue]: #references\n[useCamelotPickerTheme.ts]: #references\n[FieldFrame.vue]: #references\n[Calendar.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"DateRangeV2","summary":"DateRangeV2（匯入名稱 `CamelotDateRangeV2`）是日期區間選擇器：點觸發欄位開啟月曆，依序點選起日與迄日，桌機預設並排雙月曆、手機單月曆。可連同起迄時間一起選，支援語系、逐日自訂屬性與自訂觸發器；觸發欄位外觀與同主題的 Input 一致，標題由 FieldLabel 渲染。"},"features/components/DateV2.md":{"md":"# DateV2\n\n## Summary\n\nDateV2（匯入名稱 `CamelotDateV2`）是單一日期選擇器：點觸發欄位開啟月曆，桌機以浮層、手機以置中對話框呈現，可選擇是否連時間一起選。支援語系、週起始、逐日自訂屬性與月曆插槽透傳；觸發欄位的外觀與同主題的 Input 一致，標題由 FieldLabel 渲染。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `minDate` | `Date \\| number` | - | 可選最小日期 |\n| `maxDate` | `Date \\| number` | - | 可選最大日期 |\n| `disableDaysOfWeekList` | `number[]` | - | 停用星期幾，0 是星期日，6 是星期六 |\n| `isError` | `boolean` | - | 錯誤態，觸發欄位邊框改為 error 色 |\n| `placeholder` | `string` | `'YYYY-MM-DD'` | 未選值時的提示文字 |\n| `allowedDates` | `string[] \\| Date[]` | - | 只允許選擇這些日期，字串格式為 yyyy-MM-dd；未設定時不限制 |\n| `disabled` | `boolean` | - | 停用 |\n| `showType` | `'auto' \\| 'popup' \\| 'dialog'` | `'auto'` | 呈現方式；auto 在手機用 dialog、桌機用 popup |\n| `selectZIndex` | `number` | - | 浮層 z-index |\n| `enableTime` | `boolean` | `false` | 是否同時選擇時間 |\n| `timePrecision` | `'hour' \\| 'minute' \\| 'second'` | `'second'` | 時間精細度，由秒往上關閉 |\n| `hourFormat` | `'12' \\| '24'` | `'24'` | 12 或 24 小時制 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色 |\n| `label` | `string` | - | 欄位標題，由 FieldLabel 渲染 |\n| `required` | `boolean` | - | 標題旁顯示必填星號 |\n| `getDayAttributes` | `(date: Date, dayOfWeek: number) => CalendarDayAttributes \\| undefined \\| null` | - | 逐日自訂屬性，如節日、標記、停用、圓點 |\n| `showDayLabel` | `boolean` | `true` | 是否顯示日期下方 label；關閉則不渲染、格高緊湊 |\n| `locale` | `string` | - | BCP47 語系；未給用預設中文 |\n| `weekStartsOn` | `0 \\| 1` | `0` | 週起始：0 為週日、1 為週一 |\n| `weekdayFormatter` | `(date: Date, index: number) => string` | - | 自訂週名，優先於 locale |\n| `monthFormatter` | `(monthIndex: number) => string` | - | 自訂月名 |\n| `yearFormatter` | `(year: number) => string` | - | 自訂年標題 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model`（預設） | `Date \\| number` | 選中的日期時間 |\n| `v-model:input` | `string` | 觸發欄位顯示的格式化字串 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| 透傳插槽 | 依 [Calendar](./Internal-Calendar.md) | 所有插槽原樣轉給內部月曆，如 `day`、`weekday`、`month-name` |\n\n## 運作方式\n\n### 觸發欄位\n\n觸發欄位是唯讀輸入框，前方有月曆圖示，點整個欄位即開關月曆。\n\n| 項目 | 行為 |\n| :--- | :--- |\n| 高度 | 最低 42px，字級放大時跟著變高 |\n| 圖示 | 大小以 em 計，跟著字級縮放 |\n| Material | Filled 樣式：上圓角、底線，開啟時底線轉為角色色 |\n| Cupertino | 無可見框線的填色底，開啟時內框轉為角色色 |\n| Aqua | 玻璃軌道底，開啟時發光 |\n| Sci-Fi | 外層包 HUD 外框，開啟時外框進入聚焦態 |\n\n觸發欄位是 label 元素且阻止預設點擊行為：否則點到圖示時，瀏覽器會再對內層輸入框補發一次點擊，把剛開的月曆又關掉。\n\n來源：1. [DateV2.vue][]　2. [useCamelotPickerTheme.ts][]　3. [FieldFrame.vue][]\n\n### 顯示格式\n\n輸入框顯示字串依是否含時間組成：\n\n| 設定 | 格式 |\n| :--- | :--- |\n| 不含時間 | `yyyy-MM-dd` |\n| 含時間、24 小時制、秒 | `yyyy-MM-dd HH:mm:ss` |\n| 含時間、12 小時制 | 時改為 hh，結尾加上午下午標記 |\n\n時間精細度為 hour 時省略分與秒，為 minute 時省略秒。\n\n來源：1. [DateV2.vue][]\n\n### 選取流程\n\n1. 開啟月曆時，檢視月份跳到目前選中的日期。\n2. 不含時間：點日期即寫回 v-model 並關閉。\n3. 含時間：月曆下方出現時間列與「確認」按鈕，選日期與調時間都即時寫回 v-model。\n4. 含時間時月曆保持開啟，按「確認」或點外部才關閉。\n\n來源：1. [DateV2.vue][]\n\n### 停用日\n\n月曆每一天的屬性由三個來源合成，任一條件成立該日就停用：\n\n| 來源 | 規則 |\n| :--- | :--- |\n| 使用端的逐日屬性 | 先取得使用端回傳的屬性，含其自訂的停用 |\n| 停用星期 | 該日的星期在停用清單內 |\n| 允許日期 | 有設定允許清單且該日不在清單內；比對只看年月日，不受時分秒影響 |\n| 無法解析的允許日期 | 直接略過，不影響其餘日期與月曆渲染 |\n\n停用星期或不在允許清單時，保留使用端的其他屬性，只把該日設為停用。\n\n來源：1. [DateV2.vue][]\n\n### 手機對話框\n\nshowType 為 auto 時，手機斷點改用置中的 [BaseDialogV2](./BaseDialogV2.md) 呈現月曆，桌機用浮層。\n\n1. 對話框本身已有主題外框，月曆不再疊一層面板樣式。\n2. 對話框內容最高 82dvh，超過時可捲動，極小或橫向螢幕也能看到完整月曆。\n3. 點外部關閉只在浮層模式生效；對話框模式由對話框自行處理遮罩與 Esc。\n\n浮層的落影畫在外層容器上並對齊面板圓角，避免被內層的裁切容器切出方角。\n\n來源：1. [DateV2.vue][]\n\n## 相關頁面\n\n- [DateRangeV2](./DateRangeV2.md)\n- [FieldFrame](./Internal-FieldFrame.md)\n- [FieldLabel](./FieldLabel.md)\n- [月曆與日期選擇](../calendar.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| DateV2.vue | [app/components/Camelot/DateV2.vue](../../../../app/components/Camelot/DateV2.vue) |\n| useCamelotPickerTheme.ts | [app/composables/useCamelotPickerTheme.ts](../../../../app/composables/useCamelotPickerTheme.ts) |\n| FieldFrame.vue | [app/components/Camelot/Internal/FieldFrame.vue](../../../../app/components/Camelot/Internal/FieldFrame.vue) |\n\n[DateV2.vue]: #references\n[useCamelotPickerTheme.ts]: #references\n[FieldFrame.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"DateV2","summary":"DateV2（匯入名稱 `CamelotDateV2`）是單一日期選擇器：點觸發欄位開啟月曆，桌機以浮層、手機以置中對話框呈現，可選擇是否連時間一起選。支援語系、週起始、逐日自訂屬性與月曆插槽透傳；觸發欄位的外觀與同主題的 Input 一致，標題由 FieldLabel 渲染。"},"features/components/Drawer.md":{"md":"# Drawer\n\n## Summary\n\nDrawer（匯入名稱 `CamelotDrawer`）是側邊抽屜，有兩種型態：floating 從畫面左或右滑入並蓋上遮罩，fixed 在版面中佔位、以寬度展開或收合。面板分成 header、可捲動的主要內容與 footer 三區，外觀依主題切換，開關由 v-model:open 控制。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `position` | `'left' \\| 'right'` | `'left'` | 抽屜出現的位置 |\n| `variant` | `'floating' \\| 'fixed'` | `'floating'` | 浮動滑入或行內佔位 |\n| `width` | `string` | `'320px'` | 抽屜寬度；floating 另限制最寬 90vw |\n| `closeByMask` | `boolean` | `true` | 是否可點遮罩或按 Esc 關閉 |\n| `zIndex` | `number` | — | floating 容器層級；未指定時用 `--cml-z-drawer`，見 [疊層刻度](../../platform/layering.md) |\n\nzIndex 調高到超過 popup 層級時，Drawer 內的 Select、Popup 浮層會被面板蓋住。\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `close` | — | 透過遮罩點擊或 Esc 關閉時觸發 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `open` | `boolean`，預設 `false` | 抽屜是否開啟 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `header` | — | 抽屜頂部區塊 |\n| `default` | — | 抽屜主要內容，超出時可捲動 |\n| `footer` | — | 抽屜底部區塊 |\n\n## 運作方式\n\n### 兩種型態\n\n| 型態 | 行為 |\n| :--- | :--- |\n| floating | 掛到 body，半透明遮罩淡入，面板從所在側滑入 |\n| fixed | 留在原位，容器寬度在 0 與 width 之間過場；靠右時面板貼齊右緣 |\n\n兩種型態在使用者偏好減少動態時都停用過場動畫。\n\n來源：1. [Drawer.vue][]\n\n### 關閉與捲動鎖\n\n1. floating 開啟時鎖住頁面捲動，關閉或元件卸載時解除。\n2. 多層 Drawer 共用同一個計數，全部關閉才解除，關掉內層不會讓外層背景又能捲動。\n3. 全域樣式固定保留捲軸空間，鎖捲動時版面寬度不會跳動。\n4. closeByMask 開啟時，點遮罩或按 Esc 都會關閉並觸發 close；Esc 只對 floating 有效。\n\n來源：1. [Drawer.vue][]　2. [tailwind.css][]\n\n### 面板外觀\n\n兩種型態的面板都不畫邊框，只用底色與陰影和背景區隔。\n\n| 主題 | 面板樣式 |\n| :--- | :--- |\n| Aqua | 75% 半透明底、背景模糊與大範圍陰影；不套用共用的玻璃面板工具，以避開它的髮絲邊框 |\n| Sci-Fi | 實色底，外圍一圈 18% 主色光暈 |\n| Cupertino | 實色底與大範圍陰影 |\n| Material | 低階容器底色與大範圍陰影 |\n\n來源：1. [Drawer.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Drawer.vue | [app/components/Camelot/Drawer.vue](../../../../app/components/Camelot/Drawer.vue) |\n| tailwind.css | [app/assets/css/tailwind.css](../../../../app/assets/css/tailwind.css) |\n\n[Drawer.vue]: #references\n[tailwind.css]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Drawer","summary":"Drawer（匯入名稱 `CamelotDrawer`）是側邊抽屜，有兩種型態：floating 從畫面左或右滑入並蓋上遮罩，fixed 在版面中佔位、以寬度展開或收合。面板分成 header、可捲動的主要內容與 footer 三區，外觀依主題切換，開關由 v-model:open 控制。"},"features/components/DropImage.md":{"md":"# DropImage\n\n## Summary\n\nDropImage（匯入名稱 `CamelotDropImage`）是單張圖片的選取區：點擊開啟檔案選擇或把圖片拖進來，選到的圖片直接預覽在方形或 16:9 的框內，並以 v-model 回傳該檔案。尚未選圖時可顯示既有圖片與提示文字。多張、主題化的圖片上傳請改用 [ImageDropzone](./ImageDropzone.md)。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `label` | `string` | — | 上方標籤文字 |\n| `modelValue` | `File \\| string` | — | 目前選取的圖片 |\n| `originImage` | `string` | — | 既有圖片網址，未選新圖時顯示 |\n| `id` | `string` | — | 檔案輸入框的 id；未提供時自動產生 |\n| `placeholderText` | `string` | — | 沒有任何圖片時顯示的提示文字 |\n| `isAspectVideo` | `boolean` | — | 使用 16:9 比例，否則為正方形 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `update:modelValue` | `value?: File \\| string` | 選取或拖放圖片後觸發 |\n\n## 運作方式\n\n### 選取與預覽\n\n1. 點擊預覽框開啟檔案選擇，或把檔案拖到框上；拖曳經過時框內顯示藍底虛線提示。\n2. 只取第一個檔案，且只接受圖片類型，其他類型直接忽略。\n3. 選到的檔案讀成 DataURL 畫進預覽，並觸發 update:modelValue。\n\n預覽只在元件內選檔或拖放時更新，外部改寫 modelValue 不會重畫預覽。\n\n來源：1. [DropImage.vue][]\n\n### 既有圖片\n\nmodelValue 為 undefined 且有 originImage 時顯示既有圖片：載入中先顯示 [Skeleton](./Skeleton.md)，載入完成後顯示圖片。\n\n未提供 id 時，以時間戳加兩組隨機數產生，讓同頁多個 DropImage 的 label 各自對應自己的輸入框。\n\n來源：1. [DropImage.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| DropImage.vue | [app/components/Camelot/DropImage.vue](../../../../app/components/Camelot/DropImage.vue) |\n\n[DropImage.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"DropImage","summary":"DropImage（匯入名稱 `CamelotDropImage`）是單張圖片的選取區：點擊開啟檔案選擇或把圖片拖進來，選到的圖片直接預覽在方形或 16:9 的框內，並以 v-model 回傳該檔案。尚未選圖時可顯示既有圖片與提示文字。多張、主題化的圖片上傳請改用 [ImageDropzone](./ImageDropzone.md)。"},"features/components/ErrorDialog.md":{"md":"# ErrorDialog\n\n## Summary\n\nErrorDialog（匯入名稱 `CamelotErrorDialog`）是綁定 [useCamelotError](../composables/useCamelotError.md) 錯誤佇列的對話框：一次顯示一則錯誤，關閉後自動接續下一則，佇列清空才關閉。它包裝 [ConfirmDialog](./ConfirmDialog.md)，在 App 根部掛一次即可；內容全部來自目前的錯誤，Props 只提供錯誤未帶對應欄位時的預設值。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `title` | `string` | `'發生錯誤'` | 錯誤未帶標題時的預設標題 |\n| `fallbackMessage` | `string` | `'發生錯誤，請稍後再試'` | 錯誤既無純文字也無 HTML 訊息時的保底文字 |\n| `positiveLabel` | `string` | `'確認'` | 錯誤未帶正向動作時的按鈕文字 |\n| `closeByMask` | `boolean` | `false` | 是否可由遮罩或 Esc 關閉；預設關閉，以免使用者略過未讀的錯誤 |\n| `zIndex` | `number` | — | 錯誤未帶層級時的預設層級 |\n\n## Emits\n無。使用者的操作一律回寫到錯誤佇列。\n\n## v-model\n無。開關狀態由佇列是否為空決定。\n\n## Slots\n無。內容取自目前錯誤的純文字或 HTML 訊息。\n\n## 用法\n\n### 掛載\n\n在 app 根元件掛一次：\n\n```vue\n<template>\n  <NuxtLayout>\n    <NuxtPage />\n  <\/NuxtLayout>\n  <CamelotToast />\n  <CamelotErrorDialog />\n<\/template>\n```\n\n### 覆寫預設文字\n\n```vue\n<CamelotErrorDialog\n  title=\"系統訊息\"\n  fallback-message=\"請稍後再試一次。\"\n  positive-label=\"我知道了\"\n/>\n```\n\n## 運作方式\n\n### 內容與按鈕\n\n| 項目 | 來源 |\n| :--- | :--- |\n| 標題 | 錯誤的標題，沒有則用 title |\n| 內文 | HTML 訊息優先，其次純文字訊息，都沒有則用 fallbackMessage |\n| 按鈕 | 錯誤的 positive、neutral、negative 三個動作，對應 ConfirmDialog 的三個按鈕槽 |\n| 按鈕色 | 動作自帶顏色優先，否則用錯誤等級推導的色彩角色，未設等級時為 error |\n| 層級 | 錯誤的 zIndex，沒有則用 zIndex prop |\n\n按鈕排列沿用 ConfirmDialog：反向、中立、正向，靠右。錯誤未指定正向動作時，仍顯示一顆用 positiveLabel 的確認鈕。\n\nHTML 訊息以 v-html 渲染，內容必須來自可信來源。\n\n來源：1. [ErrorDialog.vue][]\n\n### 關閉流程\n\n1. 對話框停用 ConfirmDialog 的自動關閉，按鈕一律交給錯誤佇列處理。\n2. 按下的按鈕有對應動作時，由佇列執行該動作，並依動作的 close 設定決定是否關閉這則錯誤。\n3. 按下的按鈕沒有對應動作時，直接關閉這則錯誤。\n4. 遮罩與 Esc 關閉會寫回開關狀態，由同一個 setter 關閉這則錯誤。\n5. 佇列還有下一則時對話框保持開啟並顯示下一則，佇列清空才關閉。\n\n關閉只收斂在開關狀態的 setter，不另外監聽 cancel 事件：[BaseDialogV2](./BaseDialogV2.md) 關閉時會先寫回開關狀態再發出 cancel，兩邊都處理會多關一則、吃掉佇列中的下一則錯誤。\n\n來源：1. [ErrorDialog.vue][]\n\n## 相關頁面\n\n- [元件清單](../components.md)\n- [錯誤處理](../../platform/error-handling.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| ErrorDialog.vue | [app/components/Camelot/ErrorDialog.vue](../../../../app/components/Camelot/ErrorDialog.vue) |\n\n[ErrorDialog.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"ErrorDialog","summary":"ErrorDialog（匯入名稱 `CamelotErrorDialog`）是綁定 [useCamelotError](../composables/useCamelotError.md) 錯誤佇列的對話框：一次顯示一則錯誤，關閉後自動接續下一則，佇列清空才關閉。它包裝 [ConfirmDialog](./ConfirmDialog.md)，在 App 根部掛一次即可；內容全部來自目前的錯誤，Props 只提供錯誤未帶對應欄位時的預設值。"},"features/components/Expanded.md":{"md":"# Expanded\n\n## Summary\n\nExpanded（匯入名稱 `CamelotExpanded`）是可展開、收合的容器：點 header 區切換展開狀態，內容以高度過場平滑展開，底部另有常駐的 footer 區。展開狀態由 v-model:expanded 控制，並對外公開內容區的寬高。Menu 與 Tree 的子層展開都用它做動畫。\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `expanded` | `boolean`，預設 `false` | 是否展開內容 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `header` | — | 標題區，放開指標時切換展開狀態 |\n| `default` | — | 展開、收合的內容 |\n| `footer` | — | 底部區，不隨展開狀態隱藏 |\n\n## Exposed\n| 名稱 | 說明 |\n| :--- | :--- |\n| `contentHeight` | 內容區的高度 |\n| `contentWidth` | 內容區的寬度 |\n\n## 運作方式\n\n### 展開動畫\n\n內容包在一格 grid 裡，展開時列高從 0fr 過場到 1fr，歷時 500ms；收合時內容被裁切隱藏，不需要事先知道內容高度。\n\nheader 監聽的是 pointerup，滑鼠、觸控與觸控筆放開時都會切換。\n\n來源：1. [Expanded.vue][]\n\n### 尺寸追蹤\n\n公開的寬高由內建的 ResizeObserver 追蹤內容區尺寸。元件不監聽視窗捲動與縮放，因為那些只影響座標、不影響尺寸。\n\n來源：1. [Expanded.vue][]\n\n## 相關頁面\n\n- [Menu](./Menu.md)\n- [Tree](./Tree.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Expanded.vue | [app/components/Camelot/Expanded.vue](../../../../app/components/Camelot/Expanded.vue) |\n\n[Expanded.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Expanded","summary":"Expanded（匯入名稱 `CamelotExpanded`）是可展開、收合的容器：點 header 區切換展開狀態，內容以高度過場平滑展開，底部另有常駐的 footer 區。展開狀態由 v-model:expanded 控制，並對外公開內容區的寬高。Menu 與 Tree 的子層展開都用它做動畫。"},"features/components/FieldLabel.md":{"md":"# FieldLabel\n\n## Summary\n\nFieldLabel（匯入名稱 `CamelotFieldLabel`）是表單欄位的標題文字，可在文字後加紅色必填星號，字體樣式依主題調整；標題為空時整個元件不渲染。Input、DateV2 等表單元件的欄位標題一律由它渲染，讓各元件的標題外觀一致。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `label` | `string` | `''` | 標題文字，為空時不渲染任何內容 |\n| `required` | `boolean` | `false` | 為 true 時於文字後方顯示紅色星號 |\n\n## 運作方式\n\n### 主題字體\n\n| 主題 | 字體 |\n| :--- | :--- |\n| Sci-Fi | 小字、全大寫、加寬字距 |\n| 其他主題 | 小字、中等字重 |\n\nFieldLabel 本身不帶內距，左側留白由使用端的 class 決定。\n\n來源：1. [FieldLabel.vue][]\n\n### 表單元件的 label slot\n\n表單元件把 FieldLabel 包在 label slot 的預設內容裡，消費端可以整段替換；slot 會帶出目前的標題文字。\n\n| 元件 | 標題位置 |\n| :--- | :--- |\n| Input、Textarea、SelectV2、NumberCounter | 欄位上方，可用 slot 替換 |\n| Switch、Checkbox、Radio | 控制項右側，點標題可切換或選取；停用時不可點，可用 slot 替換 |\n| RadioGroup、CheckboxGroup | 群組上方，可用 slot 替換 |\n| DateV2、DateRangeV2、TimeV2 | 欄位上方，不開放 slot |\n\nMaterial 主題的 Input 在 labelMode 為 floating 時，標題改由框內的浮動 label 呈現，不渲染 FieldLabel；預設的 outside 與其他主題相同。\n\n來源：1. [FieldLabel.vue][]　2. [Input.vue][]　3. [Switch.vue][]　4. [Radio.vue][]\n\n### 自訂標題\n\n```vue\n<CamelotInput label=\"Custom\">\n  <template #label=\"{ label }\">\n    <span class=\"pl-1 text-sm font-bold\">★ {{ label }}<\/span>\n  <\/template>\n<\/CamelotInput>\n```\n\n## 相關頁面\n\n- [Input](./Input.md)\n- [DateV2](./DateV2.md)\n- [DateRangeV2](./DateRangeV2.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| FieldLabel.vue | [app/components/Camelot/FieldLabel.vue](../../../../app/components/Camelot/FieldLabel.vue) |\n| Input.vue | [app/components/Camelot/Input.vue](../../../../app/components/Camelot/Input.vue) |\n| Switch.vue | [app/components/Camelot/Switch.vue](../../../../app/components/Camelot/Switch.vue) |\n| Radio.vue | [app/components/Camelot/Radio.vue](../../../../app/components/Camelot/Radio.vue) |\n\n[FieldLabel.vue]: #references\n[Input.vue]: #references\n[Switch.vue]: #references\n[Radio.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"FieldLabel","summary":"FieldLabel（匯入名稱 `CamelotFieldLabel`）是表單欄位的標題文字，可在文字後加紅色必填星號，字體樣式依主題調整；標題為空時整個元件不渲染。Input、DateV2 等表單元件的欄位標題一律由它渲染，讓各元件的標題外觀一致。"},"features/components/FileChip.md":{"md":"# FileChip\n\n## Summary\n\nFileChip（匯入名稱 `CamelotFileChip`）是單一檔案的附件晶片：左側是圖片縮圖或依檔案類型著色的圖示，右側是檔名與「類型標籤 · 大小」，可選擇在右上角加移除鈕。[FileDropzone](./FileDropzone.md) 的附件列預設就用它渲染，也可以單獨拿來顯示已上傳的檔案。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `file` | `File` | — | 要顯示的檔案，必填 |\n| `url` | `string` | `''` | 縮圖網址；未提供且為圖片檔時自行產生 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色，用於移除鈕的懸停色 |\n| `removable` | `boolean` | `false` | 顯示右上角移除鈕 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `remove` | — | 點擊移除鈕時觸發 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | `{ file, url, meta }` | 自訂晶片內容；url 為縮圖網址，meta 為檔案類型資訊 |\n\n## 運作方式\n\n### 圖示與文字\n\n1. 有縮圖網址時顯示縮圖，否則依檔案類型顯示圖示：試算表、PDF、文件、壓縮檔、音訊、影片，其餘為通用檔案圖示。\n2. 類型標籤與圖示底色來自共用的檔案分類規則，大小以同一套規則格式化。\n3. 檔名過長時截斷，最寬 10rem。\n\n來源：1. [FileChip.vue][]　2. [useCamelotFileDrop.ts][]\n\n### 縮圖生命週期\n\n外部傳入 url 時直接使用。沒有傳入且檔案是圖片時，元件自行產生 objectURL，並在 file 或 url 變動、以及卸載時回收，避免記憶體洩漏。\n\n來源：1. [FileChip.vue][]\n\n### 主題圓角\n\n| 主題 | 晶片圓角 | 圖示圓角 |\n| :--- | :--- | :--- |\n| Aqua | 1rem | 0.625rem |\n| Sci-Fi | 直角 | 直角 |\n| 其他 | 0.75rem | 0.5rem |\n\n來源：1. [FileChip.vue][]\n\n## 相關頁面\n\n- [檔案拖放](../file-drop.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| FileChip.vue | [app/components/Camelot/FileChip.vue](../../../../app/components/Camelot/FileChip.vue) |\n| useCamelotFileDrop.ts | [app/composables/useCamelotFileDrop.ts](../../../../app/composables/useCamelotFileDrop.ts) |\n\n[FileChip.vue]: #references\n[useCamelotFileDrop.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"FileChip","summary":"FileChip（匯入名稱 `CamelotFileChip`）是單一檔案的附件晶片：左側是圖片縮圖或依檔案類型著色的圖示，右側是檔名與「類型標籤 · 大小」，可選擇在右上角加移除鈕。[FileDropzone](./FileDropzone.md) 的附件列預設就用它渲染，也可以單獨拿來顯示已上傳的檔案。"},"features/components/FileDropzone.md":{"md":"# FileDropzone\n\n## Summary\n\nFileDropzone（匯入名稱 `CamelotFileDropzone`）是通用檔案的拖放區：點擊區域開啟檔案選擇，或把檔案拖進來，已選檔案以附件晶片列顯示在下方並可逐一移除。可限制檔案類型、單選多選與檔數上限，選取結果以 v-model 回傳。只收圖片、要縮圖格的情境改用 [ImageDropzone](./ImageDropzone.md)。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色 |\n| `accept` | `string` | `'*'` | 接受的檔案類型，寫法同原生 accept |\n| `multiple` | `boolean` | `true` | 是否可多選 |\n| `disabled` | `boolean` | `false` | 是否停用 |\n| `max` | `number` | `0` | 最多檔數，0 表示不限 |\n| `height` | `string` | `'7rem'` | 拖曳區最小高度 |\n| `hint` | `string` | `'點此選擇檔案，或拖曳到此區域'` | 提示文字 |\n| `preview` | `boolean` | `true` | 是否顯示附件晶片列 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `select` | `(files: File[])` | 選取檔案時觸發 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model` | `File[] \\| null` | 目前選取的檔案清單，預設 `null` |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | `{ dragOver, count, max, atMax, open }` | 自訂拖曳區內容；open 為開啟檔案選擇的函式 |\n| `icon` | — | 自訂拖曳區圖示 |\n| `chip` | `{ file, url, index, remove }` | 自訂附件晶片；預設渲染 [FileChip](./FileChip.md) |\n\n## 運作方式\n\n### 選取與拖放\n\n拖放、類型過濾、檔數上限與縮圖生命週期都由 [useCamelotFileDrop](../composables/useCamelotFileDrop.md) 處理，元件只負責畫面。\n\n| 狀態 | 外觀 |\n| :--- | :--- |\n| 拖曳經過 | 邊框、底色與文字轉為角色色 |\n| 懸停 | 邊框轉為角色色、底色加深 |\n| 停用 | 半透明並阻擋所有互動 |\n\n來源：1. [FileDropzone.vue][]　2. [useCamelotFileDrop.ts][]\n\n### 主題圓角\n\n| 主題 | 拖曳區圓角 |\n| :--- | :--- |\n| Aqua | 1rem |\n| Sci-Fi | 直角 |\n| Cupertino | 0.75rem |\n| Material | 0.5rem |\n\n來源：1. [FileDropzone.vue][]\n\n## 相關頁面\n\n- [檔案拖放](../file-drop.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| FileDropzone.vue | [app/components/Camelot/FileDropzone.vue](../../../../app/components/Camelot/FileDropzone.vue) |\n| useCamelotFileDrop.ts | [app/composables/useCamelotFileDrop.ts](../../../../app/composables/useCamelotFileDrop.ts) |\n\n[FileDropzone.vue]: #references\n[useCamelotFileDrop.ts]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"FileDropzone","summary":"FileDropzone（匯入名稱 `CamelotFileDropzone`）是通用檔案的拖放區：點擊區域開啟檔案選擇，或把檔案拖進來，已選檔案以附件晶片列顯示在下方並可逐一移除。可限制檔案類型、單選多選與檔數上限，選取結果以 v-model 回傳。只收圖片、要縮圖格的情境改用 [ImageDropzone](./ImageDropzone.md)。"},"features/components/Gpu.md":{"md":"# Gpu\n\n## Summary\n\nGpu（匯入名稱 `CamelotGpu`）是強制 GPU 合成的包裹容器：把內容放進獨立的合成層，並開啟 iOS 的慣性捲動，用來改善動畫閃爍或捲動卡頓。兩項修正都可以個別關閉；容器本身沒有其他樣式與行為。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabledFixTransform` | `boolean` | `false` | 關閉零位移 3D transform 修正 |\n| `disabledFixScrolling` | `boolean` | `false` | 關閉 iOS 觸控慣性捲動修正 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 要套用修正的內容 |\n\n## 運作方式\n\n### 套用的修正\n\n| 修正 | 條件 | 作用 |\n| :--- | :--- | :--- |\n| GPU transform | 一律套用 | 啟用 GPU 合成 |\n| 零位移 3D transform | 未關閉時 | 強制內容獨立成合成層 |\n| 觸控慣性捲動 | 未關閉時 | 讓 iOS Safari 內的捲動有慣性 |\n\n來源：1. [Gpu.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Gpu.vue | [app/components/Camelot/Gpu.vue](../../../../app/components/Camelot/Gpu.vue) |\n\n[Gpu.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"Gpu","summary":"Gpu（匯入名稱 `CamelotGpu`）是強制 GPU 合成的包裹容器：把內容放進獨立的合成層，並開啟 iOS 的慣性捲動，用來改善動畫閃爍或捲動卡頓。兩項修正都可以個別關閉；容器本身沒有其他樣式與行為。"},"features/components/IdxForm.md":{"md":"# IdxForm\n\n## Summary\n\nIdxForm（匯入名稱 `CamelotIdxForm`）是依欄位順序移動焦點的表單容器：在欄位上按 Enter 跳到下一個欄位，Shift+Tab 回到上一個，最後一個欄位按 Enter 時觸發 submit。適合需要連續鍵盤輸入的資料登打畫面。\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `submit` | — | 在最後一個欄位按 Enter 時觸發 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 表單內容，其中的 input 與 select 會自動編號 |\n\n## 運作方式\n\n### 欄位編號\n\n表單掛載後，依文件順序替內容中所有 input 與 select 寫上 data-idx 索引，從 0 開始。編號只在掛載時做一次，之後才動態加入的欄位不會編號。\n\n來源：1. [IdxForm.vue][]\n\n### 鍵盤導覽\n\n1. 按下 Enter 的 keydown 記錄目前欄位的索引。\n2. 同一次 Enter 的 keypress 找索引加一的欄位；找到就聚焦並阻止預設行為。\n3. 找不到下一個欄位時觸發 submit。\n4. Shift+Tab 聚焦索引減一的欄位；已是第一個時交給瀏覽器預設行為。\n\nEnter 拆成 keydown 與 keypress 兩段處理，是為了避開中文輸入法組字時按 Enter 的衝突。\n\n來源：1. [IdxForm.vue][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| IdxForm.vue | [app/components/Camelot/IdxForm.vue](../../../../app/components/Camelot/IdxForm.vue) |\n\n[IdxForm.vue]: #references\n\n---\n[⚙️ Env](../../environment.md) | [🏠 Wiki](../../index.md)\n","title":"IdxForm","summary":"IdxForm（匯入名稱 `CamelotIdxForm`）是依欄位順序移動焦點的表單容器：在欄位上按 Enter 跳到下一個欄位，Shift+Tab 回到上一個，最後一個欄位按 Enter 時觸發 submit。適合需要連續鍵盤輸入的資料登打畫面。"},"features/components/ImageDropzone.md":{"md":"# ImageDropzone\n\n## Summary\n\nImageDropzone（匯入名稱 `CamelotImageDropzone`）是圖片專用的拖放區，有兩種版面：stacked 是一個大的拖放區塊，縮圖列在下方；grid 是多欄縮圖格，新增格接在最後一張縮圖之後。預設只收圖片，可限制張數，縮圖可逐一移除，選取結果以 v-model 回傳。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色 |\n| `accept` | `string` | `'image/*'` | 接受的檔案類型，寫法同原生 accept |\n| `multiple` | `boolean` | `false` | 是否可多選；grid 版面一律多選 |\n| `disabled` | `boolean` | `false` | 是否停用 |\n| `layout` | `'stacked' \\| 'grid'` | `'stacked'` | 版面 |\n| `max` | `number` | `0` | 最多張數，0 表示不限；grid 達上限時隱藏新增格 |\n| `columns` | `number` | `4` | grid 欄數 |\n| `height` | `string` | `'7rem'` | stacked 區塊最小高度 |\n| `hint` | `string` | `'點此選擇圖片，或拖曳到此區域'` | stacked 提示文字 |\n| `gridHint` | `string` | `'新增'` | grid 新增格提示文字 |\n| `preview` | `boolean` | `true` | stacked 是否在下方顯示縮圖；grid 一律顯示 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `select` | `(files: File[])` | 選取檔案時觸發 |\n\n## v-model\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `v-model` | `File[] \\| null` | 目前選取的圖片清單，預設 `null` |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | `{ dragOver, count, max, atMax, open }` | 自訂拖放區或新增格內容；open 為開啟檔案選擇的函式 |\n| `icon` | — | 自訂拖放區圖示 |\n| `thumb` | `{ url, filename, index, remove }` | 自訂縮圖格；預設顯示圖片與移除鈕 |\n\n## 運作方式\n\n### 兩種版面\n\n| 版面 | 排列 | 縮圖 | 多選 |\n| :--- | :--- | :--- | :--- |\n| stacked | 拖放區塊在上，縮圖列在下 | 依 preview | 依 multiple |\n| grid | 縮圖與新增格排成 columns 欄 | 一律顯示 | 一律多選 |\n\n拖放、類型過濾、張數上限與縮圖生命週期都由 [useCamelotFileDrop](../composables/useCamelotFileDrop.md) 處理，元件只負責畫面。\n\n來源：1. [ImageDropzone.vue][]　2. [useCamelotFileDrop.ts][]\n\n### 狀態與主題\n\n拖曳經過時邊框、底色與文字轉為角色色；停用時半透明並阻擋所有互動。\n\n| 主題 | 拖放區圓角 | 縮圖圓角 |\n| :--- | :--- | :--- |\n| Aqua | 1rem | 0.5rem |\n| Sci-Fi | 直角 | 直角 |\n| Cupertino | 0.75rem | 0.375rem |\n| Material | 0.5rem | 0.375rem |\n\n來源：1. [ImageDropzone.vue][]\n\n## 相關頁面\n\n- [FileDropzone](./FileDropzone.md)\n- [檔案拖放](../file-drop.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| ImageDropzone.vue | [app/components/Camelot/ImageDropzone.vue](../../../../app/components/Camelot/ImageDropzone.vue) |\n| useCamelotFileDrop.ts | [app/composables/useCamelotFileDrop.ts](../../../../app/composables/useCamelotFileDrop.ts) |\n\n[ImageDropzone.vue]: #references\n[useCamelotFileDrop.ts]: #references\n\n---\n[⚙️ Env](../
