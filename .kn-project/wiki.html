<title>Camelot Nuxt Layer</title>

    --sidebar:#f6f8fa; --accent:#2563eb; --accent-soft:#dbeafe;

    --sidebar:#161b22; --accent:#4493f8; --accent-soft:#132a4a;
    --code-bg:#161b22; --hover:#1c2330; --table-head:#161b22; --mark:#7c5a00;
    --callout:#161b22; --note:#4493f8; --important:#a371f7; --warning:#e3a008; --ok:#3fb950;
  }

      --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --border:#30363d;
      --sidebar:#161b22; --accent:#4493f8; --accent-soft:#132a4a;
      --code-bg:#161b22; --hover:#1c2330; --table-head:#161b22; --mark:#7c5a00;
      --callout:#161b22; --note:#4493f8; --important:#a371f7; --warning:#e3a008; --ok:#3fb950;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--fg);font-size:15px;line-height:1.65}
  #app{display:flex;height:100vh;overflow:hidden}
  button{font:inherit}
  .btn{background:transparent;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:12.5px;cursor:pointer}
  .btn:hover{background:var(--hover);color:var(--fg)}
  .btn:disabled{opacity:.4;cursor:default}
  /* Sidebar */
  #sidebar{width:280px;min-width:200px;max-width:46vw;background:var(--sidebar);border-right:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden}
  #sidebar header{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
  #sidebar header .name{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #search{width:100%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);font-size:13px}
  #search:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  #tree,#results{overflow:auto;padding:8px;flex:1}
  #content pre.code{position:relative}
  #content pre.code .copy{position:absolute;top:6px;right:6px;font-size:11px;padding:2px 8px;border:1px solid var(--border);border-radius:5px;background:var(--bg);color:var(--muted);cursor:pointer;opacity:0;transition:opacity .15s}
  #content pre.code:hover .copy,#content pre.code .copy:focus{opacity:1}
  #content pre.code .copy.done{color:var(--accent);border-color:var(--accent)}
  #content .tblwrap{overflow:auto;margin:.6em 0}
  #content .tblbar{display:flex;gap:8px;align-items:center;margin:.6em 0 .2em}
  #content .tblbar input{font-size:12.5px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:inherit;min-width:180px}
  #content .tblbar small{color:var(--muted)}
  #content th.sortable{cursor:pointer;user-select:none;white-space:nowrap}
  #content th.sortable::after{content:" ↕";opacity:.35;font-size:.85em}
  #content th.sortable.asc::after{content:" ↑";opacity:1}
  #content th.sortable.desc::after{content:" ↓";opacity:1}
  #content a.src::after{content:" ↗";font-size:.8em;opacity:.6}
  #tree .sec{display:block;padding:8px 8px 2px;font-size:11px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;font-weight:700}
  #results{display:none}
  #tree ul{list-style:none;margin:0;padding-left:14px}
  #tree>ul{padding-left:4px}
  #tree li{margin:1px 0}
  #tree .f,#tree .d{display:block;padding:3px 8px;border-radius:6px;cursor:pointer;font-size:13.5px;
    text-decoration:none;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #tree .f:hover,#tree .d:hover{background:var(--hover)}
  #tree .f.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  #tree .d{color:var(--muted);font-weight:600;font-size:12.5px;user-select:none}
  #tree .d::before{content:"▾ ";font-size:10px}
  #tree li.closed>.d::before{content:"▸ "}
  #tree li.closed>ul{display:none}
  .res{display:block;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--fg);margin-bottom:2px}
  .res:hover,.res.sel{background:var(--hover)}
  .res b{display:block;font-size:13.5px}
  .res small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .res mark{background:var(--mark);color:inherit;border-radius:2px}
  #resizer{width:5px;cursor:col-resize;background:transparent}
  #resizer:hover{background:var(--accent-soft)}
  /* Main */
  #main{flex:1;overflow:auto;position:relative}
  #toolbar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);
    padding:8px 20px;display:flex;align-items:center;gap:8px;font-size:13px;z-index:5}
  #crumb{color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #crumb a{color:var(--muted);text-decoration:none}
  #crumb a:hover{color:var(--accent)}
  #layout{display:flex;gap:32px;max-width:1180px;margin:0 auto;padding:28px 32px 120px}
  #content{flex:1;min-width:0;max-width:860px}
  #toc{width:220px;flex:none;position:sticky;top:60px;align-self:flex-start;max-height:calc(100vh - 80px);overflow:auto;
    font-size:12.5px;border-left:1px solid var(--border);padding-left:14px;color:var(--muted)}
  #toc .t{font-weight:600;margin-bottom:6px;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
  #toc a{display:block;color:var(--muted);text-decoration:none;padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toc a.h3{padding-left:12px}
  #toc a:hover,#toc a.cur{color:var(--accent)}
  @media (max-width:1000px){#toc{display:none}}
  #backlinks{margin-top:3em;padding-top:1em;border-top:1px solid var(--border);font-size:13.5px;color:var(--muted)}
  #backlinks ul{padding-left:1.4em;margin:.4em 0}
  #backlinks a{color:var(--accent);text-decoration:none}
  #empty{color:var(--muted);padding:40px;text-align:center}
  .ext-badge{background:var(--warning);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px;margin-right:4px}

  #content h1,#content h2,#content h3,#content h4{line-height:1.3;margin:1.4em 0 .5em;scroll-margin-top:56px}
  #content h1{font-size:1.9em;border-bottom:1px solid var(--border);padding-bottom:.3em;margin-top:.2em}
  #content h2{font-size:1.5em;border-bottom:1px solid var(--border);padding-bottom:.25em}
  #content h3{font-size:1.25em}
  #content h4{font-size:1.05em}
  #content a{color:var(--accent);text-decoration:none}
  #content a:hover{text-decoration:underline}
  #content a.ext::after{content:" ↗";font-size:.8em;opacity:.6}
  #content code{background:var(--code-bg);padding:.15em .4em;border-radius:4px;font-size:.88em;
    font-family:"SF Mono",Consolas,"Liberation Mono",monospace}
  #content pre.code{background:var(--code-bg);padding:14px 16px;border-radius:8px;overflow:auto;border:1px solid var(--border)}
  #content pre.code code{background:none;padding:0}
  #content table{border-collapse:collapse;width:100%;margin:1em 0;display:block;overflow:auto}
  #content th,#content td{border:1px solid var(--border);padding:7px 12px;text-align:left}
  #content th{background:var(--table-head);font-weight:600}
  #content blockquote.callout{margin:1em 0;padding:.6em 1em;border-left:4px solid var(--muted);
    background:var(--callout);border-radius:0 6px 6px 0}
  #content blockquote.callout-note{border-color:var(--note)}
  #content blockquote.callout-important{border-color:var(--important)}
  #content blockquote.callout-warning,#content blockquote.callout-caution{border-color:var(--warning)}
  #content blockquote.callout-tip{border-color:var(--ok)}
  #content blockquote p:first-child{margin-top:0}#content blockquote p:last-child{margin-bottom:0}
  #content hr{border:0;border-top:1px solid var(--border);margin:1.6em 0}
  #content ul,#content ol{padding-left:1.6em}
  #content label.task{display:inline-flex;align-items:flex-start;gap:.5em}
  #content li:has(>label.task){list-style:none;margin-left:-1.2em}
  #content label.task input{margin-top:.35em;width:15px;height:15px}
  #content img.diagram{display:block;margin:.6em auto 1em;max-width:100%;cursor:zoom-in;border-radius:6px}
  #content details.diagram-src{margin:.8em 0 0;font-size:12.5px;color:var(--muted)}
  #content details.diagram-src summary{cursor:pointer;user-select:none}
  #content details.diagram-src pre{margin:.4em 0 0}
    background:var(--callout);border-left:4px solid var(--warning);color:var(--warning)}
  #content img{max-width:100%}
  #content td img{max-width:180px;max-height:180px;object-fit:contain;display:block}
  #appflowLink{display:block;padding:6px 8px;border-radius:6px;font-size:13px;color:var(--accent);text-decoration:none;border:1px dashed var(--border)}
  #appflowLink:hover{background:var(--hover)}
  #content mark{background:var(--mark);color:inherit}
  #mmd-lb{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;overflow:hidden}
  #mmd-lb.open{display:flex}
  #mmd-lb .stage{background:var(--bg);padding:16px;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5);cursor:grab;will-change:transform;user-select:none}
  #mmd-lb .stage svg{max-width:none!important;height:auto;display:block}
  #mmd-lb .lb-close{position:fixed;top:14px;right:18px;font-size:24px;color:#fff;background:rgba(0,0,0,.45);border:0;border-radius:8px;width:44px;height:44px;cursor:pointer;line-height:1}
  #mmd-lb .lb-hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);color:#fff;opacity:.85;font-size:12.5px;background:rgba(0,0,0,.45);padding:5px 12px;border-radius:20px;pointer-events:none}
  kbd{font:11px "SF Mono",Consolas,monospace;border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
  @media print{#sidebar,#resizer,#toolbar,#toc{display:none}#main{overflow:visible}#layout{padding:0}}
</style>
</head>

</div>

mposables/useBlobDownload.md","features/composables/useCamelotColorMode.md","features/composables/useCamelotError.md","features/composables/useCamelotFileDrop.md","features/composables/useCamelotMenuItemTheme.md","features/composables/useCamelotOverlayScrollbar.md","features/composables/useCamelotPickerTheme.md","features/composables/useCamelotRoleColorClass.md","features/composables/useCamelotRouter.md","features/composables/useCamelotTeleportTarget.md","features/composables/useCamelotTheme.md","features/composables/useCamelotToast.md","features/composables/useCamelotVirtual.md","features/composables/useCanvasConvert.md","features/composables/useColor.md","features/composables/useColorSchemeCssVars.md","features/composables/useCookieProxy.md","features/composables/useCurrentRoute.md","features/composables/useCustomColorScheme.md","features/composables/useDelay.md","features/composables/useDeviceBreakpoints.md","features/composables/useDrawerCollapsed.md","features/composables/useElCssVar.md","features/composables/useErrorRef.md","features/composables/useFetchJSONLinesStream.md","features/composables/useFetchStream.md","features/composables/useFileKey.md","features/composables/useFileToDataURL.md","features/composables/useFloat.md","features/composables/useInfinitePage.md","features/composables/useInputValidationController.md","features/composables/useIsValidKey.md","features/composables/useLazyImage.md","features/composables/useLoading.md","features/composables/useLocalStorageProxy.md","features/composables/useLocale.md","features/composables/useMaterial3ColorScheme.md","features/composables/useNumberThousandsSeparators.md","features/composables/useObject.md","features/composables/usePiniaClear.md","features/composables/useRandom.md","features/composables/useRandomCatImg.md","features/composables/useRouteWrapper.md","features/composables/useScrollOnBottom.md","features/composables/useScrollParent.md","features/composables/useSessionStorageProxy.md","features/composables/useStorageProxy.md","features/composables/useValueValidation.md","features/file-drop.md","features/progress-components.md","features/radio-and-groups.md","features/richtext-editor-image-dropzone.md","features/time-picker.md","features/timeline.md","platform/api-client.md","platform/architecture.md","platform/color-scheme.md","platform/error-handling.md","platform/i18n-locales.md","platform/layering.md","platform/locale.md","platform/overlay-scrollbar.md","platform/theme-system.md"],"pages":{"environment.md":{"md":"# 環境變數\n\n## Summary\n\nCamelot Nuxt Layer 的設定全部走 Nuxt runtimeConfig：Layer 的 Nuxt 設定只定義預設值與結構，實際值由消費端的 Nuxt 設定或 `NUXT_` 開頭的環境變數覆寫。本 repo 沒有 `.env.example`，也不分 flavor。支付 SDK 與 Google 字型由 Nuxt 模組在建置期讀取，只能在消費端的 Nuxt 設定裡改；安全性插件與公開設定在執行期讀取，可用環境變數覆寫。缺值時一律套用下表的預設值，不會啟動失敗。\n\n## 變數\n\n### 支付與字型\n\n這三個值由 Layer 的 Nuxt 模組在建置期讀取設定檔裡的值，執行期環境變數改不到，請寫在消費端 Nuxt 設定的 runtimeConfig。\n\n| 變數 | 用途 | 缺省影響 | 範例 |\n|---|---|---|---|\n| `tappay.addScript` | 在 head 注入 TapPay SDK 5.17.0 的 script | 預設 `false`：不載入 TapPay，信用卡支付無法使用 | `true` |\n| `googlePay.addScript` | 在 head 注入 Google Pay JS SDK 的 script | 預設 `false`：Google Pay 無法使用 | `true` |\n| `googleFont.disabled` | 停用 Noto Sans TC 的 Google 字型 preconnect 與樣式表 | 預設 `false`：會載入 Google 字型 | `true` |\n\n來源：1. [nuxt.config.ts][]　2. [tappay.ts][]　3. [googleFont.ts][]\n\n### 安全性插件\n\n| 變數 | 用途 | 缺省影響 | 範例 |\n|---|---|---|---|\n| `NUXT_SECURITY_PLUGIN_ENABLED` | 啟用伺服器端安全性插件，設定 CSP 與安全 HTTP 標頭 | 預設 `true`；設為 `false` 時不送任何 CSP 或安全標頭，建議只在開發或 playground 關閉 | `false` |\n| `NUXT_SECURITY_PLUGIN_USE_NONCE` | 每個請求產生隨機 nonce，注入 script、style、link 標籤 | 預設 `true`；關閉時 script-src 不帶 nonce 與 strict-dynamic，只剩 self 與 unsafe-inline | `true` |\n\n來源：1. [nuxt.config.ts][]　2. [securityPlugin.ts][]\n\n### CSP 追加來源\n\n`securityPlugin.contentSecurityPolicy` 底下的陣列讓消費端追加 CSP 來源，Layer 內建的基底來源一律保留。\n\n每條指令都含 self，全域 default-src 為 self。\n\n| 設定鍵 | 對應指令 | 基底來源 |\n|---|---|---|\n| `connect` | connect-src | self |\n| `font` | font-src | self、data、fonts.gstatic.com 的 http 與 https |\n| `frame` | frame-src | self、unsafe-inline |\n| `frameAncestors` | frame-ancestors | self |\n| `img` | img-src | self、data |\n| `manifest` | manifest-src | self |\n| `media` | media-src | self |\n| `object` | object-src | self |\n| `script` | script-src | self、unsafe-inline；nonce 模式另加 nonce 與 strict-dynamic |\n| `style` | style-src | self、fonts.googleapis.com、unsafe-inline |\n| `worker` | worker-src | self、unsafe-inline、wasm-unsafe-eval、blob |\n\n來源：1. [securityPlugin.ts][]\n\n### 公開設定\n\n| 變數 | 用途 | 缺省影響 | 範例 |\n|---|---|---|---|\n| `NUXT_PUBLIC_VERSION` | 應用程式版本號，由版本 API 回傳 | 預設 `1.0.0` | `4.3.1.12` |\n| `NUXT_PUBLIC_ENV` | 環境識別字串；Layer 內沒有程式讀取，供消費端使用 | 預設 `development` | `production` |\n| `NUXT_PUBLIC_REPLACE_END_SPLASH` | 全域 middleware 移除路徑末尾的斜線，根路徑除外 | 預設 `true`；設為 `false` 時不正規化，同一頁可能有兩個網址 | `true` |\n\n設定鍵名是 `replaceEndSplash`，所以環境變數是 SPLASH 而不是 SLASH。\n\n來源：1. [nuxt.config.ts][]　2. [index.get.ts][]　3. [$00.replacePath.ts][]\n\n## 來源與載入順序\n\n1. Layer 的 Nuxt 設定提供預設值。\n2. 消費端的 Nuxt 設定覆寫 Layer 預設值。\n3. 執行期的 `NUXT_` 環境變數覆寫前兩者；建置期由模組讀取的支付與字型設定不受影響。\n\n來源：1. [nuxt.config.ts][]\n\n## 環境差異\n\n無：本 repo 不分 flavor，各環境的值由消費端決定。\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| nuxt.config.ts | [nuxt.config.ts](../../nuxt.config.ts) |\n| tappay.ts | [modules/tappay.ts](../../modules/tappay.ts) |\n| googleFont.ts | [modules/googleFont.ts](../../modules/googleFont.ts) |\n| securityPlugin.ts | [server/plugins/securityPlugin.ts](../../server/plugins/securityPlugin.ts) |\n| index.get.ts | [server/api/version/index.get.ts](../../server/api/version/index.get.ts) |\n| $00.replacePath.ts | [app/middleware/$00.replacePath.ts](../../app/middleware/$00.replacePath.ts) |\n\n[nuxt.config.ts]: #references\n[tappay.ts]: #references\n[googleFont.ts]: #references\n[securityPlugin.ts]: #references\n[index.get.ts]: #references\n[$00.replacePath.ts]: #references\n\n---\n[🏠 Wiki](index.md)\n","title":"環境變數","summary":"Camelot Nuxt Layer 的設定全部走 Nuxt runtimeConfig：Layer 的 Nuxt 設定只定義預設值與結構，實際值由消費端的 Nuxt 設定或 `NUXT_` 開頭的環境變數覆寫。本 repo 沒有 `.env.example`，也不分 flavor。支付 SDK 與 Google 字型由 Nuxt 模組在建置期讀取，只能在消費端的 Nuxt 設定裡改；安全性插件與公開設定在執行期讀取，可用環境變數覆寫。缺值時一律套用下表的預設值，不會啟動失敗。"},"index.md":{"md":"# Camelot Nuxt Layer Wiki\n\n## 功能\n\n- [🗓️ 日期選擇器](features/calendar.md)\n- [🧩 元件清單](features/components.md)\n- [🪝 Composable 清單](features/composables.md)\n- [📎 檔案拖曳](features/file-drop.md)\n- [📊 進度元件](features/progress-components.md)\n- [🔘 單選與選項群組](features/radio-and-groups.md)\n- [✍️ 富文本與圖片拖曳](features/richtext-editor-image-dropzone.md)\n- [⏰ 時間選擇器](features/time-picker.md)\n- [🕒 時間軸](features/timeline.md)\n\n### components\n- [Aqua Button](features/components/Aqua-Button.md)\n- [Aqua Checkbox](features/components/Aqua-Checkbox.md)\n- [Aqua Input](features/components/Aqua-Input.md)\n- [Aqua Radio](features/components/Aqua-Radio.md)\n- [Aqua Switch](features/components/Aqua-Switch.md)\n- [BaseBottomSheetV2](features/components/BaseBottomSheetV2.md)\n- [BaseDialogV2](features/components/BaseDialogV2.md)\n- [Breadcrumb](features/components/Breadcrumb.md)\n- [Breakpoints](features/components/Breakpoints.md)\n- [Button](features/components/Button.md)\n- [Carousel](features/components/Carousel.md)\n- [CarouselIndicator](features/components/CarouselIndicator.md)\n- [CascadeMenu](features/components/CascadeMenu.md)\n- [Checkbox](features/components/Checkbox.md)\n- [CheckboxGroup](features/components/CheckboxGroup.md)\n- [ColorSchemeProvider](features/components/ColorSchemeProvider.md)\n- [ConfirmDialog](features/components/ConfirmDialog.md)\n- [Container](features/components/Container.md)\n- [Cupertino Button](features/components/Cupertino-Button.md)\n- [Cupertino Checkbox](features/components/Cupertin /useFloat.md)\n- [useInfinitePage](features/composables/useInfinitePage.md)\n- [輸入驗證控制器](features/composables/useInputValidationController.md)\n- [useIsValidKey](features/composables/useIsValidKey.md)\n- [useLazyImage](features/composables/useLazyImage.md)\n- [useLoading](features/composables/useLoading.md)\n- [useLocalStorageProxy](features/composables/useLocalStorageProxy.md)\n- [useLocale](features/composables/useLocale.md)\n- [M3 色彩配置](features/composables/useMaterial3ColorScheme.md)\n- [千分位格式化](features/composables/useNumberThousandsSeparators.md)\n- [useObject](features/composables/useObject.md)\n- [Pinia 重置與釋放](features/composables/usePiniaClear.md)\n- [useRandom](features/composables/useRandom.md)\n- [useRandomCatImg](features/composables/useRandomCatImg.md)\n- [useRouteWrapper](features/composables/useRouteWrapper.md)\n- [useScrollOnBottom](features/composables/useScrollOnBottom.md)\n- [useScrollParent](features/composables/useScrollParent.md)\n- [sessionStorage 代理](features/composables/useSessionStorageProxy.md)\n- [useStorageProxy](features/composables/useStorageProxy.md)\n- [useValueValidation](features/composables/useValueValidation.md)\n\n## 平台\n\n- [API 用戶端](platform/api-client.md)\n- [專案架構](platform/architecture.md)\n- [色彩主題系統](platform/color-scheme.md)\n- [錯誤處理系統](platform/error-handling.md)\n- [i18n 語系系統](platform/i18n-locales.md)\n- [疊層刻度](platform/layering.md)\n- [useLocale](platform/locale.md)\n- [自訂捲軸系統](platform/overlay-scrollbar.md)\n- [主題系統](platform/theme-system.md)\n\n## 開發\n\n- [Layer 整合](dev/layer-integration.md)\n- [單元測試](dev/testing.md)\n\n---\n[⚙️ Env](environment.md) | [🏠 Wiki](index.md)\n","title":"Camelot Nuxt Layer Wiki","summary":""},"dev/layer-integration.md":{"md":"# Layer 整合\n\n## Summary\n\nLayer 整合規範說明消費端以 `extends: ['github:KNightING/camelot-nuxt-layer']` 引入本 Layer 時的必裝依賴清單、整合失敗模式、Layer 端的型別放置規則與品質門檻。c12 與 giget 只把原始碼抓進消費端的 `.c12/` 目錄，不在該目錄安裝 Layer 的依賴；Layer 的 import 沿 `node_modules` 向上解析到消費端，所以被直接 import 的套件都必須由消費端自行宣告。另一類只在消費端浮現的失敗，是 Layer 的 `shared/` 誤用 DOM 型別。\n\n## 運作方式\n\n### 依賴解析模型\n\n這張圖回答：Layer 程式碼裡的 import，最後是從哪裡解析到套件？\n\n```json diagram id=圖1\n{\n  \"type\": \"flow\",\n  \"dir\": \"TD\",\n  \"title\": \"Layer 依賴解析\",\n  \"desc\": \"消費端的 extends 讓 c12 下載 Layer 原始碼但不安裝依賴，Layer 的 import 沿 node_modules 上溯到消費端\",\n  \"nodes\": [\n    {\"id\": \"B\", \"text\": \"消費端 extends\", \"shape\": \"stadium\"},\n    {\"id\": \"C\", \"text\": \"c12 下載\", \"kind\": \"ext\"},\n    {\"id\": \"D\", \"text\": \"Layer 原始碼副本\"},\n    {\"id\": \"X\", \"text\": \"Layer 依賴清單\", \"kind\": \"data\"},\n    {\"id\": \"A\", \"text\": \"消費端依賴\", \"shape\": \"db\", \"key\": true},\n    {\"id\": \"R\", \"text\": \"被 import 的套件\"}\n  ],\n  \"edges\": [\n    {\"from\": \"B\", \"to\": \"C\"},\n    {\"from\": \"C\", \"to\": \"D\", \"label\": \"下載原始碼\"},\n    {\"from\": \"D\", \"to\": \"X\", \"label\": \"不執行安裝\", \"kind\": \"fail\"},\n    {\"from\": \"D\", \"to\": \"A\", \"label\": \"import 上溯\"},\n    {\"from\": \"A\", \"to\": \"R\", \"label\": \"解析終點\"}\n  ]\n}\n```\n\n![Layer 依賴解析](layer-integration.圖1.svg)\n\nLayer 自己的依賴宣告對消費端沒有約束力：它不是 peer dependency，也不會被安裝。消費端必須自己重建這份清單。\n\n來源：1. [nuxt.config.ts][]　2. [package.json][]\n\n### 必裝依賴清單\n\n| 套件 | 被誰直接使用 | 缺少時的症狀 |\n| :--- | :--- | :--- |\n| `@tailwindcss/vite` | Layer 的 Nuxt 設定 | Layer 設定載入即失敗 |\n| `@nuxt/kit` | Layer 的三個自訂 Nuxt 模組 | 啟動立即中止，找不到該模組 |\n| `@tiptap` 系列：core、pm、starter-kit、vue-3、extension-image、extension-link、extension-placeholder | RichTextEditor | 使用 RichTextEditor 的頁面編譯時才報錯 |\n| `date-fns` | DateV2、DateRangeV2、TimeV2 與日曆 | 使用日期元件的頁面編譯時才報錯 |\n| `change-case` | 色彩 CSS 變數寫入器 | 引用時才報錯 |\n| `@iconify-json/material-symbols`、`@iconify-json/ic` | 元件內的 icons 虛擬模組，例如 Breadcrumb | 圖示解析失敗 |\n| `pinia`、`pinia-plugin-persistedstate` | Nuxt 模組清單與 usePiniaClear | Pinia 模組載入失敗 |\n| `@vueuse/core`、`@vueuse/nuxt`、`@vueuse/components`、`@vueuse/integrations` | composables 與元件 | 引用時才報錯 |\n| `nuxt`、`tailwindcss`、`unplugin-icons`、`unplugin-vue-components`、`@nuxtjs/i18n`、`@pinia/nuxt`、`@nuxt/eslint` | Layer Nuxt 設定的模組與 vite 外掛 | 啟動失敗 |\n\n具體版本以 Layer 的依賴宣告為準；README 的安裝章節有可直接複製的片段。\n\n來源：1. [package.json][]　2. [nuxt.config.ts][]　3. [buildHook.ts][]　4. [RichTextEditor.vue][]　5. [DateV2.vue][]　6. [useColorSchemeCssVars.ts][]　7. [Breadcrumb.vue][]　8. [usePiniaClear.ts][]\n\n### 失敗模式\n\n整合失敗分三類，延遲失敗最難排查：\n\n| 類型 | 觸發時機 | 代表 |\n| :--- | :--- | :--- |\n| 立即中止 | Nuxt 啟動的模組解析階段 | `@nuxt/kit`、`@tailwindcss/vite` |\n| 延遲失敗 | 用到該元件的頁面被編譯時才爆 | `@tiptap` 系列、`date-fns`、`@iconify-json` 系列 |\n| 只在消費端 type check 浮現 | 消費端跑 `nuxt typecheck` 時 | Layer 的 shared 目錄誤用 DOM 型別，見型別放置規則 |\n\n延遲失敗的後果是 `pnpm dev` 看似正常，直到某個頁面第一次被存取才報 Cannot find module。\n\n補齊時要照整份清單補，不要只裝報錯的那一個。\n\n來源：1. [nuxt.config.ts][]\n\n### @nuxt/kit 為何是硬性中止點\n\nLayer 的自訂模組由 jiti 以 CJS 的 require.resolve 載入 @nuxt/kit，發生在 Nuxt 啟動的模組解析階段。\n\npnpm 的嚴格 node_modules 不提升傳遞依賴，消費端未直接宣告時解析不到，`pnpm dev` 立刻中止。\n\nLayer 自身的依賴宣告也沒有列 @nuxt/kit，只由 nuxt 傳遞取得，屬同一類脆弱性。\n\n來源：1. [buildHook.ts][]　2. [echartModule.ts][]　3. [tappay.ts][]　4. [package.json][]\n\n## 型別放置規則\n\n### shared 目錄不得依賴 DOM\n\nNuxt 4 為 shared 目錄產生獨立的 TS project：target 為 ESNext、types 為空、不指定 lib。\n\nshared 同時被 client 與 Nitro server 匯入，所以刻意不假設有 DOM。\n\n該 project 的 include 涵蓋 Layer 的 shared 目錄，會被消費端一起編譯。Layer 的 shared 一旦出現 HTMLElement、Event 等 DOM 型別，錯誤只會在消費端浮現：\n\n```\nCannot find name 'HTMLElement'.\n```\n\n| 型別性質 | 放置位置 | 例 |\n| :--- | :--- | :--- |\n| 跨環境資料契約：純資料，client 與 server 皆可用 | shared 型別目錄 | `CamelotCascadeMenuItem`、`CamelotTreeNode` |\n| 只在瀏覽器端成立：含 DOM 型別、provide 與 inject 上下文、元件實例 | app 型別目錄 | `CamelotCascadeMenuContext`、`CamelotCascadeMenuPanelParent` |\n\napp 型別目錄的型別同樣會被自動匯入：Nuxt 設定的 imports.dirs 已涵蓋整個 app 目錄，元件不需手動 import。\n\n來源：1. [shared/types/cascadeMenu.ts][]　2. [app/types/cascadeMenu.ts][]　3. [nuxt.config.ts][]\n\n> [!WARNING]\n> 本 repo 的 `pnpm typecheck` 擋不住這一條。本專案的 shared project 經相依套件的 dom reference 指令間接載入了 DOM lib，屬碰巧通過；消費端相依圖不同就會失敗。\n> 新增 shared 型別時請人工確認未引入 DOM 型別。\n\n## 品質門檻\n\n| 指令 | 涵蓋範圍 |\n| :--- | :--- |\n| `pnpm typecheck` | 對 playground 跑 nuxt typecheck，涵蓋 app、server、shared 全部 TS project |\n| `pnpm lint` | 對整個 repo 跑 eslint，含 playground |\n\n兩者可直接作為 CI 門檻。\n\n來源：1. [package.json][]\n\n## 相關頁面\n\n- [i18n 語系系統](../platform/i18n-locales.md)：i18n 註冊分工與已知缺陷\n- [c12 extends 說明](https://github.com/unjs/c12#extending-configuration)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| nuxt.config.ts | [nuxt.config.ts](../../../nuxt.config.ts) |\n| package.json | [package.json](../../../package.json) |\n| buildHook.ts | [modules/buildHook.ts](../../../modules/buildHook.ts) |\n| RichTextEditor.vue | [app/components/Camelot/RichTextEditor.vue](../../../app/components/Camelot/RichTextEditor.vue) |\n| DateV2.vue | [app/components/Camelot/DateV2.vue](../../../app/components/Camelot/DateV2.vue) |\n| useColorSchemeCssVars.ts | [app/composables/useColorSchemeCssVars.ts](../../../app/composables/useColorSchemeCssVars.ts) |\n| Breadcrumb.vue | [app/components/Camelot/Breadcrumb.vue](../../../app/components/Camelot/Breadcrumb.vue) |\n| usePiniaClear.ts | [app/composables/usePiniaClear.ts](../../../app/composables/usePiniaClear.ts) |\n| echartModule.ts | [modules/echartModule.ts](../../../modules/echartModule.ts) |\n| tappay.ts | [modules/tappay.ts](../../../modules/tappay.ts) |\n| shared/types/cascadeMenu.ts | [shared/types/cascadeMenu.ts](../../../shared/types/cascadeMenu.ts) |\n| app/types/cascadeMenu.ts | [app/types/cascadeMenu.ts](../../../app/types/cascadeMenu.ts) |\n\n[nuxt.config.ts]: #references\n[package.json]: #references\n[buildHook.ts]: #references\n[RichTextEditor.vue]: #references\n[DateV2.vue]: #references\n[useColorSchemeCssVars.ts]: #references\n[Breadcrumb.vue]: #references\n[usePiniaClear.ts]: #references\n[echartModule.ts]: #references\n[tappay.ts]: #references\n[shared/types/cascadeMenu.ts]: #references\n[app/types/cascadeMenu.ts]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"Layer 整合","summary":"Layer 整合規範說明消費端以 `extends: ['github:KNightING/camelot-nuxt-layer']` 引入本 Layer 時的必裝依賴清單、整合失敗模式、Layer 端的型別放置規則與品質門檻。c12 與 giget 只把原始碼抓進消費端的 `.c12/` 目錄，不在該目錄安裝 Layer 的依賴；Layer 的 import 沿 `node_modules` 向上解析到消費端，所以被直接 import 的套件都必須由消費端自行宣告。另一類只在消費端浮現的失敗，是 Layer 的 `shared/` 誤用 DOM 型別。"},"dev/testing.md":{"md":"# 單元測試\n\n## Summary\n\n本 Layer 以 Vitest 為 composables 寫單元測試，不啟動 Nuxt：設定檔 `vitest.config.ts` 用 unimport 重建 Nuxt 的自動匯入（vue、@vueuse/core 與 `app/composables`），Nuxt 執行期 API（useState、useAsyncData）改由 `tests/nuxt-stubs.ts` 的替身提供，測試環境為 happy-dom。測試檔放在 `tests/composables/*.test.ts`，以 `pnpm test` 執行一次；`pnpm typecheck` 會一併檢查測試檔的型別。\n\n## 運作方式\n\n### 執行測試\n\n```bash\npnpm test\n```\n\n指令執行 Vitest 的單次模式，跑完所有測試即結束，不進入監看模式。\n\n來源：1. [package.json][]\n\n### 自動匯入\n\n測試檔與被測的 composables 都直接呼叫 `ref`、`computed`、`useThrottleFn` 等函式而不寫 import，和在 Nuxt 裡一樣。\n\n1. vue 的 API 全部自動匯入。\n2. @vueuse/core 的 API 自動匯入，但 `toRef`、`toRefs`、`toValue` 排除，與 Nuxt 相同改用 vue 的版本。\n3. Layer 自己的 composables 依名稱自動匯入。\n4. `useState`、`useAsyncData` 指到測試替身。\n\n來源：1. [vitest.config.ts][]\n\n### Nuxt 替身\n\n| 替身 | 行為 |\n|---|---|\n| `useState` | 同一個 key 共用同一個 ref，第一次取用時以初始函式建立 |\n| `resetStates` | 清空所有狀態，供測試之間隔離 |\n| `useAsyncData` | 立即執行 handler，回傳可 await 的物件，帶 `data` 與 `error` |\n\n替身只模擬測試需要的部分，沒有 Nuxt 的 pending、refresh 與快取行為。\n\n來源：1. [nuxt-stubs.ts][]\n\n### 測試檔位置\n\n1. 每個 composable 一個測試檔，放在測試資料夾的 composables 子目錄，檔名為 composable 名稱加上 test 後綴。\n2. 測試檔以 Vitest 的 `describe`、`it`、`expect` 撰寫，需要時自行從 vitest 匯入。\n3. 測試環境是 happy-dom，可使用 document、window 等瀏覽器 API。\n\n來源：1. [vitest.config.ts][]　2. [useDrawerCollapsed.test.ts][]\n\n### 模擬伺服器端\n\nhappy-dom 預設提供 window；要驗證 composable 在伺服器端呼叫不會出錯，參考無限捲動的測試做法：\n\n1. 以 `createSSRApp` 建立一個在 setup 中呼叫 composable 的元件。\n2. 暫時刪除全域的 window，模擬伺服器端沒有 window 的情況。\n3. 以 vue 伺服器渲染的 `renderToString` 渲染，預期不拋錯並輸出正確的 HTML。\n4. 在 finally 中把 window 還原，避免影響其他測試。\n\n刪除 window 在型別上不被允許，測試以型別忽略註解標明這是刻意的。\n\n來源：1. [useInfinitePage.test.ts][]\n\n### 型別檢查\n\n```bash\npnpm typecheck\n```\n\nNuxt 產生的 tsconfig 涵蓋整個 Layer 目錄，測試檔也在檢查範圍內，因此測試裡的自動匯入也要能通過型別檢查。\n\n來源：1. [package.json][]\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231702-fix-wiki-review-code-defects](../../archive/2609231702-fix-wiki-review-code-defects.md) | 修正程式碼缺陷後更新為修正後的行為 | [#47](https://github.com/KNightING/camelot-nuxt-layer/issues/47) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| package.json | [package.json](../../../package.json) |\n| vitest.config.ts | [vitest.config.ts](../../../vitest.config.ts) |\n| nuxt-stubs.ts | [tests/nuxt-stubs.ts](../../../tests/nuxt-stubs.ts) |\n| useDrawerCollapsed.test.ts | [tests/composables/useDrawerCollapsed.test.ts](../../../tests/composables/useDrawerCollapsed.test.ts) |\n| useInfinitePage.test.ts | [tests/composables/useInfinitePage.test.ts](../../../tests/composables/useInfinitePage.test.ts) |\n\n[package.json]: #references\n[vitest.config.ts]: #references\n[nuxt-stubs.ts]: #references\n[useDrawerCollapsed.test.ts]: #references\n[useInfinitePage.test.ts]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"單元測試","summary":"本 Layer 以 Vitest 為 composables 寫單元測試，不啟動 Nuxt：設定檔 `vitest.config.ts` 用 unimport 重建 Nuxt 的自動匯入（vue、@vueuse/core 與 `app/composables`），Nuxt 執行期 API（useState、useAsyncData）改由 `tests/nuxt-stubs.ts` 的替身提供，測試環境為 happy-dom。測試檔放在 `tests/composables/*.test.ts`，以 `pnpm test` 執行一次；`pnpm typecheck` 會一併檢查測試檔的型別。"},"features/calendar.md":{"md":"# 🗓️ 日期選擇器\n\n## Summary\n\n日期選擇器家族由 `CamelotDateV2`（單日）、`CamelotDateRangeV2`（範圍）與共用的日曆核心 `CamelotInternalCalendar` 組成，日期運算用 date-fns，非中文語系的週名、月名與年標題用 `Intl.DateTimeFormat` 產生。支援節日標記（`getDayAttributes`）、緊湊模式（`showDayLabel`）、週起始日、自訂 formatter 與年／月快速切換；RTL 版面未支援，佈局固定 LTR。\n\n## 運作方式\n\n### 架構\n\n這張圖回答：日期選擇器由哪幾層組成？\n\n```json diagram id=圖1\n{\n  \"type\": \"flow\",\n  \"dir\": \"TD\",\n  \"title\": \"日期選擇器架構\",\n  \"desc\": \"DateV2 與 DateRangeV2 都內嵌共用日曆核心，核心再依賴 date-fns 與 Intl\",\n  \"nodes\": [\n    {\"id\": \"User\", \"text\": \"消費端頁面\", \"shape\": \"stadium\"},\n    {\"id\": \"DateV2\", \"text\": \"DateV2\\n單日選擇\"},\n    {\"id\": \"DateRangeV2\", \"text\": \"DateRangeV2\\n範圍選擇\"},\n    {\"id\": \"Calendar\", \"text\": \"日曆核心\", \"key\": true},\n    {\"id\": \"DateFns\", \"text\": \"date-fns\\n日期運算\", \"kind\": \"ext\"},\n    {\"id\": \"Intl\", \"text\": \"Intl\\n語系名稱\", \"kind\": \"ext\"}\n  ],\n  \"edges\": [\n    {\"from\": \"User\", \"to\": \"DateV2\", \"label\": \"v-model\"},\n    {\"from\": \"User\", \"to\": \"DateRangeV2\", \"label\": \"v-model\"},\n    {\"from\": \"DateV2\", \"to\": \"Calendar\", \"label\": \"一個月曆\"},\n    {\"from\": \"DateRangeV2\", \"to\": \"Calendar\", \"label\": \"一或兩個月曆\"},\n    {\"from\": \"Calendar\", \"to\": \"DateFns\"},\n    {\"from\": \"Calendar\", \"to\": \"Intl\"}\n  ]\n}\n```\n\n![日期選擇器架構](calendar.圖1.svg)\n\n1. DateV2 與 DateRangeV2 負責觸發輸入框、浮層、時間列與「確認」鈕；日曆核心只負責月曆格與年／月選擇。\n2. 兩個外層元件把語系、週起始日、formatter、節日回呼與 `showDayLabel` 原樣轉發給日曆核心，並轉發所有 slot。\n3. 日曆核心內建的時間區一律以 `hideTime` 關閉，時間列改由外層放在月曆下方，與「確認」鈕同一區塊。\n4. DateRangeV2 在 `multiCalendars` 開啟且非手機寬度時並排兩個月曆：左月曆隱藏下個月箭頭與下個月日期格，右月曆隱藏上個月的。\n\n來源：1. [Calendar.vue][]　2. [DateV2.vue][]　3. [DateRangeV2.vue][]\n\n### 單日選擇\n\n這張圖回答：使用者點一個日期後，值怎麼回到頁面？\n\n```json diagram id=圖3\n{\n  \"type\": \"sequence\",\n  \"title\": \"單日選擇\",\n  \"desc\": \"點日期格後日曆核心更新 modelValue，DateV2 寫回 v-model；未啟用時間時自動關閉浮層\",\n  \"actors\": [\"User\", \"DateV2\", \"Calendar\"],\n  \"steps\": [\n    {\"from\": \"User\", \"to\": \"DateV2\", \"text\": \"點擊輸入框\"},\n    {\"from\": \"DateV2\", \"to\": \"Calendar\", \"text\": \"開啟浮層並顯示月曆\"},\n    {\"from\": \"User\", \"to\": \"Calendar\", \"text\": \"點擊日期格\"},\n    {\"from\": \"Calendar\", \"to\": \"Calendar\", \"text\": \"套用時間並選定日期\"},\n    {\"from\": \"Calendar\", \"to\": \"DateV2\", \"text\": \"更新 modelValue\", \"reply\": true},\n    {\"from\": \"DateV2\", \"to\": \"User\", \"text\": \"寫回 v-model，無時間則關閉\", \"reply\": true}\n  ]\n}\n```\n\n![單日選擇](calendar.圖3.svg)\n\n1. 點到相鄰月份的日期時，月曆會切到該日期所在的月份。\n2. 停用的日期格（`disabled`、早於 `minDate`、晚於 `maxDate`）不可點。\n3. 啟用時間時選日期不會關閉浮層；時間列改值即時寫回，「確認」鈕只負責關閉。\n\n來源：1. [Calendar.vue][]　2. [DateV2.vue][]\n\n### 範圍選擇\n\n這張圖回答：兩次點擊怎麼組成起訖日期？\n\n```json diagram id=圖4\n{\n  \"type\": \"sequence\",\n  \"title\": \"範圍選擇\",\n  \"desc\": \"第一次點擊設定起日，第二次點擊依先後排成起訖；兩端都有值時 DateRangeV2 寫回 v-model\",\n  \"actors\": [\"User\", \"DateRangeV2\", \"Calendar\"],\n  \"steps\": [\n    {\"from\": \"User\", \"to\": \"Calendar\", \"text\": \"點擊第一個日期\"},\n    {\"from\": \"Calendar\", \"to\": \"Calendar\", \"text\": \"rangeValue 設為起日、迄日清空\"},\n    {\"from\": \"User\", \"to\": \"Calendar\", \"text\": \"點擊第二個日期\"},\n    {\"from\": \"Calendar\", \"to\": \"Calendar\", \"text\": \"較早者為起日、較晚者為迄日\"},\n    {\"from\": \"Calendar\", \"to\": \"DateRangeV2\", \"text\": \"更新 rangeValue\", \"reply\": true},\n    {\"from\": \"DateRangeV2\", \"to\": \"User\", \"text\": \"寫回 v-model\", \"reply\": true}\n  ]\n}\n```\n\n![範圍選擇](calendar.圖4.svg)\n\n1. 已有完整起訖時再點一次，會重新開始：新日期成為起日、迄日清空。\n2. 並排的兩個月曆共用同一組 `rangeValue`，點哪一個月曆都可以。\n3. 起訖兩端都有值才寫回 v-model；`autoApply` 開啟且未啟用時間時自動關閉浮層。\n\n來源：1. [Calendar.vue][]　2. [DateRangeV2.vue][]\n\n### 年月切換\n\n這張圖回答：月曆、年份、月份三種檢視怎麼切換？\n\n```json diagram id=圖2\n{\n  \"type\": \"state\",\n  \"title\": \"年月切換\",\n  \"desc\": \"標題列的年份與月份按鈕切換檢視；選完年份會接著進入月份選擇\",\n  \"entity\": \"pickerMode\",\n  \"states\": [\n    {\"id\": \"calendar\", \"label\": \"月曆\", \"type\": \"start\"},\n    {\"id\": \"year\", \"label\": \"年份選擇\", \"type\": \"active\"},\n    {\"id\": \"month\", \"label\": \"月份選擇\", \"type\": \"active\"}\n  ],\n  \"transitions\": [\n    {\"from\": \"calendar\", \"to\": \"year\", \"label\": \"點年份按鈕\"},\n    {\"from\": \"calendar\", \"to\": \"month\", \"label\": \"點月份按鈕\"},\n    {\"from\": \"year\", \"to\": \"month\", \"label\": \"選擇年份\"},\n    {\"from\": \"month\", \"to\": \"calendar\", \"label\": \"選擇月份\"},\n    {\"from\": \"year\", \"to\": \"calendar\", \"label\": \"再點年份按鈕\", \"retry\": true}\n  ]\n}\n```\n\n![年月切換](calendar.圖2.svg)\n\n1. 年份頁一次列 12 年，預設從今年往前 5 年起算，左右箭頭一次翻 12 年。\n2. 年份頁與月份頁不顯示月曆的左右月份箭頭。\n3. `pickerMode` 是 v-model，DateRangeV2 用它讓兩個月曆其中一個進入年／月選擇時，另一個月曆隱藏。\n\n來源：1. [Calendar.vue][]　2. [DateRangeV2.vue][]\n\n## 日曆核心 Props\n\n| Prop | 型別 | 預設值 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `isRange` | `boolean` | `false` | 範圍選擇模式 |\n| `minDate` | `Date \\| number` | — | 可選最早日期 |\n| `maxDate` | `Date \\| number` | — | 可選最晚日期 |\n| `hidePrevMonth` | `boolean` | `false` | 隱藏上個月的日期格 |\n| `hideNextMonth` | `boolean` | `false` | 隱藏下個月的日期格 |\n| `enableTime` | `boolean` | `false` | 顯示時間區 |\n| `timePrecision` | `'hour' \\| 'minute' \\| 'second'` | `'second'` | 時間精細度 |\n| `hourFormat` | `'12' \\| '24'` | `'24'` | 12 或 24 小時制 |\n| `hideTime` | `boolean` | — | 隱藏內建時間區，由外層自行放時間列 |\n| `pickerExpand` | `boolean` | — | 年／月選擇時撐滿容器寬度，供雙月曆使用 |\n| `hidePrevArrow` | `boolean` | `false` | 隱藏上個月箭頭 |\n| `hideNextArrow` | `boolean` | `false` | 隱藏下個月箭頭 |\n| `getDayAttributes` | `(date, dayOfWeek) => CalendarDayAttributes \\| null \\| undefined` | — | 每日屬性回呼，見節日標記 |\n| `showDayLabel` | `boolean` | `true` | 顯示日期下方 label；關閉時格高緊湊 |\n| `locale` | `string` | — | BCP47 語系；未給或中文語系用預設中文格式 |\n| `weekStartsOn` | `0 \\| 1` | `0` | 每週起始：0 週日、1 週一 |\n| `weekdayFormatter` | `(date, index) => string` | — | 自訂週名，優先序最高 |\n| `monthFormatter` | `(monthIndex) => string` | — | 自訂月名，用於月份格與月標題 |\n| `yearFormatter` | `(year) => string` | — | 自訂年標題 |\n\n來源：1. [Calendar.vue][]\n\n## v-model\n\n| Model | 型別 | 說明 |\n| :--- | :--- | :--- |\n| `modelValue` | `Date \\| number \\| null` | 單選日期 |\n| `rangeValue` | `(Date \\| number \\| null)[] \\| null` | 範圍值，依序為起日、迄日 |\n| `viewDate` | `Date`（必填） | 目前顯示的月份 |\n| `pickerMode` | `'calendar' \\| 'month' \\| 'year'` | 目前檢視，預設 `'calendar'` |\n\n來源：1. [Calendar.vue][]\n\n## Slots\n\n| Slot | Scope | 用途 |\n| :--- | :--- | :--- |\n| `year-label` | `viewDate`、`year` | 標題列年份按鈕文字 |\n| `month-label` | `viewDate`、`month` | 標題列月份按鈕文字 |\n| `weekday` | `day`、`index` | 週名表頭 |\n| `day` | `date`、`day`、`isSelected`、`isToday` | 日期數字 |\n| `month-name` | `month`、`index` | 月份選擇格文字 |\n\nDateV2 與 DateRangeV2 會把自己收到的 slot 全部轉給日曆核心，所以在外層元件上直接寫這些 slot 即可。\n\n來源：1. [Calendar.vue][]　2. [DateV2.vue][]\n\n## 規則\n\n### 日期格顏色\n\n| 條件 | 樣式 |\n| :--- | :--- |\n| 週六、週日或 `isHoliday` | 錯誤色字（紅） |\n| 已選取，或區間的起日與迄日 | 依主題的選中表面樣式 |\n| 今日 | 目前色彩角色的字色、粗體，左上角小點 |\n| 區間中段 | 目前色彩角色 10% 的淡底 |\n| 其他當月日期 | 一般表面字色 |\n| 相鄰月份日期 | 外框色、半透明 |\n\n1. 選取中的格子一律用選中表面樣式；其餘格子由上往下判斷，週末與假日的紅字優先於今日字色。\n2. 選中表面樣式來自各主題的 picker 樣式，日期、月份與年份格共用。\n3. 元件的色彩角色由外層元件的 `color` 決定。\n\n來源：1. [Calendar.vue][]　2. [useCamelotPickerTheme.ts][]\n\n### 節日標記\n\n`getDayAttributes` 對每個日期格呼叫一次，回傳的屬性決定這一格的外觀；`isHoliday` 與 `label` 互相獨立。\n\n| 回傳 | 效果 |\n| :--- | :--- |\n| `{ isHoliday: true }` | 只標紅字，不顯示名稱 |\n| `{ label: '國慶' }` | 只顯示節日名，不變紅，代表有節日但不放假 |\n| `{ isHoliday: true, label: '春節' }` | 紅字加名稱 |\n| `{ disabled: true }` | 該日不可選 |\n| `{ dot: true, dotColor }` | 左上角小點，可自訂顏色 |\n| `{ labelClass, class }` | label 與日期格的額外 class |\n\n來源：1. [Calendar.vue][]\n\n### 緊湊模式與 label 截斷\n\n1. `showDayLabel` 為 `false` 時不渲染 label，日期格最小高度從 42px 降為 36px。\n2. label 固定單行，超出格寬以省略號截斷。\n3. 被截斷的 label 在 hover 或觸控長壓時以 Tooltip 顯示完整文字；沒被截斷的不出現 Tooltip。\n4. Tooltip 會 teleport 進 picker 的 dialog，dialog 模式下也看得到。\n\n來源：1. [Calendar.vue][]\n\n### 語系與週起始\n\n| 規則 | 說明 |\n| :--- | :--- |\n| 優先序 | 自訂 formatter 優先，其次非中文語系的 Intl，最後是預設中文 |\n| 未給 `locale` | 用預設中文：週名「日一二」、月名「一月」、標題「2026年」「09月」 |\n| 中文語系 | 繁、簡中文都用預設中文格式，避免 Intl 的中文週名帶「週」或「周」 |\n| 非中文語系 | 週名用短格式、月名用完整月名，年標題用數字年 |\n| `weekStartsOn` | 同時決定月曆起始欄與週名順序 |\n| 佛曆 | 泰文語系由 Intl 顯示佛曆年 |\n| RTL | 未支援，佈局固定 LTR |\n\n來源：1. [Calendar.vue][]\n\n## 相關頁面\n\n- [DateV2](./components/DateV2.md)\n- [DateRangeV2](./components/DateRangeV2.md)\n- [Internal/Calendar](./components/Internal-Calendar.md)\n- [TimeV2 時間選擇器](./time-picker.md)\n- [Tooltip](./components/Tooltip.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Calendar.vue | [app/components/Camelot/Internal/Calendar.vue](../../../app/components/Camelot/Internal/Calendar.vue) |\n| DateV2.vue | [app/components/Camelot/DateV2.vue](../../../app/components/Camelot/DateV2.vue) |\n| DateRangeV2.vue | [app/components/Camelot/DateRangeV2.vue](../../../app/components/Camelot/DateRangeV2.vue) |\n| useCamelotPickerTheme.ts | [app/composables/useCamelotPickerTheme.ts](../../../app/composables/useCamelotPickerTheme.ts) |\n\n[Calendar.vue]: #references\n[DateV2.vue]: #references\n[DateRangeV2.vue]: #references\n[useCamelotPickerTheme.ts]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"🗓️ 日期選擇器","summary":"日期選擇器家族由 `CamelotDateV2`（單日）、`CamelotDateRangeV2`（範圍）與共用的日曆核心 `CamelotInternalCalendar` 組成，日期運算用 date-fns，非中文語系的週名、月名與年標題用 `Intl.DateTimeFormat` 產生。支援節日標記（`getDayAttributes`）、緊湊模式（`showDayLabel`）、週起始日、自訂 formatter 與年／月快速切換；RTL 版面未支援，佈局固定 LTR。"},"features/components.md":{"md":"# 🧩 元件清單\n\n## Summary\n\nCamelot Nuxt Layer 全部元件的分類索引，依表單、版面資料導覽、覆蓋層、回饋進度、媒體檔案、標籤、效果工具、主題 Provider、內部元件與主題實作變體分組，每個元件連到自己的 API 頁（Props、Emits、v-model、Slots、Exposed）。元件以 `Camelot<Name>` 名稱由 Nuxt 自動匯入，不需手動 import；主題變體與內部元件是實作細節，通常由公開元件依目前主題自動選用。\n\n## 運作方式\n\n1. 元件放在 Camelot 目錄下，Nuxt 依路徑加上 `Camelot` 前綴自動匯入，例如按鈕是 `CamelotButton`。\n2. 子目錄會併入名稱：內部元件以 CamelotInternal 開頭，主題變體以 CamelotAqua、CamelotMaterial 等開頭。\n3. 公開元件依目前主題選用對應的主題變體，使用端只需要寫公開元件。\n\n來源：1. [components/Camelot][]\n\n## 元件清單\n\n### 表單\n\n| 元件 | 說明 | API |\n| :--- | :--- | :--- |\n| `Button` | 按鈕（四風格、color 角色、is-container） | [詳情](./components/Button.md) |\n| `Input` | 輸入框 | [詳情](./components/Input.md) |\n| `Textarea` | 多行輸入（autosize、字數） | [詳情](./components/Textarea.md) |\n| `Checkbox` | 勾選框（indeterminate） | [詳情](./components/Checkbox.md) |\n| `CheckboxGroup` | 勾選群組 | [詳情](./components/CheckboxGroup.md) |\n| `Radio` | 單選 | [詳情](./components/Radio.md) |\n| `RadioGroup` | 單選群組 | [詳情](./components/RadioGroup.md) |\n| `Switch` | 開關 | [詳情](./components/Switch.md) |\n| `SelectV2` | 下拉選擇（可搜尋、虛擬滾動） | [詳情](./components/SelectV2.md) |\n| `NumberCounter` | 數字加減 | [詳情](./components/NumberCounter.md) |\n| `Slider` | 滑桿（單值/區間） | [詳情](./components/Slider.md) |\n| `FieldLabel` | 表單共通標籤 | [詳情](./components/FieldLabel.md) |\n| `IdxForm` | 表單容器 | [詳情](./components/IdxForm.md) |\n| `DateV2` | 單日期選擇器 | [詳情](./components/DateV2.md) |\n| `DateRangeV2` | 日期範圍選擇器 | [詳情](./components/DateRangeV2.md) |\n| `TimeV2` | 純時間選擇器 | [詳情](./components/TimeV2.md) |\n\n### 版面、資料、導覽\n\n| 元件 | 說明 | API |\n| :--- | :--- | :--- |\n| `Container` | 通用容器 | [詳情](./components/Container.md) |\n| `Table` | 資料表格（fixed header/columns、泛型、雙軸自訂捲軸） | [詳情](./components/Table.md) |\n| `Tree` | 多階層樹 | [詳情](./components/Tree.md) |\n| `Menu` | 多階層導覽選單 | [詳情](./components/Menu.md) |\n| `CascadeMenu` | 側邊飛出多階層彈出選單 | [詳情](./components/CascadeMenu.md) |\n| `Breadcrumb` | 麵包屑 | [詳情](./components/Breadcrumb.md) |\n| `Pagination` | 分頁 | [詳情](./components/Pagination.md) |\n| `Steps` | 步驟指示器 | [詳情](./components/Steps.md) |\n| `Tabs` | 頁籤（滑動指示器） | [詳情](./components/Tabs.md) |\n| `RippleTabs` | 漣漪頁籤 | [詳情](./components/RippleTabs.md) |\n| `Timeline` | 時間軸 | [詳情](./components/Timeline.md) |\n| `VirtualScroll` | 虛擬滾動 | [詳情](./components/VirtualScroll.md) |\n| `Expanded` | 展開/收合區塊 | [詳情](./components/Expanded.md) |\n| `Drawer` | 側邊抽屜 | [詳情](./components/Drawer.md) |\n\n### 覆蓋層、捲軸\n\n| 元件 | 說明 | API |\n| :--- | :--- | :--- |\n| `BaseDialogV2` | 對話框（mask 點空白關閉） | [詳情](./components/BaseDialogV2.md) |\n| `ConfirmDialog` | 確認對話框（最多三顆按鈕，預設一顆確認） | [詳情](./components/ConfirmDialog.md) |\n| `ErrorDialog` | 全域錯誤對話框（綁定 `useCamelotError` 佇列，逐一顯示） | [詳情](./components/ErrorDialog.md) |\n| `BaseBottomSheetV2` | 底部彈出面板（把手拖曳關閉） | [詳情](./components/BaseBottomSheetV2.md) |\n| `PopupV2` | 彈出層 | [詳情](./components/PopupV2.md) |\n| `Tooltip` | 提示浮層（hover／觸控長壓／Tab focus，自行找空間） | [詳情](./components/Tooltip.md) |\n| `Toast` | 吐司通知（玻璃淡入、8 方位） | [詳情](./components/Toast.md) |\n| `OverlayScrollbar` | 附著容器的自訂 overlay 捲軸（H/V） | [詳情](./components/OverlayScrollbar.md) |\n| `Scrollbar` | 包裝式自訂捲軸 | [詳情](./components/Scrollbar.md) |\n\n### 回饋、進度\n\n| 元件 | 說明 | API |\n| :--- | :--- | :--- |\n| `Loading` | 載入動畫 | [詳情](./components/Loading.md) |\n| `Skeleton` | 骨架屏 | [詳情](./components/Skeleton.md) |\n| `ProgressBar` | 進度條 | [詳情](./components/ProgressBar.md) |\n| `ProgressCircle` | 環形進度 | [詳情](./components/ProgressCircle.md) |\n| `ProgressStage` | 階段進度 | [詳情](./components/ProgressStage.md) |\n\n### 媒體、檔案\n\n| 元件 | 說明 | API |\n| :--- | :--- | :--- |\n| `ImageV2` | 圖片（懶載入/動畫） | [詳情](./components/ImageV2.md) |\n| `RevealImage` | 圖片揭示動畫 | [詳情](./components/RevealImage.md) |\n| `RevealText` | 文字揭示動畫 | [詳情](./components/RevealText.md) |\n| `DropImage` | 拖曳上傳圖片 | [詳情](./components/DropImage.md) |\n| `ImageDropzone` | 圖片拖曳/選擇區 | [詳情](./components/ImageDropzone.md) |\n| `FileDropzone` | 檔案拖曳/選擇 | [詳情](./components/FileDropzone.md) |\n| `FileChip` | 附件晶片 | [詳情](./components/FileChip.md) |\n| `Carousel` | 輪播 | [詳情](./components/Carousel.md) |\n| `CarouselIndicator` | 輪播指示器 | [詳情](./components/CarouselIndicator.md) |\n| `RichTextEditor` | TipTap 富文本編輯器 | [詳情](./components/RichTextEditor.md) |\n\n### 標籤\n\n| 元件 | 說明 | API |\n| :--- | :--- | :--- |\n| `Tag` | 標籤 | [詳情](./components/Tag.md) |\n| `TagGroup` | 標籤群組 | [詳情](./components/TagGroup.md) |\n\n### 效果、工具\n\n| 元件 | 說明 | API |\n| :--- | :--- | :--- |\n| `RippleEffect` | 漣漪點擊效果 | [詳情](./components/RippleEffect.md) |\n| `SlideTransitionGroup` | 滑動過場群組 | [詳情](./components/SlideTransitionGroup.md) |\n| `Marquee` | 跑馬燈（無縫循環、四方向、hover／外部暫停） | [詳情](./components/Marquee.md) |\n| `Gpu` | GPU 加速動畫容器 | [詳情](./components/Gpu.md) |\n| `Breakpoints` | 斷點顯示（開發用） | [詳情](./components/Breakpoints.md) |\n\n### 主題 Provider\n\n| 元件 | 說明 | API |\n| :--- | :--- | :--- |\n| `ColorSchemeProvider` | 主題色彩 Provider | [詳情](./components/ColorSchemeProvider.md) |\n| `CustomColorSchemeProvider` | 自訂色彩方案 Provider | [詳情](./components/CustomColorSchemeProvider.md) |\n| `Material3Provider` | Material Design 3 Provider | [詳情](./components/Material3Provider.md) |\n\n### 內部元件\n\n| 元件 | 說明 | API |\n| :--- | :--- | :--- |\n| Internal/Calendar | 日曆核心（DateV2/DateRangeV2 共用） | [詳情](./components/Internal-Calendar.md) |\n| Internal/CascadeMenuPanel | CascadeMenu 遞迴飛出面板 | [詳情](./components/Internal-CascadeMenuPanel.md) |\n| Internal/FieldFrame | 表單欄位外框：Scifi 主題套 HUD 外框，其他主題直接渲染內容 | [詳情](./components/Internal-FieldFrame.md) |\n| Internal/MenuItem | Menu 遞迴項目 | [詳情](./components/Internal-MenuItem.md) |\n| Internal/PasswordToggle | Input 密碼顯示切換鈕 | [詳情](./components/Internal-PasswordToggle.md) |\n| Internal/SheetHandle | BottomSheet 拖曳把手 | [詳情](./components/Internal-SheetHandle.md) |\n| Internal/TimeField | 時/分/秒欄位 | [詳情](./components/Internal-TimeField.md) |\n| Internal/TimeRow | 時間列 | [詳情](./components/Internal-TimeRow.md) |\n| Internal/TreeNode | Tree 遞迴節點 | [詳情](./components/Internal-TreeNode.md) |\n| Internal/editor/ResizableImageView | RichTextEditor 可縮放圖片 node view | [詳情](./components/Internal-editor-ResizableImageView.md) |\n\n### 主題實作變體\n\n| 主題 | 元件 |\n| :--- | :--- |\n| **Aqua** | [Button](./components/Aqua-Button.md)・[Input](./components/Aqua-Input.md)・[Switch](./components/Aqua-Switch.md)・[Checkbox](./components/Aqua-Checkbox.md)・[Radio](./components/Aqua-Radio.md) |\n| **Material** | [Button](./components/Material-Button.md)・[Input](./components/Material-Input.md)・[Switch](./components/Material-Switch.md)・[Checkbox](./components/Material-Checkbox.md)・[Radio](./components/Material-Radio.md) |\n| **Cupertino** | [Button](./components/Cupertino-Button.md)・[Input](./components/Cupertino-Input.md)・[Switch](./components/Cupertino-Switch.md)・[Checkbox](./components/Cupertino-Checkbox.md)・[Radio](./components/Cupertino-Radio.md) |\n| **Scifi** | [Button](./components/Scifi-Button.md)・[Input](./components/Scifi-Input.md)・[Switch](./components/Scifi-Switch.md)・[Checkbox](./components/Scifi-Checkbox.md)・[Radio](./components/Scifi-Radio.md)・[Frame](./components/Scifi-Frame.md)・[Reticle](./components/Scifi-Reticle.md) |\n\n## 相關頁面\n\n- [Composable 清單](./composables.md)\n- [主題系統](../platform/theme-system.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| components/Camelot | [app/components/Camelot](../../../app/components/Camelot) |\n\n[components/Camelot]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"🧩 元件清單","summary":"Camelot Nuxt Layer 全部元件的分類索引，依表單、版面資料導覽、覆蓋層、回饋進度、媒體檔案、標籤、效果工具、主題 Provider、內部元件與主題實作變體分組，每個元件連到自己的 API 頁（Props、Emits、v-model、Slots、Exposed）。元件以 `Camelot<Name>` 名稱由 Nuxt 自動匯入，不需手動 import；主題變體與內部元件是實作細節，通常由公開元件依目前主題自動選用。"},"features/composables.md":{"md":"# 🪝 Composable 清單\n\n## Summary\n\nCamelot Nuxt Layer 全部 composable 的分類索引，依主題色彩、元件相關、API 串流、表單驗證、儲存 Proxy、路由連結、DOM 滾動裝置、檔案媒體與工具分組，每個 composable 連到自己的 API 頁（簽章、參數、回傳、用法）。全部由 Nuxt 自動匯入，直接呼叫即可，不需手動 import。\n\n## 運作方式\n\n1. composables 目錄下每個檔案至少匯出一個與檔名同名的函式，由 Nuxt 自動匯入，元件與頁面可直接呼叫。\n2. 名稱以 `useCamelot` 開頭的是與本 layer 元件或主題綁定的 composable，其餘是通用工具。\n\n來源：1. [app/composables][]\n\n## Composable 清單\n\n### 主題、色彩\n\n| Composable | 說明 | 詳情 |\n| :--- | :--- | :--- |\n| `useCamelotTheme` | 主題切換狀態（themeMode / colorMode / 色彩方案） | [詳情](./composables/useCamelotTheme.md) |\n| `useCamelotColorMode` | 全站共用的深淺色模式單一實例（勿直接用 `useColorMode`） | [詳情](./composables/useCamelotColorMode.md) |\n| `useCamelotRoleColorClass` | 色彩角色 → 注入 `--cml-color-current-*` 的 class | [詳情](./composables/useCamelotRoleColorClass.md) |\n| `useCamelotPickerTheme` | DatePicker 各風格 class | [詳情](./composables/useCamelotPickerTheme.md) |\n| `useCamelotMenuItemTheme` | 選單/選項列各風格 active/hover | [詳情](./composables/useCamelotMenuItemTheme.md) |\n| `useMaterial3ColorScheme` | Material 3 色彩方案生成 | [詳情](./composables/useMaterial3ColorScheme.md) |\n| `useCustomColorScheme` | 自訂色彩方案管理 | [詳情](./composables/useCustomColorScheme.md) |\n| `useColorSchemeCssVars` | 色彩方案 CSS 變數單向寫入器 | [詳情](./composables/useColorSchemeCssVars.md) |\n| `useColor` | 顏色處理工具 | [詳情](./composables/useColor.md) |\n\n### 元件相關\n\n| Composable | 說明 | 詳情 |\n| :--- | :--- | :--- |\n| `useCamelotToast` | Toast 通知系統 | [詳情](./composables/useCamelotToast.md) |\n| `useCamelotError` | 全域錯誤佇列（轉換器 / 攔截器） | [詳情](./composables/useCamelotError.md) |\n| `useCamelotVirtual` | 虛擬滾動核心（可變列高） | [詳情](./composables/useCamelotVirtual.md) |\n| `useCamelotOverlayScrollbar` | 自訂 overlay 捲軸核心（方向感知） | [詳情](./composables/useCamelotOverlayScrollbar.md) |\n| `useCamelotTeleportTarget` | 浮層 Teleport 目標判定（最近 `<dialog>`，否則 `body`） | [詳情](./composables/useCamelotTeleportTarget.md) |\n| `useCamelotFileDrop` | 檔案拖曳 headless 核心 | [詳情](./composables/useCamelotFileDrop.md) |\n| `useCamelotRouter` | 擴展 Vue Router（歷史堆疊） | [詳情](./composables/useCamelotRouter.md) |\n| `useLocale` | 語系格式正規化（bcp47/cldr/l10n） | [詳情](./composables/useLocale.md) |\n| `useLoading` | 全域載入狀態 | [詳情](./composables/useLoading.md) |\n\n### API、串流\n\n| Composable | 說明 | 詳情 |\n| :--- | :--- | :--- |\n| `useBaseApi` | API 請求基礎封裝（含串流） | [詳情](./composables/useBaseApi.md) ・[使用指南](../platform/api-client.md) |\n| `useBaseUrl` | Base URL | [詳情](./composables/useBaseUrl.md) |\n| `useFetchStream` | Fetch 串流請求 | [詳情](./composables/useFetchStream.md) |\n| `useFetchJSONLinesStream` | JSON Lines 串流 | [詳情](./composables/useFetchJSONLinesStream.md) |\n\n### 表單、驗證\n\n| Composable | 說明 | 詳情 |\n| :--- | :--- | :--- |\n| `useInputValidationController` | 表單驗證控制器 | [詳情](./composables/useInputValidationController.md) |\n| `useValueValidation` | 值驗證工具 | [詳情](./composables/useValueValidation.md) |\n| `useIsValidKey` | 鍵值驗證 | [詳情](./composables/useIsValidKey.md) |\n\n### 儲存、Proxy\n\n| Composable | 說明 | 詳情 |\n| :--- | :--- | :--- |\n| `useStorageProxy` | 儲存 proxy 基底 | [詳情](./composables/useStorageProxy.md) |\n| `useLocalStorageProxy` | localStorage proxy | [詳情](./composables/useLocalStorageProxy.md) |\n| `useSessionStorageProxy` | sessionStorage proxy | [詳情](./composables/useSessionStorageProxy.md) |\n| `useCookieProxy` | cookie proxy | [詳情](./composables/useCookieProxy.md) |\n| `usePiniaClear` | 清空 Pinia | [詳情](./composables/usePiniaClear.md) |\n\n### 路由、連結\n\n| Composable | 說明 | 詳情 |\n| :--- | :--- | :--- |\n| `useCurrentRoute` | 當前路由 | [詳情](./composables/useCurrentRoute.md) |\n| `useRouteWrapper` | 路由包裝 | [詳情](./composables/useRouteWrapper.md) |\n| `useAnchorLink` | 錨點連結 | [詳情](./composables/useAnchorLink.md) |\n| `useAutoLink` | 自動連結 | [詳情](./composables/useAutoLink.md) |\n\n### DOM、滾動、裝置\n\n| Composable | 說明 | 詳情 |\n| :--- | :--- | :--- |\n| `useElCssVar` | 讀寫元素 CSS 變數 | [詳情](./composables/useElCssVar.md) |\n| `useScrollParent` | 找捲動祖先 | [詳情](./composables/useScrollParent.md) |\n| `useScrollOnBottom` | 捲到底偵測 | [詳情](./composables/useScrollOnBottom.md) |\n| `useInfinitePage` | 無限滾動分頁 | [詳情](./composables/useInfinitePage.md) |\n| `useDeviceBreakpoints` | 裝置斷點偵測 | [詳情](./composables/useDeviceBreakpoints.md) |\n| `useDrawerCollapsed` | Drawer 收合狀態（singleton） | [詳情](./composables/useDrawerCollapsed.md) |\n\n### 檔案、媒體\n\n| Composable | 說明 | 詳情 |\n| :--- | :--- | :--- |\n| `useBlobDownload` | Blob 下載 | [詳情](./composables/useBlobDownload.md) |\n| `useCanvasConvert` | Canvas 轉換 | [詳情](./composables/useCanvasConvert.md) |\n| `useFileKey` | 檔案唯一鍵 | [詳情](./composables/useFileKey.md) |\n| `useFileToDataURL` | 檔案轉 DataURL | [詳情](./composables/useFileToDataURL.md) |\n| `useLazyImage` | 圖片懶載入 | [詳情](./composables/useLazyImage.md) |\n| `useRandomCatImg` | 隨機貓圖 | [詳情](./composables/useRandomCatImg.md) |\n\n### 工具\n\n| Composable | 說明 | 詳情 |\n| :--- | :--- | :--- |\n| `useObject` | 物件操作工具集 | [詳情](./composables/useObject.md) |\n| `useFloat` | 浮點數處理 | [詳情](./composables/useFloat.md) |\n| `useNumberThousandsSeparators` | 千分位 | [詳情](./composables/useNumberThousandsSeparators.md) |\n| `useRandom` | 隨機 | [詳情](./composables/useRandom.md) |\n| `useDelay` | 延遲 | [詳情](./composables/useDelay.md) |\n| `useErrorRef` | 錯誤 ref 匯總（不含佇列/顯示，全域錯誤請見 `useCamelotError`） | [詳情](./composables/useErrorRef.md) |\n\n## 相關頁面\n\n- [元件清單](./components.md)\n- [API 呼叫](../platform/api-client.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| app/composables | [app/composables](../../../app/composables) |\n\n[app/composables]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"🪝 Composable 清單","summary":"Camelot Nuxt Layer 全部 composable 的分類索引，依主題色彩、元件相關、API 串流、表單驗證、儲存 Proxy、路由連結、DOM 滾動裝置、檔案媒體與工具分組，每個 composable 連到自己的 API 頁（簽章、參數、回傳、用法）。全部由 Nuxt 自動匯入，直接呼叫即可，不需手動 import。"},"features/file-drop.md":{"md":"# 📎 檔案拖曳\n\n## Summary\n\n檔案拖曳分三層：headless 核心 `useCamelotFileDrop`、全包元件 `CamelotImageDropzone`（圖片縮圖格）與 `CamelotFileDropzone`（附件晶片列），以及可獨立使用的附件晶片 `CamelotFileChip`。三層共用同一套檔案過濾、上限、縮圖 objectURL 與型別分類邏輯，依客製程度選用其中一層。\n\n## 運作方式\n\n### 三層架構\n\n這張圖回答：要客製到什麼程度，該選哪一層？\n\n```json diagram id=圖1\n{\n  \"type\": \"flow\",\n  \"dir\": \"TD\",\n  \"title\": \"檔案拖曳三層\",\n  \"desc\": \"headless 核心供兩個全包元件與自定義拖曳區使用；附件晶片可在全包與自定義兩處重用\",\n  \"nodes\": [\n    {\"id\": \"CORE\", \"text\": \"拖曳核心\\nheadless\", \"key\": true},\n    {\"id\": \"IDZ\", \"text\": \"ImageDropzone\\n圖片縮圖格\"},\n    {\"id\": \"FDZ\", \"text\": \"FileDropzone\\n附件晶片列\"},\n    {\"id\": \"CUSTOM\", \"text\": \"自定義元素\\n綁拖放事件\"},\n    {\"id\": \"CHIP\", \"text\": \"FileChip\\n附件晶片\"}\n  ],\n  \"edges\": [\n    {\"from\": \"CORE\", \"to\": \"IDZ\"},\n    {\"from\": \"CORE\", \"to\": \"FDZ\"},\n    {\"from\": \"CORE\", \"to\": \"CUSTOM\"},\n    {\"from\": \"FDZ\", \"to\": \"CHIP\", \"label\": \"預設晶片\"},\n    {\"from\": \"CUSTOM\", \"to\": \"CHIP\", \"label\": \"可重用\", \"kind\": \"async\"}\n  ]\n}\n```\n\n![檔案拖曳三層](file-drop.圖1.svg)\n\n| 需求 | 選用 |\n| :--- | :--- |\n| 上傳圖片，要縮圖預覽或多格排列 | ImageDropzone |\n| 上傳任意附件，以晶片列顯示 | FileDropzone |\n| 拖曳區外觀完全自訂 | `useCamelotFileDrop` 綁到任意元素 |\n| 只要顯示一個檔案 | FileChip |\n\n來源：1. [useCamelotFileDrop.ts][]　2. [ImageDropzone.vue][]　3. [FileDropzone.vue][]　4. [FileChip.vue][]\n\n### 核心 useCamelotFileDrop\n\n1. 呼叫時傳入檔案清單的 ref 作為單一真相來源，其餘選項都可以是 ref 或 getter。\n2. 拖曳區元素綁上 dragover、dragenter、dragleave、drop 四個事件（都加 `.prevent`），點擊時呼叫 `pick()`。\n3. `pick()` 動態建立隱藏的檔案 input 開啟選檔視窗；停用或已達上限時不開啟。\n4. 選入或拖入的檔案先依 `accept` 過濾，多選時累加到既有清單、單選時只取第一個，再依 `max` 截斷。\n5. `entries` 由檔案清單衍生，外部直接改清單也會同步；縮圖 objectURL 由核心建立並在清單變動或卸載時回收。\n\n| 選項 | 預設 | 說明 |\n| :--- | :--- | :--- |\n| `model` | 必填 | `Ref<File[] \\| null>` |\n| `accept` | 不限 | 同 input 的 accept，支援副檔名、MIME 與萬用 MIME |\n| `multiple` | `true` | 多選時新檔累加 |\n| `max` | `0` | 最多檔數，0 為不限 |\n| `disabled` | `false` | 停用 |\n| `thumbnails` | `true` | 為圖片檔產生縮圖 objectURL |\n| `onSelect` | — | 清單變動（選入或移除）時回呼 |\n\n| 回傳 | 說明 |\n| :--- | :--- |\n| `dragOver` | 是否有檔案拖在區域上 |\n| `count`、`atMax`、`maxCount` | 目前檔數、是否已達上限、上限（不限時為無限大） |\n| `entries` | 每個檔案的展示資料，見下表 |\n| `setFiles`、`removeAt` | 以程式加入檔案、移除第 i 個 |\n| `pick` | 開啟選檔視窗 |\n| `onDragOver`、`onDragLeave`、`onDrop` | 綁到拖曳區的事件處理 |\n\n| entry 欄位 | 說明 |\n| :--- | :--- |\n| `file` | 原始 File |\n| `url` | 圖片縮圖 objectURL；非圖片或關閉縮圖時為空字串 |\n| `kind` | 型別分類，見 FileChip 色塊表 |\n| `label` | 副檔名大寫；無副檔名時為 MIME 或「檔案」 |\n| `sizeText` | 人類可讀大小（B、KB、MB、GB） |\n| `colorClass` | 型別色塊 class |\n| `key` | 由檔名、大小、修改時間與索引組成 |\n\n同一個模組另匯出 `camelotFileMeta` 與 `camelotFormatFileSize`，可單獨取得檔案的型別分類與大小文字。\n\n來源：1. [useCamelotFileDrop.ts][]\n\n### FileChip\n\n| Prop | 預設 | 說明 |\n| :--- | :--- | :--- |\n| `file` | 必填 | 要顯示的 File |\n| `url` | `''` | 外部縮圖；未給且為圖片時自行產生並負責回收 |\n| `color` | `'primary'` | 色彩角色 |\n| `removable` | `false` | 顯示右上角移除鈕，點擊 emit `remove` |\n\n預設 slot 帶 `file`、`url`、`meta`，可整個換掉晶片內容。\n\n| kind | 副檔名或 MIME | 色塊 |\n| :--- | :--- | :--- |\n| image | png、jpg、jpeg、gif、webp、svg、avif、bmp，或圖片 MIME | 縮圖；無縮圖時 purple-600 |\n| sheet | csv、xls、xlsx、ods、tsv | green-600 |\n| pdf | pdf | red-600 |\n| doc | doc、docx、txt、md、rtf、odt | blue-600 |\n| archive | zip、rar、7z、gz、tar | amber-600 |\n| audio | mp3、wav、flac、aac、ogg、m4a，或音訊 MIME | fuchsia-600 |\n| video | mp4、mov、avi、mkv、webm，或影片 MIME | cyan-600 |\n| file | 其他 | slate-500 |\n\n來源：1. [FileChip.vue][]　2. [useCamelotFileDrop.ts][]\n\n### FileDropzone\n\n| Prop | 預設 | 說明 |\n| :--- | :--- | :--- |\n| `v-model` | `null` | `File[] \\| null` |\n| `color` | `'primary'` | 色彩角色 |\n| `accept` | `'*'` | 接受型別，預設不限 |\n| `multiple` | `true` | 多選 |\n| `max` | `0` | 最多檔數，0 為不限 |\n| `disabled` | `false` | 停用 |\n| `height` | `'7rem'` | 拖曳區最小高度 |\n| `hint` | 「點此選擇檔案，或拖曳到此區域」 | 提示文字 |\n| `preview` | `true` | 顯示附件晶片列 |\n\n| Slot 或 Emit | 說明 |\n| :--- | :--- |\n| 預設 slot | 拖曳區內容，scope 為 `dragOver`、`count`、`max`、`atMax`、`open` |\n| `#icon` | 替換預設上傳圖示 |\n| `#chip` | 替換單一晶片，scope 為 `file`、`url`、`index`、`remove` |\n| `select` | 清單變動時 emit 目前的檔案陣列 |\n\n來源：1. [FileDropzone.vue][]\n\n### ImageDropzone 與核心的關係\n\nImageDropzone 的拖曳、過濾與縮圖同樣由核心提供，只是在 grid 版面強制多選並產生縮圖。它的 Props 與 slot 見 [RichTextEditor 與 ImageDropzone](./richtext-editor-image-dropzone.md)。\n\n| 核心選項 | ImageDropzone 傳入 |\n| :--- | :--- |\n| `multiple` | `multiple` 或版面為 grid |\n| `thumbnails` | `preview` 或版面為 grid |\n\n來源：1. [ImageDropzone.vue][]\n\n## 相關頁面\n\n- [FileDropzone](./components/FileDropzone.md)\n- [FileChip](./components/FileChip.md)\n- [ImageDropzone](./components/ImageDropzone.md)\n- [useCamelotFileDrop](./composables/useCamelotFileDrop.md)\n- [RichTextEditor 與 ImageDropzone](./richtext-editor-image-dropzone.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| useCamelotFileDrop.ts | [app/composables/useCamelotFileDrop.ts](../../../app/composables/useCamelotFileDrop.ts) |\n| ImageDropzone.vue | [app/components/Camelot/ImageDropzone.vue](../../../app/components/Camelot/ImageDropzone.vue) |\n| FileDropzone.vue | [app/components/Camelot/FileDropzone.vue](../../../app/components/Camelot/FileDropzone.vue) |\n| FileChip.vue | [app/components/Camelot/FileChip.vue](../../../app/components/Camelot/FileChip.vue) |\n\n[useCamelotFileDrop.ts]: #references\n[ImageDropzone.vue]: #references\n[FileDropzone.vue]: #references\n[FileChip.vue]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"📎 檔案拖曳","summary":"檔案拖曳分三層：headless 核心 `useCamelotFileDrop`、全包元件 `CamelotImageDropzone`（圖片縮圖格）與 `CamelotFileDropzone`（附件晶片列），以及可獨立使用的附件晶片 `CamelotFileChip`。三層共用同一套檔案過濾、上限、縮圖 objectURL 與型別分類邏輯，依客製程度選用其中一層。"},"features/progress-components.md":{"md":"# 📊 進度元件\n\n## Summary\n\n三個進度元件：水平進度條 `CamelotProgressBar`、SVG 環形進度 `CamelotProgressCircle`、帶破口讀作「n／total」的階段儀表環 `CamelotProgressStage`。三者都支援 material、cupertino、scifi、aqua 四種主題與 `color` 色彩角色，數值變化以彈簧曲線過場並尊重減少動態偏好；前兩者另有 indeterminate（不確定）模式。\n\n## 運作方式\n\n### ProgressBar\n\n水平線性進度條，填滿寬度＝`value` 除以 `max` 的百分比，限制在 0 到 100 之間；`max` 小於等於 0 時視為 0。\n\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :--- | :--- |\n| `value` | `number` | `0` | 當前值 |\n| `max` | `number` | `100` | 最大值 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色 |\n| `indeterminate` | `boolean` | `false` | 不確定模式，填滿段左右來回掃描 |\n| `showLabel` | `boolean` | `false` | 右側顯示文字；不確定模式不顯示 |\n| `labelMode` | `'percent' \\| 'fraction'` | `'percent'` | 顯示百分比，或「值 ／ 最大值」 |\n| `height` | `string` | `'8px'` | 軌道高度 |\n| `rounded` | `boolean` | `true` | 圓角；scifi 主題強制方角 |\n\n| 主題 | 外觀 |\n| :--- | :--- |\n| material、cupertino | 表面色軌道，色彩角色填滿 |\n| scifi | 色彩角色淡底加細邊，填滿段帶光暈 |\n| aqua | 玻璃軌道加漸層填滿 |\n\n1. 確定模式以寬度過場，曲線為彈簧曲線。\n2. 不確定模式用 40% 寬的填滿段做掃描動畫，一輪 1.4 秒。\n3. 使用者開啟減少動態時，過場與掃描動畫都關閉。\n\n來源：1. [ProgressBar.vue][]　2. [tailwind.css][]\n\n### ProgressCircle\n\nSVG 環形進度，由軌道圈與進度圈疊成；進度圈的虛線偏移量＝周長乘以（1 減完成比例）。\n\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :--- | :--- |\n| `value` | `number` | `0` | 當前值 |\n| `max` | `number` | `100` | 最大值 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色 |\n| `indeterminate` | `boolean` | `false` | 固定弧長旋轉 |\n| `showLabel` | `boolean` | `false` | 圓心顯示文字；不確定模式不顯示 |\n| `labelMode` | `'percent' \\| 'fraction'` | `'percent'` | 同 ProgressBar |\n| `size` | `number` | `64` | 直徑 px |\n| `strokeWidth` | `number` | `6` | 線寬 |\n\n| 主題 | 外觀 |\n| :--- | :--- |\n| scifi | 平頭線端加光暈 |\n| aqua | 漸層描邊，漸層 id 以 `useId()` 產生避免衝突 |\n| 其他 | 圓頭線端 |\n\nsvg 設為溢出可見，避免光暈被裁切；不確定模式用 Tailwind 內建的旋轉動畫。\n\n來源：1. [ProgressCircle.vue][]\n\n### ProgressStage\n\n階段儀表環：左上有破口，當前階段數字從破口突破而出，斜線在圓心左上、總階段在圓心右下，整體讀作「n／total」。\n\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :--- | :--- |\n| `current` | `number` | `1` | 當前階段 |\n| `total` | `number` | `1` | 總階段數 |\n| `color` | `CamelotColorRole` | `'primary'` | 色彩角色 |\n| `size` | `number` | `96` | 直徑 px |\n| `strokeWidth` | `number` | `7` | 線寬 |\n\n| 規則 | 說明 |\n| :--- | :--- |\n| 破口 | 中心在 225°（左上），開口固定 98° |\n| 進度弧 | 從破口順時針補滿，完成比例＝當前除以總數，限制在 0 到 1 |\n| 當前數字字級 | 三位數以內 51px，四位數以上 40px |\n| 當前數字位置 | 絕對定位靠右、最小 3 字元寬，固定在右 62px、上 4px |\n| 總階段 | 斜體，字級為直徑的 26% |\n| 主題 | aqua 漸層描邊、scifi 加光暈，其餘用色彩角色描邊；線端一律圓頭 |\n\n來源：1. [ProgressStage.vue][]\n\n## 相關頁面\n\n- [ProgressBar](./components/ProgressBar.md)\n- [ProgressCircle](./components/ProgressCircle.md)\n- [ProgressStage](./components/ProgressStage.md)\n- [主題系統](../platform/theme-system.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| ProgressBar.vue | [app/components/Camelot/ProgressBar.vue](../../../app/components/Camelot/ProgressBar.vue) |\n| tailwind.css | [app/assets/css/tailwind.css](../../../app/assets/css/tailwind.css) |\n| ProgressCircle.vue | [app/components/Camelot/ProgressCircle.vue](../../../app/components/Camelot/ProgressCircle.vue) |\n| ProgressStage.vue | [app/components/Camelot/ProgressStage.vue](../../../app/components/Camelot/ProgressStage.vue) |\n\n[ProgressBar.vue]: #references\n[tailwind.css]: #references\n[ProgressCircle.vue]: #references\n[ProgressStage.vue]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"📊 進度元件","summary":"三個進度元件：水平進度條 `CamelotProgressBar`、SVG 環形進度 `CamelotProgressCircle`、帶破口讀作「n／total」的階段儀表環 `CamelotProgressStage`。三者都支援 material、cupertino、scifi、aqua 四種主題與 `color` 色彩角色，數值變化以彈簧曲線過場並尊重減少動態偏好；前兩者另有 indeterminate（不確定）模式。"},"features/radio-and-groups.md":{"md":"# 🔘 單選與選項群組\n\n## Summary\n\n選項群組系統由單選鈕 `CamelotRadio`、單選群組 `CamelotRadioGroup` 與複選群組 `CamelotCheckboxGroup` 組成。Radio 與 Checkbox 同樣是「外層 wrapper＋四主題 variant」的結構，群組層負責選項排列方向、整組與逐選項停用、群組標題與必填標示，選項型別共用 `CamelotGroupOption`。\n\n## 運作方式\n\n### Radio\n\n外層 wrapper 依目前主題選用 Material、Cupertino、Aqua 或 Scifi 的 variant，label 則由 wrapper 統一用 FieldLabel 渲染。\n\n| 主題 | 外觀 | 尺寸 |\n| :--- | :--- | :--- |\n| Material | 2px 外圈，選中時色彩角色圓點放大 | 20px |\n| Cupertino | 選中時整圈填滿色彩角色，中間淺色小點 | 22px |\n| Aqua | 未選為玻璃軌道，選中為漸層填滿加淺色圓點 | 20px |\n| Scifi | 髮絲圓框，選中時邊框與圓點帶光暈 | 18px |\n\n1. 點圓鈕或 label 都能選取；停用時 label 呈半透明且不可點。\n2. 已選取時再點一次不會取消，除非開啟 `deselectable`，適合非必填情境。\n3. 圓點以滿版尺寸再用 transform 縮小繪製，以中心對稱取樣，避免 Windows 125%、150% 這類非整數縮放下的半像素偏移。\n4. label 可用 `#label` slot 替換，預設以 `leading-none` 做光學置中。\n\n| Prop | 預設 | 說明 |\n| :--- | :--- | :--- |\n| `v-model` | `false` | 是否選取 |\n| `label` | `''` | 標籤文字 |\n| `disabled` | `false` | 停用 |\n| `deselectable` | `false` | 點已選取項可取消 |\n| `color` | `'primary'` | 色彩角色 |\n| `isContainer` | `false` | 使用 container 系列色 |\n\n選取狀態改變時 emit `change`，帶新的布林值。\n\n來源：1. [Radio.vue][]　2. [Material/Radio.vue][]　3. [Cupertino/Radio.vue][]　4. [Aqua/Radio.vue][]　5. [Scifi/Radio.vue][]\n\n### RadioGroup 與 CheckboxGroup\n\n```vue\n<CamelotRadioGroup v-model=\"val\" :options=\"options\" direction=\"vertical\" deselectable label=\"付款方式\" />\n<CamelotCheckboxGroup v-model=\"vals\" :options=\"options\" label=\"通知管道\" />\n```\n\n| Prop | RadioGroup | CheckboxGroup |\n| :--- | :--- | :--- |\n| `v-model` | `string \\| number \\| undefined` | `(string \\| number)[]`，預設空陣列 |\n| `options` | `CamelotGroupOption[]`，欄位為 `label`、`value`、`disabled` | 同左 |\n| `direction` | `'horizontal'`（預設）或 `'vertical'` | 同左 |\n| `color` | `'primary'` | 同左 |\n| `disabled` | 整組停用；與 `option.disabled` 任一為真即停用該項 | 同左 |\n| `deselectable` | 點已選項取消，model 變成 `undefined` | 無，複選本來就能取消 |\n| `label`、`required` | 群組標題與必填標示，可用 `#label` slot 替換 | 同左 |\n| `change` emit | 選中的 option；取消時為 `undefined` | 勾選後的值陣列 |\n\n1. 選項間距固定為橫向 24px、縱向 8px，四主題一致。\n2. 水平排列時選項會自動換行。\n3. 群組標題用 FieldLabel，左側內縮 4px 與選項對齊。\n\n來源：1. [RadioGroup.vue][]　2. [CheckboxGroup.vue][]　3. [camelot.ts][]\n\n## 相關頁面\n\n- [Radio](./components/Radio.md)\n- [RadioGroup](./components/RadioGroup.md)\n- [CheckboxGroup](./components/CheckboxGroup.md)\n- [FieldLabel](./components/FieldLabel.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Radio.vue | [app/components/Camelot/Radio.vue](../../../app/components/Camelot/Radio.vue) |\n| Material/Radio.vue | [app/components/Camelot/Material/Radio.vue](../../../app/components/Camelot/Material/Radio.vue) |\n| Cupertino/Radio.vue | [app/components/Camelot/Cupertino/Radio.vue](../../../app/components/Camelot/Cupertino/Radio.vue) |\n| Aqua/Radio.vue | [app/components/Camelot/Aqua/Radio.vue](../../../app/components/Camelot/Aqua/Radio.vue) |\n| Scifi/Radio.vue | [app/components/Camelot/Scifi/Radio.vue](../../../app/components/Camelot/Scifi/Radio.vue) |\n| RadioGroup.vue | [app/components/Camelot/RadioGroup.vue](../../../app/components/Camelot/RadioGroup.vue) |\n| CheckboxGroup.vue | [app/components/Camelot/CheckboxGroup.vue](../../../app/components/Camelot/CheckboxGroup.vue) |\n| camelot.ts | [shared/types/camelot.ts](../../../shared/types/camelot.ts) |\n\n[Radio.vue]: #references\n[Material/Radio.vue]: #references\n[Cupertino/Radio.vue]: #references\n[Aqua/Radio.vue]: #references\n[Scifi/Radio.vue]: #references\n[RadioGroup.vue]: #references\n[CheckboxGroup.vue]: #references\n[camelot.ts]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"🔘 單選與選項群組","summary":"選項群組系統由單選鈕 `CamelotRadio`、單選群組 `CamelotRadioGroup` 與複選群組 `CamelotCheckboxGroup` 組成。Radio 與 Checkbox 同樣是「外層 wrapper＋四主題 variant」的結構，群組層負責選項排列方向、整組與逐選項停用、群組標題與必填標示，選項型別共用 `CamelotGroupOption`。"},"features/richtext-editor-image-dropzone.md":{"md":"# ✍️ 富文本與圖片拖曳\n\n## Summary\n\n`CamelotRichTextEditor` 是以 TipTap v3 驅動的主題化 WYSIWYG 編輯器，v-model 為 HTML 字串，支援連結、圖片縮放與對齊、貼上 HTML 清洗、Tab 縮排，以及可插拔的延後上傳。`CamelotImageDropzone` 是從編輯器圖片彈窗抽出、可單獨使用的圖片拖曳／選擇元件，有 stacked 與 grid 兩種版面。兩者都支援四種主題，與舊版圖片預覽框 `CamelotDropImage` 並存。\n\n## 運作方式\n\n### 編輯器擴充\n\n編輯器以 StarterKit 為底，另外註冊以下擴充；自寫的三個擴充放在內部 editor 目錄。\n\n| 擴充 | 作用 |\n| :--- | :--- |\n| StarterKit | 段落、標題、清單、程式碼區塊、復原等基本功能；內建的 Link 關閉，改由下一列註冊 |\n| Link | 點擊連結不開啟，方便編輯 |\n| Placeholder | 空白時顯示 `placeholder` |\n| ResizableImage | 圖片寬度、對齊、待上傳標記與圖說，NodeView 提供縮放手把與對齊工具列 |\n| PasteSanitize | 清洗貼上的 HTML，只留 allowlist 內的標籤與屬性，b 轉 strong、i 轉 em |\n| TabIndent | 清單內交給 StarterKit 調整層級；程式碼區塊插兩個半形空白；其餘插一個全形空白 |\n\n1. 圖片 NodeView 元件的 props 直接用 TipTap 的 `NodeViewProps` 型別；手寫 props 會缺少必要欄位而被 NodeView renderer 拒絕。\n2. `addNodeView()` 必須明寫回傳型別 `NodeViewRenderer`，否則會與 schema 形成循環推導。\n3. 插入圖片用 `insertContent` 帶 image 型別與屬性，而不用 `setImage()`：後者的選項型別容不下自訂的 `pending` 屬性，兩者行為相同。\n\n來源：1. [RichTextEditor.vue][]　2. [resizable-image.ts][]　3. [ResizableImageView.vue][]　4. [paste-sanitize.ts][]　5. [tab-indent.ts][]\n\n### 圖片上傳\n\n有 `uploadHandler` 時，圖片先以 blob 暫存在編輯器裡，等頁面呼叫 `flush()` 才真正上傳。\n\n1. 貼上、拖入或從圖片彈窗的 ImageDropzone 選入圖片時，建立 blob URL 並插入標記為待上傳的圖片。\n2. 狀態列顯示待上傳張數；`hasPending` 可供頁面判斷是否還有未上傳的圖。\n3. 頁面儲存前呼叫 `flush()`：先回收已從內容刪掉的 blob，再逐張呼叫 `uploadHandler`，把圖片來源換成回傳的 URL 並清除待上傳標記。\n4. 上傳中再次呼叫 `flush()` 會丟錯；上傳失敗時狀態列顯示錯誤並把錯誤往外丟，保留原始錯誤在 `cause`。\n5. 沒有 `uploadHandler` 時，圖片彈窗只能貼圖片網址，貼上與拖入圖片檔不會被攔截。\n\n來源：1. [RichTextEditor.vue][]\n\n### 工具列與主題\n\n1. 工具列用 Material Symbols 圖示，連結與圖片以彈窗輸入，彈窗內的按鈕用 CamelotButton。\n2. 「貼上 HTML 原始碼」按鈕讀取剪貼簿，清洗後插入；剪貼簿為空、無法解析或瀏覽器拒絕讀取時顯示提示，4 秒後消失。\n3. 貼上的純文字若看起來像 HTML 標籤，也會先清洗再插入。\n4. 按鈕形狀依主題區分：aqua 膠囊、scifi 銳角、cupertino 柔圓、material 標準圓角。\n5. 啟用態依主題區分：aqua 漸層加柔光、scifi 霓虹底色加色彩角色邊框與光暈，其餘為實心。\n6. 顏色一律走主題 token 與色彩角色，邊框用 border token。\n\n來源：1. [RichTextEditor.vue][]\n\n### RichTextEditor Props\n\n| Prop | 預設 | 說明 |\n| :--- | :--- | :--- |\n| `v-model` | 必填 | HTML 字串 |\n| `color` | `'primary'` | 色彩角色 |\n| `placeholder` | 「開始撰寫內容…」 | 空白提示 |\n| `disabled` | `false` | 唯讀 |\n| `minHeight` | `'320px'` | 編輯區最小高度 |\n| `uploadHandler` | — | `(file: File) => Promise<string>`，回傳可存取的圖片 URL |\n\n| Exposed | 說明 |\n| :--- | :--- |\n| `flush()` | 上傳所有仍在內容中的待上傳圖片 |\n| `hasPending` | 是否還有待上傳圖片 |\n\n來源：1. [RichTextEditor.vue][]\n\n### ImageDropzone\n\n可重用的拖曳或點擊選擇圖片區；拖曳、過濾與縮圖由檔案拖曳核心提供，見 [檔案拖曳](./file-drop.md)。\n\n| 版面 | 行為 |\n| :--- | :--- |\n| stacked（預設） | 一個大區塊，下方縮圖預覽列；編輯器圖片彈窗用這個版面並關閉預覽 |\n| grid | 縮圖各佔一格，「新增」格在縮圖右側；達 `max` 後隱藏新增格，移除後重現；檔案累加 |\n\n| Prop | 預設 | 說明 |\n| :--- | :--- | :--- |\n| `v-model` | `null` | `File[] \\| null`，唯一真相來源，縮圖由它衍生 |\n| `color` | `'primary'` | 色彩角色 |\n| `accept` | 圖片 MIME | 同 input 的 accept |\n| `multiple` | `false` | 多選；grid 版面一律多選 |\n| `disabled` | `false` | 停用 |\n| `layout` | `'stacked'` | `'stacked'` 或 `'grid'` |\n| `max` | `0` | 最多張數，0 為不限 |\n| `columns` | `4` | grid 欄數 |\n| `height` | `'7rem'` | stacked 區塊最小高度 |\n| `hint` | 「點此選擇圖片，或拖曳到此區域」 | 提示文字 |\n| `gridHint` | 「新增」 | grid 新增格文字 |\n| `preview` | `true` | stacked 是否在下方顯示縮圖 |\n\n| Slot 或 Emit | 說明 |\n| :--- | :--- |\n| 預設 slot | 新增區或新增格的內容，外層恆可點擊，scope 含 `open` |\n| `#icon` | 替換預設圖示 |\n| `#thumb` | 自訂縮圖，scope 為 `url`、`filename`、`index`、`remove` |\n| `select` | 清單變動時 emit 目前的檔案陣列 |\n\n整個元件都是拖放目標；邊框走 border token，hover 與拖入時改用色彩角色。\n\n來源：1. [ImageDropzone.vue][]\n\n### 開發環境\n\nplayground 的 Nuxt 設定開頭會把開發時的暫存目錄導到短路徑。macOS 預設暫存目錄太長，vite-node 建立的 unix socket 路徑會超過約 104 字元上限而連線失敗。這個設定只在 playground 開發時生效，不隨 layer 發佈。\n\n來源：1. [nuxt.config.ts][]\n\n## 相關頁面\n\n- [RichTextEditor](./components/RichTextEditor.md)\n- [ImageDropzone](./components/ImageDropzone.md)\n- [DropImage](./components/DropImage.md)\n- [ResizableImageView](./components/Internal-editor-ResizableImageView.md)\n- [檔案拖曳](./file-drop.md)\n- [主題系統](../platform/theme-system.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| RichTextEditor.vue | [app/components/Camelot/RichTextEditor.vue](../../../app/components/Camelot/RichTextEditor.vue) |\n| resizable-image.ts | [app/components/Camelot/Internal/editor/resizable-image.ts](../../../app/components/Camelot/Internal/editor/resizable-image.ts) |\n| ResizableImageView.vue | [app/components/Camelot/Internal/editor/ResizableImageView.vue](../../../app/components/Camelot/Internal/editor/ResizableImageView.vue) |\n| paste-sanitize.ts | [app/components/Camelot/Internal/editor/paste-sanitize.ts](../../../app/components/Camelot/Internal/editor/paste-sanitize.ts) |\n| tab-indent.ts | [app/components/Camelot/Internal/editor/tab-indent.ts](../../../app/components/Camelot/Internal/editor/tab-indent.ts) |\n| ImageDropzone.vue | [app/components/Camelot/ImageDropzone.vue](../../../app/components/Camelot/ImageDropzone.vue) |\n| nuxt.config.ts | [.playground/nuxt.config.ts](../../../.playground/nuxt.config.ts) |\n\n[RichTextEditor.vue]: #references\n[resizable-image.ts]: #references\n[ResizableImageView.vue]: #references\n[paste-sanitize.ts]: #references\n[tab-indent.ts]: #references\n[ImageDropzone.vue]: #references\n[nuxt.config.ts]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"✍️ 富文本與圖片拖曳","summary":"`CamelotRichTextEditor` 是以 TipTap v3 驅動的主題化 WYSIWYG 編輯器，v-model 為 HTML 字串，支援連結、圖片縮放與對齊、貼上 HTML 清洗、Tab 縮排，以及可插拔的延後上傳。`CamelotImageDropzone` 是從編輯器圖片彈窗抽出、可單獨使用的圖片拖曳／選擇元件，有 stacked 與 grid 兩種版面。兩者都支援四種主題，與舊版圖片預覽框 `CamelotDropImage` 並存。"},"features/time-picker.md":{"md":"# ⏰ 時間選擇器\n\n## Summary\n\n`CamelotTimeV2` 是純時間選擇器，操作與外觀比照日期選擇器 DateV2：觸發框是時鐘圖示加唯讀輸入框，點開後在桌機顯示浮層、手機顯示對話框，裡面是可輸入的時／分／秒欄位與「確認」鈕。v-model 是 24 小時制字串，顯示格式依 `hourFormat` 與 `timePrecision` 決定；支援四種主題與 `color` 色彩角色，不引入新依賴。\n\n## 運作方式\n\n### 選時間\n\n1. 點觸發框開啟選擇器；停用時不開啟。\n2. `showType` 為 `auto` 時，手機寬度用對話框，其餘用浮層；也可固定為 `popup` 或 `dialog`。\n3. 在時間列改時、分、秒或 AM／PM，值即時寫回 v-model。\n4. 按「確認」關閉選擇器；若從未改過時間就按確認，會以目前欄位值（預設 00:00）寫入。\n5. 浮層模式點外面也會關閉。\n\n來源：1. [TimeV2.vue][]　2. [TimeRow.vue][]\n\n### 值與顯示格式\n\n| 項目 | 規則 |\n| :--- | :--- |\n| v-model | 24 小時制字串；`second` 精細度為 `HH:mm:ss`，其餘為 `HH:mm` |\n| 讀入 | 以冒號拆開，時限制 0 到 23、分秒限制 0 到 59 |\n| 觸發框顯示 | 24 小時制用 `HH`，12 小時制用 `hh` 並加 AM／PM；依精細度接上分、秒 |\n| 範例 | 值 `14:30:00`、12 小時制、秒精細度，顯示 `02:30:00 PM` |\n| `hour` 精細度 | 觸發框只顯示時，v-model 仍是 `HH:mm` |\n\n來源：1. [TimeV2.vue][]\n\n### 主題\n\n1. 觸發框、開啟態與面板樣式來自共用的 picker 主題，四主題與 DateV2 一致。\n2. scifi 主題下，觸發框外層套上表單欄位共用的 HUD 外框，開啟時呈 focus 態；其他主題不加外框。\n3. 浮層陰影與圓角依主題設定在浮層外層，避免被面板裁切；錯誤態時邊框改為錯誤色。\n\n來源：1. [TimeV2.vue][]　2. [useCamelotPickerTheme.ts][]　3. [FieldFrame.vue][]\n\n## Props\n\n| Prop | 預設 | 說明 |\n| :--- | :--- | :--- |\n| `v-model` | — | 時間字串，24 小時制 |\n| `color` | `'primary'` | 色彩角色 |\n| `label` | — | 標籤 |\n| `required` | — | 必填星號 |\n| `disabled` | — | 停用 |\n| `isError` | — | 錯誤態 |\n| `placeholder` | `'HH:mm'` | 無值時顯示 |\n| `showType` | `'auto'` | `'auto'`、`'popup'` 或 `'dialog'` |\n| `selectZIndex` | — | 浮層 z-index |\n| `timePrecision` | `'minute'` | `'hour'`、`'minute'` 或 `'second'` |\n| `hourFormat` | `'24'` | `'12'` 或 `'24'` |\n\n來源：1. [TimeV2.vue][]\n\n## 相關頁面\n\n- [TimeV2](./components/TimeV2.md)\n- [Internal/TimeRow](./components/Internal-TimeRow.md)\n- [Internal/TimeField](./components/Internal-TimeField.md)\n- [日期選擇器](./calendar.md)\n- [主題系統](../platform/theme-system.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| TimeV2.vue | [app/components/Camelot/TimeV2.vue](../../../app/components/Camelot/TimeV2.vue) |\n| TimeRow.vue | [app/components/Camelot/Internal/TimeRow.vue](../../../app/components/Camelot/Internal/TimeRow.vue) |\n| useCamelotPickerTheme.ts | [app/composables/useCamelotPickerTheme.ts](../../../app/composables/useCamelotPickerTheme.ts) |\n| FieldFrame.vue | [app/components/Camelot/Internal/FieldFrame.vue](../../../app/components/Camelot/Internal/FieldFrame.vue) |\n\n[TimeV2.vue]: #references\n[TimeRow.vue]: #references\n[useCamelotPickerTheme.ts]: #references\n[FieldFrame.vue]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"⏰ 時間選擇器","summary":"`CamelotTimeV2` 是純時間選擇器，操作與外觀比照日期選擇器 DateV2：觸發框是時鐘圖示加唯讀輸入框，點開後在桌機顯示浮層、手機顯示對話框，裡面是可輸入的時／分／秒欄位與「確認」鈕。v-model 是 24 小時制字串，顯示格式依 `hourFormat` 與 `timePrecision` 決定；支援四種主題與 `color` 色彩角色，不引入新依賴。"},"features/timeline.md":{"md":"# 🕒 時間軸\n\n## Summary\n\n`CamelotTimeline` 是垂直或水平排列的時間軸元件，每個項目由標題、內容、選填圖片與軸上的圓點組成。內容可以放在軸線的同一側或左右（上下）交錯，支援捲動時逐項淡入、`#title`／`#content`／`#node` 三個 slot，以及四種主題下的 `color` 色彩角色。\n\n## 運作方式\n\n### 版面機制\n\n這張圖回答：內容位置怎麼決定 grid 軌道與軸線位置？\n\n```json diagram id=圖1\n{\n  \"type\": \"flow\",\n  \"dir\": \"LR\",\n  \"title\": \"時間軸版面\",\n  \"desc\": \"每個項目是一個 grid；交錯排列用三軌讓軸線置中，單側排列用兩軌讓軸線靠邊\",\n  \"nodes\": [\n    {\"id\": \"G\", \"text\": \"每個項目\\n一個 grid\"},\n    {\"id\": \"T1\", \"text\": \"三軌\\n軸線置中\"},\n    {\"id\": \"T2\", \"text\": \"兩軌\\n軸線靠邊\"},\n    {\"id\": \"A\", \"text\": \"軸軌\\n圓點與連接線\", \"key\": true}\n  ],\n  \"edges\": [\n    {\"from\": \"G\", \"to\": \"T1\", \"label\": \"alternate\"},\n    {\"from\": \"G\", \"to\": \"T2\", \"label\": \"before 或 after\"},\n    {\"from\": \"T1\", \"to\": \"A\"},\n    {\"from\": \"T2\", \"to\": \"A\"}\n  ]\n}\n```\n\n![時間軸版面](timeline.圖1.svg)\n\n| 規則 | 說明 |\n| :--- | :--- |\n| 軌道方向 | 垂直排列用欄，水平排列用列，節點與線恆在同一直線上 |\n| 交錯排列 | 三軌依序為「內容、軸、內容」，第 0 項內容在後側，之後逐項交替 |\n| 單側排列 | before 為「內容、軸」，after 為「軸、內容」 |\n| 垂直對齊 | 軸軌靠上並留 6px，12px 圓點的中心對齊標題 24px 行高的中心 |\n| 水平對齊 | 圓點置中於軸列；內容貼齊軸線，before 靠下、after 靠上 |\n| 水平項目寬 | 平均分配，最小 140px |\n\n來源：1. [Timeline.vue][]\n\n### 連接線與圖片\n\n1. 垂直排列時，每項的連接線分上下兩段：非第一項畫上段、非最後一項畫下段，相鄰項目無縫接續，列高不一也是連續直線。\n2. 水平排列時，非最後一項從圓點畫一條橫線到下一項。\n3. 項目有 `image` 時，圖片顯示在文字下方，寬 200px、圓角加邊框。\n4. 垂直排列的 before 側圖片靠右貼軸，水平排列時圖片置中。\n5. 自訂 `#content` slot 時不渲染內建圖片。\n6. scifi 主題的圓點帶光暈。\n\n來源：1. [Timeline.vue][]\n\n### 捲動淡入\n\n1. `animate` 開啟時，每個項目以 IntersectionObserver 觀察，露出 20% 才淡入並位移歸位，每項只觸發一次。\n2. 位移方向：水平排列由下往上，垂直 before 由左往右，其餘由右往左。\n3. `animate` 關閉或在伺服器端時，所有項目直接顯示。\n\n來源：1. [Timeline.vue][]\n\n## Props\n\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :--- | :--- |\n| `items` | `TimelineItem[]` | 必填 | 欄位為 `title`、`content`、`image`、`key`，皆選填 |\n| `direction` | `'vertical' \\| 'horizontal'` | `'vertical'` | 排列方向 |\n| `side` | `'before' \\| 'after' \\| 'alternate'` | `'after'` | 內容位置：垂直時為左右，水平時為上下 |\n| `color` | `CamelotColorRole` | `'primary'` | 圓點顏色 |\n| `animate` | `boolean` | `false` | 捲動逐項淡入 |\n\nSlots 有 title、content、node 三個，scope 都是 `item` 與 `index`。\n\n來源：1. [Timeline.vue][]\n\n## 相關頁面\n\n- [Timeline](./components/Timeline.md)\n- [元件清單](./components.md)\n- [主題系統](../platform/theme-system.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/issues/45) | — |\n\n## References\n\n| 來源 | 位置 |\n|---|---|\n| Timeline.vue | [app/components/Camelot/Timeline.vue](../../../app/components/Camelot/Timeline.vue) |\n\n[Timeline.vue]: #references\n\n---\n[⚙️ Env](../environment.md) | [🏠 Wiki](../index.md)\n","title":"🕒 時間軸","summary":"`CamelotTimeline` 是垂直或水平排列的時間軸元件，每個項目由標題、內容、選填圖片與軸上的圓點組成。內容可以放在軸線的同一側或左右（上下）交錯，支援捲動時逐項淡入、`#title`／`#content`／`#node` 三個 slot，以及四種主題下的 `color` 色彩角色。"},"features/components/Aqua-Button.md":{"md":"# Aqua Button\n\n## Summary\n\nAqua Button 是 Aqua 主題（毛玻璃風格）的按鈕外觀實作，匯入名稱 `CamelotAquaButton`（Nuxt 自動匯入）。一般不直接使用，而是在 Aqua 主題下由公開元件 [Button](./Button.md) 自動選用；它只負責外觀、停用狀態與轉發點擊事件。\n\n## Props\n| Prop | 型別 | 預設 | 說明 |\n| :--- | :--- | :---: | :--- |\n| `disabled` | `boolean` | `false` | 是否停用按鈕 |\n\n## Emits\n| 事件 | 參數 | 說明 |\n| :--- | :--- | :--- |\n| `click` | `event: MouseEvent` | 按鈕點擊事件 |\n\n## Slots\n| Slot | 作用域參數 | 說明 |\n| :--- | :--- | :--- |\n| `default` | — | 按鈕內容 |\n\n## 運作方式\n\n| 項目 | 行為 |\n|---|---|\n| 尺寸 | 最低高度 42px，字級沿用外層（由 Button 設為 1rem）；字級變大時按鈕跟著撐高 |\n| 外觀 | 玻璃填色、半粗體文字、12px 控制項圓角 |\n| 互動 | hover 略微提亮，按下時縮小回彈 |\n| 停用 | 降低不透明度並灰階，游標改為禁止 |\n\n來源：1. [Aqua/Button.vue][]\n\n## 相關頁面\n- [Button](./Button.md)\n- [主題系統](../../platform/theme-system.md)\n\n## Changelog\n\n| 日期 | 版本 | 計畫 | 變動 | Issue | PR |\n|---|---|---|---|---|---|\n| 2026-09-23 | — | [2609231616-wiki-lint-migration](../../../archive/2609231616-wiki-lint-migration.md) | 改寫為新版 wiki 格式並依原始碼校正內容 | [#45](https://github.com/KNightING/camelot-nuxt-layer/i
